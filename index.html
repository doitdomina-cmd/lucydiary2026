// ═══════════ TODAY PAGE ═══════════
function renderTodayLegacy(){
  const t=todStr();
  const checks=S.checks[t]||{};
  const rods=routinesForDate(t);
  const done=rods.filter(r=>checks[r.id]).length;
  const total=rods.length;
  const pct=total?Math.round(done/total*100):0;
  const spct=S.savings.goal?Math.min(100,Math.round(S.savings.current/S.savings.goal*100)):0;

  // 이번 달 목표
  const ym=t.slice(0,7);
  const monthGoals=S.monthlyGoals[ym]||[];
  const MN_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const curMonthName=MN_KO[new Date().getMonth()];

  // 이번 주 마감 (날짜가 비었거나 형식이 깨진 항목은 제외해 정렬 에러 방지)
  const validDlDateRe=/^\d{4}-\d{2}-\d{2}$/;
  const upcoming=S.deadlines.filter(d=>{if(!d.date||!validDlDateRe.test(d.date))return false;const n=dLeft(d.date);return n>=0&&n<=7;}).sort((a,b)=>a.date.localeCompare(b.date));

  // 오늘 할일
  if(!S.todoList)S.todoList={};
  if(!S.todoList[t])S.todoList[t]=[];

  // 30일 이전 데이터 자동 정리
  const cutoff=addDays(t,-30);
  Object.keys(S.todoList).forEach(function(k){if(k<cutoff)delete S.todoList[k];});

  // 자동 이월: 오늘 이전 날짜에 남은 미완료 항목을 전부 오늘로 모으고,
  // 원래 날짜에서는 제거해서 며칠을 건너뛰어도 그 날짜에 중복으로 남지 않게 함
  let carried=false;
  for(let i=1;i<=30;i++){
    const pd=addDays(t,-i);
    if(!S.todoList[pd]||S.todoList[pd].length===0)continue;
    const incomplete=S.todoList[pd].filter(item=>!item.done);
    if(incomplete.length>0){
      incomplete.forEach(function(item){
        const already=S.todoList[t].some(x=>x.text===item.text&&x._carried);
        if(!already){ S.todoList[t].unshift({id:gid(),text:item.text,done:false,_carried:true}); carried=true; }
      });
      // 이월된 미완료 항목은 원래 날짜에서 제거 (완료된 항목만 남김)
      S.todoList[pd]=S.todoList[pd].filter(item=>item.done);
    }
  }
  if(carried)save();

  // 내일 할일 초기화

function czStartMove(el,t){
  var o=czObj(t.kind,t.id);if(!o)return;
  if(el.classList.contains('cz-moving'))return;
  var x=o.posX!=null?o.posX:50,y=o.posY!=null?o.posY:50,drag=null;
  el.classList.add('cz-moving');
  var bar=document.createElement('div');bar.className='cz-mv-bar';
  bar.innerHTML='<span>사진을 끌어서 위치를 맞춰요</span><button type="button" class="cz-mv-rot" title="오른쪽으로 90° 돌리기">↻ 돌리기</button><button type="button" class="cz-mv-reset">가운데</button><button type="button" class="cz-mv-done">완료</button>';
  el.appendChild(bar);
  function apply(){el.style.backgroundPosition=x+'% '+y+'%';}
  function down(e){if(e.target.closest('.cz-mv-bar'))return;e.preventDefault();e.stopPropagation();drag={sx:e.clientX,sy:e.clientY,x:x,y:y};try{el.setPointerCapture(e.pointerId);}catch(_){}}
  function move(e){if(!drag)return;e.preventDefault();var r=el.getBoundingClientRect();
    x=Math.max(0,Math.min(100,drag.x-(e.clientX-drag.sx)/Math.max(1,r.width)*160));
    y=Math.max(0,Math.min(100,drag.y-(e.clientY-drag.sy)/Math.max(1,r.height)*160));apply();}
  function up(){drag=null;}
  function stopClick(e){if(!e.target.closest('.cz-mv-bar')){e.stopPropagation();e.preventDefault();}}
  function done(e){if(e){e.stopPropagation();e.preventDefault();}
    el.removeEventListener('pointerdown',down,true);el.removeEventListener('pointermove',move,true);el.removeEventListener('pointerup',up,true);el.removeEventListener('pointercancel',up,true);el.removeEventListener('click',stopClick,true);
    el.classList.remove('cz-moving');bar.remove();
    var cur=czObj(t.kind,t.id);if(cur){cur.posX=Math.round(x);cur.posY=Math.round(y);save();render();}}
  el.addEventListener('pointerdown',down,true);el.addEventListener('pointermove',move,true);el.addEventListener('pointerup',up,true);el.addEventListener('pointercancel',up,true);el.addEventListener('click',stopClick,true);
  bar.querySelector('.cz-mv-done').onclick=done;
  bar.querySelector('.cz-mv-reset').onclick=function(e){e.stopPropagation();x=50;y=50;apply();};
  bar.querySelector('.cz-mv-rot').onclick=function(e){e.stopPropagation();e.preventDefault();var b=e.currentTarget;b.disabled=true;b.textContent='돌리는 중…';czRotatePhoto(t.kind,t.id).then(function(){done();}).catch(function(err){b.disabled=false;b.textContent='↻ 돌리기';alert((err&&err.message)||'사진을 돌리지 못했어요.');});};
}
// 사진을 오른쪽으로 90° 돌려서 다시 저장 (이 기기 사진이면 바로, 클라우드 사진이면 받아와서 돌림)
function czRotatePhoto(kind,id){
  var o=czObj(kind,id);if(!o||!o.photo)return Promise.reject(new Error('돌릴 사진이 없어요.'));
  var src=o.photo;
  return new Promise(function(resolve,reject){
    var img=new Image();
    if(src.indexOf('data:')!==0)img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=h;c.height=w;
        var ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,h,w);
        ctx.translate(h,0);ctx.rotate(Math.PI/2);ctx.drawImage(img,0,0);
        var d='';try{d=c.toDataURL('image/webp',0.8);}catch(e){throw new Error('이 사진은 돌릴 수 없어요. 사진을 다시 올려 주세요.');}
        if(!d||d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/jpeg',0.85);
        var cur=czObj(kind,id);if(!cur){resolve();return;}
        var oldPath=cur.photoPath;cur.photo=d;cur.photoPath=undefined;
        var px=cur.posX,py=cur.posY;if(px!=null||py!=null){cur.posX=100-(py!=null?py:50);cur.posY=(px!=null?px:50);}
        save();render();
        if(oldPath){try{storage.ref().child(oldPath).delete().catch(function(){});}catch(_){}}
        czUpload(kind,id);resolve();
      }catch(err){reject(err);}
    };
    img.onerror=function(){reject(new Error('사진을 불러오지 못했어요. 사진을 다시 올려 주세요.'));};
    img.src=src+(src.indexOf('data:')===0?'':(src.indexOf('?')>-1?'&':'?')+'rot='+Date.now());
  });
}

function togTodoItem(ds,i){
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  S.todoList[ds][i].done=!S.todoList[ds][i].done;

  const allBoxes=document.querySelectorAll('[onclick*="togTodoItem"]');

function delTodoItem(ds,i){

}
function carryTodoToNext(ds,i,nextDs){
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  var item=S.todoList[ds][i];
  if(!S.todoList[nextDs])S.todoList[nextDs]=[];
  // 중복 방지
  var already=S.todoList[nextDs].some(function(x){return x.text===item.text&&x._carried;});
  if(!already)S.todoList[nextDs].push({id:gid(),text:item.text,done:false,_carried:true});
  // 원래 날짜에서 제거
  S.todoList[ds].splice(i,1);
  save();render();
}

function getWeekDates(offset){
  const now=new Date();
  const dow=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-dow+1+(offset*7));
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(dateStr(d));}
  return days;
}

// 하루 1장 / 긴 변 360px / WebP(또는 jpeg) · base64로 직접 저장해서 로그인/브라우저 환경에 관계없이 항상 저장됨
var pendingDiaryPhoto={};

// 파일 -> 압축된 base64 data URL (webp 실패 시 jpeg로 자동 대체)
function compressDiaryPhotoToDataURL(file){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var tempUrl=URL.createObjectURL(file);
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight;
        if(!w||!h){reject(new Error('이미지 크기를 읽지 못했어요.'));return;}
        // 모든 사진은 긴 변 1200px · WebP 0.72 로 줄여서 보관한다 (폰 화면 가로 1440px에 거의 꽉 참)
        var scale=1200/Math.max(w,h);
        if(scale>1) scale=1;   // 원본보다 크게 늘리지 않음
        var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
        var canvas=document.createElement('canvas');
        canvas.width=cw;canvas.height=ch;
        var ctx=canvas.getContext('2d',{alpha:false});
        if(ctx.imageSmoothingQuality!==undefined) ctx.imageSmoothingQuality='high';
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        URL.revokeObjectURL(tempUrl);
        var dataUrl='';
        try{ dataUrl=canvas.toDataURL('image/webp',0.72); }catch(e){ dataUrl=''; }
        // 일부 브라우저(WebP 인코딩 미지원)는 png로 그대로 돌려주므로 webp가 아니면 jpeg로 재시도
        if(!dataUrl || dataUrl.indexOf('data:image/webp')!==0){
          try{ dataUrl=canvas.toDataURL('image/jpeg',0.8); }catch(e2){ dataUrl=''; }
        }
        if(!dataUrl){reject(new Error('사진 압축에 실패했어요.'));return;}
        resolve(dataUrl);
      }catch(e){
        URL.revokeObjectURL(tempUrl);reject(e);
      }
    };
    img.onerror=function(){URL.revokeObjectURL(tempUrl);reject(new Error('사진을 읽지 못했어요.'));};
    img.src=tempUrl;
  });
}

// data URL -> Blob (Firebase Storage 업로드용)
function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(',');
  var mimeMatch=parts[0].match(/:(.*?);/);
  var mime=mimeMatch?mimeMatch[1]:'image/jpeg';
  var bstr=atob(parts[1]);
  var n=bstr.length;
  var u8=new Uint8Array(n);
  while(n--){ u8[n]=bstr.charCodeAt(n); }
  return new Blob([u8],{type:mime});
}

// 이전 버전(IndexedDB/blob URL 방식)으로 저장된, 새로고침 후 더 이상 열리지 않는 사진 기록을 정리
function cleanupStaleDiaryPhotos(){
  var entries=S.diaryEntries||{};
  var changed=false;
  Object.keys(entries).forEach(function(ds){
    var e=entries[ds];
    if(!e)return;
    var isStale=e.photoStorage==='indexeddb'||(typeof e.photoUrl==='string'&&e.photoUrl.indexOf('blob:')===0);
    if(isStale){
      delete e.photoUrl;delete e.photoPath;delete e.photoStorage;delete e.photoSize;delete e.photoPosX;delete e.photoPosY;
      changed=true;
    }
  });
  if(changed)save();
}
async function deleteDiaryPhotoFile(ds,entry){
  if(!entry)return;
  if(entry.photoStorage==='firebase'&&currentUser&&entry.photoPath){
    try{await storage.ref().child(entry.photoPath).delete();}
    catch(e){if(!e||e.code!=='storage/object-not-found')console.warn('사진 삭제 실패(무시):',e);}
  }
  // storage==='local'인 경우 데이터가 diaryEntries 안에 직접 들어있어서 별도 삭제 불필요
}

async function finishDiaryPhotoUpload(ds){
  var pending=pendingDiaryPhoto[ds];
  if(!pending)return;
  delete pendingDiaryPhoto[ds];
  try{
    if(!S.diaryEntries)S.diaryEntries={};
    if(!S.diaryEntries[ds])S.diaryEntries[ds]={text:'',mood:'',title:''};
    var e=S.diaryEntries[ds];
    var oldPath=e.photoPath,oldStorage=e.photoStorage;

    // ① 먼저 base64로 즉시 반영 — 업로드를 기다리지 않으므로 사진이 바로 보인다
    e.photoUrl=pending.dataUrl;
    e.photoPath='';
    e.photoStorage='local';
    e.photoSize=pending.dataUrl.length;
    e.photoPosX=pending.posX!=null?pending.posX:50;
    e.photoPosY=pending.posY!=null?pending.posY:50;
    save();
    if(page==='diary')render();

    // ② 이전 사진 정리
    if(oldStorage==='firebase'&&oldPath){
      deleteDiaryPhotoFile(ds,{photoStorage:oldStorage,photoPath:oldPath});
    }

    // ③ 로그인 상태면 백그라운드로 클라우드에 올리고, 끝나면 주소만 조용히 교체
    if(currentUser){
      (async function(){
        try{
          var blob=dataUrlToBlob(pending.dataUrl);
          var ext=(blob.type==='image/jpeg')?'jpg':'webp';
          var path=diaryPhotoPath(ds,ext);
          var ref=storage.ref().child(path);
          await ref.put(blob,{contentType:blob.type||'image/webp',cacheControl:'public,max-age=31536000'});
          var url=await ref.getDownloadURL();
          var cur=(S.diaryEntries||{})[ds];
          // 그 사이 사용자가 사진을 바꾸거나 지웠으면 덮어쓰지 않는다
          if(!cur||cur.photoUrl!==pending.dataUrl)return;
          cur.photoUrl=url;
          cur.photoPath=path;
          cur.photoStorage='firebase';
          cur.photoSize=blob.size;
          save();
          if(page==='diary')render();
        }catch(err){
          console.warn('Firebase Storage 업로드 실패 — 이 기기에 저장된 사진을 계속 사용합니다.',err);
        }
      })();
    }
  }catch(err){
    console.error('Diary photo save error:',err);
    alert('사진 저장에 실패했어요: '+(err.message||err));
  }
}

var _dphotoDrag=null;
function _dphotoGetPos(ds){
  var pend=pendingDiaryPhoto[ds];
  var entry=(S.diaryEntries||{})[ds]||{};
  return {
    x:(pend&&pend.posX!=null)?pend.posX:(entry.photoPosX!=null?entry.photoPosX:50),
    y:(pend&&pend.posY!=null)?pend.posY:(entry.photoPosY!=null?entry.photoPosY:50)
  };
}
function _dphotoStart(box,clientX,clientY){
  var ds=box.dataset.ds;
  var img=box.querySelector('#diary-photo-img');
  if(!img)return;
  var cur=_dphotoGetPos(ds);
  _dphotoDrag={ds:ds,box:box,img:img,startX:clientX,startY:clientY,startPosX:cur.x,startPosY:cur.y};
  box.style.cursor='grabbing';
}
function _dphotoMove(clientX,clientY){
  var d=_dphotoDrag;if(!d)return;
  var rect=d.box.getBoundingClientRect();
  var dx=(clientX-d.startX)/rect.width*100;
  var dy=(clientY-d.startY)/rect.height*100;
  var nx=Math.max(0,Math.min(100,d.startPosX-dx));
  var ny=Math.max(0,Math.min(100,d.startPosY-dy));
  d.img.style.objectPosition=nx+'% '+ny+'%';
  d._nx=nx;d._ny=ny;
}
function _dphotoEnd(){
  var d=_dphotoDrag;if(!d)return;
  d.box.style.cursor='grab';
  if(d._nx!=null){
    if(pendingDiaryPhoto[d.ds]){
      pendingDiaryPhoto[d.ds].posX=d._nx;
      pendingDiaryPhoto[d.ds].posY=d._ny;
    }else{
      if(!S.diaryEntries)S.diaryEntries={};
      if(!S.diaryEntries[d.ds])S.diaryEntries[d.ds]={};
      S.diaryEntries[d.ds].photoPosX=d._nx;
      S.diaryEntries[d.ds].photoPosY=d._ny;
      save();
    }
  }
  _dphotoDrag=null;
}
document.addEventListener('mousedown',function(e){
  var box=e.target.closest&&e.target.closest('.dphoto-drag');
  if(!box)return;
  _dphotoStart(box,e.clientX,e.clientY);
  e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!_dphotoDrag)return;
  _dphotoMove(e.clientX,e.clientY);
});
document.addEventListener('mouseup',_dphotoEnd);
document.addEventListener('touchstart',function(e){
  var box=e.target.closest&&e.target.closest('.dphoto-drag');
  if(!box)return;
  var t=e.touches[0];
  _dphotoStart(box,t.clientX,t.clientY);
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!_dphotoDrag)return;
  var t=e.touches[0];
  _dphotoMove(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',_dphotoEnd);

function runDiarySearch(q){
  var box=document.getElementById('diary-search-res');
  if(!box)return;
  q=(q||'').trim().toLowerCase();
  if(!q){box.innerHTML='<div class="empty">검색어를 입력하면 결과가 나타나요</div>';return;}
  var keys=Object.keys(S.diaryEntries||{}).sort(function(a,b){return b.localeCompare(a);});
  var hits=[];
  keys.forEach(function(ds){
    var e=S.diaryEntries[ds];if(!e)return;
    var hay=((e.title||'')+'\n'+(e.text||'')).toLowerCase();
    var idx=hay.indexOf(q);
    if(idx===-1)return;
    var src=(e.title||'')+'\n'+(e.text||'');
    var start=Math.max(0,idx-25), end=Math.min(src.length,idx+q.length+45);
    var snippet=(start>0?'…':'')+src.slice(start,end).replace(/[<>]/g,'').replace(/\n/g,' ')+(end<src.length?'…':'');
    var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
    snippet=snippet.replace(re,function(m){return '<mark style="background:var(--al);color:var(--accent);border-radius:3px;padding:0 1px">'+m+'</mark>';});
    hits.push({ds:ds,mood:e.mood||'',title:e.title||'',snippet:snippet});
  });
  if(hits.length===0){box.innerHTML='<div class="empty">"'+q.replace(/[<>]/g,'')+'" 검색 결과가 없어요</div>';return;}
  var html='<div style="font-size:0.78em;color:var(--t3);margin-bottom:8px">'+hits.length+'개의 일기에서 발견</div>';
  hits.slice(0,50).forEach(function(h){
    html+='<div onclick="diarySearchGo(\''+h.ds+'\')" style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s" onmouseenter="this.style.borderColor=\'var(--accent)\'" onmouseleave="this.style.borderColor=\'var(--border)\'">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'+
        (h.mood?'<span>'+h.mood+'</span>':'')+
        '<span style="font-size:0.8em;font-weight:600;color:var(--accent);font-family:var(--mono)">'+h.ds+'</span>'+
        (h.title?'<span style="font-size:0.85em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h.title.replace(/[<>]/g,'')+'</span>':'')+
      '</div>'+
      '<div style="font-size:0.82em;color:var(--t2);line-height:1.5">'+h.snippet+'</div>'+
    '</div>';
  });
  if(hits.length>50)html+='<div style="text-align:center;font-size:0.78em;color:var(--t3)">상위 50개만 표시됩니다</div>';
  box.innerHTML=html;
}

      '<div style="width:6px;height:6px;border-radius:50%;background:'+p.color+';flex-shrink:0"></div>'+
      '<div style="flex:1;min-width:0;font-size:0.86em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</div>'+
      '<button type="button" class="bi" title="위로" onclick="moveAreaProj(\''+aid+'\',\''+p.id+'\',-1)" style="padding:2px 4px;line-height:1;'+(i===0?'opacity:.25;pointer-events:none':'')+'">▲</button>'+
      '<button type="button" class="bi" title="아래로" onclick="moveAreaProj(\''+aid+'\',\''+p.id+'\',1)" style="padding:2px 4px;line-height:1;'+(i===projs.length-1?'opacity:.25;pointer-events:none':'')+'">▼</button>'+

    '</div>';

function refreshAreaProjList(aid){
  var box=document.getElementById('ar-proj-list');
  if(box) box.innerHTML=areaProjListHtml(aid);
}
// 같은 영역 안에서만 순서 변경 (S.projects 전체 배열에서 위치를 맞바꾼다)
function moveAreaProj(aid,pid,dir){
  var idxs=[];
  (S.projects||[]).forEach(function(p,i){ if(p.lifeAreaId===aid) idxs.push(i); });
  var pos=idxs.findIndex(function(i){return S.projects[i].id===pid;});
  if(pos<0) return;
  var target=pos+dir;
  if(target<0||target>=idxs.length) return;
  var i1=idxs[pos], i2=idxs[target];
  var tmp=S.projects[i1]; S.projects[i1]=S.projects[i2]; S.projects[i2]=tmp;
  save();
  refreshAreaProjList(aid);
  render();
}
function addAreaProj(aid){
  var inp=document.getElementById('ar-new-proj');
  if(!inp) return;
  var name=inp.value.trim();
  if(!name) return;
  var area=(S.lifeAreas||[]).find(function(x){return x.id===aid;});
  if(!S.projects) S.projects=[];
  S.projects.push({id:gid(),name:name,color:(area&&area.color)||COLORS[0],lifeAreaId:aid,tasks:[]});
  inp.value='';
  save();
  refreshAreaProjList(aid);
  render();
}
function removeAreaProj(aid,pid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p) return;
  if(!confirm('"'+p.name+'"을(를) 이 영역에서 뺄까요?\n(프로젝트 자체는 삭제되지 않아요)')) return;
  p.lifeAreaId='';
  save();
  refreshAreaProjList(aid);
  render();
}
function pickAreaC(el,c){selAreaC=c;document.querySelectorAll('.cop').forEach(e=>e.classList.remove('on'));el.classList.add('on');}
function saveArea(eid){
  const emoji=document.getElementById('ar-e').value||'📌',name=document.getElementById('ar-n').value.trim();
  const dday=document.getElementById('ar-dday').value||'';
  const wSel=document.getElementById('ar-wish'),wv=wSel?wSel.value:'',isAr=wv.indexOf('area:')===0,wishRef=isAr?'':wv,dreamArea=isAr?wv.slice(5):(wv?wv.split('~')[0]:'');
  if(!name)return;
  if(eid){S.lifeAreas=(S.lifeAreas||[]).map(a=>a.id===eid?Object.assign({},a,{emoji,name,color:selAreaC,dday,dreamArea,wishRef}):a);}
  else{if(!S.lifeAreas)S.lifeAreas=[];S.lifeAreas.push({id:gid(),name,emoji,color:selAreaC,dday,dreamArea,wishRef});}
  save();closeMo();render();
}
function delArea(id){
  const pc=S.projects.filter(p=>p.lifeAreaId===id).length;
  if(pc>0&&!confirm('프로젝트 '+pc+'개의 영역이 해제돼요. 계속할까요?'))return;
  S.lifeAreas=(S.lifeAreas||[]).filter(a=>a.id!==id);
  S.projects=S.projects.map(p=>p.lifeAreaId===id?Object.assign({},p,{lifeAreaId:''}):p);
  save();render();
}

function renderProjects(){
  const areas=S.lifeAreas||[];
  const filteredAll=pjFilter?S.projects.filter(p=>p.lifeAreaId===pjFilter):S.projects;
  const filtered=filteredAll.filter(p=>!p.completed);
  const doneProjects=filteredAll.filter(p=>p.completed);
  let html='';
  if(document.body.classList.contains('cozy')){
    var allN=S.projects.length;
    var story=function(on,click,ph,label,pc,cnt,cls){return '<button type="button" class="pjs-item'+(on?' on':'')+(cls||'')+'" onclick="'+click+'" title="'+esc(label)+'">'+
      '<span class="pjs-ring" style="--p:'+(pc||0)+'"><span class="pjs-ph"'+(ph?' style="background-image:url(\''+esc(ph).replace(/'/g,'%27')+'\')"':'')+'>'+(ph?'':'✿')+'</span></span>'+
      '<span class="pjs-n">'+esc(label)+'</span>'+(cnt!=null?'<span class="pjs-c">'+cnt+'</span>':'')+'</button>';};
    html+='<div class="pjs"><div class="pjs-row">'+story(pjFilter==='',"setPjF('')",'','전체',0,allN)+
      areas.map(function(a){return story(pjFilter===a.id,"setPjF('"+a.id+"')",czAreaPhoto(a),a.name,lifeProgress(a),S.projects.filter(function(p){return p.lifeAreaId===a.id;}).length);}).join('')+
      '<button type="button" class="pjs-item pjs-add" onclick="openPjModal()" title="새 프로젝트"><span class="pjs-ring"><span class="pjs-ph">+</span></span><span class="pjs-n">새 프로젝트</span></button>'+
      '</div></div>';
    if(pjFilter){var fa=areas.find(function(a){return a.id===pjFilter;});if(fa){var fdl=fa.dday?dLeft(fa.dday):null;html+='<div class="pjs-sel"><b>'+esc(fa.name)+'</b>'+(fdl!==null?'<span>'+(fdl>0?'D-'+fdl:fdl===0?'D-DAY':'D+'+Math.abs(fdl))+'</span>':'')+'<span>진행 '+lifeProgress(fa)+'%</span><button type="button" onclick="goToArea&&go(\'life\')">My Goals →</button></div>';}}
  } else {
  // 상단 필터 탭 (To Do 월 탭과 동일한 인덱스 탭 스타일) — 한 줄 전체를 차지
  html+='<div class="mtab-wrap pjtab-wrap"><div class="mtab" style="grid-template-columns:repeat('+(areas.length+1)+',minmax(0,1fr))">';
  html+='<div class="mtab-item'+(pjFilter===''?' on':'')+'" onclick="setPjF(\'\')">전체</div>';
  areas.forEach(function(a){
    html+='<div class="mtab-item'+(pjFilter===a.id?' on':'')+'" data-aid="'+a.id+'" onclick="setPjF(this.dataset.aid)" title="'+esc(a.name)+'">'+esc(a.name)+'</div>';
  });
  html+='</div></div>';
  // 새 프로젝트 버튼은 탭 아래 줄로
  html+='<div style="display:flex;justify-content:flex-end;margin:10px 0 16px">'+
    '<button class="btn bp bsm" onclick="openPjModal()">+ 새 프로젝트</button></div>';
  }
  if(filtered.length===0){html+='<div class="empty" style="padding:60px"><div class="ei">🗂️</div>'+(pjFilter?'이 영역의 프로젝트가 없어요':'첫 프로젝트를 만들어 보세요!')+'</div>';}
  else{
  html+='<div class="pj-grid">';
    filtered.forEach(p=>{
      const tk=p.tasks||[],dn=tk.filter(t=>t.done).length,pc=tk.length?Math.round(dn/tk.length*100):0;
      const area=areas.find(a=>a.id===p.lifeAreaId);
      const pjDday=p.dday?dLeft(p.dday):null;
      const pjDdayLabel=pjDday===null?'':pjDday<0?'D+'+Math.abs(pjDday):pjDday===0?'D-Day':'D-'+pjDday;
      var metaBits=[];
      if(tk.length>0) metaBits.push(dn+'/'+tk.length+' · '+pc+'%');
      if(area) metaBits.push(area.name);
      if(pjDday!==null) metaBits.push(pjDdayLabel);
      var col=p.color||'#F5C490';
      html+='<div class="pj-card" onclick="go(\'projects\',\''+p.id+'\')" style="--card-accent:'+col+'">'+
          czPhotoHtml('project',p,czProjectPhoto(p,area))+

          '</div>'+

    });
    html+='</div>';

  if(doneProjects.length){
    html+='<div class="pjd-done"><div class="pjd-done-h">✿ 완료한 프로젝트 <span>'+doneProjects.length+'</span></div><div class="pjd-done-list">'+

  }
  return html;

function pjCardHead(en,ko,right){return '<div class="ch"><div class="ct">'+(document.body.classList.contains('cozy')?'<em class="pjx-en">'+en+'</em>':'')+ko+'</div>'+(right||'')+'</div>';}
function pjWeekStart(){var t=todStr(),d=new Date(t+'T00:00:00').getDay();return addDays(t,-((d+6)%7));}
function pjWeekCard(p){

  var rest=tk.map(function(t,i){return {t:t,i:i};}).filter(function(x){return !x.t.done&&x.t.week!==wk;});

    return '<div class="pjx-row'+(x.t.done?' done':'')+'"><span class="pjx-cb'+(x.t.done?' on':'')+'" onclick="togTk(\''+p.id+'\','+x.i+')"></span><span class="pjx-tx">'+esc(x.t.text)+'</span>'+
      (x.t.done?'':(inToday?'<span class="pjx-tag">오늘 할 일에 있어요</span>':'<button type="button" class="pjx-btn" onclick="pjTaskToToday(\''+p.id+'\','+x.i+')">→ 오늘</button>'))+
      '<button type="button" class="pjx-x" onclick="pjTaskWeek(\''+p.id+'\','+x.i+',false)" title="이번 주에서 빼기">×</button></div>';}).join('');
  if(rest.length) h+='<select class="sel pjx-sel" onchange="if(this.value!==\'\')pjTaskWeek(\''+p.id+'\',parseInt(this.value),true)"><option value="">+ 태스크에서 고르기</option>'+rest.map(function(x){return '<option value="'+x.i+'">'+esc(x.t.text)+'</option>';}).join('')+'</select>';

function pjTaskWeek(pid,i,on){var p=S.projects.find(function(x){return x.id===pid;});if(!p||!p.tasks[i])return;if(on)p.tasks[i].week=pjWeekStart();else delete p.tasks[i].week;save();render();}

function pjMetricCur(m){
  if(m.source==='savings')return (S.savings&&S.savings.current||0)/10000;
  if(m.source==='weight'){var ib=((S.health&&S.health.inbody)||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});var l=ib[ib.length-1];return l?Number(l.weight):null;}
  var e=(m.entries||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});return e.length?Number(e[e.length-1].val):(m.start!=null?Number(m.start):null);
}
function pjMetricSeries(m){
  if(m.source==='weight')return ((S.health&&S.health.inbody)||[]).filter(function(x){return x.weight;}).map(function(x){return {date:x.date,val:Number(x.weight)};}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(m.source==='savings'){var acc=0,arr=[];((S.savings&&S.savings.entries)||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){acc+=e.amount;arr.push({date:e.date,val:acc/10000});});return arr;}
  return (m.entries||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
}
function pjMetricCard(p){
  var m=p.metric;
  var h='<div class="card" style="margin-bottom:0">'+pjCardHead('numbers','숫자 목표',m?'<button class="btn bg bsm" onclick="openPjMetric(\''+p.id+'\')">설정</button>':'');
  if(!m) return h+'<div class="pjx-empty">몸무게 58kg · 책 20권 · 자산 5억처럼 숫자로 가는 목표를 그래프로 볼 수 있어요<br><button type="button" class="pjx-btn" style="margin-top:10px" onclick="openPjMetric(\''+p.id+'\')">+ 숫자 목표 만들기</button></div></div>';
  var cur=pjMetricCur(m),st=Number(m.start),tg=Number(m.target),u=esc(m.unit||'');
  var pc=(cur==null||isNaN(st)||isNaN(tg)||tg===st)?0:Math.max(0,Math.min(100,Math.round((cur-st)/(tg-st)*100)));
  var ser=pjMetricSeries(m).slice(-20),svg='';
  if(ser.length>1){var vs=ser.map(function(x){return Number(x.val);}).concat([tg]),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),W=300,H=70,rg=(mx-mn)||1;
    var pts=ser.map(function(x,i){return [(i/(ser.length-1))*W,H-6-((x.val-mn)/rg)*(H-12)];});
    var ty=H-6-((tg-mn)/rg)*(H-12);
    svg='<svg class="pjx-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="0" x2="'+W+'" y1="'+ty+'" y2="'+ty+'" stroke="var(--cz-mid,var(--accent))" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline fill="none" stroke="var(--cz-acc,var(--accent))" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+'"/>'+'</svg>';}
  h+='<div class="pjx-m"><div><div class="pjx-ml">'+esc(m.label||'목표')+'</div><div class="pjx-mv">'+(cur==null?'-':(Math.round(cur*10)/10).toLocaleString())+'<small>'+u+'</small></div><div class="pjx-ms">시작 '+st.toLocaleString()+u+' → 목표 '+tg.toLocaleString()+u+'</div></div><div class="pjx-mp">'+pc+'%</div></div>'+
    '<div class="pjx-bar"><i style="width:'+pc+'%"></i></div>'+svg;
  if(!m.source||m.source==='manual') h+='<div class="pjx-add"><input class="inp" type="number" step="any" id="pjm-v-'+p.id+'" placeholder="오늘 값 입력 ('+u+')"><button class="btn bp bsm" onclick="addPjMetric(\''+p.id+'\')">기록</button></div>';
  else h+='<div class="pjx-note">'+(m.source==='savings'?'저축 관리 금액(만원)이 자동으로 들어와요':'건강 관리 인바디 체중이 자동으로 들어와요')+'</div>';
  return h+'</div>';
}

function savePjMetric(pid){var p=S.projects.find(function(x){return x.id===pid;});if(!p)return;var src=document.getElementById('pjm-src').value,s0=parseFloat(document.getElementById('pjm-s').value),tg=parseFloat(document.getElementById('pjm-t').value);

var _tlDragId=null;
function tlDragStart(e){_tlDragId=e.currentTarget.dataset.id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function tlDragEnd(e){e.currentTarget.classList.remove('dragging');_tlDragId=null;}
function tlDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function tlDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function tlDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  var target=e.currentTarget.dataset.id;
  if(!_tlDragId||_tlDragId===target)return;
  var arr=S.timeline||[];
  var fromIdx=arr.findIndex(function(x){return x.id===_tlDragId;});
  var toIdx=arr.findIndex(function(x){return x.id===target;});
  if(fromIdx<0||toIdx<0)return;
  var item=arr.splice(fromIdx,1)[0];arr.splice(toIdx,0,item);
  _tlDragId=null;
  save();render();
}

function saveTlEntry(id){
  const year=document.getElementById('tl-year').value.trim();
  const title=document.getElementById('tl-title').value.trim();
  const sub=document.getElementById('tl-sub').value.trim();
  const desc=document.getElementById('tl-desc').value.trim();
  const tagsRaw=document.getElementById('tl-tags').value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(function(t){return t.trim();}).filter(Boolean):[];
  const size=selTlSize==='small'?'small':'big';
  const bgToggle=document.getElementById('tl-bg-toggle');
  const bgColor=(size==='big'&&bgToggle&&bgToggle.checked)?document.getElementById('tl-bg-input').value:'';
  if(!year&&!title)return;
  if(!S.timeline)S.timeline=[];
  if(id){
    const idx=S.timeline.findIndex(function(x){return x.id===id;});
    if(idx>-1){
      const upd={year:year,title:title,subtitle:sub,desc:desc,tags:tags,size:size,bgColor:bgColor};
      S.timeline[idx]=Object.assign({},S.timeline[idx],upd);
      if(!bgColor)delete S.timeline[idx].bgColor;
    }
  } else {
    const entry={id:gid(),year:year,title:title,subtitle:sub,desc:desc,tags:tags,size:size};
    if(bgColor)entry.bgColor=bgColor;
    if(_tlParent)entry.parentId=_tlParent;
    S.timeline.push(entry);
  }
  save();closeMo();render();
}

function delTlEntry(id){
  var nk=(S.timeline||[]).filter(function(x){return x.parentId===id;}).length;
  if(!confirm(nk?'이 시점과 옆의 작은 카드 '+nk+'개를 삭제할까요?':'이 시점을 삭제할까요?'))return;
  S.timeline=(S.timeline||[]).filter(function(x){return x.id!==id&&x.parentId!==id;});
  save();render();
}

// ═══════════ LIFE 드래그앤드롭 ═══════════
window._laDragging = false;
var _dragAreaId = null;   // 드래그 중인 라이프 카드 aid
var _dragPjId = null;     // 드래그 중인 프로젝트 pid

document.addEventListener('dragstart', function(e){
  // pj-slot 드래그 (카드 레이아웃 편집)는 방해하지 않음
  if(e.target.closest('.pj-slot[draggable]')) return;
  // supp 약 pill 드래그는 방해하지 않음
  if(e.target.closest('[draggable][data-id]')) return;
  // 건강 상태 관리 카드 드래그는 방해하지 않음
  if(e.target.closest('[draggable][data-cid]')) return;

  // 라이프 카드(영역) 드래그만 처리 — 카드 안 세부 목록은 드래그하지 않는다
  var card = e.target.closest('.la-card[draggable]');

  if(card){
    window._laDragging = true;
    _dragAreaId = card.dataset.aid;
    _dragPjId = null;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('type','area');
    setTimeout(function(){card.classList.add('dragging');},0);
  } else {
    // 드래그 취소
    e.preventDefault();
  }
});

document.addEventListener('dragend', function(e){
  window._laDragging = false;
  _dragAreaId = null; _dragPjId = null;
  document.querySelectorAll('.la-card.dragging').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.la-card.drag-over,.pj-drop-zone.drag-over').forEach(function(el){el.classList.remove('drag-over');});
});

document.addEventListener('dragover', function(e){
  e.preventDefault();
  var type = e.dataTransfer.getData('type') || (_dragPjId?'pj':_dragAreaId?'area':'');

  if(type==='pj'||_dragPjId){
    // 프로젝트를 라이프 카드 위로
    var zone = e.target.closest('.pj-drop-zone');
    var card = e.target.closest('.la-card');
    document.querySelectorAll('.pj-drop-zone.drag-over').forEach(function(el){el.classList.remove('drag-over');});
    if(zone) zone.classList.add('drag-over');
    else if(card){ var z=card.querySelector('.pj-drop-zone'); if(z) z.classList.add('drag-over'); }
  } else if(type==='area'||_dragAreaId){
    // 라이프 카드 순서 변경
    var targetCard = e.target.closest('.la-card[draggable]');
    document.querySelectorAll('.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});
    if(targetCard && targetCard.dataset.aid !== _dragAreaId) targetCard.classList.add('drag-over');
  }
});

document.addEventListener('dragleave', function(e){
  if(!e.currentTarget.contains(e.relatedTarget)){
    document.querySelectorAll('.pj-drop-zone.drag-over,.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});
  }
});

document.addEventListener('drop', function(e){
  e.preventDefault();
  document.querySelectorAll('.pj-drop-zone.drag-over,.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});

  if(_dragPjId){
    // 프로젝트 → 라이프 카드 이동
    var zone = e.target.closest('.pj-drop-zone');
    var card = e.target.closest('.la-card');
    var targetAid = zone ? zone.dataset.aid : (card ? card.dataset.aid : null);
    if(targetAid){
      var pj = S.projects.find(function(p){return p.id===_dragPjId;});
      if(pj && pj.lifeAreaId !== targetAid){
        pj.lifeAreaId = targetAid;
        save(); render();
      }
    }
  } else if(_dragAreaId){
    // 라이프 카드 순서 변경
    var targetCard = e.target.closest('.la-card[draggable]');
    if(targetCard && targetCard.dataset.aid !== _dragAreaId){
      var areas = S.lifeAreas;
      var fromIdx = areas.findIndex(function(a){return a.id===_dragAreaId;});
      var toIdx   = areas.findIndex(function(a){return a.id===targetCard.dataset.aid;});
      if(fromIdx>-1 && toIdx>-1){
        var moved = areas.splice(fromIdx,1)[0];
        areas.splice(toIdx,0,moved);
        save(); render();
      }
    }
  }
  window._laDragging = false;
  _dragAreaId = null; _dragPjId = null;
});

function pickPjC(el,c){selPjC=c;document.querySelectorAll('.cop').forEach(e=>e.classList.remove('on'));el.classList.add('on');}
function pickPjA(el,id){
  var aid=(id!==undefined)?id:(el.dataset.aid||'');
  selPjA=aid;
  document.querySelectorAll('[id^="pja-"],[data-aid]').forEach(b=>{b.style.background='';b.style.color='';b.style.borderColor='';});
  const area=(S.lifeAreas||[]).find(a=>a.id===aid);
  if(area){
    el.style.background=area.color;el.style.color='#fff';el.style.borderColor=area.color;
    // 색상도 라이프 영역 색상으로 자동 변경
    selPjC=area.color;
    // 디데이도 영역 날짜로 자동 채움 (영역에 날짜가 있으면)
    const ddayInput=document.getElementById('pj-dday');
    if(ddayInput&&area.dday)ddayInput.value=area.dday;
    const cops=document.querySelectorAll('#pj-cops .cop');
    cops.forEach(c=>c.classList.remove('on'));
    let matched=false;
    cops.forEach(c=>{if(c.style.background===area.color||c.dataset.c===area.color){c.classList.add('on');matched=true;}});
    // 팔레트에 없는 커스텀 색이면 마지막 label(color picker) 배경만 변경
    if(!matched){const last=document.querySelector('#pj-cops label.cop');if(last)last.style.background=area.color;}
  } else {
    el.style.background='var(--s2)';
  }
}

      '</div></div>';

  html+='<div class="pj-layout'+(isEdit?' pj-editing':'')+'" id="pj-layout-grid">';
  layout.forEach(function(slot){
    if(!CB[slot.id])return;

function toggleTdLayoutEdit(){window._tdEditMode=!window._tdEditMode;render();}
function togTdSlotSize(cardId){
  var defTL=[{id:'stats',cols:2},{id:'deadlines',cols:1},{id:'monthlyGoal',cols:1},{id:'todo',cols:1},{id:'diary',cols:1},{id:'projects',cols:2}];

function togTdSlotVis(cardId){if(!S.todayCardVis)S.todayCardVis={};var v=S.todayCardVis[cardId];var shown=cardId==='suppToday'?v===true:v!==false;S.todayCardVis[cardId]=!shown;save();render();}
var _tdDragCard=null;
function tdSlotDragStart(e){_tdDragCard=e.currentTarget.dataset.card;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function tdSlotDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  var target=e.currentTarget.dataset.card;if(!_tdDragCard||_tdDragCard===target)return;
  var defTL=[{id:'stats',cols:2},{id:'deadlines',cols:1},{id:'monthlyGoal',cols:1},{id:'todo',cols:1},{id:'diary',cols:1},{id:'projects',cols:2}];
  if(!S.todayLayout)S.todayLayout=JSON.parse(JSON.stringify(defTL));
  var lay=S.todayLayout,fi=lay.findIndex(s=>s.id===_tdDragCard),ti=lay.findIndex(s=>s.id===target);
  if(fi<0||ti<0)return;var item=lay.splice(fi,1)[0];lay.splice(ti,0,item);_tdDragCard=null;save();render();
}

// 드래그 앤 드롭 순서 변경
var _pjDragCard=null;
function pjSlotDragStart(e){_pjDragCard=e.currentTarget.dataset.card;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function pjSlotDragEnd(e){e.currentTarget.classList.remove('dragging');_pjDragCard=null;}
function pjSlotDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function pjSlotDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function pjSlotDrop(e,pid){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  var target=e.currentTarget.dataset.card;
  if(!_pjDragCard||_pjDragCard===target)return;
  var p=S.projects.find(x=>x.id===pid);if(!p)return;
  var defLayout=[{id:'progress',cols:2},{id:'task',cols:1},{id:'deadline',cols:1},{id:'routine',cols:2},{id:'achieve',cols:2},{id:'milestone',cols:1},{id:'material',cols:1},{id:'link',cols:1},{id:'note',cols:1}];
  if(!p.cardLayout)p.cardLayout=JSON.parse(JSON.stringify(defLayout));
  var lay=p.cardLayout, fromIdx=lay.findIndex(s=>s.id===_pjDragCard), toIdx=lay.findIndex(s=>s.id===target);
  if(fromIdx<0||toIdx<0)return;
  var item=lay.splice(fromIdx,1)[0];lay.splice(toIdx,0,item);
  _pjDragCard=null;
  save();render();
}

function togTk(pid,i){const p=S.projects.find(x=>x.id===pid);if(!p||!p.tasks[i])return;p.tasks[i].done=!p.tasks[i].done;save();render();}
function delTk(pid,i){
  const p=S.projects.find(x=>x.id===pid);
  if(!p||!p.tasks[i])return;
  const t=p.tasks[i];
  // 캘린더에서 해당 태스크 마감일 제거
  if(t.due) S.deadlines=S.deadlines.filter(d=>!(d.projectId===pid&&d._tkIdx===i&&d.date===t.due));
  p.tasks.splice(i,1);
  save();render();
}
function openTkModal(pid){
  openMo('태스크 추가',
    '<div class="fg"><label class="fl">태스크</label><input class="inp" id="t-t" placeholder="할 일"></div>'+
    '<div class="fg"><label class="fl">마감일 (선택) — 캘린더에 자동 표시</label><input type="date" class="inp" id="t-d"></div>',
    '<button class="btn bg" onclick="closeMo()">취소</button><button class="btn bp" onclick="saveTk(\''+pid+'\')">추가</button>');
}
function openTkEditModal(pid,i){
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const t=p.tasks[i];if(!t)return;
  openMo('태스크 수정',
    '<div class="fg"><label class="fl">태스크</label><input class="inp" id="te-t" value="'+esc(t.text)+'"></div>'+
    '<div class="fg"><label class="fl">마감일 (선택)</label><input type="date" class="inp" id="te-d" value="'+(t.due||'')+'"></div>',
    '<button class="btn bg" onclick="closeMo()">취소</button><button class="btn bp" onclick="saveTkEdit(\''+pid+'\','+i+')">저장</button>');
}
function saveTkEdit(pid,i){
  const text=document.getElementById('te-t').value.trim();
  const due=document.getElementById('te-d').value;
  if(!text)return;
  const p=S.projects.find(x=>x.id===pid);
  const old=p.tasks[i];
  // 기존 마감일 캘린더에서 제거
  if(old.due) S.deadlines=S.deadlines.filter(d=>!(d._tkId===old.id));
  p.tasks[i]=Object.assign({},old,{text,due});
  // 새 마감일 캘린더 등록
  if(due){
    S.deadlines=S.deadlines.filter(d=>d._tkId!==old.id);
    S.deadlines.push({id:gid(),title:text,date:due,projectId:pid,_tkId:old.id});
  }
  save();closeMo();render();
}
function saveTk(pid){
  const text=document.getElementById('t-t').value.trim(),due=document.getElementById('t-d').value;
  if(!text)return;
  const p=S.projects.find(x=>x.id===pid);
  if(!p.tasks)p.tasks=[];
  const tkId=gid();
  p.tasks.push({id:tkId,text,due,done:false});
  // 마감일 있으면 캘린더에 자동 등록
  if(due){
    S.deadlines.push({id:gid(),title:text,date:due,projectId:pid,_tkId:tkId});
  }
  save();closeMo();render();
}

function detectPdf(input){
  const file=input.files[0];
  if(!file)return;
  // 제목 자동 입력
  const titleEl=document.getElementById('mat-title');
  if(titleEl&&!titleEl.value) titleEl.value=file.name.replace(/\.pdf$/i,'');

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const bytes=new Uint8Array(e.target.result);
      // 바이너리를 latin1 문자열로 변환 (PDF 내부 구조 파싱용)
      let str='';
      for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);

      let pages=0;

      // 방법 1: /N 숫자 (Pages 딕셔너리 안)
      const m1=str.match(/\/N\s+(\d+)/);
      if(m1) pages=parseInt(m1[1]);

      // 방법 2: /Count 숫자
      if(!pages){
        const counts=[...str.matchAll(/\/Count\s+(\d+)/g)].map(m=>parseInt(m[1]));
        if(counts.length) pages=Math.max(...counts);
      }

      // 방법 3: PDF 전체에서 페이지 오브젝트 개수 세기
      if(!pages){
        const pageObjs=(str.match(/\/Type\s*\/Page[^s]/g)||[]).length;
        if(pageObjs>0) pages=pageObjs;
      }

      // 방법 4: trailer의 /Size로 추정 (부정확하지만 없는 것보다 나음)
      if(!pages){
        const trailer=str.match(/\/Size\s+(\d+)/);
        if(trailer) pages=Math.max(1,parseInt(trailer[1])-1);
      }

      const totalEl=document.getElementById('mat-total');
      if(totalEl&&pages>0){
        totalEl.value=pages;
        document.getElementById('mat-unit').value='p';
      } else if(totalEl){
        totalEl.placeholder='페이지 수 직접 입력';
      }
    }catch(err){console.log('PDF 파싱 오류',err);}
  };
  // 앞 1MB 읽기 (페이지 정보는 대부분 앞부분에 있음)
  reader.readAsArrayBuffer(file.slice(0,1024*1024));
}
function saveMat(pid){
  const type=document.getElementById('mat-type').value;
  const title=document.getElementById('mat-title').value.trim();
  const total=parseInt(document.getElementById('mat-total').value)||0;
  const unit=document.getElementById('mat-unit').value;
  const current=parseInt(document.getElementById('mat-cur').value)||0;
  const memo=document.getElementById('mat-memo').value.trim();
  if(!title)return;
  const p=S.projects.find(x=>x.id===pid);
  if(!p.materials)p.materials=[];
  p.materials.push({id:gid(),type,title,total,unit,current,memo});
  save();closeMo();render();
}

  save();render();
}

function saveRz(pid){
  const task=document.getElementById('rz-t').value.trim();
  const time=document.getElementById('rz-ti').value;
  const dur=document.getElementById('rz-du').value;
  const saveAmtEl=document.getElementById('rz-save');
  const saveAmt=saveAmtEl&&saveAmtEl.value?Math.round(parseFloat(saveAmtEl.value)*10000):0;
  const until=document.getElementById('rz-until').value;
  const startEl=document.getElementById('rz-start');
  const startVal=startEl&&startEl.value?startEl.value:dateStr(new Date());
  const isMonthly=(document.getElementById('rz-mode-month')&&document.getElementById('rz-mode-month').dataset.on==='1');
  const isDaily=(document.getElementById('rz-mode-day')&&document.getElementById('rz-mode-day').dataset.on==='1');

  if(!task){alert('할 일 이름을 입력해주세요');return;}
  if(!until){alert('등록 마감일을 선택해주세요');return;}
  if(startVal>until){alert('시작일이 마감일보다 늦을 수 없어요');return;}

  let days=[], monthDays=[];
  if(isMonthly){
    monthDays=Array.from(document.querySelectorAll('#rz-mdays [data-md]')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.md==='last'?'last':parseInt(el.dataset.md));
    if(!monthDays.length){alert('날짜를 선택해주세요');return;}
  } else if(!isDaily){
    days=DOWS.filter(k=>{const el=document.getElementById('rzd-'+k);return el&&el.dataset.on==='1';});
    if(!days.length){alert('요일을 선택해주세요');return;}
  }

  const p=S.projects.find(x=>x.id===pid);if(!p.routinized)p.routinized=[];
  const entry={id:gid(),task,days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,time,duration:dur,projectId:pid,until,startDate:startVal,saveAmount:saveAmt};
  p.routinized.push(entry);
  S.routines.push({id:entry.id,time:time||'',task,detail:p.name+' 루틴화',days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,isRz:true,rzProjectId:pid,saveAmount:saveAmt,startDate:startVal,until});
  S.routines.sort((a,b)=>a.time.localeCompare(b.time));

  // 캘린더 등록: 시작일 ~ 마감일까지
  const untilDate=new Date(until+'T00:00:00');
  const now=new Date(startVal+'T00:00:00'); now.setHours(0,0,0,0);
  if(isMonthly){
    // 매월: 오늘~마감일 사이에 해당 일자(말일 포함)가 있으면 등록
    const hasLast=monthDays.includes('last');
    let cur=new Date(now);
    while(cur<=untilDate){
      const lastDayOfMonth=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const isLastDay=hasLast&&cur.getDate()===lastDayOfMonth;
      if(monthDays.includes(cur.getDate())||isLastDay){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:entry.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    // 매주/매일: 오늘~마감일 사이에 선택 요일(또는 매일) 등록
    let cur=new Date(now);
    while(cur<=untilDate){
      const dow=['sun','mon','tue','wed','thu','fri','sat'][cur.getDay()];
      if(isDaily||days.includes(dow)){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:entry.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  syncRzToRoutines();
  restoreCustomFont();
  save();closeMo();render();
}

  const isDaily=(document.getElementById('rze-mode-day')&&document.getElementById('rze-mode-day').dataset.on==='1');

  if(!task){alert('할 일 이름을 입력해주세요');return;}
  if(!until){alert('등록 마감일을 선택해주세요');return;}
  if(startVal>until){alert('시작일이 마감일보다 늦을 수 없어요');return;}

  let days=[], monthDays=[];
  if(isMonthly){
    monthDays=Array.from(document.querySelectorAll('#rze-mdays [data-md]')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.md==='last'?'last':parseInt(el.dataset.md));
    if(!monthDays.length){alert('날짜를 선택해주세요');return;}
  } else if(!isDaily){
    days=Array.from(document.querySelectorAll('.rzed-btn')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.k);
    if(!days.length){alert('요일을 선택해주세요');return;}
  }

  const p=S.projects.find(x=>x.id===pid); if(!p) return;
  const old=p.routinized[idx];
  S.calEvents=S.calEvents.filter(e=>e.rzId!==old.id);
  p.routinized[idx]=Object.assign({},old,{task,days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,time,duration:dur,until,startDate:startVal,saveAmount:saveAmt});

  // 이미 적립된 저축 내역 금액 재정산
  if(S.savings&&S.savings.entries){
    const prefix='rzsave-'+old.id+'-';
    S.savings.entries.forEach(function(e){
      if(e.id&&e.id.indexOf(prefix)===0){
        const diff=saveAmt-e.amount;
        e.amount=saveAmt;
        S.savings.current+=diff;
        e.note=task+' (루틴 달성)';
      }
    });
    if(S.savings.current<0)S.savings.current=0;
  }

  // 캘린더 재등록: 시작일 ~ 마감일
  const untilDate=new Date(until+'T00:00:00');
  let cur=new Date(startVal+'T00:00:00'); cur.setHours(0,0,0,0);
  if(isMonthly){
    const hasLast=monthDays.includes('last');
    while(cur<=untilDate){
      const lastDayOfMonth=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const isLastDay=hasLast&&cur.getDate()===lastDayOfMonth;
      if(monthDays.includes(cur.getDate())||isLastDay){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:old.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    while(cur<=untilDate){
      const dow=['sun','mon','tue','wed','thu','fri','sat'][cur.getDay()];
      if(isDaily||days.includes(dow)){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:old.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  syncRzToRoutines();
  save(); closeMo(); render();
}
function delRz(pid,i){
  const p=S.projects.find(x=>x.id===pid);
  const rm=p.routinized[i];
  p.routinized.splice(i,1);
  S.calEvents=S.calEvents.filter(e=>e.rzId!==rm.id);
  // 이 루틴으로 적립된 저축 내역 회수
  if(S.savings&&S.savings.entries){
    const prefix='rzsave-'+rm.id+'-';
    const removed=S.savings.entries.filter(e=>e.id&&e.id.indexOf(prefix)===0);
    removed.forEach(e=>{S.savings.current-=e.amount;});
    S.savings.entries=S.savings.entries.filter(e=>!(e.id&&e.id.indexOf(prefix)===0));
    if(S.savings.current<0)S.savings.current=0;
  }
  syncRzToRoutines();save();render();
}

// ═══════════ SAVINGS ═══════════
function renderSavings(){
  const s=S.savings,pct=s.goal?Math.min(100,Math.round(s.current/s.goal*100)):0,rem=Math.max(0,s.goal-s.current);
  const entries=(s.entries||[]).slice().reverse();

  // 프로젝트별 합산
  const byProject={};
  const noProject={amount:0,count:0};
  (s.entries||[]).forEach(function(e){
    if(e.projectId&&e.projectName){
      if(!byProject[e.projectId])byProject[e.projectId]={name:e.projectName,amount:0,count:0,color:''};
      byProject[e.projectId].amount+=e.amount;
      byProject[e.projectId].count++;
    } else {
      noProject.amount+=e.amount;
      noProject.count++;
    }
  });
  // 프로젝트 색상 매칭
  Object.keys(byProject).forEach(function(pid){
    const proj=(S.projects||[]).find(p=>p.id===pid);
    byProject[pid].color=proj?proj.color:'var(--accent)';
  });

  // 저축 금액이 등록된 루틴이 있는 프로젝트는 적립 0이어도 카드 표시
  (S.routines||[]).forEach(function(r){
    if(r.saveAmount>0&&r.rzProjectId){
      const proj=(S.projects||[]).find(p=>p.id===r.rzProjectId);
      if(proj&&!byProject[proj.id]){
        byProject[proj.id]={name:proj.name,amount:0,count:0,color:proj.color||'var(--accent)'};
      }
    }
  });

  // 프로젝트별 목표 횟수 및 목표 금액 계산 (저축 루틴이 시작~마감일까지 등록한 캘린더 이벤트 총 수 × 회당 금액)
  Object.keys(byProject).forEach(function(pid){
    const proj=(S.projects||[]).find(p=>p.id===pid);
    var total=0, targetAmt=0;
    if(proj&&proj.routinized){
      proj.routinized.forEach(function(rz){
        if(rz.saveAmount>0){
          var cnt=(S.calEvents||[]).filter(function(e){return e.rzId===rz.id;}).length;
          total+=cnt;
          targetAmt+=cnt*rz.saveAmount;
        }
      });
    }
    byProject[pid].totalCount=total;
    byProject[pid].targetAmount=targetAmt;
  });

  var projectCards='';
  const pids=Object.keys(byProject);
  if(pids.length>0||noProject.count>0){
    // 가장 큰 금액 기준으로 막대 비율 계산
    var allAmts=pids.map(function(pid){return byProject[pid].amount;});
    if(noProject.count>0)allAmts.push(noProject.amount);
    var maxAmt=Math.max(1,...allAmts);

    projectCards='<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:0.9286em;font-weight:500;color:var(--text)"><svg width="17" height="17" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0"><path d="M2 6a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>항목별 저축 현황</div>';
    projectCards+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px">';

    function svCard(name,amount,count,color,totalCount,targetAmount){
      var hasTarget=totalCount&&totalCount>0;
      var barPct=hasTarget?Math.min(100,Math.round(count/totalCount*100)):0;
      var countLabel=hasTarget?(count+' / '+totalCount+'회 적립 ('+barPct+'%)'):(count+'회 적립');
      var targetLabel=(hasTarget&&targetAmount>0)?('목표 '+money(targetAmount)):'';
      return '<div class="card" style="margin-bottom:0;padding:16px 18px">'+
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">'+
          '<div style="width:9px;height:9px;border-radius:3px;background:'+color+';flex-shrink:0"></div>'+
          '<div style="font-size:0.88em;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name+'</div>'+
        '</div>'+
        '<div style="font-family:var(--serif);font-size:1.7em;letter-spacing:-0.5px;color:var(--text);line-height:1.1;margin-bottom:8px">'+money(amount)+'</div>'+
        '<div class="pw" style="height:8px;margin-bottom:6px"><div class="pb" style="width:'+barPct+'%;background:'+color+'"></div></div>'+
        '<div style="font-size:0.75em;color:var(--t3)">'+countLabel+'</div>'+
        (targetLabel?'<div style="font-size:0.75em;color:var(--t3);margin-top:2px">'+targetLabel+'</div>':'')+
      '</div>';
    }

    pids.forEach(function(pid){
      const g=byProject[pid];
      projectCards+=svCard(g.name,g.amount,g.count,g.color,g.totalCount,g.targetAmount);
    });
    if(noProject.count>0){
      projectCards+=svCard('기타 (직접 입력)',noProject.amount,noProject.count,'var(--t3)',0,0);
    }
    projectCards+='</div>';
  }

  // 저축 내역을 루틴(note+projectName)별로 그룹화
  var histGroups={};
  (s.entries||[]).forEach(function(e){
    var key=(e.projectName||'')+'|'+(e.note||'저축');
    if(!histGroups[key]){
      var proj=e.projectId?(S.projects||[]).find(p=>p.id===e.projectId):null;
      histGroups[key]={note:(e.note||'저축').replace(/ \(루틴 달성\)$/,''),projectName:e.projectName||'',proj:proj,color:proj?proj.color:'var(--t3)',total:0,items:[]};
    }
    histGroups[key].total+=e.amount;
    histGroups[key].items.push(e);
  });
  var histKeys=Object.keys(histGroups);
  var histHtml='';
  if(histKeys.length===0){
    histHtml='<div class="empty">내역이 없어요</div>';
  } else {
    histHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px">';
    histKeys.forEach(function(k){
      var g=histGroups[k];
      // 최신 날짜순 정렬
      g.items.sort(function(a,b){return b.date.localeCompare(a.date);});
      var itemsHtml=g.items.map(function(e){
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 0;font-size:0.7em">'+

    '<div class="ov-kick">MY LIFE GOAL</div>'+
    '<h1>'+esc(lg.text||'나의 인생 목표')+'</h1>'+
    (lg.sub?'<p>'+esc(lg.sub)+'</p>':'')+
    '<div class="ov-pills">'+(lgDd!==null?'<span class="on">'+ddL(lgDd)+'</span><span>'+esc(lg.dday.replace(/-/g,'. '))+'</span>':'')+
      '<button onclick="printOverview()">'+CZI.report+'보고서</button></div>'+
    '</div><span class="cz-ph-btns"><button type="button" class="cz-ph-btn" onclick="czPickPhoto(\'overview\',\'overview\')" title="사진 바꾸기">'+CZI.cam+'</button>'+(ob.photo?'<button type="button" class="cz-ph-btn" onclick="czResetPhoto(\'overview\',\'overview\')" title="기본 사진으로">'+CZI.reset+'</button>':'')+'</span></div>';

  const areas=(S.lifeAreas||[]).filter(function(a){return a.name;});
  const pjByArea={},pjNoArea=[];
  (S.projects||[]).forEach(function(p){
    if(p.lifeAreaId&&areas.some(function(a){return a.id===p.lifeAreaId;})){(pjByArea[p.lifeAreaId]=pjByArea[p.lifeAreaId]||[]).push(p);} else pjNoArea.push(p);
  });
  if(areas.length===0&&(S.projects||[]).length===0){
    return html+'<div class="ov-empty">라이프 목표와 프로젝트를 먼저 추가해보세요</div>';
  }
  function pjCard(p,area){
    const dls=(S.deadlines||[]).filter(function(d){return d.projectId===p.id&&d.date&&!d.done&&dLeft(d.date)>=0;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    const rzs=p.routinized||[],all=p.tasks||[],open=all.filter(function(t){return !t.done;});
    const dn=all.length-open.length,pc=all.length?Math.round(dn/all.length*100):0,col=p.color||'#E07656';
    var h='<div class="ov-pj" style="--pc:'+esc(col)+'">'+
      '<div class="ov-pj-h" onclick="go(\'projects\',\''+p.id+'\')">'+
        '<div class="ov-pj-ph" style="background-image:url(\''+esc(czProjectPhoto(p,area)).replace(/'/g,'%27')+'\')"></div>'+
        '<div class="ov-pj-t"><div class="ov-pj-n">'+esc(p.name||'')+'</div>'+
          '<div class="ov-pj-bar"><i style="width:'+pc+'%"></i></div>'+
          '<div class="ov-pj-m">'+(all.length?dn+' / '+all.length+' 완료':'태스크 없음')+'<b>'+pc+'%</b></div></div>'+
        '<span class="ov-pj-go">›</span></div>';
    var body='';
    if(open.length) body+='<div class="ov-blk"><div class="ov-lab">할 일</div>'+open.slice(0,6).map(function(t){return '<div class="ov-task"><i></i><span>'+esc(t.text)+'</span>'+(t.dueDate?'<em>'+t.dueDate.slice(5).replace('-','.')+'</em>':'')+'</div>';}).join('')+(open.length>6?'<div class="ov-more">외 '+(open.length-6)+'개</div>':'')+'</div>';
    if(dls.length) body+='<div class="ov-blk"><div class="ov-lab">마감일</div>'+dls.map(function(d){var dd=dLeft(d.date),f=fmtDateObj(d.date);return '<div class="ov-dl"><div class="ov-dc"><small>'+f.month+'</small>'+f.day+'</div><span>'+esc(d.title)+'</span><b class="'+(dd<=7?'hot':'')+'">'+(dd===0?'오늘':'D-'+dd)+'</b></div>';}).join('')+'</div>';
    if(rzs.length) body+='<div class="ov-blk"><div class="ov-lab">루틴</div>'+rzs.map(function(rz){return '<div class="ov-rz"><span class="ov-rz-n">'+esc(rz.task)+'</span><span class="ov-rz-m">'+rzLabel(rz)+(rz.until?' ~ '+rz.until.slice(0,7).replace('-','.'):'')+'</span>'+(rz.saveAmount>0?'<span class="ov-rz-a">+'+money(rz.saveAmount)+'</span>':'')+'</div>';}).join('')+'</div>';
    if(body) h+='<div class="ov-pj-b">'+body+'</div>';
    return h+'</div>';
  }
  function section(title,photo,list,area){
    var h='<div class="ov-sec"><div class="ov-sec-ph"'+(photo?' style="background-image:url(\''+esc(photo).replace(/'/g,'%27')+'\')"':'')+'></div><h2>'+esc(title)+'</h2><span class="ov-cnt">'+list.length+'</span></div>';
    if(!list.length) return h+'<div class="ov-none">아직 연결된 프로젝트가 없어요</div>';
    return h+'<div class="ov-grid">'+list.map(function(p){return pjCard(p,area);}).join('')+'</div>';
  }
  areas.forEach(function(a){html+=section(a.name,czAreaPhoto(a),pjByArea[a.id]||[],a);});
  if(pjNoArea.length) html+=section('영역 미지정','',pjNoArea,null);
  return html;
}

function printOverview(){
  const today=todStr();
  const yr=new Date().getFullYear();
  const areas=(S.lifeAreas||[]).filter(a=>a.name);
  const pjByArea={}, pjNoArea=[];
  (S.projects||[]).forEach(function(p){
    if(p.lifeAreaId){ if(!pjByArea[p.lifeAreaId]) pjByArea[p.lifeAreaId]=[]; pjByArea[p.lifeAreaId].push(p); }
    else pjNoArea.push(p);
  });

  function rzLabel(rz){
    if(rz.isMonthly) return '매월 '+(rz.monthDays||[]).map(function(d){return d==='last'?'말':d;}).join('·')+'일';
    if(!rz.days||rz.days.length===0) return '매일';
    return '매주 '+rz.days.map(function(d){return DOW_KO[DOWS.indexOf(d)];}).join('·');
  }

  // 현재 앱에서 사용 중인 폰트 패밀리 가져오기
  const appFont=getComputedStyle(document.documentElement).getPropertyValue('--sans').trim()||"'Pretendard','Apple SD Gothic Neo',sans-serif";
  const appFontSize=S.fontSize||14;
  const appFontWeight=S.fontWeight||'400';

  // 구글 폰트 링크 (앱에서 이미 로드된 것들)
  const existingFontLinks=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(function(l){return l.href;}).filter(function(h){return h.includes('fonts.googleapis.com');}).map(function(h){return '<link rel="stylesheet" href="'+h+'">';}).join('\n');

  const lifeGoal=S.lifeGoal||{};
  const goalTitle=lifeGoal.text||'';
  const goalSub=lifeGoal.sub||'';
  const goalDday=lifeGoal.dday||'';
  const savingsAmt=(S.savings&&S.savings.goal>0)?money(S.savings.goal):'';

  function buildPjCard(p){
    const dls=(S.deadlines||[]).filter(function(d){return d.projectId===p.id&&d.date&&!d.done&&dLeft(d.date)>=0;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    const rzs=p.routinized||[];
    const tasks=p.tasks||[];

    // 왼쪽: 태스크
    var leftHtml='<div class="col-label">태스크</div>';
    if(tasks.length===0){
      leftHtml+='<div class="col-empty">없음</div>';
    } else {
      tasks.forEach(function(t){
        leftHtml+='<div class="task-row'+(t.done?' task-done':'')+'">'+
          '<span class="task-box">'+(t.done?'✓':'')+'</span>'+
          '<span class="task-text">'+t.text+'</span>'+
          (t.dueDate?'<span class="task-due">'+t.dueDate.slice(5)+'</span>':'')+
        '</div>';
      });
    }

    // 오른쪽: 마감일 + 루틴화
    var rightHtml='';
    if(dls.length>0){
      rightHtml+='<div class="col-label">마감일</div>';
      dls.forEach(function(d){
        var dd=dLeft(d.date);
        var uc=dd<=7?'#c0392b':dd<=30?'#c07a2b':'#555';
        rightHtml+='<div class="dl-row">'+
          '<span class="dl-date">'+d.date.slice(5).replace('-','/')+'</span>'+
          '<span class="dl-title">'+d.title+'</span>'+
          '<span class="dl-dday" style="color:'+uc+'">'+(dd===0?'오늘':'D-'+dd)+'</span>'+
        '</div>';
      });
    }
    if(rzs.length>0){
      rightHtml+='<div class="col-label" style="margin-top:'+(dls.length?'10':'0')+'px">루틴화 일정</div>';
      rzs.forEach(function(rz){
        var label=rzLabel(rz);
        var until=rz.until?rz.until.slice(0,7):'';
        var amtStr=rz.saveAmount>0?(' · '+money(rz.saveAmount)):'';
        rightHtml+='<div class="rz-row">'+
          '<span class="rz-dot" style="background:'+p.color+'"></span>'+
          '<span class="rz-text">'+rz.task+'<span class="rz-meta">'+label+(until?' ~ '+until:'')+amtStr+'</span></span>'+
        '</div>';
      });
    }
    if(!rightHtml) rightHtml='<div class="col-empty">없음</div>';

    return '<div class="pj-card">'+
      '<div class="pj-header">'+
        '<span class="pj-dot" style="background:'+p.color+'"></span>'+
        '<span class="pj-name">'+p.name+'</span>'+
        (p.dday?'<span class="pj-dday">목표 '+p.dday+'</span>':'')+
      '</div>'+
      '<div class="pj-body">'+
        '<div class="pj-left">'+leftHtml+'</div>'+
        '<div class="pj-right">'+rightHtml+'</div>'+
      '</div>'+
    '</div>';
  }

  var sectionsHtml='';
  areas.forEach(function(area){
    var pjs=pjByArea[area.id]||[];
    sectionsHtml+='<div class="area-section">'+
      '<div class="area-header"><span class="area-emoji">'+area.emoji+'</span><span class="area-name">'+area.name+'</span></div>'+
      (pjs.length===0?'<p class="col-empty">이 영역에 연결된 프로젝트가 없어요</p>':pjs.map(buildPjCard).join(''))+
    '</div>';
  });
  if(pjNoArea.length>0){
    sectionsHtml+='<div class="area-section">'+
      '<div class="area-header"><span class="area-emoji">📁</span><span class="area-name">기타</span></div>'+
      pjNoArea.map(buildPjCard).join('')+
    '</div>';
  }

  const printHtml=`<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>${yr} 목표 계획서</title>
${existingFontLinks}
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:${appFont};color:#1a1a1a;background:#fff;font-size:${Math.max(11,appFontSize-1)}px;font-weight:${appFontWeight};line-height:1.6;}
  .page{max-width:760px;margin:0 auto;padding:44px 40px;}
  /* 헤더 */
  .report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #1a1a1a;padding-bottom:12px;margin-bottom:28px;}
  .report-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .report-year{font-size:44px;font-weight:700;line-height:1;}
  /* 인생 목표 */
  .life-goal-banner{border:1.5px solid #1a1a1a;border-radius:6px;padding:12px 18px;margin-bottom:24px;display:flex;align-items:center;gap:16px;background:#fafaf8;}
  .life-goal-label{font-size:9.5px;font-weight:600;color:#888;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3px;}
  .life-goal-text{font-size:14px;font-weight:700;}
  .life-goal-amount{font-size:18px;font-weight:700;padding:0 18px;border-left:1px solid #ddd;border-right:1px solid #ddd;}
  /* 영역 */
  .area-section{margin-bottom:24px;}
  .area-header{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #1a1a1a;}
  .area-emoji{font-size:14px;}
  .area-name{font-size:13.5px;font-weight:700;}
  /* 프로젝트 카드 */
  .pj-card{margin-bottom:10px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;break-inside:avoid;}
  .pj-header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f5f5f2;}
  .pj-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block;}
  .pj-name{font-weight:600;font-size:12.5px;flex:1;}
  .pj-dday{font-size:10px;color:#666;}
  /* 2열 본문 */
  .pj-body{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e8e8e8;}
  .pj-left{padding:10px 12px;border-right:1px solid #e8e8e8;}
  .pj-right{padding:10px 12px;}
  .col-label{font-size:9.5px;font-weight:600;color:#888;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
  .col-empty{font-size:10.5px;color:#bbb;}
  /* 태스크 */
  .task-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;font-size:11.5px;}

  .task-box{width:12px;height:12px;border:1.5px solid #ccc;border-radius:2px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#555;}
  .task-text{flex:1;}
  .task-due{font-size:10px;color:#aaa;flex-shrink:0;}
  /* 마감일 */
  .dl-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11.5px;}
  .dl-date{font-size:10.5px;color:#666;flex-shrink:0;font-weight:600;min-width:36px;}
  .dl-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-dday{font-size:10.5px;font-weight:700;flex-shrink:0;}
  /* 루틴 */
  .rz-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;font-size:11.5px;}
  .rz-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;display:inline-block;}
  .rz-text{flex:1;}
  .rz-meta{display:block;font-size:10px;color:#888;}
  /* 푸터 */
  .report-footer{margin-top:36px;padding-top:10px;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:10px;color:#aaa;}
  .sign-line{width:130px;border-bottom:1px solid #999;margin-top:22px;}

  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.page{padding:30px 26px;}}
</style></head><body>
<div class="page">
  <div class="report-header">
    <div><div class="report-title">나의 목표 계획서</div><div style="font-size:10.5px;color:#888;margin-top:3px">작성일 ${today}</div></div>
    <div class="report-year">${yr}</div>
  </div>
  ${goalTitle?`<div class="life-goal-banner">
    <div style="flex:1"><div class="life-goal-label">인생 목표</div><div class="life-goal-text">${goalTitle}</div>${goalSub?`<div style="font-size:10.5px;color:#888;margin-top:2px">${goalSub}</div>`:''}</div>
    ${savingsAmt?`<div class="life-goal-amount">${savingsAmt}</div>`:''}
    ${goalDday?`<div><div class="life-goal-label">목표 기간</div><div style="font-size:11px;color:#555;">${goalDday}까지</div></div>`:''}
  </div>`:''}
  ${sectionsHtml}
  <div class="report-footer">
    <div><div class="sign-line"></div><div class="sign-label">서명</div></div>
    <div style="text-align:right;line-height:2"><div>Lucy's Space</div><div>${today} 기준</div></div>

</div>

  const w=window.open('','_blank','width=820,height=950');

    {bg:'#E8A0A0',text:'#7A3535'},

    {bg:'#8FCFA0',text:'#245C3A'},

      '">'+tabIco[t.k]+t.l+'</button>';

function openSuppEditModal(slotKey,id){
  if(!S.health||!S.health.supplements)return;
  var it=(S.health.supplements[slotKey]||[]).find(function(x){return x.id===id;});
  if(!it)return;
  openHealthMo('영양제 수정',
    '<div class="fg"><label class="fl">이름</label><input class="inp" id="supp-name" value="'+esc(it.name)+'"></div>'+
    '<div class="fg"><label class="fl">갯수 (알)</label><input class="inp" id="supp-count" type="number" min="1" value="'+it.count+'" style="max-width:80px"></div>'+
    '<div class="fg"><label class="fl">효능</label><input class="inp" id="supp-effect" value="'+(it.effect||'')+'" placeholder="예: 면역력 강화"></div>',
    '<button class="btn bg" onclick="closeMo()">취소</button>'+
    '<button class="btn bp" onclick="saveSuppEdit(\''+slotKey+'\',\''+id+'\')">저장</button>'
  );
}
function saveSuppEdit(slotKey,id){
  var name=document.getElementById('supp-name').value.trim();
  var count=parseInt(document.getElementById('supp-count').value)||1;
  var effect=document.getElementById('supp-effect').value.trim();
  if(!name){alert('이름을 입력해주세요');return;}
  var arr=S.health.supplements[slotKey]||[];
  var idx=arr.findIndex(function(x){return x.id===id;});
  if(idx<0)return;
  arr[idx]={id:id,name:name,count:count,effect:effect};
  save();closeMo();render();
}
// 복용 달력에서 날짜를 클릭하면 아래 체크 패널이 그 날짜로 전환됨
function selectSuppDay(ds){
  window._suppSelectedDate=ds;
  render();
}
function togSuppCheck(ds,id){
  if(!S.suppChecks)S.suppChecks={};
  if(!S.suppChecks[ds])S.suppChecks[ds]={};
  S.suppChecks[ds][id]=!S.suppChecks[ds][id];
  save();render();
}

// ═══════════ 식품 정리 · 코지 ═══════════
var SUPP_IC={morning_empty:'☼',morning_meal:'☕',lunch:'◐',dinner:'☾',bedtime:'✦'};

  var t=todStr(),sel=window._suppSelectedDate||t,ck=(S.suppChecks||{})[sel]||{};

    '<div class="spz-msg">'+(pc===100?'✿ 다 챙겨 먹었어요. 잘했어요!':done?'잘하고 있어요, '+(all.length-done)+'개 남았어요':'하나씩 체크해 볼까요?')+'</div></div>'+
    '<div class="spz-ring" style="--p:'+pc+'"><b>'+done+'</b><small>/ '+all.length+'</small></div></div>';
  if(sel!==t) h+='<button type="button" class="spz-back" onclick="selectSuppDay(\''+t+'\')">← 오늘로</button>';
  h+='<div class="spz-groups">';

      its.map(function(x){var on=!!ck[x.it.id],p=pillColorByName(x.it.name);return '<button type="button" class="spz-chip'+(on?' on':'')+'" style="--pc:'+p.color+';--pb:'+p.bg+'" onclick="togSuppCheck(\''+sel+'\',\''+x.it.id+'\')"'+(x.it.effect?' title="'+esc(x.it.effect)+'"':'')+'><span class="spz-cb">'+(on?'✓':'')+'</span>'+esc(x.it.name)+'<small>'+(x.it.count||1)+'알</small></button>';}).join('')+'</div></div>';
  });

function suppCheckSlot(ds,key){if(!S.suppChecks)S.suppChecks={};if(!S.suppChecks[ds])S.suppChecks[ds]={};((S.health.supplements[key])||[]).forEach(function(it){S.suppChecks[ds][it.id]=true;});save();render();}
function suppCozyCal(){
  var all=suppAllItems();if(!all.length)return '';
  var now=new Date(),off=window._suppCalMonthOffset||0,base=new Date(now.getFullYear(),now.getMonth()+off,1),yr=base.getFullYear(),mo=base.getMonth();
  var first=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate(),t=todStr(),sel=window._suppSelectedDate||t,sc=S.suppChecks||{};
  var full=0,past=0;
  var h='<div class="card spz-cal"><div class="spz-ch"><button type="button" onclick="suppCalNav(-1)">‹</button><div class="spz-t"><em>calendar</em>'+yr+'년 '+(mo+1)+'월</div><button type="button" onclick="suppCalNav(1)">›</button></div>';
  h+='<div class="spz-dn">'+['일','월','화','수','목','금','토'].map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="spz-grid">';
  for(var i=0;i<first;i++)h+='<span></span>';
  for(var d=1;d<=dim;d++){
    var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ck=sc[ds]||{},dn=all.filter(function(x){return ck[x.it.id];}).length,pc=Math.round(dn/all.length*100),fut=ds>t;
    if(!fut){past++;if(pc===100)full++;}
    h+='<button type="button" class="spz-d'+(ds===t?' today':'')+(ds===sel?' sel':'')+(fut?' fut':'')+(pc===100?' full':'')+'" onclick="selectSuppDay(\''+ds+'\')" title="'+dn+'/'+all.length+'"><span class="spz-mr" style="--p:'+(fut?0:pc)+'"><b>'+d+'</b></span></button>';
  }

  cal+='</div>';

function pillColorByName(name){
  if(_pillColorMap[name])return _pillColorMap[name];
  var s=0;for(var i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))&0xFFFFFF;
  return _pillColorPalette[Math.abs(s)%_pillColorPalette.length];
}

function calcBmi(){
  var wEl=document.getElementById('ib-w'), hEl=document.getElementById('ib-h'), bEl=document.getElementById('ib-b');

  var w=parseFloat(wEl.value), h=parseFloat(hEl.value);
  if(w>0&&h>0) bEl.value=(w/((h/100)*(h/100))).toFixed(1);
}

      '<div><label class="fl">관련 과 / 분류</label>'+
        '<select class="inp sel" id="co-cat" onchange="toggleCondCustomCat(this.value)">'+cats.map(function(ct){return '<option'+(!isCustomCat&&c.category===ct?' selected':'')+'>'+ct+'</option>';}).join('')+'<option value="__custom__"'+(isCustomCat?' selected':'')+'>직접 입력</option></select>'+
        '<input class="inp" id="co-cat-custom" placeholder="분류를 입력하세요" value="'+(isCustomCat?c.category:'')+'" style="margin-top:6px;display:'+(isCustomCat?'block':'none')+'">'+
      '</div>'+

      '<div><label class="fl">진단일</label><input type="date" class="inp" id="co-date" value="'+(c.diagDate||'')+'"></div>'+

    '<div class="fg"><label class="fl">메모</label><textarea class="ta" id="co-note" rows="2">'+(c.note||'')+'</textarea></div>',
    '<button class="btn bg bsm" onclick="closeMo()">취소</button><button class="btn bp bsm" onclick="saveCond('+(id?'\''+id+'\'':'null')+')">저장</button>'

function toggleCondCustomCat(val){
  var el=document.getElementById('co-cat-custom');
  if(!el)return;
  el.style.display=(val==='__custom__')?'block':'none';
  if(val==='__custom__')el.focus();
}
function saveCond(id){
  const n=document.getElementById('co-n').value.trim();
  const catSel=document.getElementById('co-cat').value;
  const cat=catSel==='__custom__'?(document.getElementById('co-cat-custom').value.trim()||'기타'):catSel;
  const onset=document.getElementById('co-onset').value;
  const dt=document.getElementById('co-date').value;
  const note=document.getElementById('co-note').value.trim();
  const cbg=document.getElementById('co-cbg').value;
  const ctxt=document.getElementById('co-ctxt').value;
  if(!n){alert('병명을 입력해주세요');return;}
  if(!S.health.conditions) S.health.conditions=[];
  if(id){
    const c=S.health.conditions.find(x=>x.id===id);
    if(c){c.name=n;c.category=cat;c.onsetDate=onset;c.diagDate=dt;c.note=note;c.color={bg:cbg,text:ctxt};}
  } else {
    S.health.conditions.push({id:gid(),name:n,category:cat,onsetDate:onset,diagDate:dt,note:note,history:[],color:{bg:cbg,text:ctxt}});
  }
  save();closeMo();render();
}
function delCond(id){
  if(!S.health||!S.health.conditions) return;
  S.health.conditions=S.health.conditions.filter(x=>x.id!==id);
  (S.health.records||[]).forEach(function(r){if(r.conditionIds)r.conditionIds=r.conditionIds.filter(function(x){return x!==id;});});
  save();render();
}
// ── 건강 상태 관리 카드 드래그 앤 드롭 순서 변경 ──
var _condDragId=null;
function condCardDragStart(e){_condDragId=e.currentTarget.dataset.cid;e.currentTarget.style.opacity='0.4';e.currentTarget.style.cursor='grabbing';e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',_condDragId);}
function condCardDragEnd(e){e.currentTarget.style.opacity='';e.currentTarget.style.cursor='grab';_condDragId=null;}
function condCardDragOver(e){e.preventDefault();e.currentTarget.style.outline='2px solid var(--accent)';e.currentTarget.style.outlineOffset='2px';}
function condCardDragLeave(e){e.currentTarget.style.outline='';}
function condCardDrop(e){
  e.preventDefault();
  e.currentTarget.style.outline='';
  var target=e.currentTarget.dataset.cid;
  if(!_condDragId||_condDragId===target)return;
  var arr=S.health.conditions||[];
  var fromIdx=arr.findIndex(function(x){return x.id===_condDragId;});
  var toIdx=arr.findIndex(function(x){return x.id===target;});
  if(fromIdx<0||toIdx<0)return;
  var item=arr.splice(fromIdx,1)[0];arr.splice(toIdx,0,item);
  _condDragId=null;
  save();render();
}

function openCondHistModal(condId){

function saveCondHist(condId){
  const d=document.getElementById('ch-d').value;
  const detail=document.getElementById('ch-detail').value.trim();
  if(!d||!detail){alert('날짜와 내용을 입력해주세요');return;}
  const c=(S.health.conditions||[]).find(x=>x.id===condId);
  if(!c) return;
  if(!c.history) c.history=[];
  c.history.push({id:gid(),date:d,detail:detail});
  save();closeMo();render();
}
function delCondHist(condId, histId){
  const c=(S.health.conditions||[]).find(x=>x.id===condId);
  if(!c||!c.history) return;
  c.history=c.history.filter(x=>x.id!==histId);
  save();render();
}

// 검진 기록 필드 라벨·색상 (유형 구분 없이 공통)
var HR_LABELS={
  abnormal:{l:'⚠️ 이상 소견', c:'var(--red)', bg:'#fde8e8'},
  normal:{l:'✅ 정상 범위', c:'#2d8653', bg:'#e6f4ec'},
  treatment:{l:'💊 처치 / 처방', c:'#3C6BC1', bg:'#e8edfa'},
  action:{l:'📌 추후 조치', c:'var(--accent)', bg:'var(--al)'},
  nextAppt:{l:'📅 다음 예약', c:'#C17C3C', bg:'#f5e8d8'},
  note:{l:'📝 진료 내용', c:'var(--t2)', bg:'var(--s2)'}
};
// 검진 기록 제목 표시 (제목이 없으면 연결된 병명으로 대체) + 병원명
function hrTitleHtml(r){
  var t=r.title||((r.conditionIds&&r.conditionIds.length)?(S.health.conditions||[]).filter(function(c){return r.conditionIds.indexOf(c.id)!==-1;}).map(function(c){return c.name;}).join(', '):'메모');
  return t+(r.hospital?' <span style="font-weight:400;color:var(--t2);font-size:0.85em">· '+r.hospital+'</span>':'');
}
function hrRecFieldsHtml(r){
  var out='';
  ['abnormal','normal','treatment','action','nextAppt','note'].forEach(function(k){
    var L=HR_LABELS[k];
    var content;
    if(k==='nextAppt'){
      if(!r.nextApptDate)return;
      var dd=dLeft(r.nextApptDate);
      var ddTxt=dd<0?'지남':dd===0?'오늘':'D-'+dd;
      content=r.nextApptDate+(r.nextApptNote?' · '+r.nextApptNote:'')+' <span style="color:var(--t3);font-weight:600">('+ddTxt+')</span>';
    } else {
      if(!r[k])return;
      content=r[k];
    }
    out+='<div style="margin-top:5px"><span style="font-size:0.72em;font-weight:600;color:'+L.c+';background:'+L.bg+';padding:1px 6px;border-radius:4px">'+L.l+'</span><div style="font-size:0.82em;color:var(--t2);margin-top:3px;white-space:pre-wrap">'+content+'</div></div>';
  });
  if(!r.abnormal&&!r.normal&&!r.treatment&&!r.action&&!r.nextApptDate&&!r.note&&r.memo){
    out='<div style="font-size:0.82em;color:var(--t3);margin-top:3px;white-space:pre-wrap">'+r.memo+'</div>'+out;
  }
  return out;
}

// 이미지를 canvas로 리사이즈·압축해서 base64 반환 (용량 초과 방지)
function compressImage(file, maxW, maxH, quality){
  return new Promise(function(resolve){
    if(!file.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=function(e){resolve({name:file.name,type:file.type,data:e.target.result});};
      reader.readAsDataURL(file);
      return;
    }
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve({name:file.name,type:'image/jpeg',data:canvas.toDataURL('image/jpeg',quality||0.7)});
    };
    img.onerror=function(){resolve(null);};
    img.src=url;
  });
}

function previewHealthFiles(input){
  var files=Array.from(input.files);
  // 병렬 압축 후 순서 유지
  Promise.all(files.map(function(file){
    return compressImage(file, 1200, 1200, 0.72);
  })).then(function(results){
    window._hrFiles=window._hrFiles||[];
    results.forEach(function(r){if(r) window._hrFiles.push(r);});
    refreshHrPreview();
  });
}

}

// 검진 기록의 "다음 예약" 날짜를 검진 일정(S.health.schedules)에 자동으로 추가·동기화
function syncNextApptSchedule(rec){
  if(!S.health.schedules) S.health.schedules=[];
  if(rec.nextApptDate){
    var schedTitle=(rec.title||'진료')+' 다음 예약'+(rec.nextApptNote?' · '+rec.nextApptNote:'');
    var cid=(rec.conditionIds&&rec.conditionIds[0])||'';
    var s=rec.nextApptSchedId?S.health.schedules.find(function(x){return x.id===rec.nextApptSchedId;}):null;
    if(s){
      s.title=schedTitle;s.date=rec.nextApptDate;s.conditionId=cid;s.done=false;
    } else {
      var ns={id:gid(),title:schedTitle,date:rec.nextApptDate,memo:'',hospital:'',conditionId:cid,done:false,fromRecordId:rec.id};
      S.health.schedules.push(ns);
      rec.nextApptSchedId=ns.id;
    }
  } else if(rec.nextApptSchedId){
    S.health.schedules=S.health.schedules.filter(function(x){return x.id!==rec.nextApptSchedId;});
    rec.nextApptSchedId=null;
  }
}
