<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>웹소설 집필실</title>
<link rel="manifest" href="novel-manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#f6f7f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f6f7f4; --panel: #ffffff; --panel2: #fbfbf9; --line: #e4e6e0; --text: #23261f; --muted: #8a8f84;
    --accent: #6aa12f; --accent-soft: #eef6e4; --danger: #d9534f; --paper: #fffefa;
    --cork: #d3b487; --cork-dot: rgba(80,50,10,.22); --cork-text: #5b4426;
    --note-yellow: #fff6c7; --note-pink: #ffe1ea; --note-green: #e3f5d6; --note-blue: #dfeefe; --note-purple: #ece4fb;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #17191a; --panel: #1f2223; --panel2: #232627; --line: #33383a; --text: #e6e8e3; --muted: #8d948f;
        --accent: #8cc455; --accent-soft: #263420; --paper: #1c1f20;
    --cork: #3a3026; --cork-dot: rgba(255,240,220,.10); --cork-text: #c2ae8e;
        --note-yellow: #3b3720; --note-pink: #3d2730; --note-green: #253522; --note-blue: #213140; --note-purple: #2f2840;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #17191a; --panel: #1f2223; --panel2: #232627; --line: #33383a; --text: #e6e8e3; --muted: #8d948f;
    --accent: #8cc455; --accent-soft: #263420; --paper: #1c1f20;
    --cork: #3a3026; --cork-dot: rgba(255,240,220,.10); --cork-text: #c2ae8e;
    --note-yellow: #3b3720; --note-pink: #3d2730; --note-green: #253522; --note-blue: #213140; --note-purple: #2f2840;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
.hidden { display: none !important; }

/* ===== 상단 바 ===== */
header { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; color: var(--accent); white-space: nowrap; }
header .work-select { font-weight: 700; max-width: 220px; }
header .spacer { flex: 1; }
.today-chip { font-size: 11px; color: var(--muted); white-space: nowrap; padding: 3px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.today-chip b { color: var(--accent); }
.sync-badge { font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
.sync-badge.ok { color: var(--accent); border-color: var(--accent); }
.sync-badge.warn { color: #d08a1a; border-color: #d08a1a; }
.sync-badge.err { color: var(--danger); border-color: var(--danger); }
.icon-btn { padding: 5px 8px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }
.menu { position: relative; }
.pop { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; z-index: 80; min-width: 190px; max-height: 80vh; overflow-y: auto; }
.pop button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; white-space: nowrap; }
.pop button:hover { background: var(--accent-soft); }
.pop button.danger { color: var(--danger); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ===== 서식 도구줄 ===== */
.toolbar { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; flex: none; }
.toolbar .spacer { flex: 1; }
.tb { min-width: 28px; height: 28px; padding: 0 6px; border-radius: 6px; color: var(--text); flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-size: 13px; }
.tb:hover { background: var(--accent-soft); color: var(--accent); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.tb.small { font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.seg button { padding: 3px 8px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.seg-label { font-size: 11px; color: var(--muted); margin: 0 3px 0 4px; flex: none; }
.swatches { display: grid; grid-template-columns: repeat(4, 26px); gap: 6px; padding: 4px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.swatch.none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45% 55%, transparent 55%) !important; }

/* 선택 영역 위에 뜨는 서식 도구 */
.selbar { position: fixed; z-index: 90; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.selbar .tb { min-width: 30px; height: 30px; }
.selbar .dot { width: 18px; height: 18px; border-radius: 50%; margin: 0 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); flex: none; }

/* ===== 메인 레이아웃 ===== */
main { height: calc(100% - 82px); display: flex; }
.col { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
.col-head { height: 32px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 12px; }
.col-head .spacer { flex: 1; }
.resizer { width: 5px; flex: none; cursor: col-resize; background: var(--line); opacity: .5; touch-action: none; }
.resizer:hover, .resizer.drag { background: var(--accent); opacity: 1; }
#col-tree { width: 230px; }
#col-synop { width: 320px; }
#col-editor { flex: 1; background: var(--bg); }
#col-notes { width: 290px; }

/* 바인더 */
.tree { flex: 1; overflow-y: auto; padding: 4px 4px 20px; }
.tree-sec { font-size: 11px; color: var(--muted); font-weight: 700; padding: 10px 6px 4px; display: flex; align-items: center; gap: 2px; }
.tree-sec .spacer { flex: 1; }
.tree-sec button { font-size: 11px; padding: 1px 5px; border-radius: 4px; color: var(--muted); }
.tree-sec button:hover { background: var(--accent-soft); color: var(--accent); }
.row { display: flex; align-items: center; gap: 3px; padding: 4px 4px; border-radius: 6px; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; }
.row:hover { background: var(--panel2); }
.row.open { background: var(--accent-soft); }
.row.open .r-title { color: var(--accent); font-weight: 700; }
.row .caret { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.row .ico { flex: none; font-size: 12px; width: 16px; text-align: center; }
.row .r-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-meta { font-size: 10px; color: var(--muted); white-space: nowrap; }
.row .r-more { opacity: 0; font-size: 13px; color: var(--muted); padding: 0 4px; border-radius: 4px; line-height: 1; }
.row:hover .r-more { opacity: 1; }
.row .r-more:hover { background: var(--line); color: var(--text); }
.row.drop-into { box-shadow: inset 0 0 0 2px var(--accent); }
.row.drop-before::before, .row.drop-after::after { content: ''; position: absolute; left: 4px; right: 4px; height: 2px; background: var(--accent); }
.row.drop-before::before { top: -1px; }
.row.drop-after::after { bottom: -1px; }
.row.ref-folder .r-title { color: #8a6d3b; }
.trash-row { display: flex; align-items: center; gap: 4px; padding: 4px 6px; font-size: 12px; color: var(--muted); }
.trash-row .r-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trash-row button { font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }
.trash-row button:hover { color: var(--accent); border-color: var(--accent); }
.tree-foot { padding: 8px 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.6; }

/* 시놉 분할 */
.synop-grid { flex: 1; display: grid; gap: 1px; background: var(--line); min-height: 0; }
.synop-grid.n1 { grid-template: 1fr / 1fr; }
.synop-grid.n2 { grid-template: 1fr 1fr / 1fr; }
.synop-grid.n3 { grid-template: 1fr 1fr 1fr / 1fr; }
.synop-grid.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.pane.active { box-shadow: inset 0 2px 0 var(--accent); }
.pane-head { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-bottom: 1px solid var(--line); background: var(--panel2); min-height: 32px; }
.pane-head select { flex: 1; min-width: 0; font-size: 12px; border-color: transparent; background: transparent; font-weight: 700; }
.pane-head select:hover { border-color: var(--line); }
.pane textarea { flex: 1; resize: none; border: 0; outline: none; padding: 10px 12px; background: transparent; line-height: 1.7; font-size: 13px; min-height: 0; }
.pane-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 10px; line-height: 1.7; }
.mini { font-size: 12px; color: var(--muted); padding: 2px 5px; border-radius: 4px; flex: none; }
.mini:hover { background: var(--line); color: var(--text); }
.mini.on { color: var(--accent); }

/* 원고 에디터 분할 */
.editor-grid { flex: 1; display: grid; gap: 1px; background: var(--line); min-height: 0; }
.editor-grid.n1 { grid-template-columns: 1fr; }
.editor-grid.n2 { grid-template-columns: 1fr 1fr; }
.editor-grid.n3 { grid-template-columns: 1fr 1fr 1fr; }
.editor-grid.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
.epane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); }
.epane.active > .pane-head { box-shadow: inset 0 2px 0 var(--accent); }
.tabs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab { display: flex; align-items: center; gap: 3px; padding: 3px 4px 3px 8px; border-radius: 6px 6px 0 0; font-size: 12px; white-space: nowrap; cursor: pointer; color: var(--muted); max-width: 170px; border: 1px solid transparent; }
.tab span { overflow: hidden; text-overflow: ellipsis; }
.tab.on { background: var(--paper); color: var(--text); font-weight: 700; border-color: var(--line); border-bottom-color: var(--paper); }
.tab .x { font-size: 11px; padding: 0 3px; border-radius: 3px; color: var(--muted); }
.tab .x:hover { background: var(--line); }
.crumb { flex: none; font-size: 11px; color: var(--muted); padding: 3px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.crumb .lock-badge { color: #c58b00; }
.ed-wrap { flex: 1; overflow-y: auto; min-height: 0; position: relative; }
.manuscript { max-width: var(--ed-width, 720px); margin: 0 auto; min-height: 100%; outline: none; padding: 20px 28px 45vh;
    font-family: var(--ed-font, 'Nanum Myeongjo', serif); font-size: var(--ed-size, 16px); line-height: var(--ed-lh, 1.9);
    white-space: pre-wrap; overflow-wrap: anywhere; caret-color: var(--accent); }
.manuscript p { margin: 0 0 var(--ed-gap, 0); text-indent: var(--ed-indent, 0); min-height: 1em; }
.manuscript[contenteditable="false"] { opacity: .85; cursor: default; }
.manuscript img { max-width: 100%; }
.ref-box { flex: none; height: 40%; min-height: 120px; display: flex; flex-direction: column; border-top: 2px solid var(--line); background: var(--panel2); }
.ref-head { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
.ref-head b { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-box .manuscript { font-size: calc(var(--ed-size, 16px) * .88); padding: 12px 20px 30px; }
.epane-foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); background: var(--panel2); white-space: nowrap; overflow-x: auto; }
.epane-foot b { color: var(--text); font-weight: 700; }
.goal-bar { width: 70px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.goal-bar i { display: block; height: 100%; background: var(--accent); }
.goal-input { width: 58px; border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 0 4px; font-size: 11px; }

/* 노트 */
.free-note { flex: none; display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
.fn-head, .board-head { display: flex; align-items: center; gap: 4px; padding: 4px 8px; font-size: 11px; color: var(--muted); min-height: 30px; }
.fn-head b, .board-head b { color: var(--text); }
.free-note textarea { height: 150px; min-height: 60px; max-height: 70vh; resize: vertical; border: 0; outline: none; background: var(--panel); padding: 4px 12px 10px; font-size: 12px; line-height: 1.7; }
.board-head { border-bottom: 1px solid var(--line); background: var(--panel2); flex: none; }
#board-head { flex-wrap: wrap; row-gap: 0; }
#board-head .bh-title { flex: 1 0 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 2px; }
#board-head .bh-tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.board-wrap { flex: 1; overflow: auto; min-height: 0; position: relative; background-color: var(--cork); background-image: radial-gradient(var(--cork-dot) 1px, transparent 1.3px); background-size: 14px 14px; }
.board-inner { position: relative; }
.pi { position: absolute; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.2); color: #2b2a26; display: flex; flex-direction: column; }
.pi-head { height: 20px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 1px; padding: 0 3px; cursor: grab; touch-action: none; }
.pi-head button { font-size: 10px; color: rgba(0,0,0,.45); padding: 1px 4px; border-radius: 3px; line-height: 1.2; }
.pi-head button:hover { background: rgba(0,0,0,.08); color: #000; }
.pi textarea { border: 0; outline: none; background: transparent; resize: none; padding: 0 9px 6px; font-size: 12px; line-height: 1.55; color: inherit; overflow: hidden; min-height: 36px; width: 100%; }
.pi img { display: block; width: calc(100% - 8px); margin: 0 4px 4px; pointer-events: none; user-select: none; border-radius: 2px; }
.pi-foot { font-size: 10px; color: rgba(0,0,0,.5); padding: 3px 9px 6px; border-top: 1px dashed rgba(0,0,0,.18); margin: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi-resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 55%, rgba(0,0,0,.25) 55%); border-radius: 0 0 3px 0; }
.pi.dragging { box-shadow: 0 10px 24px rgba(0,0,0,.3); }
.board-empty { position: absolute; left: 14px; top: 14px; width: 220px; color: var(--cork-text); font-size: 12px; line-height: 1.7; }
.fullboard { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.fullboard .board-head { min-height: 44px; padding: 0 12px; gap: 6px; }
.chips { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); background: var(--panel); }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.custom-color { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-top: 4px; }
.pin-list button { display: block; width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px; font-size: 12px; white-space: normal; }
.pin-list .grp { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; font-weight: 700; }
/* 형광펜 모아보기 */
.modal.wide { max-width: 640px; }
.hl-filter { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.hl-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); flex: none; }
.hl-dot.on { box-shadow: 0 0 0 2px var(--accent); }
.hl-dot.all { background: conic-gradient(#ffc9c9, #fff3a3, #c9f0b5, #c5dcff, #e0d0ff, #ffc9c9); }
.hl-group { padding: 10px 0 4px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hl-item { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; }
.hl-item:hover { background: var(--panel2); }
.hl-item small { display: block; color: var(--muted); font-size: 11px; }
.hl-item span { color: #2b2a26; border-radius: 3px; padding: 0 2px; line-height: 1.8; }
.manuscript .flash { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
/* 원고 속 사진 */
.manuscript img { display: inline-block; vertical-align: bottom; cursor: pointer; border-radius: 2px; }
.manuscript img.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.modal-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 8px 0 0; }
.modal-note.warn { color: #c47a00; }
.modal label.check { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; margin-top: 12px; }
.fmt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.fmt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; text-align: left; background: var(--panel); }
.fmt small { color: var(--muted); font-size: 11px; }
.fmt.on { border-color: var(--accent); background: var(--accent-soft); }
.fmt.on b { color: var(--accent); }
.rules { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.rule-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.rule-row span { font-size: 13px; display: flex; flex-direction: column; }
.rule-row small { font-size: 11px; color: var(--muted); }
.rule-row select, .rule-row input { width: 120px !important; flex: none; }
.copy-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; margin-top: 10px; }
.copy-preview { margin: 0; height: 300px; overflow: auto; white-space: pre-wrap; font: 12px/1.7 'Nanum Myeongjo', serif; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
@media (max-width: 640px) { .copy-grid { grid-template-columns: 1fr; } .copy-preview { height: 200px; } }
.modal.xwide { max-width: 920px; }
.btn.danger-btn { color: var(--danger); }
.check-inline { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.cmp-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; padding: 6px 0; }
.cmp-bar .btn { padding: 4px 10px; font-size: 12px; }
.cmp-head, .cmp-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 84px; gap: 10px; }
.cmp-head { font-size: 11px; color: var(--muted); padding: 8px 8px 4px; border-bottom: 1px solid var(--line); }
.cmp-rows { max-height: 56vh; overflow-y: auto; }
.cmp-row { padding: 8px; border-bottom: 1px solid var(--line); align-items: start; font-size: 13px; line-height: 1.7; }
.cmp-row.change, .cmp-row.add, .cmp-row.del { background: var(--panel2); }
.cmp-row.same .cmp-cell { color: var(--muted); }
.cmp-cell { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.cmp-cell mark { background: #ffe08a; color: #2b2a26; border-radius: 2px; }
.cmp-empty { color: var(--muted); font-size: 12px; }

<script>
'use strict';
/* =====================================================================
   웹소설 집필실
   - 모든 데이터(작품/폴더/문서/시놉/노트/화면 배치/설정)는 "아이템" 단위로 저장
   - 이 기기의 IndexedDB에 먼저 저장 + 구글 로그인 시 Firestore에 아이템별로 동기화
   - 화면 배치(분할·탭·참고창·패널 너비)는 작품별로 기억되고 기기 간에 동기화됨
   ===================================================================== */

const LEGACY_LS_KEY = 'novel-writer-v1';   // 1차 버전(localStorage) 데이터
const LS_PREF = 'novel-writer-pref';       // 기기별 설정 (테마, 폰 탭)
const PI_COLORS = ['#fff3a8', '#ffd6a5', '#ffc8dd', '#f1c0e8', '#cfbaf0', '#a3c4f3', '#90dbf4', '#98f5e1', '#b9fbc0', '#e9ecef'];
const OLD_NOTE_COLORS = { yellow: '#fff3a8', pink: '#ffc8dd', green: '#b9fbc0', blue: '#a3c4f3', purple: '#cfbaf0' };
const HILITES = ['#ffc9c9', '#ffd8a8', '#fff3a3', '#c9f0b5', '#b8ebdc', '#c5dcff', '#e0d0ff'];
const FORE_COLORS = ['#23261f', '#d93025', '#e8710a', '#188038', '#1a73e8', '#8e24aa', '#80868b'];
const MAX_PANES = 4;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = n => n.toLocaleString('ko-KR');
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const isPhone = () => matchMedia('(max-width: 760px)').matches;

let clientId = null;
try { clientId = localStorage.getItem('novel-writer-client') || null; } catch (e) {}
if (!clientId) { clientId = uid('c'); try { localStorage.setItem('novel-writer-client', clientId); } catch (e) {} }
const tabId = clientId + '.' + Math.random().toString(36).slice(2, 7); // 같은 기기에서 창(탭)마다 다름
const seenRev = {}; // 다른 창·기기에서 받은 마지막 판: 내 수정이 어느 판에서 갈라졌는지 알기 위함

/* =====================================================================
   HTML 정리 · 텍스트 변환
   ===================================================================== */
const ALLOWED_TAGS = new Set(['P', 'DIV', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'SPAN', 'MARK', 'FONT', 'IMG']);
const ALLOWED_STYLES = ['color', 'background-color', 'text-align', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line'];
function sanitizeHtml(html) {
    const t = document.createElement('template');
    t.innerHTML = html || '';
    const walk = node => {
        for (const n of [...node.childNodes]) {
            if (n.nodeType === 3) continue;
            if (n.nodeType !== 1) { n.remove(); continue; }
            walk(n);
            if (!ALLOWED_TAGS.has(n.tagName)) { n.replaceWith(...n.childNodes); continue; }
            // FONT color → span style
            if (n.tagName === 'FONT') {
                const sp = document.createElement('span');
                if (n.getAttribute('color')) sp.style.color = n.getAttribute('color');
                sp.append(...n.childNodes); n.replaceWith(sp); continue;
            }
            if (n.tagName === 'IMG') {
                // 원고 속 사진: 사진 id와 너비만 남기고, 실제 그림은 화면에 그릴 때 채움
                const id = n.getAttribute('data-img'), w = n.style.width;
                for (const a of [...n.attributes]) n.removeAttribute(a.name);
                if (!id) { n.remove(); continue; }
                n.setAttribute('data-img', id);
                if (/^\d+(\.\d+)?%$/.test(w)) n.style.width = w;
                continue;
            }
            const style = n.getAttribute('style');
            for (const a of [...n.attributes]) n.removeAttribute(a.name);
            if (style) {
                const tmp = document.createElement('span'); tmp.setAttribute('style', style);
                const keep = ALLOWED_STYLES.map(p => tmp.style.getPropertyValue(p) ? `${p}: ${tmp.style.getPropertyValue(p)}` : '').filter(Boolean);
                if (keep.length) n.setAttribute('style', keep.join('; '));
            }
        }
    };
    walk(t.content);
    return t.innerHTML;
}
function textToHtml(text) {
    const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    return lines.map(l => `<p>${l ? esc(l) : '<br>'}</p>`).join('');
}
const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", nbsp: ' ' };
function htmlToPlain(html) {
    return String(html || '').replace(/<[^>]*>/g, '').replace(/&(amp|lt|gt|quot|#39|nbsp);/g, (_, e) => ENT[e]);
}
// 문단 단위로 나눈 순수 텍스트 (내보내기용)
function htmlToLines(html) {
    const t = document.createElement('template'); t.innerHTML = html || '';
    const lines = []; let cur = null;
    const push = () => { cur = ''; lines.push(cur); };
    const add = s => { if (cur === null) push(); lines[lines.length - 1] += s; cur = lines[lines.length - 1]; };
    const isBlock = n => n.nodeType === 1 && (n.tagName === 'P' || n.tagName === 'DIV');
    const walk = node => {
        const kids = [...node.childNodes];
        kids.forEach((n, i) => {
            if (n.nodeType === 3) { add(n.data.replace(/\n/g, ' ')); return; }
            if (n.nodeType !== 1) return;
            if (n.tagName === 'BR') {
                const trailing = kids.slice(i + 1).every(k => k.nodeType === 3 && !k.data);
                if (!trailing) push(); else if (cur === null) push();
                return;
            }
            if (isBlock(n)) { push(); walk(n); cur = null; return; }
            walk(n);
        });
    };
    walk(t.content);
    return lines;
}
function countChars(text) {
    const s = text || '';
    return { all: s.replace(/\n/g, '').length, noSpace: s.replace(/\s/g, '').length };
}
const countCache = new Map();
function docCount(it) {
    const c = countCache.get(it.id);
    if (c && c.rev === it.rev && c.len === (it.body || '').length) return c.v;
    const v = countChars(htmlToPlain(it.body));
    countCache.set(it.id, { rev: it.rev, len: (it.body || '').length, v });
    return v;
}

/* =====================================================================
   저장소 (IndexedDB, 실패하면 localStorage)
   ===================================================================== */
const store = {
    db: null,
    open() {
        return new Promise(resolve => {
            if (!window.indexedDB) return resolve(false);
            let req;
            try { req = indexedDB.open('novel-writer', 1); } catch (e) { return resolve(false); }
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
            };
            req.onsuccess = () => { this.db = req.result; resolve(true); };
            req.onerror = () => resolve(false);
        });
    },
    tx(name, mode, fn) {
        return new Promise((resolve, reject) => {
            const tx = this.db.transaction(name, mode);
            const out = fn(tx.objectStore(name));
            tx.oncomplete = () => resolve(out instanceof IDBRequest ? out.result : undefined);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error);
        });
    },
    getAll() { return this.tx('items', 'readonly', s => s.getAll()); },
    putMany(list) { return this.tx('items', 'readwrite', s => { list.forEach(it => s.put(it)); }); },
    getKV(k) { return this.tx('kv', 'readonly', s => s.get(k)); },
    setKV(k, v) { return this.tx('kv', 'readwrite', s => { s.put(v, k); }); }
};

/* ---------- 상태 ---------- */
let items = {};            // id -> item
const dirty = new Set();   // 클라우드에 올려야 할 아이템 id
const localDirty = new Set(); // 이 기기 저장소에 써야 할 아이템 id
let pref = { theme: 'auto', mtab: 'editor' };
let useIDB = false;

async function loadLocal() {
    try { const raw = localStorage.getItem(LS_PREF); if (raw) pref = { ...pref, ...JSON.parse(raw) }; } catch (e) {}
    useIDB = await store.open();
    if (useIDB) {
        try {
            const list = await store.getAll();
            list.forEach(it => { items[it.id] = it; });
            const d = await store.getKV('dirty');
            if (Array.isArray(d)) d.forEach(id => dirty.add(id));
            const migrated = await store.getKV('migrated-v1');
            if (!list.length && !migrated) {
                // 1차 버전(localStorage)에 쓰던 데이터를 가져옴 (원본은 지우지 않고 백업으로 남겨둠)
                const raw = localStorage.getItem(LEGACY_LS_KEY);
                if (raw) {
                    const old = JSON.parse(raw).items || {};
                    Object.values(old).forEach(it => { items[it.id] = it; localDirty.add(it.id); });
                }
                await store.setKV('migrated-v1', true);
            }
        } catch (e) { console.error(e); useIDB = false; }
    }
    if (!useIDB) {
        try { const raw = localStorage.getItem(LEGACY_LS_KEY); if (raw) items = JSON.parse(raw).items || {}; } catch (e) { items = {}; }
    }
    Object.values(items).forEach(it => { if (normalize(it)) localDirty.add(it.id); seenRev[it.id] = it.rev; });
}

// 예전 형식 데이터를 새 형식으로 맞춤. 바뀌었으면 true
function normalize(it) {
    let changed = false;
    if (it.kind === 'episode' && it.fmt !== 'html') { it.body = textToHtml(it.body); it.fmt = 'html'; changed = true; }
    if ((it.kind === 'episode' || it.kind === 'folder') && it.parentId === undefined) { it.parentId = null; changed = true; }
    if (it.kind === 'note') {
        // 1단계까지의 노트(제목+본문, 색 이름) → 포스트잇
        if (it.title) { it.body = it.title + (it.body ? '\n' + it.body : ''); it.title = ''; changed = true; }
        if (OLD_NOTE_COLORS[it.color]) { it.color = OLD_NOTE_COLORS[it.color]; changed = true; }
        if (it.docId === undefined) { it.docId = null; changed = true; }
    }
    if (it.id === 'layout' && !it.works && (it.synopPanes || it.editorPanes)) {
        // 1차 버전 화면 배치 → 작품별 배치
        const old = it;
        const works = {};
        const mk = (sy, ed) => {
            const w = defaultWL();
            w.synopN = old.synopN || 2; w.synopPanes = (sy || []).slice(0, 4);
            w.editorN = Math.min(old.editorN || 1, 4);
            (ed || []).slice(0, 2).forEach((id, i) => { if (id) { w.panes[i].tabs = [id]; w.panes[i].active = id; } });
            w.show = { ...w.show, ...(old.show || {}) };
            w.widths = { ...(old.widths || {}) };
            return w;
        };
        Object.entries(old.perWork || {}).forEach(([wid, v]) => { works[wid] = mk(v.synop, v.editor); });
        if (old.workId) works[old.workId] = mk(old.synopPanes, old.editorPanes);
        items.layout = { id: 'layout', kind: 'layout', workId: old.workId, works, rev: old.rev || 0, by: old.by };
        changed = true;
    }
    return changed;
}

let saveTimer = null;
function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveLocal, 400);
    scheduleCloudPush();
}
async function saveLocal() {
    clearTimeout(saveTimer);
    if (useIDB) {
        const list = [...localDirty].map(id => items[id]).filter(Boolean);
        localDirty.clear();
        try {
            if (list.length) await store.putMany(list);
            await store.setKV('dirty', [...dirty]);
            broadcast(list);
            if (list.length) { lastSavedAt = Date.now(); renderSavedAt(); }
        } catch (e) {
            console.error(e);
            list.forEach(it => localDirty.add(it.id));
            toast('이 기기에 저장하지 못했어요. 백업 파일을 저장해 두세요.');
        }
    } else {
        try { localStorage.setItem(LEGACY_LS_KEY, JSON.stringify({ items })); localDirty.clear(); lastSavedAt = Date.now(); renderSavedAt(); }
        catch (e) { toast('저장 공간이 부족해요. 백업 파일을 저장해 두세요.'); }
    }
}

function touch(it) {
    if (seenRev[it.id] !== undefined) it.base = seenRev[it.id];
    it.rev = Math.max(Date.now(), (it.rev || 0) + 1);
    it.by = tabId;
    items[it.id] = it;
    dirty.add(it.id);
    localDirty.add(it.id);
    scheduleSave();
}
function create(kind, fields) {
    const it = { id: uid(kind[0]), kind, title: '', body: '', order: Date.now(), ...fields };
    if (kind === 'episode') { it.fmt = 'html'; it.parentId ??= null; if (!it.body) it.body = '<p><br></p>'; }
    if (kind === 'folder') it.parentId ??= null;
    touch(it);
    return it;
}

const live = it => it && !it.deleted;
const get = id => (id && live(items[id])) ? items[id] : null;
const works = () => Object.values(items).filter(i => i.kind === 'work' && live(i)).sort((a, b) => a.order - b.order);
const curWorkId = () => layout().workId;
const ofWork = (kind, workId = curWorkId()) => Object.values(items)
    .filter(i => i.kind === kind && live(i) && i.workId === workId).sort((a, b) => a.order - b.order);

/* 바인더 구조 */
const isBinder = it => it && (it.kind === 'episode' || it.kind === 'folder');
function children(parentId, workId = curWorkId()) {
    return Object.values(items).filter(i => isBinder(i) && live(i) && !i.trashed && i.workId === workId && (i.parentId || null) === (parentId || null))
        .sort((a, b) => a.order - b.order);
}
// 휴지통에 있는 폴더 안에 들어있으면 사실상 휴지통에 있는 것
function inTrash(it) {
    for (let p = it, guard = 0; p && guard < 50; p = get(p.parentId), guard++) if (p.trashed) return true;
    return false;
}
function isRefDoc(it) {
    for (let p = get(it.parentId), guard = 0; p && guard < 50; p = get(p.parentId), guard++) if (p.ref) return true;
    return false;
}
const openable = it => it && it.kind === 'episode' && live(it) && !inTrash(it) && it.workId === curWorkId();
function flatDocs(parentId = null, out = []) {
    children(parentId).forEach(c => { if (c.kind === 'folder') flatDocs(c.id, out); else out.push(c); });
    return out;
}
function pathOf(it) {
    const parts = [];
    for (let p = get(it.parentId), guard = 0; p && guard < 50; p = get(p.parentId), guard++) parts.unshift(p.title || '폴더');
    return parts;
}
function folderCount(id) {
    return children(id).reduce((a, c) => a + (c.kind === 'folder' ? folderCount(c.id) : (isRefDoc(c) ? 0 : docCount(c).noSpace)), 0);
}

/* 화면 배치 */
function defaultWL() {
    return {
        synopN: 2, synopPanes: [], activeSynop: 0,
        editorN: 1, panes: Array.from({ length: MAX_PANES }, () => ({ tabs: [], active: null, ref: null, single: false })), activeEditor: 0,
        show: { tree: true, synop: true, notes: true }, widths: {}, collapsed: {}

function layout() {

}
function WL(workId = curWorkId()) {
    const L = layout();
    let w = L.works[workId];
    if (!w) w = L.works[workId] = defaultWL();
    const d = defaultWL();
    for (const k of Object.keys(d)) w[k] ??= d[k];
    while (w.panes.length < MAX_PANES) w.panes.push({ tabs: [], active: null, ref: null, single: false });
    w.panes.forEach(p => { p.tabs ??= []; p.active ??= null; p.ref ??= null; p.single ??= false; });

    return w;
}

/* 열린 문서가 지워졌거나 다른 작품 것이면 정리 */
function sanitizePanes() {
    const W = WL();
    let changed = false;
    W.panes.forEach((p, i) => {
        const tabs = p.tabs.filter(id => openable(get(id)));
        if (tabs.length !== p.tabs.length) { p.tabs = tabs; changed = true; }
        if (p.single && p.tabs.length > 1) { p.tabs = [p.active && p.tabs.includes(p.active) ? p.active : p.tabs[0]]; changed = true; }
        if (!p.tabs.includes(p.active)) { p.active = p.tabs[0] || null; changed = true; }
        if (p.ref && !openable(get(p.ref))) { p.ref = null; changed = true; }
    });
    if (!W.panes[0].tabs.length) {
        const first = flatDocs().find(d => !isRefDoc(d)) || flatDocs()[0];
        if (first) { W.panes[0].tabs = [first.id]; W.panes[0].active = first.id; changed = true; }
    }
    const pool = ofWork('synop');
    for (let i = 0; i < 4; i++) {
        const it = get(W.synopPanes[i]);
        const want = it && it.workId === curWorkId() ? it.id : (pool[i] || pool[0] || {}).id || null;
        if (W.synopPanes[i] !== want) { W.synopPanes[i] = want; changed = true; }
    }
    if (W.activeEditor >= W.editorN) { W.activeEditor = 0; changed = true; }
    if (W.activeSynop >= W.synopN) { W.activeSynop = 0; changed = true; }
    if (changed) touch(layout());
}

function onEditorInput(ed) {

    lastCount.set(it.id, now);
    if (now > before && !isRefDoc(it)) {

function updateSelbar() {
    const bar = $('#selbar');
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { bar.classList.add('hidden'); return; }
    const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    const ed = node && node.closest('.manuscript[contenteditable="true"]');
    if (!ed) { bar.classList.add('hidden'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    if (!r.width && !r.height) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    let top = coarse ? r.bottom + 12 : r.top - bh - 8;
    if (top < 4) top = r.bottom + 8;
    if (top + bh > innerHeight - 4) top = r.top - bh - 8;
    bar.style.top = Math.max(4, top) + 'px';
    bar.style.left = Math.max(4, Math.min(innerWidth - bw - 4, r.left + r.width / 2 - bw / 2)) + 'px';

function ask(title, value, type = 'text') {
    return new Promise(resolve => {
        const bg = document.createElement('div'); bg.className = 'modal-bg';
        bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><input type="${type}" value="${esc(value ?? '')}">
            <div class="row2"><button class="btn" data-x="0">취소</button><button class="btn primary" data-x="1">확인</button></div></div>`;
        document.body.appendChild(bg);
        const inp = $('input', bg); inp.focus(); inp.select();
        const done = ok => { bg.remove(); resolve(ok ? inp.value : null); };
        bg.addEventListener('click', e => { if (e.target === bg) done(false); const x = e.target.dataset.x; if (x) done(x === '1'); });
        inp.addEventListener('keydown', e => { if (e.isComposing) return; if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
    });
}
function confirmBox(msg, okLabel = '확인') {

        bg.innerHTML = `<div class="modal"><p style="margin:0;line-height:1.7">${esc(msg)}</p>
            <div class="row2"><button class="btn" data-x="0">취소</button><button class="btn primary" data-x="1">${esc(okLabel)}</button></div></div>`;
        document.body.appendChild(bg);

        const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
        document.addEventListener('keydown', key, true);

}
async function copyText(text, label) {

// 파일 저장: claude.ai 미리보기 페이지에서는 저장 확인창을 거치고, 일반 브라우저에서는 바로 내려받음
async function download(name, text, type) {
    const filename = name.replace(/[\\/:*?"<>|]/g, '_');
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) {
        try { await dl.save({ filename, data: text }); toast('저장했어요.'); }
        catch (e) {
            if (e && e.code === 'declined') return;
            toast(e && (e.code === 'rejected_extension' || e.code === 'extension_not_enabled')
                ? '이 미리보기 화면에서는 이 형식을 저장할 수 없어요. GitHub 주소로 열면 저장돼요.'
                : '파일을 저장하지 못했어요. (' + (e && (e.code || e.message)) + ')');
        }
        return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(text instanceof Blob ? text : new Blob([text], { type: (type || 'text/plain') + ';charset=utf-8' }));
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

function moveItem(moving, targetParentId, beforeId) {

    for (let p = get(targetParentId), g = 0; p && g < 50; p = get(p.parentId), g++) if (p.id === moving.id) return;
    const list = children(targetParentId).filter(x => x.id !== moving.id);
    const idx = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
    list.splice(idx < 0 ? list.length : idx, 0, moving);

function compressImage(file, maxSide = 1400) {
    return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onerror = () => reject(fr.error);
        fr.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('사진을 읽지 못했어요.'));
            img.onload = () => {
                const k = Math.min(1, maxSide / Math.max(img.width, img.height));
                const cv = document.createElement('canvas');
                cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
                const g = cv.getContext('2d');
                const png = file.type === 'image/png' && file.size < 400 * 1024;
                if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); }
                g.drawImage(img, 0, 0, cv.width, cv.height);
                resolve(png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.86));
            };
            img.src = fr.result;
        };
        fr.readAsDataURL(file);
    });
}

/* 사진 자르기: 남길 부분을 끌어서 고름 */
function openCrop(imageId) {
    const it = get(imageId); if (!it) return;
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal wide"><h3>사진 자르기</h3>
        <p style="margin:0 0 10px;font-size:12px;color:var(--muted)">남길 부분을 손가락이나 마우스로 끌어서 고르세요.</p>
        <div class="crop-stage"><canvas></canvas></div>
        <div class="row2"><button class="btn" data-x="0">취소</button><button class="btn" data-x="reset">원래대로</button><button class="btn primary" data-x="1">자르기</button></div></div>`;
    document.body.appendChild(bg);
    const cv = $('canvas', bg), g = cv.getContext('2d');
    const img = new Image();
    let sel = null, k = 1;
    const draw = () => {
        g.clearRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        if (!sel) return;
        const x = Math.min(sel.x0, sel.x1), y = Math.min(sel.y0, sel.y1), w = Math.abs(sel.x1 - sel.x0), h = Math.abs(sel.y1 - sel.y0);
        g.fillStyle = 'rgba(0,0,0,.45)';
        g.fillRect(0, 0, cv.width, y); g.fillRect(0, y + h, cv.width, cv.height - y - h);
        g.fillRect(0, y, x, h); g.fillRect(x + w, y, cv.width - x - w, h);
        g.strokeStyle = '#fff'; g.lineWidth = 2; g.setLineDash([6, 4]); g.strokeRect(x, y, w, h); g.setLineDash([]);
    };
    img.onload = () => {
        const maxW = Math.min(600, innerWidth - 80), maxH = Math.min(440, innerHeight - 260);
        k = Math.min(1, maxW / img.width, maxH / img.height);
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        draw();
    };
    img.src = it.data;
    const pt = e => { const r = cv.getBoundingClientRect(); return { x: Math.max(0, Math.min(cv.width, (e.clientX - r.left) * cv.width / r.width)), y: Math.max(0, Math.min(cv.height, (e.clientY - r.top) * cv.height / r.height)) }; };
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const p = pt(e); sel = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; draw(); });
    cv.addEventListener('pointermove', e => { if (!sel || !cv.hasPointerCapture(e.pointerId)) return; const p = pt(e); sel.x1 = p.x; sel.y1 = p.y; draw(); });
    bg.addEventListener('click', e => {
        const x = e.target.dataset.x;
        if (e.target === bg || x === '0') { bg.remove(); return; }
        if (x === 'reset') { sel = null; draw(); return; }
        if (x !== '1') return;
        if (!sel || Math.abs(sel.x1 - sel.x0) < 8 || Math.abs(sel.y1 - sel.y0) < 8) { toast('남길 부분을 먼저 끌어서 골라 주세요.'); return; }
        const sx = Math.min(sel.x0, sel.x1) / k, sy = Math.min(sel.y0, sel.y1) / k;
        const sw = Math.abs(sel.x1 - sel.x0) / k, sh = Math.abs(sel.y1 - sel.y0) / k;
        const out = document.createElement('canvas');
        out.width = Math.round(sw); out.height = Math.round(sh);
        const og = out.getContext('2d');
        const png = it.data.startsWith('data:image/png');
        if (!png) { og.fillStyle = '#fff'; og.fillRect(0, 0, out.width, out.height); }
        og.drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
        it.data = png ? out.toDataURL('image/png') : out.toDataURL('image/jpeg', 0.9);
        touch(it);
        $$(`img[data-img="${it.id}"]`).forEach(i => { i.src = it.data; });
        bg.remove();
        toast('사진을 잘랐어요.');
    });
}

/* =====================================================================
   코르크 보드 (지금 쓰는 회차의 보드)
   - 메모는 회차에 속함(docId). 작품 공통 메모(docId 없음)는 모든 보드에 보임
   - "붙여 보기": 다른 회차 메모를 이 보드에 참조로 붙임 (원본은 제자리)
   - 보드마다 위치를 따로 기억 (pins[보드id])
   ===================================================================== */
function activeDocId() { const W = WL(); return W.panes[W.activeEditor]?.active || null; }

function boardNotes(B) {
    return notesOfWork().filter(n => !n.docId || n.docId === B || (B && n.pins && n.pins[B]));
}
const isPinnedHere = (n, B) => !!(B && n.docId && n.docId !== B && n.pins && n.pins[B]);
function posOn(n, mode, B) {
    if (mode === 'full') return { x: n.wx ?? n.x ?? 0, y: n.wy ?? n.y ?? 0 };
    if (isPinnedHere(n, B)) return n.pins[B];
    return { x: n.x ?? 0, y: n.y ?? 0 };
}
function setPosOn(n, mode, B, p) {

    const home = n.docId ? (get(n.docId)?.title || '지운 회차') : '작품 공통';

}

    return `<div class="pi" data-note="${n.id}" style="left:${p.x}px;top:${p.y}px;width:${n.w || 170}px;background:${esc(n.color || PI_COLORS[0])};z-index:${n.z || 1}">
        <div class="pi-head" title="끌어서 옮기기"><button data-a="color" title="색 바꾸기">●</button>${pinned
            ? '<button data-a="unpin" title="이 보드에서 떼기 (원본은 그대로)">떼기</button>'
            : '<button data-a="del" title="메모 지우기">✕</button>'}</div>
        ${n.img ? `<img data-img="${n.img}" alt="">` : ''}
        <textarea data-id="${n.id}" data-field="body" placeholder="${n.img ? '사진 설명' : '메모'}" rows="1">${esc(n.body)}</textarea>
        <div class="pi-foot">${esc(noteLabel(n, mode, B))}</div>
        <div class="pi-resize" title="끌어서 크기 조절"></div>
    </div>`;
}
function drawBoard(inner, wrap, list, mode, B, zoom) {
    list.forEach((n, i) => {
        if (n.x == null) { n.x = 14 + (i % 2) * 180; n.y = 14 + Math.floor(i / 2) * 150; n.w ??= 170; touch(n); }
    });
    let maxX = 0, maxY = 0;
    list.forEach(n => { const p = posOn(n, mode, B); maxX = Math.max(maxX, p.x + (n.w || 170)); maxY = Math.max(maxY, p.y + 200); });
    inner.innerHTML = list.map(n => piHtml(n, mode, B)).join('')
        + (list.length ? '' : `<div class="board-empty">${mode === 'full' ? '아직 메모가 없어요. ＋메모로 시작하세요.' : '이 회차에 붙인 메모가 없어요.<br>＋메모로 새로 붙이거나, 붙여 보기로 다른 회차 메모를 가져오세요.<br>사진 파일을 끌어다 놓아도 돼요.'}</div>`);
    inner.style.zoom = zoom;
    inner.style.width = Math.max(maxX + 240, wrap.clientWidth / zoom) + 'px';
    inner.style.height = Math.max(maxY + 240, wrap.clientHeight / zoom) + 'px';
    $$('textarea', inner).forEach(autoGrow);
    fillImages(inner);
}
function renderBoard() {
    const W = WL(), B = activeDocId(), zoom = W.boardZoom || 1;
    const doc = get(B);
    $('#board-head').innerHTML = `<span class="bh-title">— <b>${esc(doc ? doc.title : '작품 공통')}</b> 보드</span>
        <span class="bh-tools"><button class="mini" data-b="add" title="새 메모">＋메모</button><button class="mini" data-b="add-img" title="사진 메모">＋사진</button>
        <button class="mini" data-b="pin" title="다른 회차 메모를 이 보드에 붙여 보기">붙여 보기</button>
        <button class="mini" data-b="zout" title="작게">－</button><span>${Math.round(zoom * 100)}%</span><button class="mini" data-b="zin" title="크게">＋</button>
        <button class="mini" data-b="full" title="작품 전체 메모 보드 (넓게 보기)">⤢ 전체 보드</button></span>`;
    drawBoard($('#board'), $('#board-wrap'), boardNotes(B), 'col', B, zoom);
}
function boardSpot(wrapEl, zoom) {
    return { x: Math.round(wrapEl.scrollLeft / zoom + 16 + Math.random() * 30), y: Math.round(wrapEl.scrollTop / zoom + 16 + Math.random() * 30) };
}

function addNote(mode, extra = {}) {
    const isFull = mode === 'full';
    const wrapEl = isFull ? $('.fullboard .board-wrap') : $('#board-wrap');
    const W = WL(), zoom = (isFull ? W.fullZoom : W.boardZoom) || 1;
    const spot = extra.at || boardSpot(wrapEl, zoom);
    const docId = isFull ? (fullFilter && fullFilter !== '*' && fullFilter !== '' ? fullFilter : null) : activeDocId();
    const n = create('note', {

        x: spot.x, y: spot.y, w: extra.w || 170, z: maxZ() + 1, img: extra.img
    });

async function addImageNote(file, mode, at) {

function noteAction(e, mode) {

            <label style="display:block;font-size:11px;color:var(--muted);padding:4px 4px 0">원하는 색 직접 고르기<input type="color" class="custom-color" value="${/^#[0-9a-f]{6}$/i.test(n.color) ? n.color : '#fff3a8'}"></label>`);

$('#board-head').addEventListener('click', e => {

/* 포스트잇 끌기 · 크기 조절 (마우스·손가락 공용) */
document.addEventListener('pointerdown', e => {
    const el = e.target.closest && e.target.closest('.pi'); if (!el) return;
    const head = e.target.closest('.pi-head'), rs = e.target.closest('.pi-resize');
    if ((!head && !rs) || e.target.closest('button')) return;
    const boardEl = el.closest('[data-board]'); if (!boardEl) return;
    const mode = boardEl.dataset.board === 'full' ? 'full' : 'col';
    const n = get(el.dataset.note); if (!n) return;
    e.preventDefault();
    const zoom = parseFloat(el.parentElement.style.zoom) || 1;
    const sx = e.clientX, sy = e.clientY;
    const x0 = parseFloat(el.style.left) || 0, y0 = parseFloat(el.style.top) || 0, w0 = parseFloat(el.style.width) || 170;
    const tgt = head || rs;
    tgt.setPointerCapture(e.pointerId);
    el.classList.add('dragging'); el.style.zIndex = 9999;
    const move = ev => {
        const dx = (ev.clientX - sx) / zoom, dy = (ev.clientY - sy) / zoom;
        if (head) { el.style.left = Math.max(0, Math.round(x0 + dx)) + 'px'; el.style.top = Math.max(0, Math.round(y0 + dy)) + 'px'; }
        else el.style.width = Math.max(110, Math.round(w0 + dx)) + 'px';
    };
    const up = () => {
        tgt.removeEventListener('pointermove', move); tgt.removeEventListener('pointerup', up); tgt.removeEventListener('pointercancel', up);
        el.classList.remove('dragging');
        n.z = maxZ() + 1; el.style.zIndex = n.z;
        if (head) setPosOn(n, mode, activeDocId(), { x: parseFloat(el.style.left), y: parseFloat(el.style.top) });
        else { n.w = parseFloat(el.style.width); $$('textarea', el).forEach(autoGrow); }
        touch(n);
    };
    tgt.addEventListener('pointermove', move); tgt.addEventListener('pointerup', up); tgt.addEventListener('pointercancel', up);
});
// 사진 파일을 보드에 끌어다 놓기
document.addEventListener('dragover', e => {
    if (e.target.closest && e.target.closest('[data-board]') && [...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault();
});
document.addEventListener('drop', e => {
    const wrapEl = e.target.closest && e.target.closest('[data-board]'); if (!wrapEl) return;
    const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    e.preventDefault();
    const mode = wrapEl.dataset.board === 'full' ? 'full' : 'col';
    const inner = $('.board-inner', wrapEl), zoom = parseFloat(inner.style.zoom) || 1;
    const r = inner.getBoundingClientRect();
    files.forEach((f, i) => addImageNote(f, mode, { x: Math.max(0, Math.round((e.clientX - r.left) / zoom) + i * 20), y: Math.max(0, Math.round((e.clientY - r.top) / zoom) + i * 20) }));
});

/* =====================================================================

async function importBackupFile(f) {
    let data;
    const buf = await f.arrayBuffer();
    const u8 = new Uint8Array(buf);
    if (u8[0] === 0x50 && u8[1] === 0x4b) {
        const zip = await readZip(buf);
        const key = Object.keys(zip).find(k => k.endsWith('_집필실데이터.json'));
        if (!key) throw new Error('집필실에서 만든 작품 ZIP이 아니에요.');

}
function diffParas(a, b) {
    const n = a.length, m = b.length;
    const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
        L[i][j] = a[i].key === b[j].key ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const rows = []; let i = 0, j = 0;
    const flush = (dels, adds) => {
        const k = Math.min(dels.length, adds.length);
        for (let x = 0; x < k; x++) rows.push({ type: 'change', mi: dels[x], oi: adds[x] });
        dels.slice(k).forEach(mi => rows.push({ type: 'del', mi, oi: null }));
        adds.slice(k).forEach(oi => rows.push({ type: 'add', mi: null, oi, at: dels.length ? dels[dels.length - 1] + 1 : i }));
    };
    let dels = [], adds = [];
    while (i < n || j < m) {
        if (i < n && j < m && a[i].key === b[j].key) { flush(dels, adds); dels = []; adds = []; rows.push({ type: 'same', mi: i, oi: j }); i++; j++; }
        else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { adds.push(j); j++; }
        else { dels.push(i); i++; }
    }
    flush(dels, adds);
    return rows;
}
// 바뀐 글자만 표시 (앞뒤 같은 부분은 그대로)
function markDiff(x, y) {
    let p = 0; while (p < x.length && p < y.length && x[p] === y[p]) p++;
    let s = 0; while (s < x.length - p && s < y.length - p && x[x.length - 1 - s] === y[y.length - 1 - s]) s++;
    const m = (t) => esc(t.slice(0, p)) + (t.length - p - s > 0 ? `<mark>${esc(t.slice(p, t.length - s))}</mark>` : '') + esc(t.slice(t.length - s));
    return [m(x), m(y)];
}

/* 비교 창
   mode 'conflict': other = 충돌 사본 문서 / mode 'version': other = 버전 */
function openCompare(mainId, otherId, mode, onBack) {
    const main = get(mainId), other = get(otherId);
    if (!main || !other) { toast('비교할 문서를 찾지 못했어요.'); return; }
    let onlyDiff = true, pulledOnce = false;
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    document.body.appendChild(bg);
    const otherLabel = mode === 'version' ? (other.name || '자동 보관') + ' · ' + whenText(other.at) : '사본';
    const render = () => {
        const a = paraList(main.body), b = paraList(other.body);
        const rows = diffParas(a, b);
        const diffCount = rows.filter(r => r.type !== 'same').length;
        const shown = onlyDiff ? rows.filter(r => r.type !== 'same') : rows;
        const cell = (p, cls) => p ? `<div class="cmp-cell ${cls}">${esc(p.text) || (p.key ? '[사진]' : '<span class="cmp-empty">(빈 줄)</span>')}</div>` : '<div class="cmp-cell cmp-empty">(없음)</div>';
        bg.innerHTML = `<div class="modal xwide"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                ${onBack ? '<button class="mini" data-x="back">← 목록</button>' : ''}
                <h3 style="margin:0;flex:1">${mode === 'version' ? '🕘 버전 비교' : '충돌 사본 비교'} — ${esc(main.title)}</h3><button class="mini" data-x="close">✕</button></div>
            <div class="cmp-bar"><span>다른 문단 <b>${diffCount}</b>군데</span><span style="flex:1"></span>
                <label class="check-inline"><input type="checkbox" data-only ${onlyDiff ? 'checked' : ''}> 다른 곳만 보기</label>
                ${mode === 'version'
                    ? `<button class="btn" data-x="name">이름 붙이기</button><button class="btn" data-x="newdoc">새 문서로 꺼내기</button><button class="btn" data-x="restore">이 버전으로 되돌리기</button><button class="btn danger-btn" data-x="delver">버전 삭제</button>`
                    : `<button class="btn" data-x="all">사본 통째로 가져오기</button><button class="btn danger-btn" data-x="drop">사본 치우기</button>`}</div>
            <p class="modal-note">가져오기 전에 지금 원고를 버전 기록에 자동으로 남겨 두니, 잘못 가져와도 🕘 버전 기록에서 되돌릴 수 있어요.</p>
            <div class="cmp-head"><div>지금 원고</div><div>${esc(otherLabel)}</div><div></div></div>
            <div class="cmp-rows">${shown.length ? shown.map(r => {
                let left = cell(a[r.mi], ''), right = cell(b[r.oi], '');
                if (r.type === 'change') { const [x, y] = markDiff(a[r.mi].text, b[r.oi].text); left = `<div class="cmp-cell">${x || '<span class="cmp-empty">(빈 줄)</span>'}</div>`; right = `<div class="cmp-cell">${y || '<span class="cmp-empty">(빈 줄)</span>'}</div>`; }
                const rowIdx = rows.indexOf(r);
                return `<div class="cmp-row ${r.type}">${left}${right}<div>${r.type === 'change' || r.type === 'add' ? `<button class="mini" data-pull="${rowIdx}">← 가져오기</button>` : ''}</div></div>`;
            }).join('') : '<p class="modal-note" style="padding:20px 0">두 원고가 같아요.</p>'}</div></div>`;
        bg._rows = rows; bg._a = a; bg._b = b;
    };
    const snapshotBefore = reason => { if (!pulledOnce) { createVersion(main, main.body, reason); pulledOnce = true; } };
    const commit = () => { touch(main); renderEditors(); renderTree(); render(); };
    render();
    bg.addEventListener('change', e => { if (e.target.matches('[data-only]')) { onlyDiff = e.target.checked; render(); } });
    bg.addEventListener('click', async e => {
        const pull = e.target.closest('[data-pull]');
        if (pull) {
            if (main.locked) { toast('잠긴 문서예요. 먼저 잠금을 풀어 주세요.'); return; }
            const r = bg._rows[+pull.dataset.pull];
            const a = bg._a.map(p => p.html), src = bg._b[r.oi].html;
            snapshotBefore('가져오기 전');
            if (r.type === 'change') a[r.mi] = src; else a.splice(r.at, 0, src);
            main.body = a.join('');
            commit(); return;
        }
        const x = e.target.closest('[data-x]')?.dataset.x;
        if (e.target === bg || x === 'close') { bg.remove(); return; }
        if (x === 'back') { bg.remove(); onBack(); return; }
        if (x === 'all' || x === 'restore') {
            if (main.locked) { toast('잠긴 문서예요. 먼저 잠금을 풀어 주세요.'); return; }
            if (!await confirmBox(x === 'all' ? '사본 내용으로 원고 전체를 바꿀까요? 지금 원고는 버전 기록에 남아요.' : '이 버전으로 되돌릴까요? 지금 원고는 버전 기록에 남아요.', x === 'all' ? '통째로 가져오기' : '되돌리기')) return;
            snapshotBefore(x === 'all' ? '사본 가져오기 전' : '되돌리기 전');
            main.body = other.body; commit();
            toast(x === 'all' ? '사본 내용을 가져왔어요.' : '이 버전으로 되돌렸어요.');
            return;
        }
        if (x === 'drop') {
            if (!await confirmBox(`'${other.title}' 사본을 휴지통으로 옮길까요?`, '치우기')) return;
            bg.remove(); trashItem(other); return;
        }
        if (x === 'name') { const t = await ask('버전 이름', other.name || ''); if (t != null) { other.name = t.trim() || null; touch(other); render(); } }
        if (x === 'newdoc') {
            const copy = create('episode', { workId: main.workId, parentId: main.parentId, title: `${main.title} (${other.name || whenText(other.at)})`, body: other.body, order: main.order + 0.5 });
            bg.remove(); moveItem(copy, main.parentId, children(main.parentId)[children(main.parentId).findIndex(c => c.id === main.id) + 1]?.id || null);
            toast('버전을 새 문서로 꺼냈어요.');
        }
        if (x === 'delver') {
            if (!await confirmBox('이 버전을 지울까요?', '지우기')) return;
            other.deleted = true; other.body = ''; touch(other); bg.remove(); onBack ? onBack() : null;
        }
    });
}

/* =====================================================================
   버전 기록: 쓰는 동안 30분마다 이전 상태를 자동 보관 (회차마다 20개)
   이름 붙인 버전은 개수 제한 없이 계속 보관
   ===================================================================== */
const VERSION_GAP = 30 * 60 * 1000, AUTO_KEEP = 20;
const versionsOf = docId => Object.values(items).filter(v => v.kind === 'version' && live(v) && v.docId === docId).sort((a, b) => b.at - a.at);
function whenText(t) {
    const d = new Date(t), now = new Date();
    const hm = d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return '오늘 ' + hm;
    return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
function createVersion(doc, body, reason, name) {
    const v = create('version', { workId: doc.workId, docId: doc.id, title: doc.title, body, at: Date.now(), name: name || null, reason: reason || null });
    const autos = versionsOf(doc.id).filter(x => !x.name);
    autos.slice(AUTO_KEEP).forEach(x => { x.deleted = true; x.body = ''; touch(x); });
    return v;
}
// 원고를 고치기 직전에 부름: 마지막 보관본이 30분 넘게 지났으면 고치기 전 상태를 보관
function maybeSnapshot(doc, oldBody) {
    const last = versionsOf(doc.id)[0];
    if (last && Date.now() - last.at < VERSION_GAP) return;
    if (last && last.body === oldBody) return;
    if (!htmlToPlain(oldBody).trim() && !/<img/.test(oldBody)) return;
    createVersion(doc, oldBody, '자동 보관');
}
function openHistory(docId) {
    const doc = get(docId); if (!doc) return;
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    document.body.appendChild(bg);
    const cur = docCount(doc).noSpace;
    const render = () => {
        const list = versionsOf(docId);
        bg.innerHTML = `<div class="modal wide"><div style="display:flex;align-items:center;margin-bottom:8px"><h3 style="margin:0;flex:1">🕘 버전 기록 — ${esc(doc.title)}</h3><button class="mini" data-x="close">✕</button></div>
            <p class="modal-note" style="margin-top:0">쓰는 동안 30분마다 이전 상태를 자동으로 남겨요 (회차마다 최근 20개). 이름을 붙인 버전은 지우기 전까지 계속 남아요.</p>
            <div style="display:flex;gap:6px;margin:10px 0"><button class="btn primary" data-x="save">＋ 지금 버전 이름 붙여 남기기</button></div>
            <div class="ver-list">${list.length ? list.map(v => {
                const c = countChars(htmlToPlain(v.body)).noSpace, d = c - cur;
                return `<button class="ver-item" data-v="${v.id}"><span class="ver-when">${whenText(v.at)}</span>
                    ${v.name ? `<span class="ver-name">${esc(v.name)}</span>` : `<span class="ver-auto">${esc(v.reason || '자동 보관')}</span>`}
                    <span class="ver-chars">${fmt(c)}자 <small>(${d === 0 ? '지금과 같음' : (d > 0 ? '+' : '') + fmt(d)})</small></span></button>`;
            }).join('') : '<p class="modal-note" style="padding:16px 0">아직 남은 버전이 없어요. 30분 넘게 쓰면 자동으로 생겨요.</p>'}</div></div>`;
    };
    render();
    bg.addEventListener('click', async e => {
        const x = e.target.closest('[data-x]')?.dataset.x;
        if (e.target === bg || x === 'close') { bg.remove(); return; }
        if (x === 'save') {
            const t = await ask('이 버전의 이름 (예: 1차 탈고, 투고본)', '');
            if (t == null) return;
            createVersion(doc, doc.body, null, t.trim() || whenText(Date.now()));
            render(); toast('지금 원고를 버전으로 남겼어요.'); return;
        }
        const v = e.target.closest('[data-v]');
        if (v) { bg.remove(); openCompare(docId, v.dataset.v, 'version', () => openHistory(docId)); }
    });
}

/* =====================================================================
   여러 창(탭) 사이 실시간 반영 + 충돌 사본
   - 같은 기기에서 집필실을 두 창으로 열어도 서로의 변경이 바로 반영됨
   - 두 곳에서 같은 회차를 동시에 고치면 한쪽을 덮어쓰지 않고 충돌 사본으로 남김
   (구글 로그인 동기화를 붙일 때도 같은 규칙을 씀)
   ===================================================================== */
const conflictCopyOf = {};   // 이번 세션에 만든 충돌 사본 (같은 상대와 계속 겹치면 같은 사본을 갱신)
let bc = null;
try { bc = new BroadcastChannel('novel-writer'); } catch (e) {}
function broadcast(list) {
    if (!bc || !list.length) return;
    const send = list.filter(it => it.id !== 'layout' && it.id !== 'stats' && it.by === tabId);
    if (send.length) try { bc.postMessage({ from: tabId, items: send }); } catch (e) {}
}
function editingId() { const el = document.activeElement; return el && el.dataset ? el.dataset.id : null; }
function stamp(d) { return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`; }
const heldConflicts = new Set(); // 쓰는 중이라 이쪽 글을 지킨 회차: 손을 떼면 다시 알려서 양쪽이 같은 판으로 모이게 함
function saveConflictCopy(main, body, fromBy) {
    const key = main.id + '|' + fromBy;
    const same = Object.values(items).find(d => d.kind === 'episode' && live(d) && !inTrash(d) && d.conflictOf === main.id && d.body === body);
    if (same) { conflictCopyOf[key] = same.id; return same; }
    let copy = get(conflictCopyOf[key]);
    if (copy && !inTrash(copy)) { copy.body = body; touch(copy); return copy; }
    copy = create('episode', { workId: main.workId, parentId: main.parentId, title: `${main.title}-충돌-${stamp(new Date())}`, body, conflictOf: main.id, order: main.order + 0.001 });
    conflictCopyOf[key] = copy.id;
    return copy;
}
let conflictNotice = null;
function noticeConflict(main, copy, mineCopied) {
    if (conflictNotice && document.contains(conflictNotice)) conflictNotice.remove();
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>이 회차를 다른 곳에서도 고쳤어요.</h3>
        <p style="margin:0;line-height:1.7;font-size:13px">${mineCopied
            ? `다른 곳에서 더 나중에 고친 원고를 본문으로 가져왔고,<br>이 창에서 쓰신 내용은 『${esc(copy.title)}』(으)로 따로 남겨 뒀어요.`
            : `지금 쓰신 원고는 그대로 저장했고,<br>다른 곳의 내용은 『${esc(copy.title)}』(으)로 따로 남겨 뒀어요.`}</p>
        <div class="row2"><button class="btn" data-x="0">나중에</button><button class="btn primary" data-x="1">차이 보기</button></div></div>`;
    document.body.appendChild(bg);
    conflictNotice = bg;
    bg.addEventListener('click', e => {
        const x = e.target.dataset.x;
        if (e.target === bg || x === '0') bg.remove();
        if (x === '1') { bg.remove(); openCompare(main.id, copy.id, 'conflict'); }
    });
}
// 다른 곳에서 온 아이템 하나를 받아들임. 화면을 다시 그려야 하면 true
// 원고 충돌 규칙 (어느 쪽 글도 잃지 않게)
//  - 지금 이 창에서 쓰는 중이면: 이쪽 글은 그대로, 상대 글은 사본으로
//  - 쓰는 중이 아니면: 더 나중에 고친 쪽이 본문, 진 쪽이 자기 글을 사본으로 남김
function receiveItem(r) {
    normalize(r);
    const local = items[r.id];
    if (!local) { items[r.id] = r; seenRev[r.id] = r.rev; return true; }
    if (r.rev === local.rev) { seenRev[r.id] = r.rev; return false; }
    if (r.kind !== 'episode') {
        if (r.rev < local.rev) return false;
        if (editingId() === r.id) { pendingRemote.set(r.id, r); return false; }
        items[r.id] = r; seenRev[r.id] = r.rev; return true;
    }
    const diverged = local.by === tabId && r.base !== local.rev && local.body !== r.body;
    if (!diverged) {
        if (r.rev < local.rev) return false;
        if (editingId() === r.id && local.body !== r.body) { pendingRemote.set(r.id, r); return false; }
        items[r.id] = r; seenRev[r.id] = r.rev; return true;
    }
    if (editingId() === r.id) {
        heldConflicts.add(r.id);
        const fresh = !conflictCopyOf[r.id + '|' + r.by];
        const copy = saveConflictCopy(local, r.body, r.by);
        if (fresh) noticeConflict(local, copy);
        return true;
    }
    if (r.rev > local.rev) {
        const fresh = !conflictCopyOf[r.id + '|' + tabId];
        const copy = saveConflictCopy(local, local.body, tabId);
        items[r.id] = r; seenRev[r.id] = r.rev;
        if (fresh) noticeConflict(r, copy, true);
        return true;
    }
    broadcast([local]); // 이쪽이 더 나중 판: 상대가 자기 글을 사본으로 남기고 이쪽 판을 받도록 다시 알림
    return false;
}
function flushPendingRemote() {
    const ed = editingId();
    for (const id of [...heldConflicts]) if (id !== ed && items[id]) { heldConflicts.delete(id); broadcast([items[id]]); }
    if (!pendingRemote.size) return;
    let changed = false;
    for (const [id, r] of [...pendingRemote]) {
        if (ed === id) continue;
        pendingRemote.delete(id);
        if (receiveItem(r)) changed = true;
    }
    if (changed) refreshAfterRemote();
}
function refreshAfterRemote() {
    const el = document.activeElement;
    if (!editingId()) { renderAll(); return; }
    $$('[data-id][data-field]').forEach(f => {
        if (f === el) return;
        const it = items[f.dataset.id]; if (!it) return;
        if (f.classList.contains('manuscript')) { if (serializeEditor(f) !== it.body) { f.innerHTML = sanitizeHtml(it.body); fillImages(f); } }
        else if (f.value !== (it[f.dataset.field] ?? '')) { f.value = it[f.dataset.field] ?? ''; if (f.tagName === 'TEXTAREA') autoGrow(f); }
    });
    renderTree();
}
if (bc) bc.onmessage = ev => {
    const msg = ev.data;
    if (!msg || msg.from === tabId || !Array.isArray(msg.items)) return;
    let changed = false;
    msg.items.forEach(r => { if (receiveItem(r)) changed = true; });
    if (changed) refreshAfterRemote();
};

/* =====================================================================
   저장 시각 표시 · 스크롤 위치 기억 (작품별, 기기 간 동기화 대비)
   ===================================================================== */
let lastSavedAt = null;
function renderSavedAt() {
    const t = lastSavedAt ? '저장됨 · ' + new Date(lastSavedAt).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) : '';
    $$('.saved-at').forEach(el => { el.textContent = t; });
}
let scrollSaveTimer = null;
document.addEventListener('scroll', e => {
    const w = e.target; if (!w.matches || !w.matches('.ed-wrap[data-scroll]')) return;
    scrollMem[w.dataset.scroll] = w.scrollTop;
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(() => {
        const max = w.scrollHeight - w.clientHeight;
        const ratio = max > 0 ? Math.round(w.scrollTop / max * 1000) / 1000 : 0;
        setWL(W => {
            W.scroll ||= {};
            W.scroll[w.dataset.scroll] = ratio;
            const keys = Object.keys(W.scroll); if (keys.length > 300) delete W.scroll[keys[0]];
        });
    }, 800);
}, true);

/* ---------- 시작 ---------- */
(async () => {
    await loadLocal();
    buildSelbar();
    renderAll();
    if (localDirty.size) saveLocal();
    setBadge('이 기기에 저장됨', 'ok');
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('novel-sw.js').catch(() => {});
    }
})();
</script>
</body>
