<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#87ada1">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일정계산기">
<title>집필 일정 계산기</title>
<style>
:root{--pri:#87ada1;--pri-d:#5f8a7d;--pri-l:#effcf6;--sec:#f4a261;--bg:#f8f9fa;--tx:#334155;--sub:#64748b;--line:#e2e8f0;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,"Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;padding:0 0 env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
section{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
h2{font-size:15px;margin:0 0 10px;color:var(--pri-d)}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--tx)}
input:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
textarea{resize:vertical;min-height:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:var(--tx);padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none}
.days input{width:auto;margin:0}
.days label.off{background:#fde8d4;border-color:var(--sec)}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:#eef2f1;color:var(--pri-d)}
button.warn{background:#fbe5e5;color:#b84a4a}
button.sm{padding:5px 9px;font-size:13px}
.row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfdfd}
.row.rest{background:#fff8f0;border-color:#f6dcc0}
.row .top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row .top .no{font-weight:700;color:var(--pri-d);min-width:22px}
.row .top input{flex:1}
.row .grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.row .acts{display:flex;gap:4px}
.hint{font-size:12px;color:var(--sub);margin-top:3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--sub);text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.rest td{color:var(--sub)}
.wk{color:var(--sub);font-size:11px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--pri-l);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:16px;color:var(--pri-d)}
.sum span{font-size:11px;color:var(--sub)}
.count-res{margin-top:8px;font-size:14px}
.seg{display:flex;gap:0;margin-bottom:8px}
.seg button{flex:1;background:#eef2f1;color:var(--pri-d);border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--pri);color:#fff}
.mt{font-size:15px;font-weight:700;margin:14px 0 6px;color:var(--pri-d)}
.mt:first-child{margin-top:0}
#cal{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mg .dh{text-align:center;font-size:11px;color:var(--sub);padding:3px 0;background:#f3f6f5;border-radius:6px}
.mg .dh.su{color:#c0504d}
.cell{min-height:64px;border:1px dashed var(--line);border-radius:7px;padding:2px;background:#fff;overflow:hidden}
.cell.blank{border:0;background:transparent}
.cell.off{background:#fff6ec}
.cell.skip{background:#eee}
.cell.rest{background:#e4e4e4}
.cell.today .dn{background:var(--sec);color:#fff}
.cell.drop{outline:2px solid var(--pri);background:var(--pri-l)}
.dn{display:inline-block;min-width:17px;text-align:center;font-size:10px;line-height:17px;border-radius:9px;color:var(--sub)}
.chip{margin-top:2px;font-size:10px;line-height:15px;padding:0 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;cursor:grab;color:#3a3a3a}
.chip.rest{background:#cfcfcf!important;color:#666;cursor:default}
.chip.sel{box-shadow:0 0 0 2px #334155}
.ghost-drag{position:fixed;z-index:20;pointer-events:none;padding:3px 8px;border-radius:6px;font-size:12px;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.9}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.modes label{display:flex;align-items:center;gap:4px;margin:0;font-size:13px;color:var(--tx);padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.modes input{width:auto;margin:0}
.selbar{background:#fff3e6;border:1px solid var(--sec);border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:8px;display:none;align-items:center;justify-content:space-between;gap:8px}
.legend{margin-top:10px}
.legend div{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.legend div.sel{background:#fff3e6}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend button{margin-left:6px}
.legend span{color:var(--sub);margin-left:auto;font-size:12px;white-space:nowrap}
.fixrow{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.fixrow>div{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#334155;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>📅 집필 일정 계산기</h1><button class="ghost sm" id="reset">초기화</button></header>
<main>

<section>
<h2>기본 설정</h2>
<div class="grid">
  <div><label>시작일</label><input type="date" id="start"></div>
  <div><label>하루 집필 분량 (자)</label><input type="text" id="pace" inputmode="decimal" placeholder="예: 4000 / 0.4만"></div>
</div>
<div style="margin-top:10px">
  <label>쉬는 요일 (눌러서 토글)</label>
  <div class="days" id="days"></div>
</div>
<div style="margin-top:10px">
  <label>쉬는 날짜 (추가 휴무) — 줄/쉼표로 구분, 예: 2026-12-25, 2027-01-01 ~ 2027-01-03</label>
  <textarea id="skip" placeholder="2026-12-25&#10;2027-02-06 ~ 2027-02-09"></textarea>
</div>
</section>

<section>
<h2>작품 목록</h2>
<div id="rows"></div>
<div class="bar">
  <button id="addWork">+ 작품 추가</button>
</div>
<div class="hint">분량은 “16만”, “32.7만”, “160000”처럼 적을 수 있어요. 작품마다 하루 분량을 따로 정하면 기본값 대신 적용돼요. 각 작품은 목표 분량을 채운 뒤 다음 집필일에 다음 작품으로 넘어가요.</div>
</section>

<section>
<h2>달력</h2>
<div class="seg"><button id="mWork" class="on">작품 옮기기</button><button id="mRest">휴식 넣기</button></div>
<div class="hint" id="chint" style="margin:0 0 6px"></div>
<div class="modes" id="wmodes">
  <label><input type="radio" name="mode" value="after" checked>뒤 작품도 같이</label>
  <label><input type="radio" name="mode" value="one">이 작품만</label>
</div>
<div class="selbar" id="selbar"><span id="seltxt"></span><button class="ghost sm" id="unsel">선택 해제</button></div>
<div id="cal"></div>
<div class="legend" id="legend"></div>
</section>

<section>
<h2>계산 결과</h2>
<div class="sum" id="sum"></div>
<div id="result"></div>
<div class="bar"><button id="copy">결과 복사</button></div>
</section>

<section>
<h2>글자수 세기 (분량 확인용)</h2>
<textarea id="txt" placeholder="원고를 붙여넣으면 글자수를 세요"></textarea>
<div class="count-res" id="cnt"></div>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
(function () {
'use strict';
var KEY = 'schedule-calc-v1';
var WK = ['일','월','화','수','목','금','토'];
var $ = function (id) { return document.getElementById(id); };

function sample() {
  return {
    start: '2026-10-20', pace: '5000', off: [0], skip: '',
    rows: [
      {t:'w', name:'『권태의 종말』', chars:'16만', pace:''},
      {t:'w', name:'『두근두근 호감도 업!』', chars:'32.7만', pace:''},
      {t:'w', name:'텐북 BL 단독 배너', chars:'26.1만', pace:''},
      {t:'w', name:'『키치 웨딩』 원픽 후보', chars:'20만', pace:''},
      {t:'w', name:'현로 단권 ①', chars:'12만', pace:''},
      {t:'w', name:'위브랩 BL', chars:'18.3만', pace:''}
    ]
  };
}
var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.rows) S = sample();
if (!S.rests) S.rests = [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// "16만", "32.7만", "160,000" → 숫자
function num(v) {
  v = String(v == null ? '' : v).replace(/[,\s자]/g, '');
  if (!v) return 0;
  var m = v.match(/^(\d+(?:\.\d+)?)(만|천)?$/);
  if (!m) return NaN;
  var n = parseFloat(m[1]);
  if (m[2] === '만') n *= 10000; else if (m[2] === '천') n *= 1000;
  return Math.round(n);
}
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function fmtMan(n) {
  if (n >= 10000) { var m = Math.round(n / 100) / 100; return String(m) + '만'; }
  return fmt(n);
}

// ---- 날짜 (UTC 정오 기준 일수로 처리) ----
function parseD(s) {
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s).trim());
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5;
}
function dObj(day) { return new Date(day * 864e5); }
function dow(day) { return dObj(day).getUTCDay(); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtD(day, withYear) {
  var d = dObj(day);
  return (withYear ? d.getUTCFullYear() + '.' : '') + pad(d.getUTCMonth() + 1) + '.' + pad(d.getUTCDate());
}
function parseSkip(text) {
  var set = {};
  String(text || '').split(/[\n,;]+/).forEach(function (part) {
    part = part.trim(); if (!part) return;
    var seg = part.split(/\s*[~\-–]\s*(?=\d{4}-)/);
    var a = parseD(seg[0]), b = seg[1] ? parseD(seg[1]) : a;
    if (a == null || b == null) return;
    for (var d = a; d <= b && d - a < 800; d++) set[d] = 1;
  });
  return set;
}

// ---- 계산 ----
function compute() {
  var out = { items: [], total: 0, wdays: 0, end: null, err: '' };
  var cur = parseD(S.start);
  if (cur == null) { out.err = '시작일을 선택하세요'; return out; }
  var defPace = num(S.pace);
  var skip = parseSkip(S.skip);
  S.rests.forEach(function (r) { for (var d = r.s; d <= r.e && d - r.s < 800; d++) skip[d] = 1; });
  var off = {}; S.off.forEach(function (d) { off[d] = 1; });
  if (S.off.length >= 7) { out.err = '쉬는 요일이 7일이에요. 하루는 일해야 계산돼요'; return out; }
  function isWork(d) { return !off[dow(d)] && !skip[d]; }

  S.rows.forEach(function (r) {
    var fix = r.start ? parseD(r.start) : null;
    if (fix != null) cur = fix;
    if (r.t === 'r') {
      var n = Math.max(0, Math.round(num(r.days) || 0));
      if (!n) { out.items.push({r: r, bad: true}); return; }
      out.items.push({r: r, rest: true, fixed: fix != null, start: cur, end: cur + n - 1, days: n});
      cur += n;
      return;
    }
    var chars = num(r.chars);
    var pace = r.pace ? num(r.pace) : defPace;
    if (!chars || isNaN(chars) || !pace || isNaN(pace) || pace <= 0) { out.items.push({r: r, bad: true}); return; }
    var need = Math.ceil(chars / pace), guard = 0;
    if (fix == null) while (!isWork(cur) && guard++ < 4000) cur++;
    var start = cur, cnt = 1, last = cur;
    while (cnt < need && guard++ < 40000) {
      cur++;
      if (isWork(cur)) { cnt++; last = cur; }
    }
    out.items.push({r: r, fixed: fix != null, start: start, end: last, chars: chars, wdays: need, days: last - start + 1, pace: pace});
    out.total += chars; out.wdays += need; out.end = Math.max(out.end == null ? last : out.end, last);
    cur = last + 1;
  });
  return out;
}

function rangeText(it, st) {
  var y = dObj(it.start).getUTCFullYear();
  var s = fmtD(it.start, y !== st.year);
  st.year = y;
  var y2 = dObj(it.end).getUTCFullYear();
  var e = fmtD(it.end, y2 !== y);
  st.year = y2;
  return s + '~' + e;
}

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var lastText = '', lastO = null;
function renderResult() {
  var o = compute();
  var el = $('result'), sm = $('sum');
  lastO = o;
  renderCal();
  if (o.err) { el.innerHTML = '<div class="hint">' + esc(o.err) + '</div>'; sm.innerHTML = ''; lastText = ''; return; }
  var firstStart = null;
  o.items.forEach(function (it) { if (!it.bad && (firstStart == null || it.start < firstStart)) firstStart = it.start; });
  var calDays = (firstStart != null && o.end != null) ? o.end - firstStart + 1 : 0;
  sm.innerHTML =
    '<div><b>' + (o.end != null ? fmtD(o.end, true) : '-') + '</b><span>종료일</span></div>' +
    '<div><b>' + fmtMan(o.total) + '자</b><span>총 분량 (' + fmt(o.total) + ')</span></div>' +
    '<div><b>' + calDays + '일</b><span>집필일 ' + o.wdays + '일</span></div>';

  var st = {year: null}, html = '<table><tr><th>기간</th><th>작품</th><th class="n">분량</th></tr>', lines = [];
  o.items.forEach(function (it, i) {
    if (it.bad) {
      html += '<tr><td class="d">-</td><td colspan="2" class="hint">' + (i + 1) + '번 칸: 분량(또는 하루 분량/일수)을 확인하세요</td></tr>';
      return;
    }
    var rt = rangeText(it, st), wk = WK[dow(it.start)] + '~' + WK[dow(it.end)];
    if (it.rest) {
      html += '<tr class="rest"><td class="d">' + rt + '<div class="wk">' + wk + '</div></td><td>' + esc(it.r.name || '휴식') + '</td><td class="n">—</td></tr>';
      lines.push(rt + '  ' + (it.r.name || '휴식') + '  —');
    } else {
      var note = it.wdays + '집필일' + (it.days !== it.wdays ? ' / ' + it.days + '일' : '') + ' · 일 ' + fmt(it.pace);
      html += '<tr><td class="d">' + rt + '<div class="wk">' + wk + '</div></td><td><b>' + esc(it.r.name || '(이름 없음)') + '</b><div class="wk">' + note + '</div></td><td class="n">' + fmtMan(it.chars) + '</td></tr>';
      lines.push(rt + '  ' + (it.r.name || '(이름 없음)') + '  ' + fmtMan(it.chars));
    }
  });
  html += '</table>';
  var rl = S.rests.slice().sort(function (a, b) { return a.s - b.s; }).map(function (r) { return (r.name || '휴식') + ' ' + fmtD(r.s) + (r.e > r.s ? '~' + fmtD(r.e) : ''); });
  if (rl.length) html += '<div class="hint" style="margin-top:8px">쉬는 날: ' + esc(rl.join(' / ')) + '</div>';
  el.innerHTML = html;
  lastText = lines.join('\n') + (rl.length ? '\n쉬는 날: ' + rl.join(' / ') : '') + '\n\n총 ' + fmtMan(o.total) + '자 (' + fmt(o.total) + '자) · 종료 ' + fmtD(o.end, true);
}

// ---- 입력 UI ----
function renderDays() {
  var h = '';
  [1,2,3,4,5,6,0].forEach(function (d) {
    var off = S.off.indexOf(d) >= 0;
    h += '<label class="' + (off ? 'off' : '') + '"><input type="checkbox" data-d="' + d + '"' + (off ? ' checked' : '') + '>' + WK[d] + '</label>';
  });
  $('days').innerHTML = h;
}
function fixRow(r, i) {
  return '<div class="fixrow"><div><label>시작일 직접 지정 (비우면 앞 작품 다음 날 자동)</label><input type="date" data-f="start" data-i="' + i + '" value="' + esc(r.start || '') + '"></div>' +
    (r.start ? '<button class="ghost sm" data-a="unfix" data-i="' + i + '">원래대로</button>' : '') + '</div>';
}
function renderRows() {
  var h = '';
  S.rows.forEach(function (r, i) {
    var acts = '<div class="acts"><button class="ghost sm" data-a="up" data-i="' + i + '">↑</button><button class="ghost sm" data-a="dn" data-i="' + i + '">↓</button><button class="warn sm" data-a="del" data-i="' + i + '">✕</button></div>';
    if (r.t === 'r') {
      h += '<div class="row rest"><div class="top"><span class="no">' + (i + 1) + '</span><input data-f="name" data-i="' + i + '" value="' + esc(r.name || '') + '" placeholder="교정 / 휴식">' + acts + '</div>' +
        '<div class="grid3"><div><label>기간 (일)</label><input data-f="days" data-i="' + i + '" inputmode="numeric" value="' + esc(r.days || '') + '" placeholder="14"></div></div>' + fixRow(r, i) + '</div>';
    } else {
      h += '<div class="row"><div class="top"><span class="no">' + (i + 1) + '</span><input data-f="name" data-i="' + i + '" value="' + esc(r.name || '') + '" placeholder="작품 이름">' + acts + '</div>' +
        '<div class="grid3"><div><label>목표 분량 (자)</label><input data-f="chars" data-i="' + i + '" inputmode="decimal" value="' + esc(r.chars || '') + '" placeholder="16만"></div>' +
        '<div><label>하루 분량 (선택)</label><input data-f="pace" data-i="' + i + '" inputmode="decimal" value="' + esc(r.pace || '') + '" placeholder="기본값"></div>' +
        '<div><label>예상 집필일</label><input disabled data-est="' + i + '"></div></div>' + fixRow(r, i) + '</div>';
    }
  });
  $('rows').innerHTML = h || '<div class="hint">작품을 추가하세요</div>';
  updateEst();
}
function updateEst() {
  var dp = num(S.pace);
  S.rows.forEach(function (r, i) {
    var el = document.querySelector('[data-est="' + i + '"]');
    if (!el) return;
    var c = num(r.chars), p = r.pace ? num(r.pace) : dp;
    el.value = (c && p && !isNaN(c) && !isNaN(p)) ? Math.ceil(c / p) + '일' : '-';
  });
}
function refresh() { save(); updateEst(); renderResult(); }

$('start').value = S.start; $('pace').value = S.pace; $('skip').value = S.skip || '';
$('start').addEventListener('input', function () { S.start = this.value; refresh(); });
$('pace').addEventListener('input', function () { S.pace = this.value; refresh(); });
$('skip').addEventListener('input', function () { S.skip = this.value; refresh(); });
$('days').addEventListener('change', function (e) {
  var d = +e.target.dataset.d, i = S.off.indexOf(d);
  if (e.target.checked && i < 0) S.off.push(d); else if (!e.target.checked && i >= 0) S.off.splice(i, 1);
  renderDays(); refresh();
});
$('rows').addEventListener('input', function (e) {
  var t = e.target; if (!t.dataset.f) return;
  S.rows[+t.dataset.i][t.dataset.f] = t.value;
  if (t.dataset.f === 'start') { refresh(); return; }
  refresh();
});
$('rows').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var i = +b.dataset.i, a = b.dataset.a, r = S.rows;
  if (a === 'unfix') delete r[i].start;
  else if (a === 'del') { if (!confirm((i + 1) + '번 칸을 지울까요?')) return; r.splice(i, 1); }
  else if (a === 'up' && i > 0) { var x = r[i]; r[i] = r[i-1]; r[i-1] = x; }
  else if (a === 'dn' && i < r.length - 1) { var y = r[i]; r[i] = r[i+1]; r[i+1] = y; }
  renderRows(); refresh();
});
$('addWork').onclick = function () { S.rows.push({t:'w', name:'', chars:'', pace:''}); renderRows(); refresh(); };
$('reset').onclick = function () {
  if (!confirm('모든 입력을 예시 값으로 되돌릴까요?')) return;
  S = sample(); S.rests = []; $('start').value = S.start; $('pace').value = S.pace; $('skip').value = '';
  renderDays(); renderRows(); refresh();
};
function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 1500); }
$('copy').onclick = function () {
  if (!lastText) return;
  var done = function () { toast('복사했어요'); };
  if (navigator.clipboard) navigator.clipboard.writeText(lastText).then(done, function () { prompt('복사하세요', lastText); });
  else prompt('복사하세요', lastText);
};
$('txt').addEventListener('input', function () {
  var v = this.value, withSp = Array.from(v).length;
  var noSp = Array.from(v.replace(/\s/g, '')).length;
  $('cnt').innerHTML = v ? '공백 포함 <b>' + fmt(withSp) + '</b>자 · 공백 제외 <b>' + fmt(noSp) + '</b>자' : '';
});

// ---- 달력 ----
var COLORS = ['#f6c9a8','#bfe0d3','#cfd9f6','#f3c6d8','#e8dcab','#d5c6ea','#c2e3ef','#f0d0b8'];
var sel = -1, mode = 'after', rmode = false, drag = null, cellMap = {}, hlCells = [];
function dstr(day) { var d = dObj(day); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function shortName(r) { return (r.name || (r.t === 'r' ? '휴식' : '작품')).replace(/[『』「」]/g, ''); }
function color(i) { return COLORS[i % COLORS.length]; }
function restAt(day) {
  for (var k = 0; k < S.rests.length; k++) if (S.rests[k].s <= day && day <= S.rests[k].e) return S.rests[k];
  return null;
}
function rid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

function renderCal() {
  var o = lastO, cal = $('cal');
  if (!o || o.err) { cal.innerHTML = ''; $('legend').innerHTML = ''; cellMap = {}; return; }
  var first = parseD(S.start), last = null;
  o.items.forEach(function (it) {
    if (it.bad) return;
    if (first == null || it.start < first) first = it.start;
    if (last == null || it.end > last) last = it.end;
  });
  S.rests.forEach(function (r) { if (r.s < first) first = r.s; if (last == null || r.e > last) last = r.e; });
  var today = Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
  var y0 = dObj(first).getUTCFullYear(), m0 = dObj(first).getUTCMonth();
  var endY = Math.max(dObj(today).getUTCFullYear(), y0) + 1;
  var lim = Date.UTC(endY, 11, 31) / 864e5;
  if (last == null || last < lim) last = lim;
  var y1 = dObj(last).getUTCFullYear(), m1 = dObj(last).getUTCMonth();

  var map = {};
  o.items.forEach(function (it, i) {
    if (it.bad) return;
    for (var d = it.start; d <= it.end; d++) if (it.rest || !restAt(d)) (map[d] = map[d] || []).push(i);
  });
  var skip = parseSkip(S.skip), h = '';
  for (var y = y0, m = m0; y < y1 || (y === y1 && m <= m1); m++) {
    if (m > 11) { m = 0; y++; if (y > y1 || (y === y1 && m > m1)) break; }
    var f = Date.UTC(y, m, 1) / 864e5, nDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    h += '<div class="mt">' + y + '년 ' + (m + 1) + '월</div><div class="mg">' +
      ['일','월','화','수','목','금','토'].map(function (w, k) { return '<div class="dh' + (k === 0 ? ' su' : '') + '">' + w + '</div>'; }).join('');
    for (var b = 0; b < dow(f); b++) h += '<div class="cell blank"></div>';
    for (var n = 0; n < nDays; n++) {
      var day = f + n, cls = 'cell', rr = restAt(day);
      if (S.off.indexOf(dow(day)) >= 0) cls += ' off';
      if (skip[day]) cls += ' skip';
      if (rr) cls += ' rest';
      if (day === today) cls += ' today';
      h += '<div class="' + cls + '" data-day="' + day + '"><span class="dn">' + (n + 1) + '</span>';
      if (rr && rr.s === day) h += '<div class="chip rest">' + esc(rr.name || '휴식') + '</div>';
      (map[day] || []).forEach(function (i) {
        var it = o.items[i];
        h += '<div class="chip' + (it.rest ? ' rest' : '') + (i === sel ? ' sel' : '') + '" data-i="' + i + '" data-day="' + day + '"' + (it.rest ? '' : ' style="background:' + color(i) + '"') + '>' + esc(shortName(it.r)) + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  cal.innerHTML = h;
  cellMap = {};
  cal.querySelectorAll('.cell[data-day]').forEach(function (c) { cellMap[c.dataset.day] = c; });
  hlCells = [];

  var lg = '';
  o.items.forEach(function (it, i) {
    if (it.bad) return;
    lg += '<div data-lg="' + i + '" class="' + (i === sel ? 'sel' : '') + '"><i style="background:' + (it.rest ? '#ddd' : color(i)) + '"></i>' + esc(shortName(it.r)) + (it.fixed ? ' 📌' : '') +
      '<span>' + fmtD(it.start, true).slice(2) + ' ~ ' + fmtD(it.end, true).slice(2) + '</span></div>';
  });
  S.rests.slice().sort(function (a, b) { return a.s - b.s; }).forEach(function (r) {
    lg += '<div data-rg="' + r.id + '"><i style="background:#cfcfcf"></i>' + esc(r.name || '휴식') +
      '<span>' + fmtD(r.s, true).slice(2) + (r.e > r.s ? ' ~ ' + fmtD(r.e, true).slice(2) : '') + ' · ' + (r.e - r.s + 1) + '일</span><button class="warn sm" data-rdel="' + r.id + '">✕</button></div>';
  });
  $('legend').innerHTML = lg;
  var bar = $('selbar'), it2 = sel >= 0 && o.items[sel];
  if (!rmode && it2 && !it2.bad) { bar.style.display = 'flex'; $('seltxt').textContent = '「' + shortName(it2.r) + '」 선택됨 — 시작할 날짜를 누르세요'; }
  else { bar.style.display = 'none'; sel = -1; }
}

function moveWork(i, delta) {
  var o = lastO, it = o && o.items[i];
  if (!it || it.bad || !delta) return;
  S.rows[i].start = dstr(it.start + delta);
  if (mode === 'after') {
    for (var j = i + 1; j < S.rows.length; j++) {
      var p = S.rows[j].start ? parseD(S.rows[j].start) : null;
      if (p != null) S.rows[j].start = dstr(p + delta);
    }
  } else {
    var nx = o.items[i + 1];
    if (nx && !nx.bad && !S.rows[i + 1].start) S.rows[i + 1].start = dstr(nx.start);
  }
  renderRows(); refresh();
}

function setRmode(v) {
  rmode = v; sel = -1;
  $('mWork').classList.toggle('on', !v); $('mRest').classList.toggle('on', v);
  $('wmodes').style.display = v ? 'none' : 'flex';
  $('chint').textContent = v
    ? '날짜를 누르면 그 날이 휴식이 돼요. 여러 날은 눌러서 끌어요. 휴식의 첫날/마지막 날을 끌면 줄이고 늘이고, 가운데를 끌면 통째로 옮겨요. (폰은 0.3초 꾹 누른 뒤 끌어요)'
    : '작품 막대를 끌어서 옮겨요. (폰은 0.3초 꾹 누른 뒤 끌어요) 막대를 눌러 선택한 뒤 시작할 날짜를 눌러도 돼요.';
  renderCal();
}
$('mWork').onclick = function () { setRmode(false); };
$('mRest').onclick = function () { setRmode(true); };
setRmode(false);
$('unsel').onclick = function () { sel = -1; renderCal(); };
document.querySelectorAll('input[name=mode]').forEach(function (r) {
  r.addEventListener('change', function () { mode = this.value; });
});
$('legend').addEventListener('click', function (e) {
  var del = e.target.closest('[data-rdel]');
  if (del) { S.rests = S.rests.filter(function (r) { return r.id !== del.dataset.rdel; }); refresh(); return; }
  var rg = e.target.closest('[data-rg]');
  if (rg) {
    var r = S.rests.filter(function (x) { return x.id === rg.dataset.rg; })[0];
    var nm = r && prompt('이름 (예: 교정, 휴식)', r.name || '휴식');
    if (nm != null) { r.name = nm.trim() || '휴식'; refresh(); }
    return;
  }
  var row = e.target.closest('[data-lg]'); if (!row) return;
  var i = +row.dataset.lg, it = lastO.items[i];
  sel = (sel === i) ? -1 : i;
  if (rmode) setRmode(false);
  renderCal();
  if (sel >= 0 && cellMap[it.start]) cellMap[it.start].scrollIntoView({block: 'center', behavior: 'smooth'});
});
$('rows').addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.f === 'start') renderRows();
});

var calEl = $('cal'), ghost = null;
function cellAt(x, y) {
  var el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest('.cell[data-day]') : null;
}
function hl(s, e) {
  hlCells.forEach(function (c) { c.classList.remove('drop'); });
  hlCells = [];
  for (var d = s; d <= e && d - s < 800; d++) if (cellMap[d]) { cellMap[d].classList.add('drop'); hlCells.push(cellMap[d]); }
}
function endDrag() {
  if (drag && drag.timer) clearTimeout(drag.timer);
  if (ghost) { ghost.remove(); ghost = null; }
  hl(1, 0); drag = null;
}
calEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });
calEl.addEventListener('touchmove', function (e) { if (drag && drag.armed) e.preventDefault(); }, {passive: false});
calEl.addEventListener('pointerdown', function (e) {
  if (e.button > 0) return;
  var c = e.target.closest('.cell[data-day]'); if (!c) return;
  var day = +c.dataset.day, chip = e.target.closest('.chip');
  var d = {x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, day: day, armed: e.pointerType !== 'touch'};
  if (rmode) {
    var r = restAt(day);
    if (r) { d.kind = 'rest'; d.r = r; d.o = {s: r.s, e: r.e}; d.how = day === r.e ? 'end' : (day === r.s ? 'start' : 'move'); }
    else d.kind = 'new';
  } else {
    if (!chip || chip.classList.contains('rest')) return;
    d.kind = 'work'; d.i = +chip.dataset.i;
  }
  drag = d;
  try { calEl.setPointerCapture(e.pointerId); } catch (err) {}
  if (!d.armed) d.timer = setTimeout(function () { if (drag === d) { d.armed = true; if (navigator.vibrate) navigator.vibrate(15); } }, 280);
});
calEl.addEventListener('pointermove', function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  var dist = Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
  if (!drag.armed) { if (dist > 8) endDrag(); return; }
  if (!drag.moved && dist < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    if (drag.kind === 'work') {
      ghost = document.createElement('div');
      ghost.className = 'ghost-drag';
      ghost.style.background = color(drag.i);
      ghost.textContent = shortName(lastO.items[drag.i].r);
      document.body.appendChild(ghost);
    }
  }
  var c = cellAt(e.clientX, e.clientY), dy = c ? +c.dataset.day : null;
  if (drag.kind === 'work') {
    ghost.style.left = (e.clientX + 10) + 'px'; ghost.style.top = (e.clientY - 28) + 'px';
    hl(dy == null ? 1 : dy, dy == null ? 0 : dy);
    return;
  }
  if (dy == null) return;
  var pv;
  if (drag.kind === 'new') pv = {s: Math.min(drag.day, dy), e: Math.max(drag.day, dy)};
  else if (drag.how === 'end') pv = {s: drag.o.s, e: Math.max(drag.o.s, dy)};
  else if (drag.how === 'start') pv = {s: Math.min(dy, drag.o.e), e: drag.o.e};
  else pv = {s: drag.o.s + dy - drag.day, e: drag.o.e + dy - drag.day};
  drag.pv = pv; hl(pv.s, pv.e);
});
calEl.addEventListener('pointerup', function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  var d = drag, c = d.moved ? cellAt(e.clientX, e.clientY) : null;
  endDrag();
  if (d.kind === 'work') {
    if (d.moved) { if (c) moveWork(d.i, +c.dataset.day - d.day); }
    else if (sel >= 0 && sel !== d.i) { var s0 = lastO.items[sel]; if (s0 && !s0.bad) moveWork(sel, d.day - s0.start); }
    else { sel = (sel === d.i) ? -1 : d.i; renderCal(); }
    return;
  }
  if (d.moved && d.pv) {
    if (d.kind === 'new') S.rests.push({id: rid(), s: d.pv.s, e: d.pv.e, name: '휴식'});
    else { d.r.s = d.pv.s; d.r.e = d.pv.e; }
    refresh();
  } else if (!d.moved && d.kind === 'new') {
    S.rests.push({id: rid(), s: d.day, e: d.day, name: '휴식'});
    refresh();
  }
});
calEl.addEventListener('pointercancel', endDrag);
calEl.addEventListener('click', function (e) {
  if (rmode) return;
  var ch = e.target.closest('.chip');
  if (ch && !ch.classList.contains('rest')) return;
  var c = e.target.closest('.cell[data-day]');
  if (!c || sel < 0) return;
  var it = lastO.items[sel];
  if (it && !it.bad) moveWork(sel, +c.dataset.day - it.start);
});

renderDays(); renderRows(); renderResult();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
