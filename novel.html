    if (cur.length || !pages.length) pages.push(cur);
    box.remove();
    return { pages, pw, ph, m, fpx, lines: Math.floor(ih / (fpx * L.lh)) };
}
function renderPageView(paneEl, doc) {
    const W = WL();
    const L = pageLayouts().find(l => l.id === W.pageLayout) || PAGE_PRESETS[0];
    const host = $('.page-view', paneEl); if (!host) return;
    // 판형이 창보다 넓으면 창 너비에 맞춰 줄이고, 그 위에 사용자가 고른 배율을 곱함
    const fit = Math.min(1, (host.clientWidth - 28) / (L.w * MM));
    const zoom = Math.max(0.2, fit * (W.pageZoom || 1));
    const keep = $('.pv-pages', host)?.scrollTop || 0;
    const r = paginate(doc, L);
    host.innerHTML = `<div class="pv-bar"><span>페이지 조판</span>
        <select data-pv-layout>${pageLayouts().map(l => `<option value="${l.id}" ${l.id === L.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}<option value="__new">＋ 내 판형 만들기…</option></select>
        <button class="mini" data-pv-z="-0.1">－</button><span>${Math.round((W.pageZoom || 1) * 100)}%</span><button class="mini" data-pv-z="0.1">＋</button>
        <b>${r.pages.length}쪽 · ${r.lines}줄/쪽</b><span style="flex:1"></span><button class="mini" data-a="pages">조판 끄기</button></div>
        <div class="pv-note">${esc(L.name)} ${L.w}×${L.h}mm · ${esc(L.font)} ${L.pt}pt · ${Math.round(L.lh * 100)}% — 연재처 조판을 비슷하게 옮긴 것이라 실제 앱의 쪽 수와는 조금 다를 수 있어요.</div>
        <div class="pv-pages"><div class="pv-stack" style="zoom:${zoom}">${r.pages.map((p, i) => `<div class="pv-page" style="width:${r.pw}px;height:${r.ph}px;padding:${r.m}px;font-family:${pageFont(L.font)};font-size:${r.fpx}px;line-height:${L.lh}">
            <div class="pv-text">${p.join('')}</div><div class="pv-no">${i + 1} / ${r.pages.length}</div></div>`).join('')}</div></div>`;
    $('.pv-pages', host).scrollTop = keep;
}
let pvTimer = null;
function schedulePageViews(docId) {
    clearTimeout(pvTimer);
    pvTimer = setTimeout(() => { $$('.epane').forEach(pe => { const p = WL().panes[+pe.dataset.pane]; if (p && p.pageView && p.active === docId) renderPageView(pe, get(docId)); }); }, 700);
}
function newPageLayout() {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>내 판형 만들기</h3>
        <label>이름</label><input type="text" data-k="name" value="내 판형">
        <label>용지 가로 × 세로 (mm)</label><div style="display:flex;gap:6px"><input type="number" data-k="w" value="80" min="40" max="300"><input type="number" data-k="h" value="140" min="60" max="400"></div>
        <label>글꼴</label><select data-k="font"><option>명조</option><option>나눔명조</option><option>고딕</option><option>리디바탕</option></select>
        <label>글자 크기 (pt)</label><input type="number" data-k="pt" value="10" step="0.5" min="6" max="20">
        <label>줄간격 (%)</label><input type="number" data-k="lh" value="150" step="5" min="100" max="300">
        <div class="row2"><button class="btn" data-x="0">취소</button><button class="btn primary" data-x="1">저장</button></div></div>`;
    document.body.appendChild(bg);
    return new Promise(resolve => {
        bg.addEventListener('click', e => {
            const x = e.target.dataset.x;
            if (e.target === bg || x === '0') { bg.remove(); resolve(null); return; }
            if (x !== '1') return;
            const v = k => $(`[data-k="${k}"]`, bg).value;
            const L = { id: uid('pl'), name: v('name').trim() || '내 판형', w: +v('w') || 80, h: +v('h') || 140, font: v('font'), pt: +v('pt') || 10, lh: (+v('lh') || 150) / 100 };
            const S = settings(); S.pageLayouts = [...(S.pageLayouts || []), L]; touch(S);
            bg.remove(); resolve(L);
        });
    });
}
document.addEventListener('change', async e => {
    const t = e.target; if (!t.matches || !t.matches('[data-pv-layout]')) return;
    let id = t.value;
    if (id === '__new') { const L = await newPageLayout(); if (!L) { renderEditors(); return; } id = L.id; }
    setWL(W => { W.pageLayout = id; });
    renderEditors();
});
document.addEventListener('click', e => {
    const z = e.target.closest && e.target.closest('[data-pv-z]'); if (!z) return;
    setWL(W => { W.pageZoom = Math.max(0.5, Math.min(2, Math.round(((W.pageZoom || 1) + +z.dataset.pvZ) * 10) / 10)); });
    renderEditors();
});

/* =====================================================================
   시놉시스 보드: 시놉 문서 = 파트(카드) 여러 개, 파트 안에 블록(글 상자) 여러 개
   (에피소드 기획 보드와 같은 방식)
   ===================================================================== */
const SB_COLORS = ['', '#fff3a8', '#ffd6a5', '#ffc8dd', '#cfbaf0', '#a3c4f3', '#98f5e1', '#b9fbc0'];
const SB_MARKERS = ['⭐', '❗', '❓', '💡', '❤️', '🔥'];
const newBlock = (html = '') => ({ id: uid('b'), html, color: '', markers: [] });
const newCard = (title = '', blocks) => ({ id: uid('k'), title, place: '', color: '', blocks: blocks || [newBlock()] });
// 예전 시놉(글 한 덩어리) → 파트 하나 + 빈 줄로 나눈 블록들
function synopFromText(text) {
    const parts = String(text || '').replace(/\r\n?/g, '\n').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    return [newCard('', parts.length ? parts.map(p => newBlock(esc(p).replace(/\n/g, '<br>'))) : [newBlock()])];
}
function synopPlain(doc) {
    return (doc.cards || []).map(c => [c.title, c.place].filter(Boolean).join(' · ') + '\n' + c.blocks.map(b => (b.markers || []).join('') + htmlToLines(b.html).join('\n')).join('\n')).join('\n\n').trim();
}
function synopMd(doc) {
    return `# ${doc.title}\n\n` + (doc.cards || []).map(c => `## ${c.title || '(제목 없는 파트)'}${c.place ? ` — ${c.place}` : ''}\n\n` + c.blocks.map(b => '- ' + (b.markers || []).join('') + htmlToLines(b.html).join('\n  ')).join('\n')).join('\n\n') + '\n';
}
function sbCtx(el) {
    const doc = get(el.closest('[data-sbdoc]')?.dataset.sbdoc);
    if (!doc) return {};
    const card = (doc.cards || []).find(c => c.id === el.closest('[data-card]')?.dataset.card);
    const block = card && card.blocks.find(b => b.id === el.closest('[data-block]')?.dataset.block);
    return { doc, card, block };
}
function synopBoardHtml(doc) {
    const cards = doc.cards || [];
    return `<div class="sb" data-sbdoc="${doc.id}">${cards.map(c => `
        <div class="sb-card" data-card="${c.id}" style="${c.color ? `border-top:3px solid ${esc(c.color)}` : ''}">
            <div class="sb-card-head"><span class="sb-grip" draggable="true" title="끌어서 파트 순서 바꾸기">⠿</span>
                <input class="sb-title" data-sbf="title" value="${esc(c.title)}" placeholder="파트 제목" spellcheck="false">
                <span class="sb-count" title="블록 수">${c.blocks.length}</span>
                <button class="mini" data-sb="add-block" title="블록 추가">＋</button><button class="mini" data-sb="card-menu" title="파트 메뉴">⋯</button></div>
            <input class="sb-place" data-sbf="place" value="${esc(c.place || '')}" placeholder="장소 · 한 줄 메모" spellcheck="false">
            <div class="sb-blocks" data-card="${c.id}">${c.blocks.map(b => `
                <div class="sb-block" data-block="${b.id}" style="${b.color ? `background:${esc(b.color)};color:#2b2a26` : ''}">
                    <span class="sb-bgrip" draggable="true" title="끌어서 순서 바꾸기 · 다른 파트로 옮기기">⋮⋮</span>
                    ${(b.markers || []).length ? `<span class="sb-markers">${b.markers.join('')}</span>` : ''}
                    <div class="sb-text" contenteditable="true" spellcheck="false" data-id="${doc.id}" data-ph="내용을 적어 보세요">${sanitizeHtml(b.html)}</div>
                    <button class="mini sb-bmenu" data-sb="block-menu" title="블록 메뉴">⋯</button></div>`).join('')}</div>
            <button class="sb-add" data-sb="add-block">＋ 새 블록</button>
        </div>`).join('')}
        <button class="sb-add-card" data-sb="add-card">＋ 새 파트</button></div>`;
}
function rerenderSynop(doc, focusBlockId) {
    renderSynops();
    if (focusBlockId) {
        const el = $(`.sb[data-sbdoc="${doc.id}"] [data-block="${focusBlockId}"] .sb-text`);
        if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    }
}
function syncEmpty(el) { el.classList.toggle('empty', !el.textContent.trim() && !el.querySelector('img')); }

// 입력: 블록 글 · 파트 제목/장소
document.addEventListener('input', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('sb-text')) {
        const { doc, block } = sbCtx(t); if (!block) return;
        block.html = t.innerHTML; touch(doc); syncEmpty(t);
        $$(`.sb[data-sbdoc="${doc.id}"] [data-block="${block.id}"] .sb-text`).forEach(o => { if (o !== t) { o.innerHTML = t.innerHTML; syncEmpty(o); } });
        e.stopImmediatePropagation();
        return;
    }
    if (t.dataset && t.dataset.sbf) {
        const { doc, card } = sbCtx(t); if (!card) return;
        card[t.dataset.sbf] = t.value; touch(doc);
        $$(`.sb[data-sbdoc="${doc.id}"] [data-card="${card.id}"] [data-sbf="${t.dataset.sbf}"]`).forEach(o => { if (o !== t) o.value = t.value; });
        e.stopImmediatePropagation();
    }
}, true);
// 블록 안에 붙여넣기는 글자만
document.addEventListener('paste', e => {
    const t = e.target.closest && e.target.closest('.sb-text'); if (!t) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (text) document.execCommand('insertText', false, smartOn() ? text.replace(/\r\n?/g, '\n').split('\n').map(l => curlyText(l)).join('\n') : text.replace(/\r\n?/g, '\n'));
}, true);
// 블록에서 Enter 두 번 → 새 블록 (마지막 빈 줄에서 Enter)
document.addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('.sb-text'); if (!t || e.isComposing) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        const { doc, card, block } = sbCtx(t);
        const nb = newBlock(); card.blocks.splice(card.blocks.indexOf(block) + 1, 0, nb); touch(doc); rerenderSynop(doc, nb.id);
    }
    if (e.key === 'Backspace' && !t.textContent && !t.querySelector('img')) {
        const { doc, card, block } = sbCtx(t);
        if (card && card.blocks.length > 1) {
            e.preventDefault();
            const i = card.blocks.indexOf(block); card.blocks.splice(i, 1); touch(doc);
            rerenderSynop(doc, card.blocks[Math.max(0, i - 1)].id);
        }
    }
});

async function sbClick(e) {
    const btn = e.target.closest('[data-sb]'); if (!btn) return;
    const { doc, card, block } = sbCtx(btn); if (!doc) return;
    const a = btn.dataset.sb;
    doc.cards ||= [];
    if (a === 'add-card') { const c = newCard(); doc.cards.push(c); touch(doc); rerenderSynop(doc); $(`.sb[data-sbdoc="${doc.id}"] [data-card="${c.id}"] .sb-title`)?.focus(); return; }
    if (a === 'add-block') { const nb = newBlock(); card.blocks.push(nb); touch(doc); rerenderSynop(doc, nb.id); return; }
    if (a === 'card-menu') {
        const i = doc.cards.indexOf(card);
        const pop = showPop(btn, `<div class="swatches" style="grid-template-columns:repeat(4,26px)">${SB_COLORS.map(c => `<button class="swatch ${c ? '' : 'none'}" style="background:${c || 'var(--panel)'}" data-cc="${c}" title="${c ? '파트 색' : '색 없음'}"></button>`).join('')}</div><hr>
            <button data-m="up" ${i ? '' : 'disabled'}>↑ 위로</button><button data-m="down" ${i < doc.cards.length - 1 ? '' : 'disabled'}>↓ 아래로</button>
            <button data-m="dup">파트 복제</button><button data-m="copy">파트 글 복사</button><hr><button data-m="del" class="danger">파트 지우기</button>`);
        pop.addEventListener('click', ev => {
            const cc = ev.target.closest('[data-cc]'); const m = ev.target.closest('[data-m]')?.dataset.m;
            if (cc) { card.color = cc.dataset.cc; touch(doc); closePop(); rerenderSynop(doc); return; }
            if (!m) return; closePop();
            if (m === 'up' || m === 'down') { const j = i + (m === 'up' ? -1 : 1); [doc.cards[i], doc.cards[j]] = [doc.cards[j], doc.cards[i]]; }
            if (m === 'dup') doc.cards.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(card)), id: uid('k'), title: card.title ? card.title + ' (사본)' : '', blocks: card.blocks.map(b => ({ ...b, id: uid('b') })) });
            if (m === 'copy') { copyText(synopPlain({ cards: [card] }), '파트 글을'); return; }
            if (m === 'del') {
                const removed = doc.cards.splice(i, 1)[0];
                touch(doc); rerenderSynop(doc);
                toast('파트를 지웠어요.', '되돌리기', () => { doc.cards.splice(i, 0, removed); touch(doc); rerenderSynop(doc); });
                return;
            }
            touch(doc); rerenderSynop(doc);
        });
        return;
    }
    if (a === 'block-menu') {
        const i = card.blocks.indexOf(block);
        const pop = showPop(btn, `<div class="swatches" style="grid-template-columns:repeat(4,26px)">${SB_COLORS.map(c => `<button class="swatch ${c ? '' : 'none'}" style="background:${c || 'var(--panel)'}" data-bc="${c}" title="${c ? '블록 색' : '색 없음'}"></button>`).join('')}</div>
            <div class="sb-mk">${SB_MARKERS.map(m => `<button data-mk="${m}" class="${(block.markers || []).includes(m) ? 'on' : ''}" title="표시 켜기·끄기">${m}</button>`).join('')}</div><hr>
            <button data-m="up" ${i ? '' : 'disabled'}>↑ 위로</button><button data-m="down" ${i < card.blocks.length - 1 ? '' : 'disabled'}>↓ 아래로</button>
            <button data-m="below">아래에 새 블록 (Ctrl+Enter)</button><hr><button data-m="del" class="danger">블록 지우기</button>`);
        pop.addEventListener('mousedown', ev => ev.preventDefault());
        pop.addEventListener('click', ev => {
            const bc = ev.target.closest('[data-bc]'), mk = ev.target.closest('[data-mk]'), m = ev.target.closest('[data-m]')?.dataset.m;
            if (bc) { block.color = bc.dataset.bc; touch(doc); closePop(); rerenderSynop(doc); return; }
            if (mk) { const ms = block.markers || []; block.markers = ms.includes(mk.dataset.mk) ? ms.filter(x => x !== mk.dataset.mk) : [...ms, mk.dataset.mk]; touch(doc); mk.classList.toggle('on'); rerenderSynop(doc); return; }
            if (!m) return; closePop();
            if (m === 'up' || m === 'down') { const j = i + (m === 'up' ? -1 : 1); [card.blocks[i], card.blocks[j]] = [card.blocks[j], card.blocks[i]]; touch(doc); rerenderSynop(doc); }
            if (m === 'below') { const nb = newBlock(); card.blocks.splice(i + 1, 0, nb); touch(doc); rerenderSynop(doc, nb.id); }
            if (m === 'del') {
                const removed = card.blocks.splice(i, 1)[0];
                if (!card.blocks.length) card.blocks.push(newBlock());
                touch(doc); rerenderSynop(doc);
                toast('블록을 지웠어요.', '되돌리기', () => { if (card.blocks.length === 1 && !card.blocks[0].html) card.blocks = []; card.blocks.splice(i, 0, removed); touch(doc); rerenderSynop(doc); });
            }
        });
    }
}
$('#synop-grid').addEventListener('click', sbClick);

// 끌어서 옮기기: 블록(같은 문서 안 다른 파트로도) · 파트 순서
let sbDrag = null;
const sbGrid = $('#synop-grid');
sbGrid.addEventListener('dragstart', e => {
    const bg = e.target.closest('.sb-bgrip'), cg = e.target.closest('.sb-grip');
    if (!bg && !cg) return;
    const { doc, card, block } = sbCtx(e.target);
    sbDrag = { kind: bg ? 'block' : 'card', docId: doc.id, cardId: card.id, blockId: block?.id };
    const el = bg ? e.target.closest('.sb-block') : e.target.closest('.sb-card');
    try { e.dataTransfer.setDragImage(el, 10, 10); e.dataTransfer.setData('text/plain', ''); } catch (_) {}
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => el.classList.add('sb-dragging'), 0);
});
const clearSbMarks = () => $$('.sb-over-top, .sb-over-bottom, .sb-dragging, .sb-over-list').forEach(x => x.classList.remove('sb-over-top', 'sb-over-bottom', 'sb-dragging', 'sb-over-list'));
sbGrid.addEventListener('dragend', () => { sbDrag = null; clearSbMarks(); });
sbGrid.addEventListener('dragover', e => {
    if (!sbDrag) return;
    const sb = e.target.closest('.sb'); if (!sb || sb.dataset.sbdoc !== sbDrag.docId) return;
    const tgt = sbDrag.kind === 'block' ? (e.target.closest('.sb-block') || e.target.closest('.sb-blocks')) : e.target.closest('.sb-card');
    if (!tgt) return;
    e.preventDefault();
    $$('.sb-over-top, .sb-over-bottom, .sb-over-list').forEach(x => x.classList.remove('sb-over-top', 'sb-over-bottom', 'sb-over-list'));
    if (tgt.classList.contains('sb-blocks')) { tgt.classList.add('sb-over-list'); return; }
    const r = tgt.getBoundingClientRect();
    tgt.classList.add(e.clientY < r.top + r.height / 2 ? 'sb-over-top' : 'sb-over-bottom');
});
sbGrid.addEventListener('drop', e => {
    if (!sbDrag) return;
    const d = sbDrag; sbDrag = null;
    const doc = get(d.docId); if (!doc) return;
    e.preventDefault();
    const above = el => { const r = el.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; };
    if (d.kind === 'block') {
        const from = doc.cards.find(c => c.id === d.cardId);
        const bi = from.blocks.findIndex(b => b.id === d.blockId); if (bi < 0) return;
        const tBlock = e.target.closest('.sb-block'), tList = e.target.closest('.sb-blocks');
        if (!tList) { clearSbMarks(); return; }
        const to = doc.cards.find(c => c.id === tList.dataset.card);
        const [moved] = from.blocks.splice(bi, 1);
        let at = to.blocks.length;
        if (tBlock && tBlock.dataset.block !== moved.id) { at = to.blocks.findIndex(b => b.id === tBlock.dataset.block); if (!above(tBlock)) at++; }
        to.blocks.splice(at, 0, moved);
        if (!from.blocks.length) from.blocks.push(newBlock());
    } else {
        const tCard = e.target.closest('.sb-card'); if (!tCard || tCard.dataset.card === d.cardId) { clearSbMarks(); return; }
        const ci = doc.cards.findIndex(c => c.id === d.cardId);
        const [moved] = doc.cards.splice(ci, 1);
        let at = doc.cards.findIndex(c => c.id === tCard.dataset.card); if (!above(tCard)) at++;
        doc.cards.splice(at, 0, moved);
    }
    touch(doc); clearSbMarks(); rerenderSynop(doc);
});
