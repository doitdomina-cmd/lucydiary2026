name: Build Character Counter exe
on:
  workflow_dispatch:
  push:
    paths: ['charcounter-win/**']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller -r charcounter-win/requirements.txt
      - run: pyinstaller --onefile --windowed --name "Character Counter" charcounter-win/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Character-Counter-exe
          path: dist/Character Counter.exe
