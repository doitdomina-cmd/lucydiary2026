/* 메뉴 선택/호버 배경이 서로 붙지 않게 */
body.cozy .sb-sec{display:flex;flex-direction:column;gap:3px}
body.cozy .nav{border-radius:9px !important;padding:4px 10px !important;margin:0 !important;width:100%}
body.cozy .nav:hover{background:color-mix(in srgb,var(--text) 4%,transparent) !important}
body.cozy .nav.on,body.cozy .nav.on:hover{background:color-mix(in srgb,var(--cz-acc) 10%,transparent) !important}

/* 드림 위시: Be / Have / Do */
.dma-filter{display:flex;gap:7px;flex-wrap:wrap;margin:-2px 0 16px}
.dma-filter button{border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:99px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.dma-filter button span{color:var(--t3);font-size:11.5px}
.dma-filter button b{font-weight:600;color:var(--t3);font-size:11.5px}
.dma-filter button.on{background:var(--cz-acc);border-color:var(--cz-acc);color:#fff}
.dma-filter button.on span,.dma-filter button.on b{color:rgba(255,255,255,.85)}
.dma-kind{position:absolute;left:10px;bottom:10px;border-radius:99px;padding:3px 9px;font-size:10.5px;letter-spacing:1px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.dma-kind.k-be{background:#C98A8F}
.dma-kind.k-have{background:#B79A6E}
.dma-kind.k-do{background:#7FA394}
.wf-kind{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.wf-kind button{border:1.5px solid #EEE5E1;background:#FFFCFA;border-radius:14px;padding:10px 6px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6E6468}
.wf-kind button b{font-size:13px;letter-spacing:1.5px}
.wf-kind button span{font-size:11.5px;color:#A39A9E}
.wf-kind button.on.k-be{border-color:#C98A8F;background:#FBF0F1;color:#9A5E64}
.wf-kind button.on.k-have{border-color:#B79A6E;background:#F8F2E8;color:#7F6640}
.wf-kind button.on.k-do{border-color:#7FA394;background:#EEF5F1;color:#4F7466}
body.cozy .app .dma-kind,body.cozy .app .wf-kind button b{font-weight:600 !important}
@media(max-width:768px){.dma-filter button span{display:none}}

/* 드림보드 ↔ 나의 라이프 연결 */
.ar-dreams{display:flex;flex-wrap:wrap;gap:6px}
.ar-dream{border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.ar-dream.on{background:var(--cz-acc,var(--accent));border-color:var(--cz-acc,var(--accent));color:#fff}
.la-dream{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--cz-soft,var(--al));color:var(--cz-deep,var(--accent));border-radius:99px;padding:3px 10px;font-size:11.5px;cursor:pointer;margin:-4px 0 10px;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dma-goals-bar{margin-top:30px}
.dma-golife{border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.dma-goals-empty{border:1.5px dashed #E5D9D3;border-radius:18px;padding:22px;text-align:center;color:#A39A9E;font-size:13px;line-height:1.7;background:#FFFCFA}
.dma-goals-empty b{color:var(--cz-deep)}
.dma-goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dma-goal{display:flex;align-items:center;gap:13px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 14px rgba(120,80,60,.08);cursor:pointer;transition:transform .2s;min-width:0}
.dma-goal:hover{transform:translateY(-2px)}
.dma-goal-ph{width:52px;height:52px;border-radius:14px;background:#F3E9E4 center/cover no-repeat;flex-shrink:0}
.dma-goal-t{flex:1;min-width:0}
.dma-goal-n{font-size:14.5px;color:var(--text);display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dma-goal-n span{font-size:10.5px;color:var(--cz-deep);background:var(--cz-soft);border-radius:99px;padding:2px 7px;flex-shrink:0}
.dma-goal-bar{height:6px;border-radius:99px;background:#F3ECE8;margin:7px 0 5px;overflow:hidden}
.dma-goal-bar i{display:block;height:100%;border-radius:99px;background:var(--gc)}
.dma-goal-m{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#9A8F93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dma-goal-m b{color:#5E5458;flex-shrink:0}
.cz-today-be{display:inline-flex;align-items:center;gap:7px;margin-top:10px;border:0;background:rgba(255,255,255,.9);color:#4A3F42;border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px;cursor:pointer;font-family:inherit;max-width:100%}
.cz-today-be em{font-style:normal;background:#C98A8F;color:#fff;border-radius:99px;padding:2px 8px;font-size:10px;letter-spacing:1px}
.cz-today-be span{color:var(--cz-deep);font-size:11.5px}
body.cozy .app .dma-goal-n,body.cozy .app .dma-goal-m b{font-weight:600 !important}

.dma-life{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px;margin-top:9px;font-size:11.5px;color:var(--cz-deep)}
.dma-life b{font-size:11.5px}
.dma-life-bar{flex:1 0 100%;height:5px;border-radius:99px;background:#F3ECE8;overflow:hidden}
.dma-life-bar i{display:block;height:100%;border-radius:99px;background:var(--cz-acc)}
.wf-goal{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;margin-top:14px;border:1.5px dashed #E5D3CB;background:#FFFAF7;border-radius:14px;padding:11px 14px;cursor:pointer;font-family:inherit;text-align:left}
.wf-goal b{font-size:13.5px;color:var(--cz-deep)}
.wf-goal span{font-size:11.5px;color:#A39A9E}
.wf-goal.on{border-style:solid;background:var(--cz-soft)}

/* 연간 대시보드 화면 */
.ly-page{max-width:1100px;margin:0 auto}
.ly-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ly-back{border:0;background:transparent;color:var(--cz-deep,var(--accent));font-size:13.5px;cursor:pointer;font-family:inherit;padding:4px 0}
.ly-yr{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text)}
.ly-yr button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--t2);cursor:pointer;font-size:16px;line-height:1}
.ly-page .rp{gap:18px}
.ly-page .rp-hero{padding:26px 28px 24px}
.ly-page .rp-big{font-size:36px}
.ly-page .rp-two{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ly-page .rp-mb{height:120px;max-width:26px}
.ly-page .rp-cols{gap:18px}
@media(max-width:768px){.ly-page .rp-big{font-size:28px}.ly-page .rp-mb{height:80px}}
/* 코지: 가계부 설정 */
.lds-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:22px;padding:22px 24px;margin-bottom:18px;background:linear-gradient(135deg,var(--cz-soft),var(--cz-paper) 70%);position:relative;overflow:hidden}
.lds-head::after{content:'';position:absolute;right:-18px;top:-18px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--cz-acc) 10%,transparent)}
.lds-kick{font-size:10.5px;letter-spacing:1.8px;color:var(--cz-muted)}
.lds-head h2{margin:5px 0 4px;font-size:22px;letter-spacing:-.5px;color:var(--text)}
.lds-head p{margin:0;font-size:12.5px;color:var(--t3)}
.lds-pills{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.lds-pills span{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 14px;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.lds-pills em{font-style:normal;font-size:10.5px;color:var(--t3)}
.lds .card{border:0 !important;border-radius:20px !important;box-shadow:0 3px 14px rgba(120,80,60,.07) !important;padding:20px !important}
.lds .ct{font-size:15px !important}
.lds .inp{border-radius:12px !important;background:var(--cz-paper) !important;border-color:var(--border) !important}
.lds .g2>.card>div[style*="margin-bottom:10px"]{background:var(--cz-paper);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px !important}
.lds .card>div[style*="border-bottom:1px solid var(--border)"]{border-bottom:1px dashed var(--border) !important}
.lds div[style*="background:var(--s2);border-radius:8px;padding:10px"]{background:var(--cz-paper) !important;border-radius:14px !important;padding:12px !important;border:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.lds span[style*="border-radius:99px"]{background:var(--surface) !important;border-color:var(--cz-line) !important;padding:3px 10px !important;color:var(--t2)}
.lds .btn.bg.bsm{border-radius:99px !important}
@media(max-width:900px){.lds div[style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr !important}}
body.cozy .app .lds-head h2{font-weight:600 !important}
.lds .bi[style*="color:var(--red)"]{color:var(--t3) !important;opacity:.7}
.lds .bi[style*="color:var(--red)"]:hover{color:var(--red) !important;opacity:1}

/* 코지: 프로젝트 상세 */
body.cozy .pjh .cz-ph{height:230px}
.pjh::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,25,20,0) 20%,rgba(40,25,20,.62));pointer-events:none;z-index:1}
.pjh-in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 24px;color:#fff;pointer-events:none}
.pjh-in>*{pointer-events:auto}
.pjh-goal{border:0;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;letter-spacing:.2px}
.pjh-in h1{margin:8px 0 10px;font-size:28px;letter-spacing:-.7px;line-height:1.2;color:#fff;max-width:calc(100% - 90px)}
.pjh-pills{display:flex;gap:7px;flex-wrap:wrap}
.pjh-pills span{background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:99px;padding:4px 11px;font-size:12px}
.pjh-pills span.on{background:rgba(255,255,255,.92);color:var(--cz-deep)}
.pjh-bar{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:12px;max-width:420px}
.pjh-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.pjh-bar b{position:absolute;right:-44px;top:-5px;font-size:12px}
.pjh .cz-ph-btns{top:12px;bottom:auto;z-index:3}
body.cozy .app .pjh-in h1{font-weight:600 !important}
body.cozy .pj-slot .card{padding:20px !important}
body.cozy .pj-slot .ch{margin-bottom:12px}
body.cozy .pj-slot .ch .btn{background:var(--surface) !important;color:var(--cz-deep) !important;border:1px solid var(--cz-line) !important;border-radius:99px !important;box-shadow:none !important;padding:4px 12px !important;font-size:12px !important}
body.cozy .pj-slot .ch .btn:hover{background:var(--cz-soft) !important}
body.cozy .pj-slot .empty{padding:16px 12px !important;font-size:12.5px !important;color:var(--t3);background:var(--cz-paper);border:1.5px dashed var(--cz-line);border-radius:14px}
body.cozy .pj-slot .empty .ei{display:none}
body.cozy .pj-slot [style*="border-bottom:1px solid var(--border)"]{border-bottom:1px dashed var(--cz-line) !important}
@media(max-width:768px){body.cozy .pjh .cz-ph{height:210px}.pjh-in{padding:16px 18px}.pjh-in h1{font-size:22px}.pjh-bar{margin-right:48px}}
.pj-rzbar{display:flex;align-items:center;gap:10px;margin-top:7px}
.pj-rzbar>div{flex:1;height:6px;border-radius:99px;background:var(--s2);overflow:hidden;max-width:360px}
.pj-rzbar i{display:block;height:100%;border-radius:99px}
.pj-rzbar span{font-size:11px;color:var(--t3);white-space:nowrap}

/* 드림보드 제목: 세리프 */
body.cozy .app .dm-head h1.dm-serif,body.cozy .app .dm-head h1.dm-serif *{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif !important;font-weight:400 !important;text-transform:none !important}
.dm-head h1.dm-serif{font-size:52px;line-height:1;letter-spacing:-.5px;margin:2px 0 6px}
.dm-head h1.dm-serif em{font-style:italic;color:var(--cz-deep)}
body.cozy .app .dm-head .dm-eye{font-weight:500 !important;letter-spacing:3px;font-size:11px;color:var(--t3)}
@media(max-width:768px){.dm-head h1.dm-serif{font-size:42px}}
body.cozy .app .dm-head .dm-eye-love{font-family:'Instrument Serif',Georgia,serif !important;font-style:italic;font-weight:400 !important;letter-spacing:.2px !important;font-size:16px !important;text-transform:none;color:var(--t3);margin-bottom:2px}

/* 오늘: 다음 루틴 칩 + 모바일 순서 */
.cz-today-next{display:inline-flex;align-items:center;gap:7px;margin:10px 6px 0 0;border:0;background:rgba(255,255,255,.9);color:#4A3F42;border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px;cursor:pointer;font-family:inherit;max-width:100%}
.cz-today-next em{font-style:normal;background:var(--cz-acc);color:#fff;border-radius:99px;padding:2px 8px;font-size:10px;letter-spacing:1px}
.cz-today-next span{color:var(--t3);font-size:11.5px}
@media(max-width:768px){
  body.cozy .today-wrap{display:flex !important;flex-direction:column}
  body.cozy .today-wrap>.td-grid{order:1;width:100%;min-width:0}
  body.cozy .today-wrap>.td-rt-col{width:100%;min-width:0}
  body.cozy .today-wrap>.td-rt-col{order:2}
  body.cozy .td-grid>.pj-slot[data-card="todo"]{order:1}
  body.cozy .td-grid>.pj-slot[data-card="stats"]{order:2}
  body.cozy .td-grid>.pj-slot[data-card="deadlines"]{order:3}
  body.cozy .td-grid>.pj-slot[data-card="monthlyGoal"]{order:4}
  body.cozy .td-grid>.pj-slot{order:5}
}

/* 코지 Today 새 구성 */
.td-cz{margin-top:4px}
.td-more{margin-top:14px}
.td-more-btn{display:block;width:100%;margin:16px 0 0;border:1.5px dashed var(--cz-line);background:var(--cz-paper);color:var(--t2);border-radius:16px;padding:12px;font-size:13px;cursor:pointer;font-family:inherit}
.tdr-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tdr-h .ct{margin:0}
.tdr-c{font-size:11.5px;color:var(--t3);background:var(--s2);border-radius:99px;padding:3px 10px}
.tdr-empty{font-size:12.5px;color:var(--t3);padding:14px;text-align:center;background:var(--cz-paper);border-radius:14px;line-height:1.6}
.tdr-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.tdr-row:hover{background:var(--cz-paper)}
.tdr-row.cur{background:var(--cz-soft)}
.tdr-cb{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--cz-mid);flex-shrink:0;position:relative}
.tdr-row.done .tdr-cb{background:var(--cz-acc);border-color:var(--cz-acc)}
.tdr-row.done .tdr-cb::after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tdr-t{font-size:12.5px;color:var(--cz-deep);width:42px;flex-shrink:0;font-variant-numeric:tabular-nums}
.tdr-n{font-size:14px;color:var(--text);flex:1;min-width:0}
.tdr-n em{font-style:normal;font-size:9.5px;letter-spacing:1px;background:var(--cz-acc);color:#fff;border-radius:99px;padding:2px 7px;margin-left:7px;vertical-align:2px}
.tdr-row.done .tdr-n{color:var(--t3);text-decoration:line-through}
.tdr-miss{font-size:11.5px;color:var(--t3);margin:6px 10px 0}
.tdr-more{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--cz-deep);font-size:12.5px;cursor:pointer;font-family:inherit}
.tdr-full{margin-top:12px}
.tdw-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--cz-line);cursor:pointer}
.tdw-row:last-child{border-bottom:0}
.tdw-n{flex:1;min-width:0;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdw-dots{display:flex;gap:4px;flex-shrink:0}
.tdw-dots i{width:10px;height:10px;border-radius:50%;background:var(--s3)}
.tdw-dots i.on{background:var(--wc)}
.tdw-dots i.fu{background:transparent;border:1.5px dashed var(--border2);box-sizing:border-box}
.tdw-dots i.td{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--cz-mid)}
.tdw-row b{font-size:12px;color:var(--t2);width:38px;text-align:right;flex-shrink:0;font-weight:500}
.tdu-row{display:flex;align-items:center;gap:11px;padding:8px 2px;cursor:pointer;border-bottom:1px dashed var(--cz-line)}
.tdu-row:last-child{border-bottom:0}
.tdu-d{width:38px;flex-shrink:0;text-align:center;background:var(--cz-paper);border-radius:11px;padding:4px 0;font-size:14px;line-height:1.1;color:var(--text)}
.tdu-d small{display:block;font-size:9px;color:var(--cz-muted);letter-spacing:.5px}
.tdu-t{flex:1;min-width:0;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdu-k{font-size:10px;border-radius:99px;padding:2px 7px;margin-right:6px;background:var(--s2);color:var(--t2)}
.tdu-k.k-do{background:#EEF5F1;color:#4F7466}.tdu-k.k-dl{background:var(--cz-soft);color:var(--cz-deep)}.tdu-k.k-hs{background:#FBEFF0;color:#A0606A}
.tdu-row b{font-size:11.5px;color:var(--t2);background:var(--s2);border-radius:99px;padding:3px 9px;white-space:nowrap;font-weight:500}
.tdu-row b.hot{background:var(--cz-acc);color:#fff}

/* 코지 Today: PC 왼쪽 작은 데일리 루틴 (보기 전용) */
.td-cz-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.td-side{position:sticky;top:12px}
.td-main{min-width:0}
.td-main .td-cz{margin-top:0}
.tdl{padding:16px 14px !important}
.tdl .ct{font-size:14.5px !important}
.tdl-list{position:relative;display:flex;flex-direction:column}
.tdl-list::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1.5px;background:var(--cz-line)}
.tdl-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;position:relative;font-size:12.5px}
.tdl-dot{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--cz-mid);box-sizing:border-box;flex-shrink:0;position:relative;z-index:1;align-self:center}
.tdl-row.done .tdl-dot{background:var(--cz-acc);border-color:var(--cz-acc)}
.tdl-row.cur .tdl-dot{box-shadow:0 0 0 3px var(--cz-soft)}
.tdl-t{width:36px;flex-shrink:0;color:var(--t3);font-variant-numeric:tabular-nums;font-size:11.5px}
.tdl-n{flex:1;min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdl-row.done .tdl-n{color:var(--t3);text-decoration:line-through}
.tdl-row.cur .tdl-n,.tdl-row.cur .tdl-t{color:var(--cz-deep)}
.tdl-go{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--t3);font-size:11.5px;cursor:pointer;font-family:inherit}
@media(min-width:1101px){.tdr-more,.tdr-full{display:none !important}.td-cz>.pj-slot[data-card="rt"]{display:none !important}}
@media(max-width:1100px){.td-cz-wrap{display:block}.td-side{display:none}}
/* 코지 Today 꾸미기 */
.cz-season{margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.5);letter-spacing:.5px;opacity:.95}
.td-cz{gap:20px !important}
.td-cz-wrap{gap:20px !important}
body.cozy .td-cz-wrap .card{border:0 !important;border-radius:24px !important;box-shadow:0 2px 14px rgba(120,80,60,.055) !important}
.tdk{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:19px;color:var(--text);display:flex;align-items:baseline;gap:7px;letter-spacing:-.2px}
.tdk em{font-style:italic;font-size:14px;color:var(--cz-muted)}

@media(max-width:768px){body.cozy .cz-today{min-height:150px}body.cozy .cz-today-in{padding:18px 18px 16px}.cz-season{display:block;margin:4px 0 0;padding:0;border:0}.cz-today-next,.cz-today-be{margin-top:8px}}

/* 코지 로드맵: 세로 여정 */
.rj{position:relative;display:flex;flex-direction:column;gap:14px;padding:4px 0 10px}
.rj::before{content:'';position:absolute;left:103px;top:18px;bottom:30px;border-left:2px dashed var(--cz-line)}
.rj-item{display:grid;grid-template-columns:84px 40px minmax(0,1fr);align-items:start;position:relative}
.rj-item.dragging{opacity:.4}
.rj-item.drag-over .rj-card{box-shadow:0 0 0 2px var(--cz-mid) !important}
.rj-year{font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1;color:var(--text);text-align:right;padding-top:14px;letter-spacing:-.3px}
.rj-year em{display:block;font-size:13px;color:var(--cz-deep);margin-top:2px}
.rj-item.past .rj-year{color:var(--t3)}
.rj-mark{display:flex;justify-content:center;padding-top:16px;position:relative;z-index:1}
.rj-mark span{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--cz-mid);display:grid;place-items:center;font-size:11px;color:#fff;box-shadow:0 0 0 4px var(--bg)}
.rj-item.past .rj-mark span{background:var(--cz-mid)}
.rj-item.now .rj-mark span{background:var(--cz-acc);border-color:var(--cz-acc);width:26px;height:26px;font-size:13px}
.rj-card{position:relative;display:block;width:100%;text-align:left;font-family:inherit;background:var(--surface);border:0;border-radius:22px;padding:18px 20px;box-shadow:0 3px 14px rgba(120,80,60,.07);cursor:grab;transition:transform .2s,box-shadow .2s}
.rj-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(120,80,60,.11)}
.rj-item.now .rj-card{background:var(--cz-soft)}
.rj-card h3{margin:0;font-size:16px;letter-spacing:-.3px;color:var(--text);padding-right:56px}
.rj-sub{font-size:12.5px;color:var(--cz-deep);margin-top:4px}
.rj-card p{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--t2);white-space:pre-line}
.rj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rj-tag{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--cz-paper);border:1px solid var(--cz-line);color:var(--t2)}
.rj-btns{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.rj-card:hover .rj-btns{opacity:1}
.rj-btns button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--t3);cursor:pointer;display:grid;place-items:center;font-size:16px}
.rj-btns button:hover{background:var(--s2)}
.rj-item.small .rj-year{font-size:20px;padding-top:10px}
.rj-item.small .rj-mark{padding-top:10px}
.rj-item.small .rj-mark span{width:14px;height:14px;font-size:0}
.rj-item.small .rj-card{background:transparent;box-shadow:none;border:1.5px dashed var(--cz-line);padding:12px 16px}
.rj-item.small .rj-card h3{font-size:14px}
.rj-add .rj-mark span{border-style:dashed;color:var(--cz-muted);font-size:14px;background:var(--surface)}
.rj-add .rj-card{background:transparent;box-shadow:none;border:1.5px dashed var(--cz-line);color:var(--cz-muted);font-size:13px;cursor:pointer;text-align:center;padding:14px}
body.cozy .app .rj-card h3{font-weight:600 !important}
@media(hover:none){.rj-btns{opacity:.7}}
@media(max-width:768px){.rj::before{left:67px}.rj-item{grid-template-columns:52px 32px minmax(0,1fr)}.rj-year{font-size:22px}.rj-item.small .rj-year{font-size:16px}.rj-card{padding:15px 16px}}
/* 창이 화면보다 길면 창 안에서 스크롤 (폰 주소창 높이까지 고려) */
.md{max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
@media(max-width:768px){.mo{align-items:flex-end;padding:8px}.md{max-height:calc(100dvh - 16px)}}
/* 감사 일기 사진 칸: 사진이 보이게 (글자는 흰 띠 위에) */

/* 코지: 건강 상태 관리 카드 */
.cz-hide{}

body.cozy .cond-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr)) !important;gap:12px !important}
body.cozy .cond-card{aspect-ratio:auto !important;min-height:112px;background:var(--surface) !important;border:1px solid var(--cz-line);border-radius:18px !important;align-items:flex-start !important;justify-content:flex-start !important;text-align:left !important;padding:16px 16px 14px !important;gap:6px !important;box-shadow:0 2px 10px rgba(120,80,60,.05);overflow:hidden}
body.cozy .cond-card::before{content:'';position:absolute;left:0;top:0;right:0;height:5px;background:var(--cc);opacity:.55}
body.cozy .cond-card::after{content:'♡';position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--cb);color:var(--cc);display:grid;place-items:center;font-size:13px}
body.cozy .cond-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(120,80,60,.1)}
body.cozy .cond-card-title{font-size:15px !important;color:var(--text) !important;letter-spacing:-.3px;margin-top:36px}
body.cozy .app .cond-card-title{font-weight:600 !important}
body.cozy .cond-card-cat{font-size:11px !important;background:var(--cb) !important;color:var(--cc) !important;opacity:1 !important;padding:2px 9px !important}
body.cozy .app .cond-card-cat{font-weight:500 !important}
body.cozy .cond-card-rec{font-size:11px !important;color:var(--t3) !important;opacity:1 !important}

body.cozy .app .cond-card>div[style*="position:absolute;top:6px;right:6px"]{font-weight:600 !important}
@media(max-width:640px){body.cozy .cond-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}body.cozy .cond-card{padding:14px !important}body.cozy .cond-card::after{left:14px;top:14px}body.cozy .cond-card-title{font-size:14px !important}}

/* 코지: 프로젝트 목표 스토리 줄 */
.pjs{margin:0 -4px 14px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pjs::-webkit-scrollbar{display:none}
.pjs-row{display:flex;gap:14px;padding:4px 4px 6px;width:max-content}
.pjs-item{border:0;background:transparent;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;width:78px;position:relative;padding:0}
.pjs-ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(var(--cz-acc) calc(var(--p,0)*1%),var(--cz-line) 0);box-sizing:border-box;transition:transform .2s}
.pjs-item:hover .pjs-ring{transform:translateY(-2px)}
.pjs-ph{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--cz-soft) center/cover no-repeat;border:3px solid var(--bg);box-sizing:border-box;color:var(--cz-deep);font-size:20px}
.pjs-item.on .pjs-ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cz-acc)}
.pjs-n{font-size:12px;line-height:1.3;color:var(--t2);text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.pjs-item.on .pjs-n{color:var(--text)}
.pjs-c{position:absolute;top:0;right:2px;min-width:20px;height:20px;border-radius:99px;background:var(--surface);color:var(--cz-deep);font-size:11px;display:grid;place-items:center;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pjs-add .pjs-ring{background:transparent;border:2px dashed var(--cz-line)}
.pjs-add .pjs-ph{background:var(--surface);border:0;font-size:24px;color:var(--cz-muted)}
.pjs-sel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 16px;padding:12px 16px;border-radius:16px;background:var(--cz-soft)}
.pjs-sel b{font-size:14.5px;color:var(--text);margin-right:2px}
.pjs-sel span{font-size:11.5px;color:var(--cz-deep);background:var(--surface);border-radius:99px;padding:3px 9px}
.pjs-sel button{margin-left:auto;border:0;background:transparent;color:var(--cz-deep);font-size:12px;cursor:pointer;font-family:inherit}
body.cozy .app .pjs-item.on .pjs-n,body.cozy .app .pjs-sel b{font-weight:600 !important}
@media(max-width:768px){.pjs-row{gap:10px}.pjs-item{width:68px}.pjs-ring{width:62px;height:62px}}
body.cozy .td-cz-wrap [data-card="diary"] .card{background:var(--cz-paper) !important;background:color-mix(in srgb,var(--cz-soft) 70%,var(--surface)) !important}
body.cozy .td-cz-wrap [data-card="diary"] textarea{background-color:transparent !important}

/* 프로젝트 추가 카드 */
.pjx-en{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:14px;color:var(--cz-muted,var(--t3));margin-right:7px;font-weight:400 !important}
.pjx-c{font-size:11.5px;color:var(--t3);background:var(--s2);border-radius:99px;padding:3px 10px}
.pjx-empty{font-size:12.5px;color:var(--t3);padding:14px 12px;text-align:center;background:var(--cz-paper,var(--s2));border:1.5px dashed var(--cz-line,var(--border));border-radius:14px;line-height:1.6}
.pjx-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--cz-line,var(--border))}
.pjx-row.done .pjx-tx{color:var(--t3);text-decoration:line-through}
.pjx-cb{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--cz-mid,var(--border2));cursor:pointer;flex-shrink:0;position:relative}
.pjx-cb.on{background:var(--cz-acc,var(--accent));border-color:var(--cz-acc,var(--accent))}
.pjx-cb.on::after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.pjx-tx{flex:1;min-width:0;font-size:13.5px;color:var(--text)}
.pjx-btn{border:1px solid var(--cz-line,var(--border));background:var(--surface);color:var(--cz-deep,var(--accent));border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.pjx-tag{font-size:11px;color:var(--t3);white-space:nowrap}
.pjx-x{border:0;background:transparent;color:var(--t3);cursor:pointer;font-size:16px;padding:0 4px;opacity:.6}

.pjx-sel{margin-top:10px;border-radius:12px !important;font-size:13px}
.pjx-m{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pjx-ml{font-size:12px;color:var(--t3)}
.pjx-mv{font-size:28px;letter-spacing:-.6px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2}
.pjx-mv small{font-size:13px;color:var(--t3);margin-left:3px}
.pjx-ms{font-size:11.5px;color:var(--t3)}
.pjx-mp{font-size:20px;color:var(--cz-deep,var(--accent))}
.pjx-bar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;margin:10px 0 6px}
.pjx-bar i{display:block;height:100%;border-radius:99px;background:var(--cz-acc,var(--accent))}
.pjx-spark{width:100%;height:70px;display:block;margin-top:6px}
.pjx-add{display:flex;gap:8px;margin-top:10px}
.pjx-add .inp{flex:1;min-width:0}
.pjx-note{font-size:11.5px;color:var(--t3);margin-top:8px}
.pjx-logadd{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pjx-logadd .inp{flex:1;min-width:0}
.pjx-ph{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1.5px dashed var(--cz-line,var(--border));display:grid;place-items:center;font-size:10.5px;color:var(--t3);cursor:pointer;overflow:hidden;background:var(--cz-paper,var(--s2))}

.pjx-logs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.pjx-log-ph{display:block;position:relative;aspect-ratio:4/3;background:center/cover no-repeat}

.pjx-log-b{padding:8px 10px 10px}
.pjx-log-d{font-size:11px;color:var(--cz-muted,var(--t3))}

.pjx-log .pjx-x{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.85);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0}
.pjx-more{display:block;margin:10px auto 0;border:0;background:transparent;color:var(--cz-deep,var(--accent));font-size:12.5px;cursor:pointer;font-family:inherit}
.pjx-rvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pjx-rvl{font-size:12px;color:var(--cz-deep,var(--accent));margin-bottom:5px}

.pjx-past{margin-top:12px;font-size:12.5px;color:var(--t2)}

.lda-t{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:18px;color:var(--text);display:flex;align-items:baseline;gap:7px}
.lda-t em{font-style:italic;font-size:13.5px;color:var(--cz-muted)}
.lda-c{font-size:11.5px;color:var(--t3);background:var(--s2);border-radius:99px;padding:3px 10px}
.lda-gn{display:flex;align-items:baseline;gap:10px}
.lda-gn b{font-size:30px;color:var(--cz-deep);letter-spacing:-.6px}
.lda-gn span{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.lda-bar{height:10px;border-radius:99px;background:var(--s2);overflow:hidden;margin:10px 0 14px}
.lda-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cz-mid),var(--cz-acc))}
.lda-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lda-facts>div{background:var(--cz-paper);border-radius:14px;padding:10px 12px;min-width:0}
.lda-facts small{display:block;font-size:11px;color:var(--t3)}
.lda-facts b{display:block;font-size:14.5px;color:var(--text);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lda-empty{display:flex !important;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed var(--cz-line) !important;background:var(--cz-paper) !important;box-shadow:none !important;cursor:pointer;font-family:inherit;font-size:14px;color:var(--cz-deep);text-align:center}
.lda-empty span{font-size:12px;color:var(--t3)}
.lda-note{font-size:12.5px;color:var(--t3);line-height:1.6}
.lda-svg{width:100%;height:90px;display:block}
.lda-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin:4px 0 6px}
.lda-mixb{display:flex;align-items:center;gap:18px}
.lda-donut{width:110px;height:110px;border-radius:50%;flex-shrink:0;position:relative;display:grid;place-items:center}
.lda-donut::before{content:'';position:absolute;inset:18px;border-radius:50%;background:var(--surface)}
.lda-donut span{position:relative;font-size:20px;color:var(--text);text-align:center;line-height:1}
.lda-donut small{display:block;font-size:10px;color:var(--t3);margin-top:2px}
.lda-leg{flex:1;min-width:0;max-width:240px;display:flex;flex-direction:column;gap:6px}
.lda-leg div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2)}
.lda-leg i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lda-leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lda-leg b{color:var(--text);font-weight:500}
.lda-al{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--cz-line)}
.lda-al:last-child{border-bottom:0}
.lda-ic{width:30px;height:30px;border-radius:50%;background:var(--cz-soft);color:var(--cz-deep);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.lda-al>div{flex:1;min-width:0}
.lda-al b{display:block;font-size:13.5px;color:var(--text);font-weight:500}
.lda-al small{font-size:11px;color:var(--t3)}
.lda-al em{font-style:normal;font-size:11.5px;color:var(--t2);background:var(--s2);border-radius:99px;padding:3px 9px;white-space:nowrap}
.lda-al em.hot{background:var(--cz-acc);color:#fff}
.lda-dr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:10px 0;border-bottom:1px dashed var(--cz-line);cursor:pointer}
.lda-dr:last-child{border-bottom:0}
.lda-dr b{display:block;font-size:13.5px;color:var(--text);font-weight:500}
.lda-dr small{display:block;font-size:11.5px;color:var(--t3);margin-top:2px}
.lda-dv{text-align:right}
.lda-dv b{color:var(--red)}
.ld-arow:hover{background:var(--cz-paper)}
/* 목표 코치 */
.gt-row{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:0;background:transparent;padding:10px 4px;border-bottom:1px dashed var(--cz-line);cursor:pointer;font-family:inherit}
.gt-row:last-child{border-bottom:0}
div.gt-row{cursor:default}
.lda .gt,.ld-tips .gt{margin:0 !important}
.gt-ic{width:30px;height:30px;border-radius:50%;background:var(--cz-soft);color:var(--cz-deep);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.gt-b{flex:1;min-width:0}
.gt-b b{display:block;font-size:13.5px;color:var(--text);line-height:1.5;font-weight:500}
.gt-b small{display:block;font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.5}
body.cozy .app .gt-b b,body.cozy .app .lda-al b,body.cozy .app .lda-dr b{font-weight:500 !important}
@media(max-width:768px){.lda{grid-template-columns:1fr}.lda-goal{grid-column:auto}.lda-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 가계부 설정 코지 */
.lds .lds-t{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:18px !important;color:var(--text);display:flex;align-items:baseline;gap:7px;margin-bottom:14px !important}
.lds .lds-t em{font-style:italic;font-size:13.5px;color:var(--cz-muted)}
body.cozy .app .lds .lds-t{font-weight:400 !important}
.lds-bn{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lds-bn>div{font-size:.9em;color:var(--text)}
.lds-bn small{font-size:11px;color:var(--t3)}
.lds-bn small b.ov{color:var(--red);font-weight:500}
.lds-bb{display:block;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:2px}
.lds-bb u{display:block;height:100%;border-radius:99px;background:var(--cz-mid)}
.lds-bb.hi u{background:var(--cz-acc)}
.lds-bb.ov u{background:var(--red)}
.lds-acc{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--cz-line)}
.lds-acc-ic{width:32px;height:32px;border-radius:11px;background:var(--cz-soft);color:var(--cz-deep);display:grid;place-items:center;flex-shrink:0}
.lds-acc-ic .czi{width:17px;height:17px}
.lds .ld-hero{margin-bottom:18px}
.lds .g2>.card>div[style*="margin-bottom:10px"]{padding:10px 8px 10px 14px !important}
.lds .btn.bsm[style*="var(--rl)"]{border-radius:99px !important}
.lds .btn.bp.bsm,.lds label.btn.bsm{border-radius:99px !important}

/* 전체 설정 코지 */
.czs .card{border:0 !important;border-radius:22px !important;box-shadow:0 3px 14px rgba(120,80,60,.07) !important;padding:20px 22px !important}
.czs .ld-hero{margin-bottom:18px}
.czs input[type=checkbox]{accent-color:var(--cz-acc)}
.czs .czs-t{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:18px !important;color:var(--text);display:flex;align-items:baseline;gap:7px}
.czs .czs-t em{font-style:italic;font-size:13.5px;color:var(--cz-muted)}
body.cozy .app .czs .czs-t{font-weight:400 !important}
.czs .card-style-option,.czs .font-opt,.czs button[onclick^="setFont("],.czs button[onclick^="setLogoFont"],.czs button[onclick^="setMarker"]{border-radius:16px !important}
.czs .btn.bg.bsm{border-radius:99px !important;background:var(--cz-paper) !important}

/* 로드맵: 시점 옆 작은 카드 */
.rj-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;min-width:0}
.rj-row>.rj-card{flex:0 1 380px;width:auto;min-width:0}
.rj-kid{position:relative;flex:0 0 200px;min-width:0;background:var(--cz-paper);border-radius:18px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(120,80,60,.05)}
.rj-kid::before{content:'';position:absolute;left:-12px;top:26px;width:12px;border-top:2px dashed var(--cz-line)}
.rj-kid:not(.rj-kid-add){align-self:flex-start}
.rj-kid:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(120,80,60,.1)}
.rj-kid:hover .rj-btns{opacity:1}
.rj-kid .rj-btns{top:6px;right:6px}
.rj-kid-y{font-family:'Instrument Serif',Georgia,serif;font-size:14px;font-style:italic;color:var(--cz-muted)}
.rj-kid b{font-size:14px;color:var(--text);font-weight:500;padding-right:22px;word-break:keep-all}
.rj-kid small{font-size:12px;color:var(--cz-deep)}
.rj-kid p{margin:2px 0 0;font-size:12px;line-height:1.55;color:var(--t2);white-space:pre-line}
body.cozy .app .rj-kid b{font-weight:500 !important}
.rj-kid-add{flex:0 0 72px;border:1.5px dashed var(--cz-line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--cz-muted);font-family:inherit;font-size:12px;opacity:.55}
.rj-kid-add .czi{width:16px;height:16px}
.rj-item:hover .rj-kid-add,.rj-kid-add:focus{opacity:1}
.rj-kid-add:hover{color:var(--cz-deep);border-color:var(--cz-mid)}
.rj-kid-add::before{display:none}
@media(max-width:768px){.rj-row{flex-direction:column;gap:8px}.rj-row>.rj-card{flex:none;width:100%}.rj-kid{flex:none;margin-left:16px}.rj-kid::before{left:-12px;top:-8px;bottom:50%;width:10px;height:auto;border-top:0;border-left:2px dashed var(--cz-line);border-bottom:2px dashed var(--cz-line);border-bottom-left-radius:8px}.rj-kid-add{flex-direction:row;gap:4px;padding:5px 12px;opacity:.8;align-self:flex-start !important;border-radius:99px;font-size:11.5px}.rj-kid-add .czi{width:13px;height:13px}.rj-kid-add span{display:none}.rj-kid-add::after{content:'작은 카드 추가'}}
@media(hover:none){.rj-kid-add{opacity:1}}

/* MEMORIES */
.mem .ld-hero{margin-bottom:18px}
.mem .card{border:0 !important;border-radius:22px !important;box-shadow:0 3px 14px rgba(120,80,60,.07) !important;padding:18px 20px !important}
.mem-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mem-t{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:18px;color:var(--text);display:flex;align-items:baseline;gap:7px}
.mem-t em{font-style:italic;font-size:13.5px;color:var(--cz-muted)}
.mem-c{font-size:11.5px;color:var(--t3);background:var(--s2);border-radius:99px;padding:3px 10px}
.mem-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.mem-mo{display:flex;flex-direction:column;align-items:center;gap:4px}
.mem-mo span{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--cz-line);display:grid;place-items:center;font-size:12px;color:#fff}
.mem-mo.on span{background:var(--cz-acc);border:0}
.mem-mo.cur span{box-shadow:0 0 0 3px var(--cz-soft)}
.mem-mo.cur:not(.on) span{border-color:var(--cz-acc)}
.mem-mo.fut span{opacity:.5}
.mem-mo small{font-size:10.5px;color:var(--t3)}
.mem-mo.cur small{color:var(--cz-deep)}
.mem-ynote{font-size:12.5px;color:var(--t2);margin-top:12px}
.mem-fl{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px;align-items:center}
.mem-fl button{border:0;background:var(--s2);color:var(--t2);border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.mem-fl button.on{background:var(--cz-acc);color:#fff}
.mem-fl button.pp{background:var(--cz-paper);border:1px solid var(--cz-line)}
.mem-fl button.pp.on{background:var(--cz-deep);color:#fff;border-color:var(--cz-deep)}
.mem-fl-sep{width:1px;height:18px;background:var(--cz-line);margin:0 4px}
.mem-gh{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:20px;color:var(--text);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.mem-gh span{font-family:inherit;font-size:11px;color:var(--t3);background:var(--s2);border-radius:99px;padding:2px 8px}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mem-card{border:0;padding:0;text-align:left;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 3px 14px rgba(120,80,60,.07);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.mem-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(120,80,60,.12)}
.mem-ph{aspect-ratio:4/3;background:var(--cz-soft) center/cover no-repeat;position:relative}
.mem-ph span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px}
.mem-ph.none{display:grid;place-items:center;background:linear-gradient(135deg,var(--cz-soft),var(--cz-paper))}
.mem-ph.none i{font-style:normal;font-size:30px;color:var(--cz-deep);opacity:.6}
.mem-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mem-k{font-size:11px;color:var(--cz-muted)}
.mem-b b{font-size:14.5px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-b small{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-pp{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.mem-pp span{font-size:11px;color:var(--cz-deep);background:var(--cz-soft);border-radius:99px;padding:2px 8px}
.mem-pp.big span{font-size:12px;padding:3px 10px}
body.cozy .app .mem-b b{font-weight:500 !important}
.mem-empty{width:100%;margin-top:18px;border:1.5px dashed var(--cz-line);background:var(--cz-paper);border-radius:22px;padding:34px 20px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;font-family:inherit;color:var(--cz-deep)}
.mem-empty b{font-size:15px}
.mem-empty span{font-size:12.5px;color:var(--t3)}
.mem-none{padding:30px;text-align:center;color:var(--t3);font-size:13px}
.mem-v{display:flex;flex-direction:column;gap:10px}
.mem-vph{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.mem-vph.n1{grid-template-columns:1fr}
.mem-vph a{display:block;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--s2)}
.mem-vph.n1 a{aspect-ratio:auto;max-height:60vh}
.mem-vph img{width:100%;height:100%;object-fit:cover;display:block}
.mem-vk{font-size:12.5px;color:var(--t3)}
.mem-vt{margin:0;font-size:14px;line-height:1.75;color:var(--text);white-space:pre-line}
.mem-fph{display:flex;flex-wrap:wrap;gap:8px}
.mem-th{width:76px;height:76px;border-radius:14px;background:var(--s2) center/cover no-repeat;position:relative}
.mem-th button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;cursor:pointer;line-height:1;font-size:14px}
.mem-th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed var(--cz-line);background:var(--cz-paper);cursor:pointer;color:var(--cz-deep);font-size:10.5px}
.mem-th.add .czi{width:18px;height:18px}
.mem-kinds{display:flex;flex-wrap:wrap;gap:6px}
.mem-kinds button{border:1px solid var(--border);background:var(--surface);color:var(--t2);border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.mem-kinds button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mem-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:6px}
.mem-strip button{aspect-ratio:1;border:0;border-radius:18px;background:var(--cz-soft) center/cover no-repeat;position:relative;cursor:pointer;overflow:hidden;font-family:inherit;padding:0}
.mem-strip button span{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-size:11.5px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.5));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-strip button.more{background:var(--cz-paper);border:1.5px dashed var(--cz-line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cz-deep)}
.mem-strip button.more b{font-size:22px}
.mem-strip button.more span{position:static;background:none;color:var(--t3);padding:0;font-size:11px}
.mem-lb{display:flex;gap:14px;align-items:center;cursor:pointer}
.mem-lb-ph{width:84px;height:84px;border-radius:16px;background:var(--s2) center/cover no-repeat;flex-shrink:0}
.mem-lb-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.mem-lb-b b{font-size:15px;color:var(--text);font-weight:500}
.mem-lb-b small{font-size:12px;color:var(--t3)}
@media(max-width:768px){.mem-fl-sep{display:none}.mem-months{grid-template-columns:repeat(6,minmax(0,1fr));row-gap:10px}.mem-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mem-b{padding:10px 11px 12px}.mem-b b{font-size:13.5px}}

/* 식품 정리 코지 */
.spz-day,.spz-cal{border:0 !important;border-radius:22px !important;box-shadow:0 3px 14px rgba(120,80,60,.07) !important;padding:20px 22px !important;margin-bottom:14px !important}
.spz-empty{font-size:13px;color:var(--t3);text-align:center;background:var(--cz-paper) !important}
.spz-dh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spz-t{font-family:'Instrument Serif',Georgia,'Noto Serif KR',serif;font-size:19px;color:var(--text);display:flex;align-items:baseline;gap:7px}
.spz-t em{font-style:italic;font-size:13.5px;color:var(--cz-muted)}
.spz-msg{font-size:12.5px;color:var(--t2);margin-top:4px}
.spz-ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--cz-acc) calc(var(--p)*1%),var(--cz-soft) 0);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;gap:1px}
.spz-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.spz-ring b,.spz-ring small{position:relative;line-height:1}
.spz-ring b{font-size:18px;color:var(--text)}
.spz-ring small{font-size:10px;color:var(--t3)}
.spz-back{border:0;background:var(--s2);border-radius:99px;padding:4px 12px;font-size:11.5px;color:var(--t2);cursor:pointer;margin-top:10px;font-family:inherit}
.spz-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
.spz-g{background:var(--cz-paper);border-radius:16px;padding:12px 14px}
.spz-g.all{background:color-mix(in srgb,var(--cz-soft) 60%,var(--surface))}
.spz-gh{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);margin-bottom:9px}
.spz-gh em{font-style:normal;font-size:11px;color:var(--t3);background:var(--surface);border-radius:99px;padding:1px 8px}
.spz-g.all .spz-gh em{background:var(--cz-acc);color:#fff}
.spz-gh button{margin-left:auto;border:0;background:none;color:var(--cz-deep);font-size:11px;cursor:pointer;font-family:inherit}
.spz-ic{width:24px;height:24px;border-radius:50%;background:var(--cz-soft);color:var(--cz-deep);display:inline-grid;place-items:center;font-size:12px;flex-shrink:0}
.spz-chips{display:flex;flex-wrap:wrap;gap:6px}
.spz-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pb);background:var(--surface);color:var(--text);border-radius:99px;padding:5px 12px 5px 6px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.spz-chip small{font-size:10.5px;color:var(--t3)}
.spz-cb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--pc);display:inline-grid;place-items:center;font-size:10px;color:#fff;flex-shrink:0}
.spz-chip.on{background:var(--pb);color:var(--pc)}
.spz-chip.on .spz-cb{background:var(--pc)}
.spz-chip.on small{color:var(--pc);opacity:.7}
.spz-ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.spz-ch button{width:30px;height:30px;border-radius:50%;border:0;background:var(--s2);color:var(--t2);cursor:pointer;font-size:15px}
.spz-dn,.spz-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.spz-dn span{font-size:11px;color:var(--t3);padding-bottom:4px}
.spz-d{border:0;background:none;padding:2px 0;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.spz-mr{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--cz-acc) calc(var(--p)*1%),var(--cz-soft) 0);display:grid;place-items:center;position:relative}
.spz-mr::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.spz-mr b{position:relative;font-size:12.5px;font-weight:500;color:var(--text)}

function phHash(str){

// 클라우드에 아직 없는 사진을 올린다. 올리지 못한 사진 번호 집합을 돌려준다
async function phEnsureCloud(chunks){
  await phIndex();
  var uid=phUid(), need=new Map(), failed=new Set();
  JSON.stringify(chunks, function(k,v){ if(phIsData(v)){ var id=phReg(v); if(!PH.upKeys.has('s|'+uid+'|'+id)) need.set(id,v); return ''; } return v; });
  var ids=Array.from(need.keys()), i=0, firstErr='';
  var worker=async function(){
    while(i<ids.length){
      var id=ids[i++], d=need.get(id);
      if(PH.failAt[id] && Date.now()-PH.failAt[id] < 5*60*1000){ failed.add(id); continue; }   // 방금 실패한 사진은 5분 쉬었다가 다시
      if(d.length > 6*1024*1024){ failed.add(id); continue; }                                 // 규칙의 5MB 한도
      if(!fbStorage){ failed.add(id); if(!firstErr) firstErr='storage-unavailable'; continue; }
      try{
        await withTimeout(fbStorage.ref('users/'+uid+'/photos/'+id).putString(d,'data_url'), 60000, '사진 올리기');
        PH.upKeys.add('s|'+uid+'|'+id); delete PH.failAt[id];
        phTx('u','readwrite',function(os){ return os.put(1, 's|'+uid+'|'+id); });
      }catch(e){ failed.add(id); PH.failAt[id]=Date.now(); if(!firstErr) firstErr=(e&&(e.code||e.message))||'오류'; console.warn('사진 클라우드 올리기 실패',id,e); }
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  if(need.size && !PH.sizeWarned){ try{ var stt=phStats(); if(stt.bytes>=600*1048576){ PH.sizeWarned=true; upMsg('⚠ 사진이 약 '+(stt.bytes/1048576).toFixed(0)+'MB 쌓였어요. 폰에서 느려질 수 있어요 (설정 → 사진 보관 현황)', false); } }catch(e){} }
  if(failed.size && firstErr && !PH.warned){ PH.warned=true; try{ upMsg('⚠ 사진 '+failed.size+'장을 클라우드에 못 올렸어요 ('+firstErr+') · 이 기기에는 저장돼 있어요', false); }catch(e){} }
  return failed;
}
// 서랍 하나를 클라우드용 글자로: 올라간 사진은 자리표시자로, 못 올린 사진은 (한도 안이면) 예전처럼 그대로 넣는다
function phCloudStringify(val, failed){
  var run=function(inlineFailed){ return JSON.stringify(val, function(k,v){ if(phIsData(v)){ var id=phReg(v); return (inlineFailed && failed.has(id)) ? v : PH_PRE+id; } return v; }); };
  var j = failed.size ? run(true) : run(false);
  if(failed.size && j.length > 850*1024) j = run(false);
  return j;
}
// 클라우드에서 사진 한 장 받기: Storage 먼저, 없으면 예전 Firestore 문서
async function phCloudGet(uid,id){
  if(fbStorage){
    try{
      var url=await withTimeout(fbStorage.ref('users/'+uid+'/photos/'+id).getDownloadURL(), 20000, '사진 주소');
      var blob=await withTimeout(fetch(url).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.blob(); }), 30000, '사진 받기');
      var d=await new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res(fr.result); }; fr.onerror=rej; fr.readAsDataURL(blob); });
      PH.upKeys.add('s|'+uid+'|'+id); phTx('u','readwrite',function(os){ return os.put(1,'s|'+uid+'|'+id); });
      return d;
    }catch(e){ if(!(e&&e.code==='storage/object-not-found')) console.warn('Storage에서 사진 받기 실패', id, e); }
  }

// 자리표시자를 진짜 사진으로 되돌린다 (이 기기 보관소 → 없으면 클라우드)
async function phHydrate(root){
  PH.done=false;
  var refs=[];
  (function walk(o){
    if(!o||typeof o!=='object') return;
    var ks = Array.isArray(o) ? o.map(function(_,i){ return i; }) : Object.keys(o);
    for(var i=0;i<ks.length;i++){ var k=ks[i], x=o[k];
      if(phIsPH(x)) refs.push([o,k,x.slice(x.indexOf('#fs:')+4)]); else if(x&&typeof x==='object') walk(x); }
  })(root);
  if(!refs.length){ PH.done=true; return 0; }
  await phIndex();
  var ids=Array.from(new Set(refs.map(function(r){ return r[2]; }))), got={}, i=0, uid=phUid();
  var worker=async function(){
    while(i<ids.length){
      var id=ids[i++], d=PH.mem[id];
      if(!d){ var rec=await phTx('p','readonly',function(os){ return os.get(id); }); d = rec&&rec.d || null; }
      if(!d && uid){
        try{ d = await phCloudGet(uid,id); }catch(e){ console.warn('사진 받기 실패',id,e); }
        if(d){ phTx('p','readwrite',function(os){ return os.put({id:id,d:d,at:Date.now()}); }).then(function(ok){ if(ok) PH.inIdb.add(id); }); }
      }
      if(d){ got[id]=d; PH.mem[id]=d; PH.idMap.set(d,id); }
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  var n=0; refs.forEach(function(r){ var d=got[r[2]]; if(d){ r[0][r[1]]=d; n++; } });
  PH.done=true; return n;
}

// 클라우드에 마지막으로 쓴 서랍 내용 — 바뀐 서랍만 다시 쓰기 위한 기준
var _cloudBase = {}, _cloudBaseUid = '';
async function saveToCloud(data) {
  if (!currentUser) return;
  _lastCloudSaveData = data;
  showSaveIndicator('loading');
  try {
    if (_cloudBaseUid !== currentUser.uid) { _cloudBase = {}; _cloudBaseUid = currentUser.uid; }
    const chunks = chunkData(data);
    const failed = await phEnsureCloud(chunks);            // 1) 새 사진 먼저 올리기
    const batch = db.batch(), base = {};
    let n = 0;
    Object.entries(chunks).forEach(([key, val]) => {        // 2) 바뀐 서랍만 쓰기
      const json = phCloudStringify(val, failed);
      if (_cloudBase[key] === json) return;
      batch.set(db.collection('users').doc(currentUser.uid).collection('data').doc(key), { value: json, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      base[key] = json; n++;
    });
    if (n) { await batch.commit(); Object.assign(_cloudBase, base); }
    showSaveIndicator('ok');
  } catch(e) {
    console.error('Cloud save error:', e);
    showSaveIndicator('err');
  }
}
function retryCloudSave(){
  if(_lastCloudSaveData) saveToCloud(_lastCloudSaveData);
}
let _saveIndTimer=null;
function showSaveIndicator(state){
  var el=document.getElementById('save-ind');
  if(!el)return;
  clearTimeout(_saveIndTimer);
  if(state==='loading'){
    el.className='save-ind show loading';
    el.textContent='☁ 저장 중…';
    el.onclick=null;
  } else if(state==='ok'){
    el.className='save-ind show ok';
    el.textContent='☁ 저장 완료';
    el.onclick=null;
    _saveIndTimer=setTimeout(function(){ el.classList.remove('show'); },2000);
  } else if(state==='err'){
    el.className='save-ind show err';
    el.textContent='⚠ 저장 실패 · 탭해서 재시도';
    el.onclick=retryCloudSave;
  }
}

async function loadFromCloud() {
  if (!currentUser) return null;
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('data').get();
    if (snap.empty) return null;
    const merged = {};
    let latestUpdatedAt = 0;
    _cloudBase = {}; _cloudBaseUid = currentUser.uid;
    snap.forEach(doc => {
      try { merged[doc.id] = JSON.parse(doc.data().value); _cloudBase[doc.id] = doc.data().value; } catch(e) {}
      try {
        const ts = doc.data().updatedAt;
        const ms = ts && ts.toMillis ? ts.toMillis() : 0;
        if(ms > latestUpdatedAt) latestUpdatedAt = ms;
      } catch(e) {}
    });
    const result = mergeChunks(merged);
    result._cloudUpdatedAt = latestUpdatedAt;
    return result;
  } catch(e) { console.error('Cloud load error:', e); return null; }
}

// 큰 데이터를 필드별로 나눠서 저장 (Firestore 1MB 제한 대응)
function chunkData(data) {
  const FIELDS = ['routines','checks','projects','deadlines','savings','notes','calEvents',
    'lifeGoal','theme','customThemeColor','projectCardStyle','diaryEntries','monthlyGoals','monthlyMemo',
    'weeklyGoals','weeklyMemo','diaryStickers','font','fontSize','fontWeight','customFonts','logoFont','navMarker','todayLayout','todayCardVis',
    'lifeAreas','dream','memories','todoList','todoListTmr','timeline','timelineTitle','tlFontScaleBig','tlFontScaleSmall','tlLineLenBig','tlLineLenSmall','tlTextColor','bgIntensity','diaryFont'];
  const chunks = {};
  FIELDS.forEach(f => { if (data[f] !== undefined) chunks[f] = data[f]; });
  // customFontData는 Firestore 용량 초과 → 저장 제외 (localStorage에만)
  // 사진은 saveToCloud가 '사진 보관소'로 따로 올리고 서랍에는 자리표시자만 남긴다.
  // 나머지 소형 데이터
  const rest = {};
  Object.keys(data).forEach(k => {
    if (!FIELDS.includes(k) && k !== 'customFontData') rest[k] = data[k];
  });
  if (Object.keys(rest).length > 0) chunks['_misc'] = rest;
  return chunks;
}
function mergeChunks(chunks) {
  const result = {};
  Object.entries(chunks).forEach(([k, v]) => {
    if (k === '_misc') Object.assign(result, v);
    else result[k] = v;
  });
  return result;
}

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function todStr(){return dateStr(new Date());}
function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function todLabel(){
  const d=new Date(),days=['일','월','화','수','목','금','토'];
  return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. ('+days[d.getDay()]+')';
}
function fmtDateObj(s){
  const d=new Date(s+'T00:00:00');
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return {month:M[d.getMonth()],monthNum:(d.getMonth()+1),day:d.getDate()};
}
// 년/월/일 스택형 날짜 뱃지 (월은 진하게, 일은 굵게 강조)
function dateBadgeHtml(dateStr){
  var f=fmtDateObj(dateStr),yr=dateStr.slice(0,4);

    '<div style="font-size:1.3em;font-weight:900;color:var(--text);line-height:1.1">'+f.day+'</div>'+

}
function dLeft(s){const n=new Date();n.setHours(0,0,0,0);return Math.ceil((new Date(s+'T00:00:00')-n)/86400000);}
function money(n){if(!n)return '0원';if(n>=10000){const manwon=n/10000;const formatted=manwon%1===0?manwon.toLocaleString():manwon.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g,',');return formatted+'만원';}return n.toLocaleString()+'원';}
function addDays(dateS, d){const dt=new Date(dateS+'T00:00:00');dt.setDate(dt.getDate()+d);return dateStr(dt);}
function dowOf(dateS){return new Date(dateS+'T00:00:00').getDay();} // 0=sun..6=sat

function routinesForDate(ds){
  const dow = DOWS[dowOf(ds)];
  const dt = new Date(ds+'T00:00:00');
  const dayOfMonth = dt.getDate();
  const lastDayOfMonth = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  return S.routines.filter(function(r){
    // 특정 날짜만 건너뛰기(그 날짜에서만 삭제) 처리된 항목은 제외
    if(r.skipDates && r.skipDates.indexOf(ds)!==-1) return false;
    // 루틴화(프로젝트 연동) 항목은 시작일~등록 마감일 범위 안에서만 표시
    if(r.isRz){
      if(r.startDate && ds<r.startDate) return false;
      if(r.until && ds>r.until) return false;
    }
    // 매월 루틴: 선택한 날짜(또는 말일)에만 표시
    if(r.isMonthly){
      const mdays = r.monthDays || [];
      if(mdays.includes('last') && dayOfMonth===lastDayOfMonth) return true;
      return mdays.includes(dayOfMonth);
    }
    // 매주/매일 루틴: 요일로 필터
    return !r.days || r.days.length===0 || r.days.includes(dow);
  });
}

function go(p, pid, _fromPopstate){
  page=p; activePid=pid||null; if(p!=='projects') pjFilter='';
  if(p==='health'&&S.health) S.health.tab='summary';
  // 브라우저 히스토리에 상태 추가 (popstate로 인한 호출이 아닐 때만)
  if(!_fromPopstate){
    const state={page:p,pid:pid||null};
    const url='#'+p+(pid?'/'+pid:'');
    history.pushState(state,'',(p==='today'&&!pid)?window.location.pathname:url);
  }
  document.querySelectorAll('.nav').forEach(e=>e.classList.remove('on'));
  const n=document.getElementById('nav-'+(p==='dreamArea'?'dream':p==='ledgerYear'?'ledger':p));
  if(n) n.classList.add('on');
  const tbTitle=document.getElementById('tb-title');
  const topbar=document.querySelector('.topbar');
  const isMobile=window.innerWidth<=768;
  const hideTopbarPages=['memories','settings','dream','dreamArea','ledger','today','calendar','todocal','diary','deadlines','health','savings','routine','insights'];

  // 모바일에서는 항상 탑바 표시, 데스크탑에서만 hideTopbarPages 적용
  if(!isMobile && hideTopbarPages.includes(p)){
    if(topbar) topbar.style.display='none';
  } else {
    if(topbar) topbar.style.display='';
  }

  // 플로팅 햄버거는 항상 숨김 (모바일 탑바로 대체)
  const fhbg=document.getElementById('float-hbg');
  if(fhbg) fhbg.style.display='none';

  const tbDate=document.getElementById('tb-date');
  if(pid){
    const proj=S.projects.find(x=>x.id===pid)||{name:'프로젝트'};
    const area=(S.lifeAreas||[]).find(a=>a.id===proj.lifeAreaId);
    const colorDot='<span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+(proj.color||'#999')+';margin-right:6px;vertical-align:middle;flex-shrink:0"></span>';
    const areaBadge=area?'<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:0.78em;font-weight:500;background:'+area.color+'18;color:'+area.color+';margin-left:8px;vertical-align:middle">'+(area.emoji?area.emoji+' ':'')+area.name+'</span>':'';
    tbTitle.innerHTML=colorDot+proj.name+areaBadge;
    // 날짜 자리에 수정 버튼
    if(tbDate){
      tbDate.innerHTML='<span class="'+(window._pjEditMode?'':'hov-btns')+'"><button class="btn bg bsm" onclick="openPjEditModal(\''+pid+'\')" style="font-family:var(--sans)">✏️ 수정</button><button class="btn '+(window._pjEditMode?'bp':'bg')+' bsm" onclick="togglePjLayoutEdit(\''+pid+'\')" style="font-family:var(--sans)">'+(window._pjEditMode?'✓ 편집 완료':'⚙ 레이아웃')+'</button></span>';
      tbDate.style.fontFamily='var(--sans)';
    }
  } else {
    tbTitle.textContent=titles[p]||'';
    if(tbDate){
      tbDate.style.fontFamily='';
      if(p==='today'){
        tbDate.innerHTML='';
        tbDate.textContent=todLabel();
      } else {
        tbDate.innerHTML='';
        tbDate.textContent=todLabel();
      }
    }
  }
  render(); closeSB();
}

// 사진: 긴 쪽 1200px로 줄여서 저장 (로그인 중이면 클라우드에 올리고 주소만 남김)
function compressDreamPhoto(file){
  return new Promise(function(resolve,reject){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1200/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
        var ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(u);
        var d='';try{d=c.toDataURL('image/webp',0.72);}catch(e){}
        if(!d||d.indexOf('data:image/webp')!==0){try{d=c.toDataURL('image/jpeg',0.8);}catch(e){d='';}}
        d?resolve(d):reject(new Error('사진을 줄이지 못했어요.'));
      }catch(e){URL.revokeObjectURL(u);reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(u);reject(new Error('사진을 읽지 못했어요.'));};
    img.src=u;
  });
}

// ═══════════ 구글 드라이브 백업 ═══════════
// 드라이브의 '루시의 스페이스' 폴더에 전체 백업(JSON)을 쌓고 최근 10개만 남김.
// 권한은 이 앱이 만든 파일만 다루는 drive.file → 처음 만든 폴더를 '백업' 폴더 안으로 직접 옮겨도 폴더 id로 계속 찾아감.
// 드라이브 권한은 구글 창을 거친 뒤 약 55분만 유지돼서, 그동안 바뀐 게 있으면 1시간마다 저절로 백업하고
// 하루 넘게 백업이 없으면 '지금 백업' 알림을 띄움 (권한 창은 버튼을 눌러야 열 수 있음)
var LSD_SCOPE='https://www.googleapis.com/auth/drive.file',LSD_FOLDER='루시의 스페이스',LSD_KEEP=10;
var lsd={token:null,busy:false};
function lsdMeta(){try{return JSON.parse(localStorage.getItem('lucy_drive_meta')||'{}')||{};}catch(e){return {};}}
function lsdSetMeta(m){try{localStorage.setItem('lucy_drive_meta',JSON.stringify(m));}catch(e){}}
function lsdKeep(cred){if(!cred||!cred.accessToken)return;lsd.token={t:cred.accessToken,exp:Date.now()+55*60*1000};try{sessionStorage.setItem('lucy_drive_token',JSON.stringify(lsd.token));}catch(e){}}
function lsdToken(){var tk=lsd.token;if(!tk)try{tk=JSON.parse(sessionStorage.getItem('lucy_drive_token')||'null');}catch(e){}return tk&&tk.exp>Date.now()?tk.t:null;}
function lsdProvider(){var p=new firebase.auth.GoogleAuthProvider();p.addScope(LSD_SCOPE);return p;}
try{auth.getRedirectResult().then(function(r){if(r&&r.credential)lsdKeep(r.credential);}).catch(function(){});}catch(e){}
async function lsdEnsureToken(){
  if(lsdToken())return lsdToken();
  if(!auth.currentUser){alert('먼저 구글로 로그인해 주세요.');return null;}
  try{var r=await auth.currentUser.reauthenticateWithPopup(lsdProvider());lsdKeep(r.credential);}
  catch(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){auth.currentUser.reauthenticateWithRedirect(lsdProvider());return null;}
    if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('구글 드라이브 권한을 받지 못했어요. '+(e.message||''));
  }

}
async function lsdFetch(url,opt){
  opt=opt||{};var tk=lsdToken();if(!tk)throw Object.assign(new Error('드라이브 권한이 끝났어요'),{code:'no-token'});
  var r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tk},opt.headers||{})}));
  if(r.status===401){lsd.token=null;try{sessionStorage.removeItem('lucy_drive_token');}catch(e){}throw Object.assign(new Error('드라이브 권한이 끝났어요'),{code:'no-token'});}
  if(!r.ok){var t=await r.text();throw new Error(r.status===403&&/accessNotConfigured|has not been used|disabled/i.test(t)?'Google Drive API가 꺼져 있어요.':'드라이브 오류 '+r.status);}
  return r.status===204?null:r.json();

async function lsdFolder(){
  var m=lsdMeta();
  if(m.folder){try{var f=await lsdFetch('https://www.googleapis.com/drive/v3/files/'+m.folder+'?fields=id,trashed');if(f&&!f.trashed)return m.folder;}catch(e){if(e.code==='no-token')throw e;}}
  var q=encodeURIComponent("name='"+LSD_FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  var found=await lsdFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&spaces=drive');
  var id=found.files&&found.files.length?found.files[0].id:null;
  if(!id){var made=await lsdFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:LSD_FOLDER,mimeType:'application/vnd.google-apps.folder'})});id=made.id;m.fresh=true;}
  m.folder=id;lsdSetMeta(m);return id;
}
// '루시의 스페이스' 폴더 안의 하위 폴더(예: '추억 사진')를 찾거나 만든다
async function lsdSubFolder(name){
  var m=lsdMeta();m.sub=m.sub||{};
  if(m.sub[name]){try{var f=await lsdFetch('https://www.googleapis.com/drive/v3/files/'+m.sub[name]+'?fields=id,trashed');if(f&&!f.trashed)return m.sub[name];}catch(e){if(e.code==='no-token')throw e;}}
  var parent=await lsdFolder();
  var q=encodeURIComponent("name='"+name+"' and '"+parent+"' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false");
  var found=await lsdFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)');
  var id=found.files&&found.files.length?found.files[0].id:null;
  if(!id){var made=await lsdFetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});id=made.id;}
  m=lsdMeta();m.sub=m.sub||{};m.sub[name]=id;lsdSetMeta(m);return id;
}
// 사진 원본(파일 그대로)을 드라이브 '추억 사진' 폴더에 올리고 파일 id를 돌려준다
// 선명하게 줄이기: 긴 변 2560px · JPEG 0.88 (폰 사진 5~12MB → 대략 0.5~2MB). 이미 작은 JPEG는 그대로 올린다
function lsdSharpen(file){
  return new Promise(function(resolve){
    if(!file||!/^image\//.test(file.type||'')||/gif|svg/.test(file.type)){resolve({blob:file,name:null});return;}
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){try{
      var w=img.naturalWidth,h=img.naturalHeight,LONG=2560;
      if(!w||!h||(Math.max(w,h)<=LONG&&file.type==='image/jpeg'&&file.size<=2*1024*1024)){URL.revokeObjectURL(u);resolve({blob:file,name:null});return;}
      var sc=Math.min(1,LONG/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      var x=c.getContext('2d',{alpha:false});if(x.imageSmoothingQuality!==undefined)x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){resolve(b?{blob:b,name:'jpg'}:{blob:file,name:null});},'image/jpeg',0.88);
    }catch(e){URL.revokeObjectURL(u);resolve({blob:file,name:null});}};
    img.onerror=function(){URL.revokeObjectURL(u);resolve({blob:file,name:null});};
    img.src=u;
  });
}
async function lsdUploadOriginal(file,fileName,sub){
  var sh=await lsdSharpen(file);file=sh.blob;if(sh.name)fileName=fileName.replace(/\.[A-Za-z0-9]+$/,'')+'.jpg';
  var folder=await lsdSubFolder(sub||'추억 사진'),bd='lucy'+Date.now()+Math.random().toString(36).slice(2,8);
  var meta=JSON.stringify({name:fileName,parents:[folder]});
  var body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: '+(file.type||'application/octet-stream')+'\r\n\r\n',file,'\r\n--'+bd+'--']);

function lsdSig(){var s=JSON.stringify([S,LD]),h=0;for(var i=0;i<s.length;i+=7)h=(h*31+s.charCodeAt(i))>>>0;return s.length+':'+h;}
async function lsdBackupNow(){
  await PH.ready;
  var folder=await lsdFolder(),d=new Date(),p2=function(n){return String(n).padStart(2,'0');};
  var name='루시의스페이스_백업_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'-'+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+'.json';
  var bd='lucy'+Date.now();
  var body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:name,parents:[folder],mimeType:'application/json'})+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+lsdPayload()+'\r\n--'+bd+'--';
  await lsdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body});
  // 정리 대상은 '루시의스페이스_백업_…json' 파일만 (같은 폴더 안의 '추억 사진' 폴더는 건드리지 않는다)
  var q=encodeURIComponent("'"+folder+"' in parents and trashed=false and mimeType='application/json' and name contains '루시의스페이스_백업_'");
  var list=await lsdFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy=createdTime%20desc&fields=files(id)&pageSize=100');
  var fs=(list&&list.files)||[];for(var i=LSD_KEEP;i<fs.length;i++){try{await lsdFetch('https://www.googleapis.com/drive/v3/files/'+fs[i].id,{method:'DELETE'});}catch(e){}}
  var m=lsdMeta();m.at=Date.now();m.sig=lsdSig();m.name=name;lsdSetMeta(m);
  return name;
}
async function lsdBackupClick(){
  if(lsd.busy)return;var b=document.getElementById('lsd-btn');
  if(!await lsdEnsureToken())return;
  lsd.busy=true;if(b){b.disabled=true;b.textContent='백업하는 중…';}
  try{await lsdBackupNow();lsdToast('드라이브에 백업했어요 ✓');}catch(e){lsdToast('백업하지 못했어요. '+(e.message||''));}
  lsd.busy=false;if(page==='settings')render();
}
async function lsdAuto(){
  if(lsd.busy||!lsdToken()||typeof currentUser==='undefined'||!currentUser)return;
  var m=lsdMeta();if(m.at&&Date.now()-m.at<60*60*1000)return;if(m.sig&&m.sig===lsdSig())return;
  lsd.busy=true;try{await lsdBackupNow();}catch(e){if(e.code!=='no-token')console.warn('드라이브 백업 실패',e);}lsd.busy=false;
}

function render(){
  // 가계부 월별 막대 차트 툴팁: 터치 기기에서는 mouseout이 안 불려서 다른 페이지로 이동해도
  // 화면에 계속 떠 있는 경우가 있어, 화면이 다시 그려질 때마다 무조건 닫아준다
  if(typeof hideLedgerTip==='function')hideLedgerTip();
  const el=document.getElementById('main');
  // 현재 페이지를 body class로 반영 (페이지별 레이아웃 예외 처리용)
  document.body.className=document.body.className.replace(/\bpage-\S+/g,'').trim()+' page-'+page+((page==='projects'&&activePid)?' pj-detail':'');
  const div=document.createElement('div');
  div.className='pc'+(page==='timeline'?' pc-wide':'');
  if(page==='dream') div.innerHTML=renderDream();
  else if(page==='dreamArea') div.innerHTML=renderDreamArea();
  else if(page==='memories') div.innerHTML=renderMemories();
  else if(page==='today') div.innerHTML=renderToday();
  else if(page==='diary') div.innerHTML=renderDiary();
  else if(page==='routine') div.innerHTML=renderRoutinePage();
  else if(page==='calendar') div.innerHTML=renderCalendar();
  else if(page==='todocal') div.innerHTML=renderTodoCal();
  else if(page==='life') div.innerHTML=renderLife();
  else if(page==='projects') div.innerHTML=activePid?renderPjDetail(activePid):renderProjects();
  else if(page==='deadlines') div.innerHTML=renderDeadlines();
  else if(page==='savings') div.innerHTML=renderSavings();
  else if(page==='health') div.innerHTML=renderHealth();
  else if(page==='overview') div.innerHTML=renderOverview();
  else if(page==='settings') div.innerHTML=renderSettings();
  else if(page==='ledger') div.innerHTML=renderLedger();
  else if(page==='ledgerYear') div.innerHTML=renderLedgerYear();
  else if(page==='insights') div.innerHTML=renderInsights();
  else if(page==='timeline') div.innerHTML=renderTimeline();
  el.innerHTML=''; el.appendChild(div);
  updateSB();
  
  // Event Delegation
  setTimeout(function(){
    // 루틴 카드 날짜 이동 버튼 - 이벤트 위임으로 중복 방지
    document.querySelectorAll('[data-rcnav]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        e.preventDefault();
        var v=this.dataset.rcnav;
        if(v==='0'){resetView();}
        else{shiftView(parseInt(v));}
      },{once:true});
    });
    document.querySelectorAll('.mini-cal-cell').forEach(function(el){
      el.addEventListener('click',function(){
        window.diaryDate=this.dataset.ds;
        go('diary');
      });
    });
    var cp=document.getElementById('custom-color-picker');
    if(cp){
      cp.addEventListener('input',function(){
        S.customThemeColor=this.value;
        S.theme='custom';
        save();
        applyTheme('custom');
        var preview=document.querySelector('[data-theme-preview="custom"]');
        if(preview) preview.style.background='linear-gradient(135deg,'+this.value+','+this.value+')';
      });
    }
    document.querySelectorAll('.diary-cell').forEach(function(el){
      el.addEventListener('click',function(){
        openDiaryModal(this.dataset.ds);
      });
    });
    // 투두 입력창 이벤트 바인딩 (draggable 버그 우회)
    document.querySelectorAll('[data-todo-input="1"]').forEach(function(inp){
      function handleEnter(e){
        if(e.key==='Enter'||e.keyCode===13){
          e.preventDefault(); e.stopPropagation();
          addTodoInline(inp.dataset.ds, inp.id);
        }
      }
      inp.addEventListener('keydown', handleEnter);
      inp.addEventListener('keyup', handleEnter);
      // 모바일 소프트키보드 "완료/보내기" 대응
      inp.addEventListener('input', function(e){
        if(inp.value.endsWith('\n')){
          inp.value=inp.value.replace(/\n/g,'');
          addTodoInline(inp.dataset.ds, inp.id);
        }
      });
    });
  },0);
}

function togglePjBox(){
  const wrap=document.getElementById('pj-nav-sec');
  if(!wrap)return;
  wrap.classList.toggle('collapsed');
  window._pjBoxCollapsed=wrap.classList.contains('collapsed');

function togglePjGroup(aid){
  if(!window._pjGroupCollapsed) window._pjGroupCollapsed={};
  const col=!window._pjGroupCollapsed[aid];
  window._pjGroupCollapsed[aid]=col;
  const hd=document.querySelector('.pj-group-hd[onclick*="'+aid+'"]');
  const body=document.getElementById('pjg-'+aid);
  if(!hd||!body) return;
  hd.classList.toggle('collapsed',col);
  if(col){
    body.style.maxHeight=body.scrollHeight+'px';
    requestAnimationFrame(function(){body.style.maxHeight='0';});
    body.classList.add('collapsed');
  } else {
    body.classList.remove('collapsed');
    body.style.maxHeight=body.scrollHeight+'px';
    setTimeout(function(){if(!window._pjGroupCollapsed[aid])body.style.maxHeight='none';},260);
  }
}

  const checks=S.checks[ds]||{};
  const rods=routinesForDate(ds);
  const done=rods.filter(r=>checks[r.id]).length;
  const pct=rods.length?Math.round(done/rods.length*100):0;
  const isToday=ds===todStr();

  const dt=new Date(ds+'T00:00:00');
  const dateLabel=(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+dayName+')';

  let itemsHtml='';
  if(rods.length===0){
    itemsHtml='<div class="rc-empty">이 요일 루틴이 없어요<br><small>루틴 설정에서 추가하세요</small></div>';
  } else {
    rods.forEach(r=>{

            (r.saveAmount>0?'<span style="font-size:0.72em;background:'+(isDone?'var(--green)':'var(--al)')+';color:'+(isDone?'#fff':'var(--accent)')+';padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap">💰 '+money(r.saveAmount)+'</span>':'')+
          '</div>'+
          (r.detail?'<div class="rc-detail">'+r.detail+'</div>':'')+
        '</div>'+
        (isDone?'<div style="color:var(--green);font-size:1.1429em">✓</div>':'')+
      '</div>';
    });
  }

  return '<div class="rc">'+
    '<div class="rc-head" style="display:flex;align-items:center;justify-content:space-between">'+
      '<div class="rc-head-title">데일리 루틴</div>'+

        '<button class="rc-nav-btn" data-rcnav="-1" type="button">‹</button>'+

            'style="cursor:default"')+
        '>'+dateLabel+'</div>'+
        '<button class="rc-nav-btn" data-rcnav="1" type="button">›</button>'+
      '</div>'+
    '</div>'+
    '<div class="rc-body">'+itemsHtml+'</div>'+
    (rods.length>0?'<div class="rc-progress"><div class="rc-pbar-wrap"><div class="rc-pbar" style="width:'+pct+'%"></div></div><div class="rc-pct">'+done+'/'+rods.length+'</div></div>':'')+
  '</div>';
}

function toggleCheck(rid, ds){
  if(!S.checks[ds]) S.checks[ds]={};
  const nowChecked=!S.checks[ds][rid];
  S.checks[ds][rid]=nowChecked;

  // 저축 금액이 있는 루틴이면 저축 목표에 자동 반영
  const r=(S.routines||[]).find(x=>x.id===rid);
  if(r&&r.saveAmount>0){
    if(!S.savings)S.savings={goal:0,current:0,entries:[]};
    if(!S.savings.entries)S.savings.entries=[];
    const svId='rzsave-'+rid+'-'+ds; // 루틴+날짜별 고유 ID
    const existIdx=S.savings.entries.findIndex(e=>e.id===svId);
    // 프로젝트 정보 찾기
    const proj=r.rzProjectId?(S.projects||[]).find(p=>p.id===r.rzProjectId):null;
    if(nowChecked){
      // 체크 → 저축 입금 (중복 방지)
      if(existIdx<0){
        S.savings.entries.push({id:svId,amount:r.saveAmount,note:r.task+' (루틴 달성)',date:ds,projectId:r.rzProjectId||'',projectName:proj?proj.name:''});
        S.savings.current+=r.saveAmount;
      }
    } else {
      // 체크 해제 → 저축 회수
      if(existIdx>=0){
        S.savings.current-=S.savings.entries[existIdx].amount;
        S.savings.entries.splice(existIdx,1);
      }
    }
  }
  save(); render();
}
