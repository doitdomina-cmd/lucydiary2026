<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lucy's Space</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+KR:wght@400;500;600;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&family=Sunflower:wght@300;500;700&family=Hi+Melody&family=Stylish&family=Gaegu:wght@400;700&family=Nanum+Brush+Script&family=Gamja+Flower&family=Montserrat:ital,wght@1,700;1,800&family=Dancing+Script:wght@600;700&family=Sacramento&family=Allura&family=Kaushan+Script&family=Geist+Mono:wght@300;400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FDFCFB;--surface:#FFF;--s2:#F2EFE9;--s3:#EAE6DE;
  --border:#E2DDD5;--border2:#D4CFC6;
  --text:#1C1917;--t2:#6B6560;--t3:#A39E97;
  --accent:#C17C3C;--al:#F5E8D8;
  --green:#4A7C6F;--gl:#E0EDEA;
  --red:#C14A3C;--rl:#F5DDD8;
  --r:6px;--rsm:5px;
  --sh:0 2px 6px rgba(0,0,0,.04);
  --shm:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sw:240px;
  
  /* 모든 영역(영문, 숫자 포함)을 선택한 폰트로 완벽히 통일 */
  --sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  --serif:var(--sans);
  --serif-fancy:'Instrument Serif','Noto Serif KR',serif;
  --hand:'Gaegu','Nanum Pen Script',cursive;
  --logo-font:'Montserrat','Pretendard',sans-serif;
  --mono:var(--sans);

  /* Routine card colors */
  --rc-bg:#E8F0F5;--rc-header:#80A2B4;--rc-dot:#5A9AB8;--cal-cell-bg:#F1F6F9;

  /* Goal section vars */
  --goal-bg1:#E8F4F8;--goal-bg2:#D6EAF4;
  --goal-border:#B8D9EC;--goal-text:#1a3a4a;--goal-sub:#5a8fa8;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#B8D9EC;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#cce4f0;
}
/* ── THEME: SKY (1번 테마) ── */
body.theme-sky{
  --bg:#FCFDFD;--surface:#FEFDFB;--s2:#EDF3F5;--s3:#E2EDF0;
  --border:#D3E3E8;--border2:#B8D0D8;
  --rc-bg:#FEFDFB;--rc-header:#879EA2;--rc-dot:#86A8AD;--cal-cell-bg:#FEFEFD;
  --accent:#86A8AD;--al:#E8F0F2;
  --goal-bg1:#F4F8F9;--goal-bg2:#EDF3F5;
  --goal-border:#D3E3E8;--goal-text:#2C3E42;--goal-sub:#6A868C;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#D3E3E8;
  --goal-item-bg:rgba(255,255,255,.8);--goal-item-border:#D3E3E8;
}
/* ── THEME: SAND (2번 테마 - 샌드 베이지) ── */
body.theme-sand{
  --bg:#FDFCFC;--surface:#FEFDFB;--s2:#F3EFEA;--s3:#EAE4DC;
  --border:#DFD8CE;--border2:#D1C8BC;
  --rc-bg:#F0EBE4;--rc-header:#A69E97;--rc-dot:#968A7D;--cal-cell-bg:#F6F3EF;
  --accent:#A39688;--al:#F3EFEA;
  --goal-bg1:#EFE9E2;--goal-bg2:#E6DFD6;
  --goal-border:#D1C8BC;--goal-text:#3B342C;--goal-sub:#6A6157;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#D1C8BC;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#DFD8CE;
}
/* ── THEME: PAPER (3번 테마 - 아이보리) ── */
body.theme-lightBeige{
  --bg:#FEFDFB;--surface:#FEFDFB;--s2:#F6F3EB;--s3:#EFE9DC;
  --border:#E6DFD0;--border2:#D4CDB8;
  --rc-bg:#FEFDFB;--rc-header:#B8AB90;--rc-dot:#B5A688;--cal-cell-bg:#FEFEFD;
  --accent:#A08A63;--al:#F3EEE2;
  --goal-bg1:#F6F3EB;--goal-bg2:#EFE9DC;
  --goal-border:#E6DFD0;--goal-text:#5A5040;--goal-sub:#8A7B60;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#E6DFD0;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#E6DFD0;
}
/* ── THEME: LIGHT GRAY (4번 테마 - 연한 회색) ── */
body.theme-lightGray{
  --bg:#FCFCFD;--surface:#FEFDFB;--s2:#EDEFF2;--s3:#DFE3E8;
  --border:#D0D5DB;--border2:#A8B1BC;
  --rc-bg:#FEFDFB;--rc-header:#99A1A7;--rc-dot:#A0ABB5;--cal-cell-bg:#FEFEFD;
  --accent:#A0ABB5;--al:#EAF0F5;
  --goal-bg1:#F5F6F8;--goal-bg2:#EDEFF2;
  --goal-border:#D0D5DB;--goal-text:#3E454C;--goal-sub:#7A8693;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#D0D5DB;
  --goal-item-bg:rgba(255,255,255,.8);--goal-item-border:#D0D5DB;
}
/* ── THEME: CORAL (코랄 핑크 - Royalty 느낌) ── */
body.theme-coral{
  --bg:#FCFDFD;--surface:#FEFDFB;--s2:#ECF4F3;--s3:#DDEEED;
  --border:#C5E2E1;--border2:#9BD4D1;
  --rc-bg:#DDEEED;--rc-header:#62C2BD;--rc-dot:#40B5AF;--cal-cell-bg:#EBF5F4;
  --accent:#3BB0AA;--al:#E2EEED;
  --goal-bg1:#DDEEED;--goal-bg2:#C5E2E1;
  --goal-border:#9BD4D1;--goal-text:#246B68;--goal-sub:#38A8A3;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#9BD4D1;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#C5E2E1;
}
/* ── THEME: MINT (민트 - MOSTKET 느낌) ── */
body.theme-mint{
  --bg:#FEFCFC;--surface:#FEFDFB;--s2:#FBEEEF;--s3:#F9E1E2;
  --border:#F6CACC;--border2:#F4A4A8;
  --rc-bg:#F9E1E2;--rc-header:#FFDBDD;--rc-dot:#FFD3D5;--cal-cell-bg:#FBEDEE;
  --accent:#FFD3D5;--al:#F9E6E7;
  --goal-bg1:#F9E1E2;--goal-bg2:#F6CACC;
  --goal-border:#F4A4A8;--goal-text:#993338;--goal-sub:#CB4D53;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#F4A4A8;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#F6CACC;
}
/* ── THEME: CREAM (따뜻한 크림 옐로우) ── */
body.theme-cream{
  --bg:#FCFDFC;--surface:#FEFDFB;--s2:#EEF4F0;--s3:#E0EDE5;
  --border:#CBE2D2;--border2:#A5CFB3;
  --rc-bg:#E0EDE5;--rc-header:#6FA681;--rc-dot:#4F9265;--cal-cell-bg:#ECF4EF;
  --accent:#498D60;--al:#E6EFE9;
  --goal-bg1:#E0EDE5;--goal-bg2:#CBE2D2;
  --goal-border:#A5CFB3;--goal-text:#2C593B;--goal-sub:#45875B;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#A5CFB3;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#CBE2D2;
}
/* ── THEME: OCEAN (소프트 블루) ── */
body.theme-ocean{
  --bg:#FBFCFE;--surface:#FEFDFB;--s2:#E2EDF8;--s3:#CFE0F2;
  --border:#AECAE9;--border2:#84ADDD;
  --rc-bg:#DDEAF7;--rc-header:#5E92CB;--rc-dot:#3B7AC0;--cal-cell-bg:#EBF2FA;
  --accent:#3576BE;--al:#DDEAF7;
  --goal-bg1:#CFE0F2;--goal-bg2:#AECAE9;
  --goal-border:#84ADDD;--goal-text:#1A3A5C;--goal-sub:#2D5C92;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#84ADDD;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#AECAE9;
}
/* ── THEME: LILAC (라일락 퍼플) ── */
body.theme-lilac{
  --bg:#FDFAFB;--surface:#FEFDFB;--s2:#F4E6EB;--s3:#EDD6DE;
  --border:#E3BFCB;--border2:#D496AB;
  --rc-bg:#EDD6DE;--rc-header:#C96C8B;--rc-dot:#BD4C72;--cal-cell-bg:#F4E6EB;
  --accent:#BF406A;--al:#F0DEE4;
  --goal-bg1:#EDD6DE;--goal-bg2:#E3BFCB;
  --goal-border:#D496AB;--goal-text:#632137;--goal-sub:#9D3457;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#D496AB;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#E3BFCB;
}
/* ── THEME: PEACH (피치 살구) ── */
body.theme-peach{
  --bg:#FCFDFC;--surface:#FEFDFB;--s2:#EFF5F0;--s3:#E2EEE4;
  --border:#CEE4D1;--border2:#A8D2AE;
  --rc-bg:#E2EEE4;--rc-header:#C9E8CE;--rc-dot:#BDE3C3;--cal-cell-bg:#ECF4EF;
  --accent:#BDE3C3;--al:#E9F2EA;
  --goal-bg1:#E2EEE4;--goal-bg2:#CEE4D1;
  --goal-border:#A8D2AE;--goal-text:#2E6B37;--goal-sub:#40964D;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#A8D2AE;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#CEE4D1;
}
/* ── THEME: APPLE (애플 스타일 — iOS 시스템 색상) ── */
body.theme-apple{
  --bg:#FDFDFE;--surface:#FFFFFF;--s2:#F2F2F7;--s3:#E5E5EA;
  --border:#D1D1D6;--border2:#AEAEB2;
  --rc-bg:#F2F2F7;--rc-header:#5B9BE8;--rc-dot:#007AFF;--cal-cell-bg:#FBFBFD;
  --accent:#007AFF;--al:#E8F1FE;
  --goal-bg1:#F2F2F7;--goal-bg2:#E5E5EA;
  --goal-border:#D1D1D6;--goal-text:#1C1C1E;--goal-sub:#636366;
  --goal-btn-bg:rgba(255,255,255,.6);--goal-btn-border:#D1D1D6;
  --goal-item-bg:rgba(255,255,255,.8);--goal-item-border:#D1D1D6;
  --red:#FF3B30;--green:#34C759;--blue:#007AFF;
}
/* 애플 테마: 살짝 더 둥근 카드 + 옅은 그림자 (서체는 설정에서 고른 폰트를 그대로 따름) */
body.theme-apple{
  --r:10px;--rsm:8px;
  --sh:0 1px 3px rgba(0,0,0,.06);
  --shm:0 4px 16px rgba(0,0,0,.10);
}
/* ── THEME: CHARCOAL (차분한 차콜) ── */
body.theme-charcoal{
  --bg:#FCFCFC;--surface:#FEFDFB;--s2:#ECECEE;--s3:#DEDEE1;
  --border:#C7C7CC;--border2:#A8A8AF;
  --rc-bg:#E6E6E9;--rc-header:#737379;--rc-dot:#54545C;--cal-cell-bg:#F0F0F2;
  --accent:#56565E;--al:#E6E6E9;
  --goal-bg1:#DEDEE1;--goal-bg2:#C7C7CC;
  --goal-border:#A8A8AF;--goal-text:#2A2A2E;--goal-sub:#56565E;
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:#A8A8AF;
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:#C7C7CC;
}

/* ═══ 테마 카드 디자인 통일 (구 3번 테마 기준: 둥글기 6px, 옅은 그림자) ═══ */
/* accent 색이 연해서 흰 글씨가 안 보이는 테마는 어두운 글씨로 보정 */
body.theme-mint .rc-head-title{color:#8A3338}
body.theme-mint .rc-head-date{color:rgba(138,51,56,.75)}
body.theme-mint .rc-nav-btn{color:#8A3338}
body.theme-mint .logo{color:#8A3338}
body.theme-mint .btn.bp{color:#8A3338}
body.theme-mint .rc-time{color:#C56B70}

body.theme-peach .rc-head-title{color:#2E6B37}
body.theme-peach .rc-head-date{color:rgba(46,107,55,.75)}
body.theme-peach .rc-nav-btn{color:#2E6B37}
body.theme-peach .logo{color:#2E6B37}
body.theme-peach .btn.bp{color:#2E6B37}
body.theme-peach .rc-time{color:#499568}

/* ── THEME: CUSTOM ── */
body.theme-custom{
  --bg:var(--ct-light);--surface:#FEFDFB;--s2:var(--ct-lighter);--s3:var(--ct-mid);
  --border:var(--ct-border);--border2:var(--ct-border2);
  --rc-bg:var(--ct-lighter);--rc-header:var(--ct-dark-soft);--rc-dot:var(--ct-dark);
  --accent:var(--ct-dark);--al:var(--ct-lighter);
  --goal-bg1:var(--ct-mid);--goal-bg2:var(--ct-border);
  --goal-border:var(--ct-border2);--goal-text:#1a1a1a;--goal-sub:var(--ct-dark);
  --goal-btn-bg:rgba(255,255,255,.5);--goal-btn-border:var(--ct-border);
  --goal-item-bg:rgba(255,255,255,.6);--goal-item-border:var(--ct-border);
}

html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sb{width:var(--sw);min-width:var(--sw);background:var(--s2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:100;transition:transform .3s,width .25s,min-width .25s}
/* ── 사이드바 접기 (PC): 접으면 메뉴는 완전히 사라지고, 화면 가장자리에 작은 알약 모양 손잡이만 남는다 ── */
body.sb-collapsed .sb{width:0;min-width:0;border-right:none}
/* 손잡이는 사이드바 밖에 독립적으로 떠 있는 탭 — 펼침/접힘 상태와 무관하게 항상 화면에 고정 */
.sb-collapse-btn{position:fixed;top:50%;left:var(--sw);transform:translateY(-50%);width:16px;height:64px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--border);border-left:none;border-radius:0 12px 12px 0;color:var(--t3);cursor:pointer;box-shadow:2px 2px 8px rgba(0,0,0,.08);z-index:150;transition:left .25s ease,color .15s,background .15s}
.sb-collapse-btn:hover{color:var(--accent);background:var(--s3)}
body.sb-collapsed .sb-collapse-btn{left:0}
@media(max-width:900px){ .sb-collapse-btn{display:none} }
.sb-head{height:48px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);background:var(--accent);background:color-mix(in srgb, var(--accent) 72%, white);overflow:hidden}
.logo{font-family:var(--logo-font);font-size:1.4em;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:-0.3px;font-weight:800;font-style:italic;color:#fff;line-height:1;white-space:nowrap}
.logo-dot{width:8px;height:8px;background:var(--accent);border-radius:50%}
.logo-sub{font-size:0.7857em;color:var(--t3);font-family:var(--mono);margin-top:2px}
.sb-sc{flex:0 0 auto}
.sb-sc::-webkit-scrollbar{width:3px}
.sb-sc::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sb-sec{padding:0 8px;display:flex;flex-direction:column;gap:0}
.sb-sec:first-child{padding-top:10px}
.sb-sec:last-child{padding-bottom:10px}
.sb-sec+.sb-sec{margin-top:14px}
.sb-pj-wrap{flex:1;min-height:0;display:flex;flex-direction:column;margin:6px 10px 10px;background:transparent;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sb-pj-hd{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;user-select:none;flex-shrink:0;transition:background .15s}
.sb-pj-hd:hover{background:var(--s2)}
.sb-pj-title{font-size:0.82em;font-weight:600;color:var(--t2);letter-spacing:.02em}
.sb-pj-arrow{font-size:0.9em;color:var(--t3);transition:transform .2s;display:inline-block}
.sb-pj-wrap.collapsed .sb-pj-arrow{transform:rotate(-90deg)}
.sb-pj-body{flex:1;min-height:0;overflow-y:auto;padding:6px 6px;scrollbar-width:none;-ms-overflow-style:none}
.sb-pj-wrap.collapsed{flex:0 0 auto}
.sb-pj-wrap.collapsed .sb-pj-hd{border-bottom:none}
.sb-pj-wrap.collapsed .sb-pj-body{display:none}
.sb-pj-body::-webkit-scrollbar{width:0;height:0;display:none}
.sb-lbl{font-size:0.7143em;font-weight:500;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:10px;padding:4px 10px;border-radius:var(--rsm);cursor:pointer;color:var(--t2);font-size:0.9643em;border:none;background:none;width:100%;text-align:left;transition:all .15s;font-family:var(--sans)}
.nav:hover{background:var(--s3);color:var(--text)}
.nav.on{background:var(--al);color:var(--accent);font-weight:600;position:relative}
.nav.on::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-ic{font-size:1.0714em;width:18px;text-align:center;flex-shrink:0}
.nav-bd{margin-left:auto;background:var(--accent);color:#fff;font-size:0.7143em;padding:1px 6px;border-radius:8px;font-family:var(--mono)}
.pnav{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--rsm);cursor:pointer;color:var(--t2);font-size:0.9286em;transition:all .15s}
.pnav:hover,.pnav.on{background:var(--s2);color:var(--text)}
.pdot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.pj-group-hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--rsm);cursor:pointer;color:var(--t2);font-size:0.88em;font-weight:500;transition:background .15s;user-select:none}
.pj-group-hd:hover{background:var(--s2)}
.pj-group-hd .pj-arrow{transition:transform .2s;display:inline-block;font-size:1em;color:var(--t3);flex-shrink:0;transform:rotate(90deg)}
.pj-group-hd.collapsed .pj-arrow{transform:rotate(0deg)}
.pj-group-body{overflow:hidden;transition:max-height .25s ease}
.pj-group-body.collapsed{max-height:0!important}
.pj-group-box{margin:1px 0 6px 8px;padding-left:6px;border-left:2px solid var(--border)}
.pj-group-box .pnav{padding:5px 9px;font-size:0.84em;border-radius:7px}
.pj-group-box .pnav:hover,.pj-group-box .pnav.on{background:var(--s2)}
.pj-group-box .pnav .pdot{width:6px;height:6px}
.sb-ft{padding:12px 8px;border-top:1px solid var(--border)}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}

/* ── MAIN ── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:48px;background:var(--s2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
/* 로드맵(연대기)은 PC에서 상단 헤더 줄을 숨겨 화면을 넓게 쓴다 (모바일은 메뉴 버튼이 필요하므로 유지) */
body.page-timeline .topbar,
body.page-projects:not(.pj-detail) .topbar,
body.page-life .topbar{display:none}
@media(max-width:900px){
  body.page-timeline .topbar,
  body.page-projects .topbar,
  body.page-life .topbar{display:flex}
}
.topbar .hov-btns{opacity:0;transition:opacity .15s}
.topbar:hover .hov-btns{opacity:1}
.tb-title{font-size:1em;font-weight:500}
.tb-date{font-family:var(--mono);font-size:0.7857em;color:var(--t3);margin-left:auto}
.hbg{display:none;background:none;border:none;cursor:pointer;color:var(--text);font-size:1.2857em;padding:4px}
.content{flex:1;overflow-y:auto;padding:28px 32px;background:var(--bg)}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── PAGE ── */
.ph{margin-bottom:20px}
.pt{font-family:var(--serif);font-size:2.2857em;font-weight:300;letter-spacing:-.5px;line-height:1.2}
.ps{font-size:0.9286em;color:var(--t3);margin-top:6px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pc{animation:fi .22s ease;max-width:1300px;margin:0 auto}
.pc.pc-wide{max-width:none}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct{font-size:0.9286em;font-weight:500;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ── STAT ── */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.sl{font-size:0.7857em;color:var(--t3);font-family:var(--sans);letter-spacing:.04em;font-weight:500}
.sv{font-family:var(--serif);font-size:1em;line-height:1.2;margin:4px 0 2px}
.ss{font-size:0.8571em;color:var(--t3)}

/* ── PROGRESS ── */
.pw{background:var(--s3);border-radius:8px;height:6px;overflow:hidden}
.pb{height:100%;border-radius:8px;transition:width .6s ease}
.pl{display:flex;justify-content:space-between;font-size:0.7857em;color:var(--t3);margin-top:4px;font-family:var(--mono)}

/* ── CHECK ── */
.ci{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:none;padding-bottom:0}
.ci:first-child{padding-top:0}
.cb{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.on::after{content:'✓';color:#fff;font-size:0.7143em;font-weight:600}
.ck{flex:1;font-size:0.9643em}
.ck.done{color:var(--t3);text-decoration:line-through}
.cd{font-size:0.8571em;color:var(--t3);display:block;margin-top:1px}

/* ── BTN ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rsm);font-size:0.9286em;font-family:var(--sans);border:1px solid transparent;cursor:pointer;transition:all .15s;font-weight:400;text-decoration:none}
.bp{background:var(--accent);color:#fff;border-color:var(--accent)}
.bp:hover{opacity:.9}
.bg{background:transparent;color:var(--t2);border-color:var(--border)}
.bg:hover{background:var(--s2);color:var(--text)}
.bsm{padding:5px 10px;font-size:0.8571em}

.pj-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pj-slot{min-width:0;position:relative;transition:all .2s}
.pj-slot .pj-edit-ctl{display:none;position:absolute;top:-8px;right:-4px;z-index:10;gap:4px}
.pj-editing .pj-slot{outline:2px dashed var(--border);outline-offset:2px;border-radius:var(--r)}
.pj-editing .pj-slot .pj-edit-ctl{display:flex}
.pj-editing .pj-slot[draggable=true]{cursor:grab}
.pj-editing .pj-slot.dragging{opacity:0.4}
.pj-editing .pj-slot.drag-over{outline-color:var(--accent);outline-style:solid}
.pj-ctl-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.7em;color:var(--t2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pj-ctl-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.bi{padding:6px;background:none;border:none;cursor:pointer;color:var(--t3);border-radius:6px;display:inline-flex;transition:all .15s}
.row-hov .hov-btns{opacity:0;transition:opacity .15s}
.row-hov:hover .hov-btns{opacity:1}
@media(hover:none){.row-hov .hov-btns{opacity:1}}
.bi:hover{background:var(--s2);color:var(--text)}

/* ── INPUT ── */
.inp,.ta,.sel{background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 12px;font-size:0.9643em;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s;width:100%}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--accent);background:var(--surface)}
.ta{resize:vertical;min-height:80px;line-height:1.6}
.fg{margin-bottom:12px}
.fl{font-size:0.8571em;color:var(--t2);margin-bottom:5px;display:block}

/* ── MODAL ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;display:flex;align-items:center;justify-content:center;padding:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.open{opacity:1;pointer-events:all}
.md{background:var(--surface);border-radius:8px;width:100%;max-width:520px;max-height:96vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);transform:translateY(8px);transition:transform .2s}
.mo.open .md{transform:translateY(0)}
.mh{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.mt{font-family:var(--serif);font-size:1.5714em}
.mb{padding:20px 24px}
.mf{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}

/* ── COLORS ── */
.cops{display:flex;gap:8px;flex-wrap:wrap}
.cop{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cop.on,.cop:hover{border-color:var(--text);transform:scale(1.15)}

/* ── DEADLINE ── */
.dl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:6px}
.dl-grid .dl{padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:var(--sh);min-width:0}
.dl-grid .dl .dl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dl:last-child{border-bottom:none;padding-bottom:0}
.dl-grid .dl:last-child{padding-bottom:14px;border-bottom:1px solid var(--border)}
.dl-done-scroll::-webkit-scrollbar{width:0;display:none}
.db{min-width:44px;text-align:center;background:var(--s2);border-radius:8px;padding:6px 8px}
.dm{font-size:0.7143em;color:var(--t3);font-family:var(--mono);text-transform:uppercase}
.dd{font-size:1.2857em;font-weight:600;font-family:var(--mono);line-height:1}

/* ── MILESTONE ── */
.msi{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.msi:last-child{border-bottom:none}
.mss{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s}
.mss.on{background:var(--green);border-color:var(--green)}
.mss.on::after{content:'✓';color:#fff;font-size:0.7143em;font-weight:700}

/* ── DAYBTN ── */
.daybtn{display:inline-flex;align-items:center;cursor:pointer;font-size:0.9286em;padding:5px 10px;border-radius:8px;border:1px solid var(--border);transition:all .15s;background:none;font-family:var(--sans)}

/* ── LIFE AREA ── */
.la-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.la-card{background:var(--surface);border-radius:8px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;border:1.5px solid transparent}
.la-add{background:transparent;border:1.5px dashed var(--border2);border-radius:8px;padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;transition:all .2s}
.la-add:hover{border-color:var(--accent);background:var(--al)}
.la-card.drag-over{border-color:var(--accent) !important;background:var(--al);box-shadow:0 0 0 2px var(--accent)40}
.la-card.dragging{opacity:.4;transform:scale(.97)}
.la-card[draggable="true"]{cursor:grab}
.la-card[draggable="true"]:active{cursor:grabbing}

/* ── PROJECT CARD ── */
.pj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* ═══ 3년 로드맵(연대기) 타임라인 ═══ */
.tl3-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tl3-title{display:flex;align-items:center;gap:8px;font-size:1.25em;font-weight:700;color:var(--text)}
.tl3-title-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.tl3-scroll{overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.tl3-row{position:relative;display:flex;gap:10px;padding:8px 6px 6px;min-width:max-content}
.tl3-line{position:absolute;left:0;right:0;top:46px;height:4px;border-radius:8px;background:linear-gradient(90deg,#D98E5F,#8FAE7D,#6B8CAE,#A9A9B2);z-index:0}
.tl3-col{flex:0 0 144px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;cursor:grab;border-radius:8px;transition:outline .1s}
.tl3-col.dragging{opacity:.4}
.tl3-col.drag-over{outline:2px dashed var(--accent);outline-offset:6px}
.tl3-year-top{height:24px;line-height:24px;font-size:calc(1.15em * var(--tl-fs-big,1));font-weight:700;color:var(--text);margin-bottom:8px}
.tl3-node{width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);flex-shrink:0;box-sizing:border-box}
.tl3-connector{width:2px;height:var(--tl-line-big,18px);background:var(--border2)}
.tl3-text{width:100%;box-sizing:border-box;margin-top:10px;padding:0 4px;position:relative;text-align:left;cursor:pointer}
.tl3-editbtns{position:absolute;top:-4px;right:-2px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.tl3-col:hover .tl3-editbtns{opacity:1}
.tl3-ttitle{font-weight:600;font-size:calc(0.98em * var(--tl-fs-big,1));color:var(--tl-text-color,var(--text));line-height:1.4}
.tl3-sub{font-size:calc(0.82em * var(--tl-fs-big,1));color:var(--accent);font-weight:600;margin-top:4px;line-height:1.4}
.tl3-desc{font-size:calc(0.86em * var(--tl-fs-big,1));color:var(--tl-text-color,var(--t2));line-height:1.6;margin-top:8px;white-space:pre-line}
.tl3-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tl3-tag{font-size:calc(0.75em * var(--tl-fs-big,1));padding:3px 10px;border-radius:8px;background:var(--al);color:var(--accent);font-weight:500}
/* 큰 시점: 테두리 카드 */
.tl3-text-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;box-shadow:var(--sh);transition:box-shadow .15s}
.tl3-text-card:hover{box-shadow:var(--shm)}
.tl3-text-card .tl3-editbtns{top:6px;right:6px}
/* 작은 시점: 동그라미 없이 선으로만 연결, 테두리 없음, 더 작은 글씨, 가운데 정렬 */
.tl3-year-top-sm{height:24px;line-height:24px;font-size:calc(0.85em * var(--tl-fs-small,1));font-weight:600;color:var(--t2);margin-bottom:8px}
.tl3-connector-sm{width:2px;height:var(--tl-line-small,34px);background:var(--border2)}
.tl3-text-sm{width:100%;box-sizing:border-box;margin-top:10px;padding:0 4px;position:relative;text-align:center;cursor:pointer}
.tl3-ttitle-sm{font-weight:600;font-size:calc(0.86em * var(--tl-fs-small,1));color:var(--tl-text-color,var(--text));line-height:1.4}
.tl3-sub-sm{font-size:calc(0.74em * var(--tl-fs-small,1));color:var(--accent);font-weight:600;margin-top:3px;line-height:1.4}
.tl3-desc-sm{font-size:calc(0.76em * var(--tl-fs-small,1));color:var(--tl-text-color,var(--t2));line-height:1.5;margin-top:6px;white-space:pre-line}
.tl3-col-add{cursor:default}
.tl3-node-add{border-style:dashed;border-color:var(--border2);background:transparent}
.tl3-connector-add{width:2px;height:var(--tl-line-big,18px);background:var(--border2)}
.tl3-add-text{margin-top:10px;color:var(--t3);cursor:pointer;font-size:0.9em;font-weight:500;transition:color .15s;text-align:center}
.tl3-add-text:hover{color:var(--accent)}
@media(max-width:720px){
  .tl3-col{flex-basis:126px}
}
.pj-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;position:relative}
.pj-card:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.pj-bar{height:4px}
.pj-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:10px}
.pj-card:hover .pj-card-del{opacity:1}

/* ── 카드 스타일 피커 (설정) ── */
.card-style-picker{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card-style-option{
  position:relative;
  appearance:none;
  display:flex;
  flex-direction:column;
  border:1.5px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  padding:12px 12px 13px;
  cursor:pointer;
  text-align:left;
  font-family:var(--sans);
  color:var(--text);
  transition:border-color .18s,box-shadow .18s,transform .18s,background .18s;
}
.card-style-option:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.06);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--border));
}
.card-style-option.on{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 5%,var(--surface));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);
}
.csp-demo{
  height:76px;
  background:#fff;
  padding:14px 15px;
  margin-bottom:10px;
  color:#282828;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.csp-apple{
  border-radius:8px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}
.csp-left{
  border-radius:8px;
  border:1px solid #ECE8E1;
  border-left:4px solid #61A6A0;
  box-shadow:0 1px 4px rgba(0,0,0,.03);
}
.csp-highlight{
  border-radius:8px;
  border:1.5px solid rgba(193,124,60,.28);
}
.csp-fill{
  border-radius:8px;
  background:rgba(97,166,160,.14) !important;
  border:1px solid rgba(97,166,160,.22);
}
.csp-demo-title{font-size:.84em;font-weight:650}
.csp-demo-sub{font-size:.68em;color:#96918A;margin-top:6px}
.csp-hl{
  font-size:.84em;
  font-weight:650;
  padding:0 3px;
  background:linear-gradient(transparent 52%,rgba(247,202,95,.48) 52%);
}
.csp-meta{display:flex;flex-direction:column;gap:3px;padding:1px 2px}
.csp-meta strong{font-size:.85em;font-weight:650}
.csp-meta span{font-size:.7em;color:var(--t3);line-height:1.4}
.csp-check{
  position:absolute;right:10px;top:10px;
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:white;font-size:.72em;font-weight:700;
  box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 40%,transparent);
}

/* 공통: 각 카드가 자기 프로젝트/라이프 색을 사용 */
.pj-card,.la-card{position:relative}
.pj-title-text,.la-title-text{position:relative;width:max-content;max-width:100%}

/* 1. Apple 심플 */
body.cardstyle-apple .pj-card,
body.cardstyle-apple .la-card{
  background:#fff !important;
  border:1px solid rgba(28,25,23,.10) !important;
  border-radius:8px !important;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.10) !important;
}
body.cardstyle-apple .pj-card:hover,
body.cardstyle-apple .la-card:hover{
  box-shadow:0 7px 22px rgba(0,0,0,.07) !important;
}
body.cardstyle-apple .pj-bar{display:none !important}
body.cardstyle-apple .pj-card::before,
body.cardstyle-apple .la-card::before{display:none !important}
body.cardstyle-apple .pj-title-text,
body.cardstyle-apple .la-title-text{background:none !important}

/* 2. 레퍼런스형: 라운드 + 왼쪽 컬러라인만 */
body.cardstyle-leftline .pj-card,
body.cardstyle-leftline .la-card{
  background:#fff !important;
  border:1px solid rgba(28,25,23,.11) !important;
  border-radius:8px !important;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.10) !important;
  overflow:hidden;
}
body.cardstyle-leftline .pj-bar{display:none !important}
body.cardstyle-leftline .pj-card::before,
body.cardstyle-leftline .la-card::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:4px;
  background:var(--card-accent,var(--accent));
  opacity:.92;
}
body.cardstyle-leftline .pj-body{padding-left:19px}
body.cardstyle-leftline .la-card{padding-left:19px !important}
body.cardstyle-leftline .pj-title-text,
body.cardstyle-leftline .la-title-text{background:none !important}

/* 3. 형광펜형: 연한 고유색 테두리 + 제목만 하이라이트 */
body.cardstyle-highlight .pj-card,
body.cardstyle-highlight .la-card{
  background:#fff !important;
  border:1px solid color-mix(in srgb,var(--card-accent,var(--accent)) 40%,white) !important;
  border-radius:8px !important;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 10px -4px rgba(0,0,0,.10) !important;
  transition:box-shadow .18s,border-color .18s,transform .18s !important;
}
body.cardstyle-highlight .pj-card:hover,
body.cardstyle-highlight .la-card:hover{
  border-color:color-mix(in srgb,var(--card-accent,var(--accent)) 62%,white) !important;
  box-shadow:0 2px 4px rgba(0,0,0,.06),0 10px 20px -8px rgba(0,0,0,.16) !important;
  transform:translateY(-1px);
}
body.cardstyle-highlight .pj-bar{display:none !important}
body.cardstyle-highlight .pj-card::before,
body.cardstyle-highlight .la-card::before{display:none !important}
body.cardstyle-highlight .pj-title-text,
body.cardstyle-highlight .la-title-text{
  display:inline;
  padding:0 3px 1px;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
  background:linear-gradient(
    transparent 48%,
    color-mix(in srgb,var(--card-accent,var(--accent)) 28%,white) 48%,
    color-mix(in srgb,var(--card-accent,var(--accent)) 28%,white) 91%,
    transparent 91%
  ) !important;
}

/* 카드 스타일 공통 호버: 살짝 떠오르며 또렷해짐 */
body.cardstyle-apple .pj-card:hover,
body.cardstyle-apple .la-card:hover,
body.cardstyle-leftline .pj-card:hover,
body.cardstyle-leftline .la-card:hover,
body.cardstyle-fill .pj-card:hover,
body.cardstyle-fill .la-card:hover{
  box-shadow:0 2px 4px rgba(0,0,0,.06),0 10px 20px -8px rgba(0,0,0,.16) !important;
  transform:translateY(-1px);
}
/* 4. 컬러 채우기: 카드 전체를 아주 연한 고유색으로 */
body.cardstyle-fill .pj-card,
body.cardstyle-fill .la-card{
  background:color-mix(in srgb,var(--card-accent,var(--accent)) 10%,white) !important;
  border:1px solid color-mix(in srgb,var(--card-accent,var(--accent)) 34%,white) !important;
  border-radius:8px !important;

// Firestore 저장/로드
async function saveToCloud(data) {
  if (!currentUser) return;
  try {
    const chunks = chunkData(data);
    const batch = db.batch();
    Object.entries(chunks).forEach(([key, val]) => {
      const ref = db.collection('users').doc(currentUser.uid).collection('data').doc(key);
      batch.set(ref, { value: JSON.stringify(val), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
  } catch(e) { console.error('Cloud save error:', e); }
}

async function loadFromCloud() {
  if (!currentUser) return null;
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('data').get();
    if (snap.empty) return null;
    const merged = {};
    let latestUpdatedAt = 0;
    snap.forEach(doc => {
      try { merged[doc.id] = JSON.parse(doc.data().value); } catch(e) {}
      try {
        const ts = doc.data().updatedAt;
        const ms = ts && ts.toMillis ? ts.toMillis() : 0;
        if(ms > latestUpdatedAt) latestUpdatedAt = ms;
      } catch(e) {}
    });
    const result = mergeChunks(merged);
    result._cloudUpdatedAt = latestUpdatedAt;
    return result;
  } catch(e) { console.error('Cloud load error:', e); return null; }
}

// 큰 데이터를 필드별로 나눠서 저장 (Firestore 1MB 제한 대응)
function chunkData(data) {
  const FIELDS = ['routines','checks','projects','deadlines','savings','notes','calEvents',
    'lifeGoal','theme','customThemeColor','projectCardStyle','diaryEntries','monthlyGoals','monthlyMemo',
    'weeklyGoals','weeklyMemo','diaryStickers','font','fontSize','fontWeight','customFonts','logoFont','navMarker','todayLayout','todayCardVis',
    'lifeAreas','todoList','todoListTmr','timeline','timelineTitle','tlFontScaleBig','tlFontScaleSmall','tlLineLenBig','tlLineLenSmall','tlTextColor','bgIntensity','diaryFont'];
  const chunks = {};
  FIELDS.forEach(f => { if (data[f] !== undefined) chunks[f] = data[f]; });
  // customFontData는 Firestore 용량 초과 → 저장 제외 (localStorage에만)
  // 브라우저에 직접 저장된(base64) 일기 사진도 Firestore 1MB 문서 한도를 넘겨
  // 일기 전체 동기화를 막을 수 있으므로 클라우드 전송분에서만 제외한다.
  // (localStorage 원본은 그대로 유지되므로 이 기기에서는 계속 보인다)
  if (chunks.diaryEntries) {
    const slim = {};
    Object.keys(chunks.diaryEntries).forEach(k => {
      const e = chunks.diaryEntries[k];
      if (e && e.photoStorage === 'local') {
        const copy = Object.assign({}, e);
        delete copy.photoUrl;
        delete copy.photoStorage;
        delete copy.photoSize;
        slim[k] = copy;
      } else {
        slim[k] = e;
      }
    });
    chunks.diaryEntries = slim;
  }
  // 나머지 소형 데이터
  const rest = {};
  Object.keys(data).forEach(k => {
    if (!FIELDS.includes(k) && k !== 'customFontData') rest[k] = data[k];
  });
  if (Object.keys(rest).length > 0) chunks['_misc'] = rest;
  return chunks;
}
function mergeChunks(chunks) {
  const result = {};
  Object.entries(chunks).forEach(([k, v]) => {
    if (k === '_misc') Object.assign(result, v);
    else result[k] = v;
  });
  return result;
}

function todLabel(){

function routinesForDate(ds){
  const dow = DOWS[dowOf(ds)];
  const dt = new Date(ds+'T00:00:00');
  const dayOfMonth = dt.getDate();
  const lastDayOfMonth = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  return S.routines.filter(function(r){
    // 특정 날짜만 건너뛰기(그 날짜에서만 삭제) 처리된 항목은 제외
    if(r.skipDates && r.skipDates.indexOf(ds)!==-1) return false;
    // 루틴화(프로젝트 연동) 항목은 시작일~등록 마감일 범위 안에서만 표시
    if(r.isRz){
      if(r.startDate && ds<r.startDate) return false;
      if(r.until && ds>r.until) return false;
    }
    // 매월 루틴: 선택한 날짜(또는 말일)에만 표시
    if(r.isMonthly){
      const mdays = r.monthDays || [];
      if(mdays.includes('last') && dayOfMonth===lastDayOfMonth) return true;
      return mdays.includes(dayOfMonth);
    }
    // 매주/매일 루틴: 요일로 필터
    return !r.days || r.days.length===0 || r.days.includes(dow);
  });
}

function togglePjBox(){

function togglePjGroup(aid){
  if(!window._pjGroupCollapsed) window._pjGroupCollapsed={};
  const col=!window._pjGroupCollapsed[aid];
  window._pjGroupCollapsed[aid]=col;
  const hd=document.querySelector('.pj-group-hd[onclick*="'+aid+'"]');
  const body=document.getElementById('pjg-'+aid);
  if(!hd||!body) return;
  hd.classList.toggle('collapsed',col);
  if(col){
    body.style.maxHeight=body.scrollHeight+'px';
    requestAnimationFrame(function(){body.style.maxHeight='0';});
    body.classList.add('collapsed');
  } else {
    body.classList.remove('collapsed');
    body.style.maxHeight=body.scrollHeight+'px';
    setTimeout(function(){if(!window._pjGroupCollapsed[aid])body.style.maxHeight='none';},260);
  }
}

function routineCard(ds){
  const dow=dowOf(ds);

  const checks=S.checks[ds]||{};
  const rods=routinesForDate(ds);
  const done=rods.filter(r=>checks[r.id]).length;
  const pct=rods.length?Math.round(done/rods.length*100):0;
  const isToday=ds===todStr();

  const dt=new Date(ds+'T00:00:00');
  const dateLabel=(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+dayName+')';

  let itemsHtml='';
  if(rods.length===0){
    itemsHtml='<div class="rc-empty">이 요일 루틴이 없어요<br><small>루틴 설정에서 추가하세요</small></div>';
  } else {
    rods.forEach(r=>{

      itemsHtml+='<div class="rc-item" onclick="toggleCheck(\''+r.id+'\',\''+ds+'\')">'+

            (r.saveAmount>0?'<span style="font-size:0.72em;background:'+(isDone?'var(--green)':'var(--al)')+';color:'+(isDone?'#fff':'var(--accent)')+';padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap">💰 '+money(r.saveAmount)+'</span>':'')+
          '</div>'+
          (r.detail?'<div class="rc-detail">'+r.detail+'</div>':'')+
        '</div>'+
        (isDone?'<div style="color:var(--green);font-size:1.1429em">✓</div>':'')+
      '</div>';
    });
  }

  return '<div class="rc">'+
    '<div class="rc-head" style="display:flex;align-items:center;justify-content:space-between">'+
      '<div class="rc-head-title">데일리 루틴</div>'+

        '<button class="rc-nav-btn" data-rcnav="-1" type="button">‹</button>'+
        '<div class="rc-head-date" '+
          (viewDate!==todStr()?
            'data-rcnav="0" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px" title="오늘로 이동"':
            'style="cursor:default"')+
        '>'+dateLabel+'</div>'+
        '<button class="rc-nav-btn" data-rcnav="1" type="button">›</button>'+
      '</div>'+
    '</div>'+
    '<div class="rc-body">'+itemsHtml+'</div>'+
    (rods.length>0?'<div class="rc-progress"><div class="rc-pbar-wrap"><div class="rc-pbar" style="width:'+pct+'%"></div></div><div class="rc-pct">'+done+'/'+rods.length+'</div></div>':'')+
  '</div>';
}

function toggleCheck(rid, ds){
  if(!S.checks[ds]) S.checks[ds]={};
  const nowChecked=!S.checks[ds][rid];
  S.checks[ds][rid]=nowChecked;

  // 저축 금액이 있는 루틴이면 저축 목표에 자동 반영
  const r=(S.routines||[]).find(x=>x.id===rid);
  if(r&&r.saveAmount>0){
    if(!S.savings)S.savings={goal:0,current:0,entries:[]};
    if(!S.savings.entries)S.savings.entries=[];
    const svId='rzsave-'+rid+'-'+ds; // 루틴+날짜별 고유 ID
    const existIdx=S.savings.entries.findIndex(e=>e.id===svId);
    // 프로젝트 정보 찾기
    const proj=r.rzProjectId?(S.projects||[]).find(p=>p.id===r.rzProjectId):null;
    if(nowChecked){
      // 체크 → 저축 입금 (중복 방지)
      if(existIdx<0){
        S.savings.entries.push({id:svId,amount:r.saveAmount,note:r.task+' (루틴 달성)',date:ds,projectId:r.rzProjectId||'',projectName:proj?proj.name:''});
        S.savings.current+=r.saveAmount;
      }
    } else {
      // 체크 해제 → 저축 회수
      if(existIdx>=0){
        S.savings.current-=S.savings.entries[existIdx].amount;
        S.savings.entries.splice(existIdx,1);
      }
    }
  }
  save(); render();
}

function renderTodayLegacy(){
  const t=todStr();

  const done=rods.filter(r=>checks[r.id]).length;
  const total=rods.length;
  const pct=total?Math.round(done/total*100):0;
  const spct=S.savings.goal?Math.min(100,Math.round(S.savings.current/S.savings.goal*100)):0;

  // 이번 달 목표
  const ym=t.slice(0,7);
  const monthGoals=S.monthlyGoals[ym]||[];
  const MN_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const curMonthName=MN_KO[new Date().getMonth()];

  // 이번 주 마감 (날짜가 비었거나 형식이 깨진 항목은 제외해 정렬 에러 방지)
  const validDlDateRe=/^\d{4}-\d{2}-\d{2}$/;
  const upcoming=S.deadlines.filter(d=>{if(!d.date||!validDlDateRe.test(d.date))return false;const n=dLeft(d.date);return n>=0&&n<=7;}).sort((a,b)=>a.date.localeCompare(b.date));

  // 오늘 할일
  if(!S.todoList)S.todoList={};
  if(!S.todoList[t])S.todoList[t]=[];

  // 30일 이전 데이터 자동 정리
  const cutoff=addDays(t,-30);
  Object.keys(S.todoList).forEach(function(k){if(k<cutoff)delete S.todoList[k];});

  // 자동 이월: 오늘 이전 날짜에 남은 미완료 항목을 전부 오늘로 모으고,
  // 원래 날짜에서는 제거해서 며칠을 건너뛰어도 그 날짜에 중복으로 남지 않게 함
  let carried=false;
  for(let i=1;i<=30;i++){
    const pd=addDays(t,-i);
    if(!S.todoList[pd]||S.todoList[pd].length===0)continue;
    const incomplete=S.todoList[pd].filter(item=>!item.done);
    if(incomplete.length>0){
      incomplete.forEach(function(item){
        const already=S.todoList[t].some(x=>x.text===item.text&&x._carried);
        if(!already){ S.todoList[t].unshift({id:gid(),text:item.text,done:false,_carried:true}); carried=true; }
      });
      // 이월된 미완료 항목은 원래 날짜에서 제거 (완료된 항목만 남김)
      S.todoList[pd]=S.todoList[pd].filter(item=>item.done);

let _todoAdding=false;
function addTodoInline(ds,inputId){
  if(_todoAdding) return;
  const el=document.getElementById(inputId);
  if(!el)return;
  const text=el.value.trim();
  if(!text)return;
  _todoAdding=true;
  el.value='';
  if(!S.todoList)S.todoList={};
  if(!S.todoList[ds])S.todoList[ds]=[];
  S.todoList[ds].push({id:gid(),text,done:false});
  save(); render();
  setTimeout(()=>{ _todoAdding=false; const inp=document.getElementById(inputId); if(inp) inp.focus(); },100);
}
function togTodoItem(ds,i){
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  S.todoList[ds][i].done=!S.todoList[ds][i].done;
  save();
  // DOM만 업데이트 (깜빡임 방지)
  const list=S.todoList[ds];
  const item=list[i];
  // 해당 체크박스 찾기 - onclick 속성으로 찾기
  const allBoxes=document.querySelectorAll('[onclick*="togTodoItem"]');
  allBoxes.forEach(function(box){
    const attr=box.getAttribute('onclick')||'';
    if(attr.includes('\''+ds+'\'')&&attr.includes(','+i+')')){
      box.style.background=item.done?'var(--green)':'transparent';
      box.style.borderColor=item.done?'var(--green)':'var(--border2)';
      box.innerHTML=item.done?'<span style="color:#fff;font-size:0.6em">✓</span>':'';
      const textDiv=box.parentElement.querySelector('[style*="font-size:0.9em"]');
      if(textDiv)textDiv.style.textDecoration=item.done?'line-through':'';
    }
  });
}
function delTodoItem(ds,i){
  if(!S.todoList||!S.todoList[ds])return;
  S.todoList[ds].splice(i,1);
  save();render();
}
function carryTodoToNext(ds,i,nextDs){
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  var item=S.todoList[ds][i];
  if(!S.todoList[nextDs])S.todoList[nextDs]=[];
  // 중복 방지
  var already=S.todoList[nextDs].some(function(x){return x.text===item.text&&x._carried;});
  if(!already)S.todoList[nextDs].push({id:gid(),text:item.text,done:false,_carried:true});
  // 원래 날짜에서 제거
  S.todoList[ds].splice(i,1);
  save();render();
}


// ═══════════ ROUTINE SETTINGS PAGE ═══════════
function renderRoutinePage(){
  const now=new Date();
  const nowT=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  let html='';
  html+='<div class="card" style="margin-bottom:16px"><div class="ch"><div class="ct"><svg width="17" height="17" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v2H3V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z"/><path d="M3 10h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill-opacity="0.55"/></svg>요일별 미리보기</div></div>'+
    '<div class="dow-tabs">'+
    DOW_KO.map((d,i)=>'<button class="dow-tab" onclick="previewDow('+i+')">'+d+'요일</button>').join('')+
    '</div><div id="dow-preview"></div></div>';

  const dailyWeeklyRoutines=S.routines.filter(r=>!r.isMonthly);
  const monthlyRoutines=S.routines.filter(r=>r.isMonthly);

  function renderRoutineRow(r,i){
    const dayLabels=r.isMonthly?('매월 '+(r.monthDays||[]).map(function(d){return d==='last'?'말':d;}).join('·')+'일'):((!r.days||r.days.length===0)?'매일':r.days.map(d=>DOW_KO[DOWS.indexOf(d)]).join('·'));
    const isCur=!!r.time&&r.time<=nowT&&(i===S.routines.length-1||!S.routines[i+1].time||S.routines[i+1].time>nowT);
    return '<div class="ci" style="'+(isCur?'border-left:2px solid var(--accent);padding-left:8px;background:var(--al);border-radius:0 6px 6px 0':'')+'">'+
      '<div style="flex:1">'+
        '<div style="display:flex;align-items:center;gap:8px">'+(r.time?'<span style="font-size:0.8571em;color:var(--rc-header);font-weight:600;font-family:var(--mono)">'+r.time+'</span>':'')+
        '<span style="font-size:0.9643em;font-weight:500">'+r.task+'</span>'+
        '<span style="font-size:0.7857em;padding:2px 7px;border-radius:99px;background:var(--s2);color:var(--t2)">'+dayLabels+'</span></div>'+
        (r.detail?'<div style="font-size:0.8571em;color:var(--t3);margin-top:2px;padding-left:0">'+r.detail+'</div>':'')+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:6px">'+
        '<button class="bi" onclick="openRModal('+S.routines.indexOf(r)+')" style="font-size:0.8571em">✎</button>'+
        '<button class="bi" onclick="delR(\''+r.id+'\')" style="font-size:0.8571em;color:var(--red)">✕</button>'+
      '</div>'+
    '</div>';
  }

  html+='<div class="card" style="margin-bottom:16px"><div class="ch"><div class="ct"><svg width="17" height="17" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5a1 1 0 1 0-2 0v5a1 1 0 0 0 .5.87l3.5 2a1 1 0 0 0 1-1.74L13 11.42z"/></svg>전체 루틴 목록 <span style="font-size:0.75em;color:var(--t3);font-weight:400">(매일·매주)</span></div><button class="btn bp bsm" onclick="openRModal()">+ 추가</button></div>';
  if(dailyWeeklyRoutines.length===0){
    html+='<div class="empty"><div class="ei">⏰</div>루틴을 추가해요</div>';
  } else {
    dailyWeeklyRoutines.forEach((r,i)=>{ html+=renderRoutineRow(r,i); });
  }
  html+='</div>';

  html+='<div class="card"><div class="ch"><div class="ct"><svg width="17" height="17" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0"><path d="M3 13h2v8H3zm4-6h2v14H7zm4-4h2v18h-2zm4 8h2v10h-2zm4-3h2v13h-2z"/></svg>매월 루틴</div></div>';
  if(monthlyRoutines.length===0){
    html+='<div class="empty"><div class="ei">📅</div>매월 반복되는 루틴이 없어요</div>';
  } else {
    monthlyRoutines.forEach((r,i)=>{ html+=renderRoutineRow(r,i); });
  }
  html+='</div>';
  return html;
}

function previewDow(dowIdx){
  const dowKey=DOWS[dowIdx];
  const matched=S.routines.filter(r=>!r.isMonthly&&(!r.days||r.days.length===0||r.days.includes(dowKey)));

// ═══════════ 일기 캘린더 사진 ═══════════
// 하루 1장 / 긴 변 360px / WebP(또는 jpeg) · base64로 직접 저장해서 로그인/브라우저 환경에 관계없이 항상 저장됨
var pendingDiaryPhoto={};

function diaryPhotoPath(ds,ext){
  return 'users/'+currentUser.uid+'/diary-photos/'+ds+'.'+(ext||'webp');
}

// 파일 -> 압축된 base64 data URL (webp 실패 시 jpeg로 자동 대체)
function compressDiaryPhotoToDataURL(file){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var tempUrl=URL.createObjectURL(file);
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight;
        if(!w||!h){reject(new Error('이미지 크기를 읽지 못했어요.'));return;}
        // 캘린더 칸은 background-size:cover라 '짧은 변'이 칸을 채운다.
        // 칸 너비 약 160px + 고해상도(2x) 화면 대비 → 짧은 변을 330px로 맞춘다.
        // (긴 변은 640px로 상한을 둬서 용량이 과하게 커지지 않게 한다)
        var SHORT=330, LONG_CAP=640;
        var scale=SHORT/Math.min(w,h);
        if(Math.max(w,h)*scale>LONG_CAP) scale=LONG_CAP/Math.max(w,h);
        if(scale>1) scale=1;   // 원본보다 크게 늘리지 않음
        var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
        var canvas=document.createElement('canvas');
        canvas.width=cw;canvas.height=ch;
        var ctx=canvas.getContext('2d',{alpha:false});
        if(ctx.imageSmoothingQuality!==undefined) ctx.imageSmoothingQuality='high';
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        URL.revokeObjectURL(tempUrl);
        var dataUrl='';
        try{ dataUrl=canvas.toDataURL('image/webp',0.25); }catch(e){ dataUrl=''; }
        // 일부 브라우저(WebP 인코딩 미지원)는 png로 그대로 돌려주므로 webp가 아니면 jpeg로 재시도
        if(!dataUrl || dataUrl.indexOf('data:image/webp')!==0){
          try{ dataUrl=canvas.toDataURL('image/jpeg',0.5); }catch(e2){ dataUrl=''; }
        }
        if(!dataUrl){reject(new Error('사진 압축에 실패했어요.'));return;}
        resolve(dataUrl);
      }catch(e){
        URL.revokeObjectURL(tempUrl);reject(e);
      }
    };
    img.onerror=function(){URL.revokeObjectURL(tempUrl);reject(new Error('사진을 읽지 못했어요.'));};
    img.src=tempUrl;
  });
}

// data URL -> Blob (Firebase Storage 업로드용)
function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(',');
  var mimeMatch=parts[0].match(/:(.*?);/);
  var mime=mimeMatch?mimeMatch[1]:'image/jpeg';
  var bstr=atob(parts[1]);
  var n=bstr.length;
  var u8=new Uint8Array(n);
  while(n--){ u8[n]=bstr.charCodeAt(n); }
  return new Blob([u8],{type:mime});
}

// 이전 버전(IndexedDB/blob URL 방식)으로 저장된, 새로고침 후 더 이상 열리지 않는 사진 기록을 정리
function cleanupStaleDiaryPhotos(){
  var entries=S.diaryEntries||{};
  var changed=false;
  Object.keys(entries).forEach(function(ds){
    var e=entries[ds];
    if(!e)return;
    var isStale=e.photoStorage==='indexeddb'||(typeof e.photoUrl==='string'&&e.photoUrl.indexOf('blob:')===0);
    if(isStale){
      delete e.photoUrl;delete e.photoPath;delete e.photoStorage;delete e.photoSize;delete e.photoPosX;delete e.photoPosY;
      changed=true;
    }
  });
  if(changed)save();
}
async function deleteDiaryPhotoFile(ds,entry){
  if(!entry)return;
  if(entry.photoStorage==='firebase'&&currentUser&&entry.photoPath){
    try{await storage.ref().child(entry.photoPath).delete();}
    catch(e){if(!e||e.code!=='storage/object-not-found')console.warn('사진 삭제 실패(무시):',e);}
  }
  // storage==='local'인 경우 데이터가 diaryEntries 안에 직접 들어있어서 별도 삭제 불필요
}

async function removeDiaryPhoto(ds){
  var entry=(S.diaryEntries||{})[ds];
  if(!entry)return;
  if(!confirm('이 날의 사진을 삭제할까요?'))return;
  await deleteDiaryPhotoFile(ds,entry);
  delete entry.photoUrl;
  delete entry.photoPath;
  delete entry.photoStorage;
  delete entry.photoSize;
  delete entry.photoPosX;
  delete entry.photoPosY;
  save();
  closeMo();
  render();
  setTimeout(function(){openDiaryModal(ds);},60);
}

async function finishDiaryPhotoUpload(ds){
  var pending=pendingDiaryPhoto[ds];
  if(!pending)return;
  delete pendingDiaryPhoto[ds];
  try{
    if(!S.diaryEntries)S.diaryEntries={};
    if(!S.diaryEntries[ds])S.diaryEntries[ds]={text:'',mood:'',title:''};
    var e=S.diaryEntries[ds];
    var oldPath=e.photoPath,oldStorage=e.photoStorage;

    // ① 먼저 base64로 즉시 반영 — 업로드를 기다리지 않으므로 사진이 바로 보인다
    e.photoUrl=pending.dataUrl;
    e.photoPath='';
    e.photoStorage='local';
    e.photoSize=pending.dataUrl.length;
    e.photoPosX=pending.posX!=null?pending.posX:50;
    e.photoPosY=pending.posY!=null?pending.posY:50;
    save();
    if(page==='diary')render();

    // ② 이전 사진 정리
    if(oldStorage==='firebase'&&oldPath){
      deleteDiaryPhotoFile(ds,{photoStorage:oldStorage,photoPath:oldPath});
    }

    // ③ 로그인 상태면 백그라운드로 클라우드에 올리고, 끝나면 주소만 조용히 교체
    if(currentUser){
      (async function(){
        try{
          var blob=dataUrlToBlob(pending.dataUrl);
          var ext=(blob.type==='image/jpeg')?'jpg':'webp';
          var path=diaryPhotoPath(ds,ext);
          var ref=storage.ref().child(path);
          await ref.put(blob,{contentType:blob.type||'image/webp',cacheControl:'public,max-age=31536000'});
          var url=await ref.getDownloadURL();
          var cur=(S.diaryEntries||{})[ds];
          // 그 사이 사용자가 사진을 바꾸거나 지웠으면 덮어쓰지 않는다
          if(!cur||cur.photoUrl!==pending.dataUrl)return;
          cur.photoUrl=url;
          cur.photoPath=path;
          cur.photoStorage='firebase';
          cur.photoSize=blob.size;
          save();
          if(page==='diary')render();
        }catch(err){
          console.warn('Firebase Storage 업로드 실패 — 이 기기에 저장된 사진을 계속 사용합니다.',err);
        }
      })();
    }
  }catch(err){
    console.error('Diary photo save error:',err);
    alert('사진 저장에 실패했어요: '+(err.message||err));
  }
}

// ── 사진 위치 드래그 조정 (전역 위임) ──
var _dphotoDrag=null;
function _dphotoGetPos(ds){
  var pend=pendingDiaryPhoto[ds];
  var entry=(S.diaryEntries||{})[ds]||{};
  return {
    x:(pend&&pend.posX!=null)?pend.posX:(entry.photoPosX!=null?entry.photoPosX:50),
    y:(pend&&pend.posY!=null)?pend.posY:(entry.photoPosY!=null?entry.photoPosY:50)
  };
}
function _dphotoStart(box,clientX,clientY){
  var ds=box.dataset.ds;
  var img=box.querySelector('#diary-photo-img');
  if(!img)return;
  var cur=_dphotoGetPos(ds);
  _dphotoDrag={ds:ds,box:box,img:img,startX:clientX,startY:clientY,startPosX:cur.x,startPosY:cur.y};
  box.style.cursor='grabbing';
}
function _dphotoMove(clientX,clientY){
  var d=_dphotoDrag;if(!d)return;
  var rect=d.box.getBoundingClientRect();
  var dx=(clientX-d.startX)/rect.width*100;
  var dy=(clientY-d.startY)/rect.height*100;
  var nx=Math.max(0,Math.min(100,d.startPosX-dx));
  var ny=Math.max(0,Math.min(100,d.startPosY-dy));
  d.img.style.objectPosition=nx+'% '+ny+'%';
  d._nx=nx;d._ny=ny;
}
function _dphotoEnd(){
  var d=_dphotoDrag;if(!d)return;
  d.box.style.cursor='grab';
  if(d._nx!=null){
    if(pendingDiaryPhoto[d.ds]){
      pendingDiaryPhoto[d.ds].posX=d._nx;
      pendingDiaryPhoto[d.ds].posY=d._ny;
    }else{
      if(!S.diaryEntries)S.diaryEntries={};
      if(!S.diaryEntries[d.ds])S.diaryEntries[d.ds]={};
      S.diaryEntries[d.ds].photoPosX=d._nx;
      S.diaryEntries[d.ds].photoPosY=d._ny;
      save();
    }
  }
  _dphotoDrag=null;
}
document.addEventListener('mousedown',function(e){
  var box=e.target.closest&&e.target.closest('.dphoto-drag');
  if(!box)return;
  _dphotoStart(box,e.clientX,e.clientY);
  e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!_dphotoDrag)return;
  _dphotoMove(e.clientX,e.clientY);
});
document.addEventListener('mouseup',_dphotoEnd);
document.addEventListener('touchstart',function(e){
  var box=e.target.closest&&e.target.closest('.dphoto-drag');
  if(!box)return;
  var t=e.touches[0];
  _dphotoStart(box,t.clientX,t.clientY);
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!_dphotoDrag)return;
  var t=e.touches[0];
  _dphotoMove(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',_dphotoEnd);

function runDiarySearch(q){
  var box=document.getElementById('diary-search-res');
  if(!box)return;
  q=(q||'').trim().toLowerCase();
  if(!q){box.innerHTML='<div class="empty">검색어를 입력하면 결과가 나타나요</div>';return;}
  var keys=Object.keys(S.diaryEntries||{}).sort(function(a,b){return b.localeCompare(a);});
  var hits=[];
  keys.forEach(function(ds){
    var e=S.diaryEntries[ds];if(!e)return;
    var hay=((e.title||'')+'\n'+(e.text||'')).toLowerCase();
    var idx=hay.indexOf(q);
    if(idx===-1)return;
    var src=(e.title||'')+'\n'+(e.text||'');
    var start=Math.max(0,idx-25), end=Math.min(src.length,idx+q.length+45);
    var snippet=(start>0?'…':'')+src.slice(start,end).replace(/[<>]/g,'').replace(/\n/g,' ')+(end<src.length?'…':'');
    var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
    snippet=snippet.replace(re,function(m){return '<mark style="background:var(--al);color:var(--accent);border-radius:3px;padding:0 1px">'+m+'</mark>';});
    hits.push({ds:ds,mood:e.mood||'',title:e.title||'',snippet:snippet});
  });
  if(hits.length===0){box.innerHTML='<div class="empty">"'+q.replace(/[<>]/g,'')+'" 검색 결과가 없어요</div>';return;}
  var html='<div style="font-size:0.78em;color:var(--t3);margin-bottom:8px">'+hits.length+'개의 일기에서 발견</div>';
  hits.slice(0,50).forEach(function(h){
    html+='<div onclick="diarySearchGo(\''+h.ds+'\')" style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .15s" onmouseenter="this.style.borderColor=\'var(--accent)\'" onmouseleave="this.style.borderColor=\'var(--border)\'">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'+
        (h.mood?'<span>'+h.mood+'</span>':'')+
        '<span style="font-size:0.8em;font-weight:600;color:var(--accent);font-family:var(--mono)">'+h.ds+'</span>'+
        (h.title?'<span style="font-size:0.85em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h.title.replace(/[<>]/g,'')+'</span>':'')+
      '</div>'+
      '<div style="font-size:0.82em;color:var(--t2);line-height:1.5">'+h.snippet+'</div>'+
    '</div>';
  });
  if(hits.length>50)html+='<div style="text-align:center;font-size:0.78em;color:var(--t3)">상위 50개만 표시됩니다</div>';
  box.innerHTML=html;
}

// 같은 영역 안에서만 순서 변경 (S.projects 전체 배열에서 위치를 맞바꾼다)
function moveAreaProj(aid,pid,dir){
  var idxs=[];
  (S.projects||[]).forEach(function(p,i){ if(p.lifeAreaId===aid) idxs.push(i); });
  var pos=idxs.findIndex(function(i){return S.projects[i].id===pid;});
  if(pos<0) return;
  var target=pos+dir;
  if(target<0||target>=idxs.length) return;
  var i1=idxs[pos], i2=idxs[target];
  var tmp=S.projects[i1]; S.projects[i1]=S.projects[i2]; S.projects[i2]=tmp;
  save();
  refreshAreaProjList(aid);
  render();
}
function addAreaProj(aid){
  var inp=document.getElementById('ar-new-proj');
  if(!inp) return;
  var name=inp.value.trim();
  if(!name) return;
  var area=(S.lifeAreas||[]).find(function(x){return x.id===aid;});
  if(!S.projects) S.projects=[];
  S.projects.push({id:gid(),name:name,color:(area&&area.color)||COLORS[0],lifeAreaId:aid,tasks:[]});
  inp.value='';
  save();
  refreshAreaProjList(aid);
  render();
}
function removeAreaProj(aid,pid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p) return;
  if(!confirm('"'+p.name+'"을(를) 이 영역에서 뺄까요?\n(프로젝트 자체는 삭제되지 않아요)')) return;
  p.lifeAreaId='';
  save();
  refreshAreaProjList(aid);
  render();
}

function delArea(id){
  const pc=S.projects.filter(p=>p.lifeAreaId===id).length;
  if(pc>0&&!confirm('프로젝트 '+pc+'개의 영역이 해제돼요. 계속할까요?'))return;

  S.projects=S.projects.map(p=>p.lifeAreaId===id?Object.assign({},p,{lifeAreaId:''}):p);

// 드래그 앤 드롭 순서 변경
var _tlDragId=null;
function tlDragStart(e){_tlDragId=e.currentTarget.dataset.id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function tlDragEnd(e){e.currentTarget.classList.remove('dragging');_tlDragId=null;}
function tlDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function tlDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function tlDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  var target=e.currentTarget.dataset.id;
  if(!_tlDragId||_tlDragId===target)return;
  var arr=S.timeline||[];
  var fromIdx=arr.findIndex(function(x){return x.id===_tlDragId;});
  var toIdx=arr.findIndex(function(x){return x.id===target;});
  if(fromIdx<0||toIdx<0)return;
  var item=arr.splice(fromIdx,1)[0];arr.splice(toIdx,0,item);
  _tlDragId=null;
  save();render();
}

function tlPrevSet(prop,val){
  var el=document.getElementById('tl-prev');
  if(el)el.style.setProperty(prop,val);
}
function openTlSettingsModal(){

  const txtColor=S.tlTextColor||'#1C1917';
  const hasCustomColor=!!S.tlTextColor;
  openMo('로드맵 표시 설정',
    '<div class="fg"><label class="fl">큰 시점 글자 크기 <span id="tl-fsb-label" style="color:var(--t3);font-weight:400">'+Math.round(fsBig*100)+'%</span></label>'+
      '<input type="range" id="tl-fsb-range" min="0.7" max="1.6" step="0.05" value="'+fsBig+'" style="width:100%" oninput="document.getElementById(\'tl-fsb-label\').textContent=Math.round(this.value*100)+\'%\';tlPrevSet(\'--tl-fs-big\',this.value)">'+

function saveTlEntry(id){
  const year=document.getElementById('tl-year').value.trim();
  const title=document.getElementById('tl-title').value.trim();
  const sub=document.getElementById('tl-sub').value.trim();
  const desc=document.getElementById('tl-desc').value.trim();
  const tagsRaw=document.getElementById('tl-tags').value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(function(t){return t.trim();}).filter(Boolean):[];
  const size=selTlSize==='small'?'small':'big';
  const bgToggle=document.getElementById('tl-bg-toggle');
  const bgColor=(size==='big'&&bgToggle&&bgToggle.checked)?document.getElementById('tl-bg-input').value:'';
  if(!year&&!title)return;
  if(!S.timeline)S.timeline=[];
  if(id){
    const idx=S.timeline.findIndex(function(x){return x.id===id;});
    if(idx>-1){
      const upd={year:year,title:title,subtitle:sub,desc:desc,tags:tags,size:size,bgColor:bgColor};
      S.timeline[idx]=Object.assign({},S.timeline[idx],upd);
      if(!bgColor)delete S.timeline[idx].bgColor;
    }
  } else {
    const entry={id:gid(),year:year,title:title,subtitle:sub,desc:desc,tags:tags,size:size};
    if(bgColor)entry.bgColor=bgColor;
    S.timeline.push(entry);
  }
  save();closeMo();render();
}

function delTlEntry(id){
  if(!confirm('이 시점을 삭제할까요?'))return;
  S.timeline=(S.timeline||[]).filter(function(x){return x.id!==id;});
  save();render();
}

// ═══════════ LIFE 드래그앤드롭 ═══════════
window._laDragging = false;
var _dragAreaId = null;   // 드래그 중인 라이프 카드 aid
var _dragPjId = null;     // 드래그 중인 프로젝트 pid

document.addEventListener('dragstart', function(e){
  // pj-slot 드래그 (카드 레이아웃 편집)는 방해하지 않음
  if(e.target.closest('.pj-slot[draggable]')) return;
  // supp 약 pill 드래그는 방해하지 않음
  if(e.target.closest('[draggable][data-id]')) return;

  // 라이프 카드(영역) 드래그만 처리 — 카드 안 세부 목록은 드래그하지 않는다
  var card = e.target.closest('.la-card[draggable]');

  if(card){
    window._laDragging = true;
    _dragAreaId = card.dataset.aid;
    _dragPjId = null;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('type','area');
    setTimeout(function(){card.classList.add('dragging');},0);
  } else {
    // 드래그 취소
    e.preventDefault();
  }
});

document.addEventListener('dragend', function(e){
  window._laDragging = false;
  _dragAreaId = null; _dragPjId = null;
  document.querySelectorAll('.la-card.dragging').forEach(function(el){el.classList.remove('dragging');});
  document.querySelectorAll('.la-card.drag-over,.pj-drop-zone.drag-over').forEach(function(el){el.classList.remove('drag-over');});
});

document.addEventListener('dragover', function(e){
  e.preventDefault();
  var type = e.dataTransfer.getData('type') || (_dragPjId?'pj':_dragAreaId?'area':'');

  if(type==='pj'||_dragPjId){
    // 프로젝트를 라이프 카드 위로
    var zone = e.target.closest('.pj-drop-zone');
    var card = e.target.closest('.la-card');
    document.querySelectorAll('.pj-drop-zone.drag-over').forEach(function(el){el.classList.remove('drag-over');});
    if(zone) zone.classList.add('drag-over');
    else if(card){ var z=card.querySelector('.pj-drop-zone'); if(z) z.classList.add('drag-over'); }
  } else if(type==='area'||_dragAreaId){
    // 라이프 카드 순서 변경
    var targetCard = e.target.closest('.la-card[draggable]');
    document.querySelectorAll('.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});
    if(targetCard && targetCard.dataset.aid !== _dragAreaId) targetCard.classList.add('drag-over');
  }
});

document.addEventListener('dragleave', function(e){
  if(!e.currentTarget.contains(e.relatedTarget)){
    document.querySelectorAll('.pj-drop-zone.drag-over,.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});
  }
});

document.addEventListener('drop', function(e){
  e.preventDefault();
  document.querySelectorAll('.pj-drop-zone.drag-over,.la-card.drag-over').forEach(function(el){el.classList.remove('drag-over');});

  if(_dragPjId){
    // 프로젝트 → 라이프 카드 이동
    var zone = e.target.closest('.pj-drop-zone');
    var card = e.target.closest('.la-card');
    var targetAid = zone ? zone.dataset.aid : (card ? card.dataset.aid : null);
    if(targetAid){
      var pj = S.projects.find(function(p){return p.id===_dragPjId;});
      if(pj && pj.lifeAreaId !== targetAid){
        pj.lifeAreaId = targetAid;
        save(); render();
      }
    }
  } else if(_dragAreaId){
    // 라이프 카드 순서 변경
    var targetCard = e.target.closest('.la-card[draggable]');
    if(targetCard && targetCard.dataset.aid !== _dragAreaId){
      var areas = S.lifeAreas;
      var fromIdx = areas.findIndex(function(a){return a.id===_dragAreaId;});
      var toIdx   = areas.findIndex(function(a){return a.id===targetCard.dataset.aid;});
      if(fromIdx>-1 && toIdx>-1){
        var moved = areas.splice(fromIdx,1)[0];
        areas.splice(toIdx,0,moved);
        save(); render();
      }
    }
  }
  window._laDragging = false;
  _dragAreaId = null; _dragPjId = null;
});

function savePjEdit(pid){
  const name=document.getElementById('pje-n').value.trim();if(!name)return;

  const dday=document.getElementById('pje-dday').value||'';

    link:document.getElementById('pje-cv-link').checked,
    material:document.getElementById('pje-cv-material').checked
  };
  S.projects=S.projects.map(function(p){
    if(p.id!==pid)return p;

function detectPdf(input){
  const file=input.files[0];
  if(!file)return;
  // 제목 자동 입력
  const titleEl=document.getElementById('mat-title');
  if(titleEl&&!titleEl.value) titleEl.value=file.name.replace(/\.pdf$/i,'');

  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const bytes=new Uint8Array(e.target.result);
      // 바이너리를 latin1 문자열로 변환 (PDF 내부 구조 파싱용)
      let str='';
      for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);

      let pages=0;

      // 방법 1: /N 숫자 (Pages 딕셔너리 안)
      const m1=str.match(/\/N\s+(\d+)/);
      if(m1) pages=parseInt(m1[1]);

      // 방법 2: /Count 숫자
      if(!pages){
        const counts=[...str.matchAll(/\/Count\s+(\d+)/g)].map(m=>parseInt(m[1]));
        if(counts.length) pages=Math.max(...counts);
      }

      // 방법 3: PDF 전체에서 페이지 오브젝트 개수 세기
      if(!pages){
        const pageObjs=(str.match(/\/Type\s*\/Page[^s]/g)||[]).length;
        if(pageObjs>0) pages=pageObjs;
      }

      // 방법 4: trailer의 /Size로 추정 (부정확하지만 없는 것보다 나음)
      if(!pages){
        const trailer=str.match(/\/Size\s+(\d+)/);
        if(trailer) pages=Math.max(1,parseInt(trailer[1])-1);
      }

      const totalEl=document.getElementById('mat-total');
      if(totalEl&&pages>0){
        totalEl.value=pages;
        document.getElementById('mat-unit').value='p';
      } else if(totalEl){
        totalEl.placeholder='페이지 수 직접 입력';
      }
    }catch(err){console.log('PDF 파싱 오류',err);}
  };
  // 앞 1MB 읽기 (페이지 정보는 대부분 앞부분에 있음)
  reader.readAsArrayBuffer(file.slice(0,1024*1024));
}

function saveRz(pid){
  const task=document.getElementById('rz-t').value.trim();
  const time=document.getElementById('rz-ti').value;
  const dur=document.getElementById('rz-du').value;
  const saveAmtEl=document.getElementById('rz-save');
  const saveAmt=saveAmtEl&&saveAmtEl.value?Math.round(parseFloat(saveAmtEl.value)*10000):0;
  const until=document.getElementById('rz-until').value;
  const startEl=document.getElementById('rz-start');
  const startVal=startEl&&startEl.value?startEl.value:dateStr(new Date());
  const isMonthly=(document.getElementById('rz-mode-month')&&document.getElementById('rz-mode-month').dataset.on==='1');
  const isDaily=(document.getElementById('rz-mode-day')&&document.getElementById('rz-mode-day').dataset.on==='1');

  if(!task){alert('할 일 이름을 입력해주세요');return;}
  if(!until){alert('등록 마감일을 선택해주세요');return;}
  if(startVal>until){alert('시작일이 마감일보다 늦을 수 없어요');return;}

  let days=[], monthDays=[];
  if(isMonthly){
    monthDays=Array.from(document.querySelectorAll('#rz-mdays [data-md]')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.md==='last'?'last':parseInt(el.dataset.md));
    if(!monthDays.length){alert('날짜를 선택해주세요');return;}
  } else if(!isDaily){
    days=DOWS.filter(k=>{const el=document.getElementById('rzd-'+k);return el&&el.dataset.on==='1';});
    if(!days.length){alert('요일을 선택해주세요');return;}
  }

  const p=S.projects.find(x=>x.id===pid);if(!p.routinized)p.routinized=[];
  const entry={id:gid(),task,days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,time,duration:dur,projectId:pid,until,startDate:startVal,saveAmount:saveAmt};
  p.routinized.push(entry);
  S.routines.push({id:entry.id,time:time||'',task,detail:p.name+' 루틴화',days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,isRz:true,rzProjectId:pid,saveAmount:saveAmt,startDate:startVal,until});
  S.routines.sort((a,b)=>a.time.localeCompare(b.time));

  // 캘린더 등록: 시작일 ~ 마감일까지
  const untilDate=new Date(until+'T00:00:00');
  const now=new Date(startVal+'T00:00:00'); now.setHours(0,0,0,0);
  if(isMonthly){
    // 매월: 오늘~마감일 사이에 해당 일자(말일 포함)가 있으면 등록
    const hasLast=monthDays.includes('last');
    let cur=new Date(now);
    while(cur<=untilDate){
      const lastDayOfMonth=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const isLastDay=hasLast&&cur.getDate()===lastDayOfMonth;
      if(monthDays.includes(cur.getDate())||isLastDay){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:entry.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    // 매주/매일: 오늘~마감일 사이에 선택 요일(또는 매일) 등록
    let cur=new Date(now);
    while(cur<=untilDate){
      const dow=['sun','mon','tue','wed','thu','fri','sat'][cur.getDay()];
      if(isDaily||days.includes(dow)){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:entry.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  syncRzToRoutines();
  restoreCustomFont();
  save();closeMo();render();
}

function setRzeMode(mode){
  var dBtn=document.getElementById('rze-mode-day'),wBtn=document.getElementById('rze-mode-week'),mBtn=document.getElementById('rze-mode-month');
  var wUi=document.getElementById('rze-week-ui'),mUi=document.getElementById('rze-month-ui');
  [dBtn,wBtn,mBtn].forEach(function(b){b.dataset.on='0';b.style.cssText='padding:4px 16px';});
  wUi.style.display='none';mUi.style.display='none';
  if(mode==='day'){
    dBtn.dataset.on='1';
    dBtn.style.cssText='padding:4px 16px;background:var(--accent);color:#fff;border-color:var(--accent)';
  } else if(mode==='week'){
    wBtn.dataset.on='1';
    wBtn.style.cssText='padding:4px 16px;background:var(--accent);color:#fff;border-color:var(--accent)';
    wUi.style.display='block';
  } else {
    mBtn.dataset.on='1';
    mBtn.style.cssText='padding:4px 16px;background:var(--accent);color:#fff;border-color:var(--accent)';
    mUi.style.display='block';
  }
}
function togRzDEdit(el){
  if(el.dataset.on==='1'){el.dataset.on='0';el.style.background='';el.style.color='';el.style.borderColor='';}
  else{el.dataset.on='1';el.style.background='var(--accent)';el.style.color='#fff';el.style.borderColor='var(--accent)';}
}
function saveRzEdit(pid, idx){
  const task=document.getElementById('rze-t').value.trim();
  const time=document.getElementById('rze-ti').value;
  const dur=document.getElementById('rze-du').value;
  const saveAmtEl=document.getElementById('rze-saveamt');
  const saveAmt=saveAmtEl&&saveAmtEl.value?Math.round(parseFloat(saveAmtEl.value)*10000):0;
  const until=document.getElementById('rze-until').value;
  const startEl=document.getElementById('rze-start');
  const startVal=startEl&&startEl.value?startEl.value:dateStr(new Date());
  const isMonthly=(document.getElementById('rze-mode-month')&&document.getElementById('rze-mode-month').dataset.on==='1');
  const isDaily=(document.getElementById('rze-mode-day')&&document.getElementById('rze-mode-day').dataset.on==='1');

  if(!task){alert('할 일 이름을 입력해주세요');return;}
  if(!until){alert('등록 마감일을 선택해주세요');return;}
  if(startVal>until){alert('시작일이 마감일보다 늦을 수 없어요');return;}

  let days=[], monthDays=[];
  if(isMonthly){
    monthDays=Array.from(document.querySelectorAll('#rze-mdays [data-md]')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.md==='last'?'last':parseInt(el.dataset.md));
    if(!monthDays.length){alert('날짜를 선택해주세요');return;}
  } else if(!isDaily){
    days=Array.from(document.querySelectorAll('.rzed-btn')).filter(el=>el.dataset.on==='1').map(el=>el.dataset.k);
    if(!days.length){alert('요일을 선택해주세요');return;}
  }

  const p=S.projects.find(x=>x.id===pid); if(!p) return;
  const old=p.routinized[idx];
  S.calEvents=S.calEvents.filter(e=>e.rzId!==old.id);
  p.routinized[idx]=Object.assign({},old,{task,days:isMonthly?[]:days,monthDays:isMonthly?monthDays:[],isMonthly:!!isMonthly,time,duration:dur,until,startDate:startVal,saveAmount:saveAmt});

  // 이미 적립된 저축 내역 금액 재정산
  if(S.savings&&S.savings.entries){
    const prefix='rzsave-'+old.id+'-';
    S.savings.entries.forEach(function(e){
      if(e.id&&e.id.indexOf(prefix)===0){
        const diff=saveAmt-e.amount;
        e.amount=saveAmt;
        S.savings.current+=diff;
        e.note=task+' (루틴 달성)';
      }
    });
    if(S.savings.current<0)S.savings.current=0;
  }

  // 캘린더 재등록: 시작일 ~ 마감일
  const untilDate=new Date(until+'T00:00:00');
  let cur=new Date(startVal+'T00:00:00'); cur.setHours(0,0,0,0);
  if(isMonthly){
    const hasLast=monthDays.includes('last');
    while(cur<=untilDate){
      const lastDayOfMonth=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const isLastDay=hasLast&&cur.getDate()===lastDayOfMonth;
      if(monthDays.includes(cur.getDate())||isLastDay){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:old.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  } else {
    while(cur<=untilDate){
      const dow=['sun','mon','tue','wed','thu','fri','sat'][cur.getDay()];
      if(isDaily||days.includes(dow)){
        S.calEvents.push({id:gid(),date:dateStr(cur),title:(time?time+' ':'')+task,color:p.color,rzId:old.id,projectId:pid});
      }
      cur.setDate(cur.getDate()+1);
    }
  }
  syncRzToRoutines();
  save(); closeMo(); render();
}
function delRz(pid,i){
  const p=S.projects.find(x=>x.id===pid);
  const rm=p.routinized[i];
  p.routinized.splice(i,1);
  S.calEvents=S.calEvents.filter(e=>e.rzId!==rm.id);
  // 이 루틴으로 적립된 저축 내역 회수
  if(S.savings&&S.savings.entries){
    const prefix='rzsave-'+rm.id+'-';
    const removed=S.savings.entries.filter(e=>e.id&&e.id.indexOf(prefix)===0);
    removed.forEach(e=>{S.savings.current-=e.amount;});
    S.savings.entries=S.savings.entries.filter(e=>!(e.id&&e.id.indexOf(prefix)===0));
    if(S.savings.current<0)S.savings.current=0;
  }
  syncRzToRoutines();save();render();
}
