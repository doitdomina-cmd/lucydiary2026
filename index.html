// ════ 회고 & 통계 ════
function renderInsights(){
  const today=todStr();
  let cells30=[];
  for(let i=29;i>=0;i--){
    const ds=addDays(today,-i);
    const rods=routinesForDate(ds);
    const ck=S.checks[ds]||{};
    const done=rods.filter(r=>ck[r.id]).length;
    const pct=rods.length?Math.round(done/rods.length*100):0;
    cells30.push({ds,done,total:rods.length,pct});
  }
  // 이번 주(최근 7일) 평균
  const last7=cells30.slice(-7);
  const avg7=last7.length?Math.round(last7.reduce((s,c)=>s+c.pct,0)/last7.length):0;
  const avg30=cells30.length?Math.round(cells30.reduce((s,c)=>s+c.pct,0)/cells30.length):0;

  // ── 2) 연속 달성(스트릭): 오늘부터 거꾸로, 그날 루틴 100% 달성한 날 ──
  let streak=0;
  for(let i=0;i<365;i++){
    const ds=addDays(today,-i);
    const rods=routinesForDate(ds);
    if(rods.length===0){ if(i===0)continue; else break; }
    const ck=S.checks[ds]||{};
    const allDone=rods.every(r=>ck[r.id]);
    if(allDone)streak++; else break;
  }

  // ── 3) 루틴별 달성 횟수 (최근 30일) ──
  let routineStats={};
  cells30.forEach(c=>{
    const rods=routinesForDate(c.ds);
    const ck=S.checks[c.ds]||{};
    rods.forEach(r=>{
      if(!routineStats[r.id])routineStats[r.id]={task:r.task,done:0,total:0};
      routineStats[r.id].total++;
      if(ck[r.id])routineStats[r.id].done++;
    });
  });
  let statArr=Object.values(routineStats).map(function(s){s.rate=s.total?Math.round(s.done/s.total*100):0;return s;});
  statArr.sort((a,b)=>b.rate-a.rate);
  const best=statArr.slice(0,3);
  const worst=statArr.slice().sort((a,b)=>a.rate-b.rate).slice(0,3);

  // ── 4) 가계부 월 비교 ──
  const now=new Date();
  const ymThis=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const ymPrev=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  function sumMonth(ym,type){return (LD.transactions||[]).filter(t=>t.date.slice(0,7)===ym&&t.type===type).reduce((s,t)=>s+t.amount,0);}
  const incThis=sumMonth(ymThis,'income'),incPrev=sumMonth(ymPrev,'income');
  const expThis=sumMonth(ymThis,'expense'),expPrev=sumMonth(ymPrev,'expense');
  function diffLabel(cur,prev){
    if(prev===0)return cur>0?'<span style="color:var(--green)">신규</span>':'-';
    const d=Math.round((cur-prev)/prev*100);
    if(d===0)return '<span style="color:var(--t3)">변화 없음</span>';
    const up=d>0;
    return '<span style="color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'▲':'▼')+' '+Math.abs(d)+'%</span>';
  }

  // ── 5) 저축 월별 추이 (최근 6개월 누적) ──
  let svByMonth={};
  (S.savings&&S.savings.entries||[]).forEach(function(e){
    const m=e.date.slice(0,7);
    svByMonth[m]=(svByMonth[m]||0)+e.amount;
  });
  let svMonths=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    svMonths.push({m:(d.getMonth()+1)+'월',amount:svByMonth[m]||0});
  }
  const svMax=Math.max(1,...svMonths.map(x=>x.amount));

  // ── 6) 감사 일기 돌아보기 ──
  const diaryEntries=Object.keys(S.diaryEntries||{}).filter(k=>S.diaryEntries[k]&&S.diaryEntries[k].text).sort((a,b)=>b.localeCompare(a));
  // 작년 오늘 / 한달 전

  // ════════ HTML ════════

  html+='<div class="ins-stats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px">';

  var diaryDays=0, totalChars=0, dist={}, longest={ds:'',len:0};
  var monthCnt=Array(12).fill(0);
  Object.keys(S.diaryEntries||{}).forEach(function(ds){
    if(ds.slice(0,5)!==pfx)return;
    var e=S.diaryEntries[ds];if(!e)return;
    var has=!!(e.text||e.title||e.mood);
    if(!has)return;
    diaryDays++;
    monthCnt[parseInt(ds.slice(5,7))-1]++;
    var len=(e.text||'').length;
    totalChars+=len;
    if(len>longest.len)longest={ds:ds,len:len};
    if(e.mood)dist[e.mood]=(dist[e.mood]||0)+1;
  });
  var topMood='', topMoodCnt=0;
  Object.keys(dist).forEach(function(m){if(dist[m]>topMoodCnt){topMood=m;topMoodCnt=dist[m];}});
  // ── 루틴 ──
  var today=todStr();
  var rtSum=0,rtDays=0,perfectDays=0,bestStreak=0,curStreak=0;
  var rtStats={};
  var endDs=(Y===new Date().getFullYear())?today:Y+'-12-31';
  for(var ds=Y+'-01-01';ds<=endDs;ds=addDays(ds,1)){
    var rods=routinesForDate(ds),ck=S.checks[ds]||{};
    if(rods.length===0){continue;}
    var dn=rods.filter(r=>ck[r.id]).length;
    var p=Math.round(dn/rods.length*100);
    rtDays++;rtSum+=p;
    if(p===100){perfectDays++;curStreak++;if(curStreak>bestStreak)bestStreak=curStreak;}
    else curStreak=0;
    rods.forEach(function(r){
      if(!rtStats[r.id])rtStats[r.id]={task:r.task,done:0,total:0};
      rtStats[r.id].total++;if(ck[r.id])rtStats[r.id].done++;
    });
  }
  var rtAvg=rtDays?Math.round(rtSum/rtDays):0;
  var bestRt=null;
  Object.values(rtStats).forEach(function(s){
    if(s.total<10)return;
    s.rate=Math.round(s.done/s.total*100);
    if(!bestRt||s.rate>bestRt.rate)bestRt=s;
  });
  // ── 저축 / 가계부 / 마감 ──
  var yearSv=(S.savings&&S.savings.entries||[]).filter(function(e){return e.date&&e.date.slice(0,5)===pfx;}).reduce(function(s,e){return s+e.amount;},0);
  var yInc=0,yExp=0;
  (LD.transactions||[]).forEach(function(tx){
    if(tx.date.slice(0,5)!==pfx)return;
    if(tx.type==='income')yInc+=tx.amount;else if(tx.type==='expense')yExp+=tx.amount;
  });
  var dlDone=(S.deadlines||[]).filter(function(d){return d.done&&d.date&&d.date.slice(0,5)===pfx;}).length;

  // ════ HTML ════
  function tile(emoji,label,val,sub){
    return '<div style="background:var(--s2);border-radius:8px;padding:14px 12px;text-align:center">'+
      '<div style="font-size:1.3em;margin-bottom:4px">'+emoji+'</div>'+
      '<div style="font-family:var(--serif);font-size:1.25em;line-height:1.2;color:var(--text)">'+val+'</div>'+
      '<div style="font-size:0.7em;color:var(--t3);margin-top:3px">'+label+(sub?'<br>'+sub:'')+'</div></div>';
  }
  var body='<div style="text-align:center;margin-bottom:16px">'+
    '<div style="font-family:var(--serif);font-size:1.5em;color:var(--accent)">'+Y+'년의 루시</div>'+
    '<div style="font-size:0.78em;color:var(--t3);margin-top:2px">'+(Y===new Date().getFullYear()?'오늘까지의 기록이에요':'1년간의 기록이에요')+'</div></div>';

  body+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">';
  body+=tile('✍️','일기 쓴 날',diaryDays+'<span style="font-size:0.55em;color:var(--t3)">일</span>',totalChars>0?'총 '+totalChars.toLocaleString()+'자':'');
  body+=tile(topMood||'🌱','가장 많았던 기분',topMood?topMoodCnt+'<span style="font-size:0.55em;color:var(--t3)">일</span>':'-','');
  body+=tile('🔥','최장 연속 달성',bestStreak+'<span style="font-size:0.55em;color:var(--t3)">일</span>','100% 달성 '+perfectDays+'일');
  body+=tile('📈','루틴 연 평균',rtAvg+'<span style="font-size:0.55em;color:var(--t3)">%</span>','');
  body+=tile('💰','올해 모은 돈',money(yearSv),'');
  body+=tile('✅','끝낸 마감',dlDone+'<span style="font-size:0.55em;color:var(--t3)">개</span>','');
  body+='</div>';

  // 월별 일기 미니 차트
  var maxM=Math.max(1,...monthCnt);
  body+='<div style="margin-bottom:14px"><div style="font-size:0.78em;color:var(--t2);margin-bottom:6px">월별 일기</div>';
  body+='<div style="display:flex;gap:4px;align-items:flex-end;height:50px">';
  monthCnt.forEach(function(c,i){
    var h=Math.round(c/maxM*40);
    body+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div title="'+(i+1)+'월 '+c+'일" style="width:70%;background:var(--accent);opacity:'+(c>0?1:0.15)+';border-radius:3px 3px 0 0;height:'+Math.max(h,3)+'px"></div><div style="font-size:0.6em;color:var(--t3)">'+(i+1)+'</div></div>';
  });
  body+='</div></div>';

  // 기분 분포 (색상)
  var distKeys=Object.keys(dist);
  if(distKeys.length>0){
    var maxD=Math.max.apply(null,Object.values(dist));
    body+='<div style="margin-bottom:14px"><div style="font-size:0.78em;color:var(--t2);margin-bottom:6px">올해의 기분</div>';
    MOODS.forEach(function(m){
      var c=dist[m.v]||0;if(c===0)return;
      body+='<div style="display:flex;align-items:center;gap:8px;padding:3px 0">'+
        '<span style="width:22px;text-align:center;font-size:0.95em">'+m.v+'</span>'+
        '<div class="pw" style="flex:1;height:8px"><div class="pb" style="width:'+Math.round(c/maxD*100)+'%;background:'+(MOOD_COLORS[m.v]||'var(--accent)')+'"></div></div>'+
        '<span style="font-size:0.72em;color:var(--t3);font-family:var(--mono);width:34px;text-align:right">'+c+'일</span></div>';
    });
    body+='</div>';
  }

  // 하이라이트
  var highlights=[];
  if(bestRt)highlights.push('제일 잘 지킨 루틴은 <b>「'+bestRt.task+'」</b> ('+bestRt.rate+'%)');
  if(longest.len>0)highlights.push('가장 길게 쓴 일기는 <b>'+longest.ds+'</b> ('+longest.len.toLocaleString()+'자)');
  if(yInc>0||yExp>0)highlights.push('올해 수입 <b style="color:var(--green)">'+money(yInc)+'</b> · 지출 <b style="color:var(--red)">'+money(yExp)+'</b>');
  if(highlights.length>0){
    body+='<div style="padding:12px 14px;background:var(--al);border-radius:8px;font-size:0.85em;line-height:1.8">';
    highlights.forEach(function(h){body+='<div>· '+h+'</div>';});
    body+='</div>';
  }
  if(diaryDays===0&&rtSum===0&&yearSv===0&&yInc===0&&yExp===0&&dlDone===0){
    body+='<div class="empty">'+Y+'년 기록이 아직 없어요</div>';
  }

  openMo('🎁 '+Y+'년 결산',body,'<button class="btn bg" onclick="closeMo()">닫기</button>');
}

        '<div style="display:flex;gap:2px;flex-shrink:0">'+

        '</div>'+
      '</div>';
    });
  }

  const inner=
    '<div style="padding:20px 24px 12px;display:flex;align-items:center;justify-content:space-between">'+
      '<div><div style="font-size:1.1em;font-weight:600">'+dateLabel+'</div>'+

  document.body.appendChild(overlay);

function dayRoutineSkip(rid,ds){
  var r=S.routines.find(function(x){return x.id===rid;});
  if(r){
    if(!r.skipDates)r.skipDates=[];
    if(r.skipDates.indexOf(ds)===-1)r.skipDates.push(ds);
  }
  if(r&&r.rzProjectId){
    var p=S.projects.find(function(x){return x.id===r.rzProjectId;});
    var entry=p&&p.routinized?p.routinized.find(function(x){return x.id===rid;}):null;
    if(entry){
      if(!entry.skipDates)entry.skipDates=[];
      if(entry.skipDates.indexOf(ds)===-1)entry.skipDates.push(ds);
    }
  }
  if(S.checks[ds])delete S.checks[ds][rid];
  save();render();
  openDayRoutineModal(ds);
}
// 루틴화 항목의 반복 설정 자체를 수정 (모든 날짜에 반영됨)
function dayRoutineEdit(rid,ds){
  var r=S.routines.find(function(x){return x.id===rid;});
  if(!r||!r.rzProjectId)return;
  var p=S.projects.find(function(x){return x.id===r.rzProjectId;});
  if(!p||!p.routinized)return;
  var idx=p.routinized.findIndex(function(x){return x.id===rid;});
  if(idx<0)return;
  closeDayOverlayAnd(function(){openRzEditModal(p.id,idx);});
}

    return '<div class="mint-page pista-page">'+heroT+monthCards+

function addTodoCalItem(ds){

function applyTodoCalDate(fromDs,i){
  i=parseInt(i);
  var inp=document.getElementById('todo-date-inp');
  if(!inp||!inp.value)return;
  var toDs=inp.value;
  if(toDs===fromDs){closeMo();openTodoCalDay(fromDs);return;}
  if(!S.todoList||!S.todoList[fromDs]||!S.todoList[fromDs][i])return;
  var item=S.todoList[fromDs][i];
  if(!S.todoList[toDs])S.todoList[toDs]=[];
  S.todoList[toDs].push({id:gid(),text:item.text,done:false,_carried:item._carried||false});
  S.todoList[fromDs].splice(i,1);
  save();
  closeMo();
  render();
  // 이동된 날짜로 모달 열기
  setTimeout(function(){openTodoCalDay(toDs);},50);
}

  var filterBtnHtml='<button class="btn '+(activeFilterProjs.length?'bp':'bg')+' bsm" onclick="event.stopPropagation();openCalFilterPanel(this)" title="프로젝트별로 보기" style="display:flex;align-items:center;gap:5px">'+
      filterIconSvg+filterBtnLabel+

function openEvModal(pre){
  closeMo();
  openMo('일정 추가',
    '<div class="fg"><label class="fl">날짜</label><input type="date" class="inp" id="ev-date" value="'+(pre||todStr())+'"></div>'+
    '<div class="fg"><label class="fl">제목</label><input class="inp" id="ev-title" placeholder="일정 제목"></div>'+
    '<div class="fg"><label class="fl">색상</label><div class="cops">'+COLORS.map((c,i)=>'<div class="cop '+(i===0?'on':'')+'" style="background:'+c+'" onclick="pickEvC(this,\''+c+'\')"></div>').join('')+'</div></div>',
    '<button class="btn bg" onclick="closeMo()">취소</button><button class="btn bp" onclick="saveEv()">저장</button>');
  selEvC=COLORS[0];
}
function pickEvC(el,c){selEvC=c;document.querySelectorAll('.cop').forEach(e=>e.classList.remove('on'));el.classList.add('on');}
function saveEv(){var date=document.getElementById('ev-date').value,title=document.getElementById('ev-title').value.trim();if(!date||!title)return;S.calEvents.push({id:gid(),date,title,color:selEvC});save();closeMo();render();}
function openEvDetailModal(id){
  const ev=S.calEvents.find(e=>e.id===id);if(!ev)return;
  openMo('일정',
    '<div style="font-size:1em;font-weight:500;margin-bottom:6px">'+ev.title+'</div>'+
    '<div style="font-size:0.88em;color:var(--t3)">📅 '+ev.date+'</div>',
    '<button class="btn bg" onclick="closeMo()">닫기</button>'+
    '<button class="btn" style="background:var(--rl);color:var(--red)" onclick="delEv(\''+id+'\')">🗑 삭제</button>');
}
function delEv(id){S.calEvents=S.calEvents.filter(e=>e.id!==id);save();closeMo();render();}

function loadCustomFont(input, slot){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var name=file.name.replace(/\.[^.]+$/,'');
  var reader=new FileReader();
  reader.onload=function(e){
    var fontName='UserFont'+(slot+1);
    var fontFace=new FontFace(fontName, e.target.result);
    fontFace.load().then(function(ff){
      document.fonts.add(ff);
      if(!S.customFonts) S.customFonts=['','',''];
      if(!S.customFontData) S.customFontData=['','',''];
      S.customFonts[slot]=name;
      S.customFontData[slot]=e.target.result;
      S.font='custom'+(slot+1);
      save(); applyTheme(S.theme||'sky'); render();
    });
  };
  reader.readAsArrayBuffer(file);
}
function clearCustomFont(slot){
  if(!S.customFonts) S.customFonts=['','',''];
  if(!S.customFontData) S.customFontData=['','',''];
  S.customFonts[slot]=''; S.customFontData[slot]='';
  if(S.font==='custom'+(slot+1)) S.font='pretendard';
  save(); applyTheme(S.theme||'sky'); render();
}
function restoreCustomFont(){
  if(!S.customFontData) return;
  S.customFontData.forEach(function(data, i){
    if(!data) return;
    var fontFace=new FontFace('UserFont'+(i+1), data);
    fontFace.load().then(function(ff){ document.fonts.add(ff); });
  });
}

function importD(inp){const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{var d=JSON.parse(e.target.result);if(d.app){S=Object.assign({},S,d.app);if(d.ledger)LD=Object.assign({},LD,d.ledger);} else {S=Object.assign({},S,d);}save();saveLedger();render();alert('복원 완료!');}catch{alert('파일 오류');}};r.readAsText(file);}
function phWipeStorage(uid){
  if(!fbStorage) return Promise.resolve();
  return fbStorage.ref('users/'+uid+'/photos').listAll().then(function(r){ return Promise.all(r.items.map(function(i){ return i.delete().catch(function(){}); })); }).catch(function(){});
}
function resetD(){
  if(!confirm('모든 데이터를 삭제할까요?\n이 작업은 되돌릴 수 없어요.'))return;
  // localStorage 삭제
  localStorage.removeItem(KEY);
  localStorage.removeItem(LEDGER_KEY);
  try{ indexedDB.deleteDatabase('lucy_photos'); }catch(e){}
  // Firestore도 삭제 (서랍 + 사진)
  if(currentUser){
    const wipe=function(coll){ return db.collection('users').doc(currentUser.uid).collection(coll).get().then(function(snap){
      const docs=[];snap.forEach(function(doc){docs.push(doc.ref);});
      let p=Promise.resolve();
      for(let i=0;i<docs.length;i+=400){ const part=docs.slice(i,i+400); p=p.then(function(){ const b=db.batch(); part.forEach(function(r){b.delete(r);}); return b.commit(); }); }
      return p; }); };
    wipe('data').then(function(){ return wipe('photos'); }).then(function(){ return phWipeStorage(currentUser.uid); }).then(function(){location.reload();}).catch(function(){location.reload();});
  } else {
    location.reload();

function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function lighten(hex,amt){
  var c=hexToRgb(hex);
  var r=Math.min(255,Math.round(c.r+(255-c.r)*amt));
  var g=Math.min(255,Math.round(c.g+(255-c.g)*amt));
  var b=Math.min(255,Math.round(c.b+(255-c.b)*amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function darken(hex,amt){
  var c=hexToRgb(hex);
  var r=Math.max(0,Math.round(c.r*(1-amt)));
  var g=Math.max(0,Math.round(c.g*(1-amt)));
  var b=Math.max(0,Math.round(c.b*(1-amt)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function mixHex(hexA,hexB,t){
  var a=hexToRgb(hexA),b=hexToRgb(hexB);
  var r=Math.round(a.r+(b.r-a.r)*t),g=Math.round(a.g+(b.g-a.g)*t),bl=Math.round(a.b+(b.b-a.b)*t);
  return '#'+[r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// 테마별 원래(진한) 배경색 — 배경 진하기 슬라이더의 100% 지점

function applyBgIntensity(){
  var t=S.theme||'sky';
  var pct=(S.bgIntensity!=null?S.bgIntensity:0)/100;
  var bg;
  if(t==='custom'){
    var hex=S.customThemeColor||'#F9D0CD';
    var amt=0.97-pct*0.62; // 0%→0.97(거의 흰색) · 100%→0.35(진하게)
    bg=lighten(hex,amt);
  }else{
    var base=THEME_BASE_BG[t]||THEME_BASE_BG.sky;
    var veryPale=lighten(base,0.95);
    bg=mixHex(veryPale,base,pct);
  }
  document.body.style.setProperty('--bg',bg);
}
function setBgIntensity(v){
  S.bgIntensity=parseInt(v)||0;

  var fontMap={

    notoserif:"'Noto Serif KR','Nanum Myeongjo',serif",

    custom2: S.customFonts&&S.customFonts[1] ? "'UserFont2',sans-serif" : "'Pretendard',sans-serif",
  };
  var chosen = fontMap[f] || fontMap.pretendard;
  var root = document.documentElement.style;

    serif:"Georgia,'Noto Serif KR',serif",

}

function syncRzToRoutines(){
  (S.projects||[]).forEach(function(p){
    (p.routinized||[]).forEach(function(entry){
      var exists = S.routines.some(function(r){ return r.id === entry.id; });
      if(!exists){
        S.routines.push({
          id: entry.id,
          time: entry.time||'',
          task: entry.task,
          detail: p.name+' 루틴화',
          days: entry.days||[],
          monthDays: entry.monthDays||[],
          isMonthly: !!entry.isMonthly,
          saveAmount: entry.saveAmount||0,
          startDate: entry.startDate||'',
          until: entry.until||'',
          isRz: true,
          rzProjectId: p.id
        });
      } else {
        // 기존 루틴에 최신 정보 전체 반영
        S.routines.forEach(function(r){
          if(r.id===entry.id){
            r.time=entry.time||'';
            r.task=entry.task;
            r.detail=p.name+' 루틴화';
            r.days=entry.days||[];
            r.monthDays=entry.monthDays||[];
            r.isMonthly=!!entry.isMonthly;
            r.saveAmount=entry.saveAmount||0;
            r.startDate=entry.startDate||'';
            r.until=entry.until||'';
          }
        });
      }
    });
  });
  S.routines = S.routines.filter(function(r){
    if(!r.isRz) return true;
    return (S.projects||[]).some(function(p){
      return (p.routinized||[]).some(function(e){ return e.id === r.id; });
    });
  });
  S.routines.sort(function(a,b){ return a.time.localeCompare(b.time); });
}

  if(ledgerTab==='dashboard') html+=renderLedgerDashboard();
  else if(ledgerTab==='calendar') html+=renderLedgerCalendar();
  else if(ledgerTab==='assets') html+=renderLedgerAssets();
  else if(ledgerTab==='settings') html+=renderLedgerSettings();
  return html;
}

function fmtMoney(n){if(!n&&n!==0)return '0원';return new Intl.NumberFormat('ko-KR').format(Math.round(n))+'원';}

function openMonthlyLedgerReport(){
  const ym=ledgerYear+'-'+String(ledgerMonth+1).padStart(2,'0');
  const prevYm=ledgerMonth===0?(ledgerYear-1)+'-12':ledgerYear+'-'+String(ledgerMonth).padStart(2,'0');
  const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  function collect(targetYm){
    var inc=0,exp=0,cats={};
    (LD.fixedItems||[]).forEach(function(fi){
      if(fi.amount&&fi.amount!=='req_input'){
        var amt=Number(fi.amount)||0;exp+=amt;
        var major=fi.majorCategory||'고정 지출';
        cats[major]=(cats[major]||0)+amt;
      }
    });
    (LD.transactions||[]).forEach(function(tx){
      if(tx.date.slice(0,7)!==targetYm)return;
      if(tx.type==='income')inc+=tx.amount;
      else if(tx.type==='expense'){exp+=tx.amount;cats[tx.majorCategory]=(cats[tx.majorCategory]||0)+tx.amount;}
    });
    return {inc:inc,exp:exp,cats:cats};
  }
  var cur=collect(ym), prev=collect(prevYm);
  var net=cur.inc-cur.exp;
  var saveRate=cur.inc>0?Math.round(net/cur.inc*100):0;

  function diffTag(c,p){
    if(p===0)return c>0?'<span style="font-size:0.78em;color:var(--t3)">신규</span>':'<span style="font-size:0.78em;color:var(--t3)">-</span>';

    if(d===0)return '<span style="font-size:0.78em;color:var(--t3)">동일</span>';
    return '<span style="font-size:0.78em;color:'+(d>0?'var(--green)':'var(--red)')+'">'+(d>0?'▲':'▼')+' '+Math.abs(d)+'%</span>';

      '</div>';
    var rows=allCats.filter(function(c){return (cur.cats[c]||0)||(prev.cats[c]||0);});
    if(rows.length){

  let totalInc=0,totalExp=0,totalSav=0;

      if(!expCats['고정 지출'])expCats['고정 지출']={total:0,subs:{}};
      expCats['고정 지출'].total+=amt*12;
      expCats['고정 지출'].subs[fi.title||'고정']=(expCats['고정 지출'].subs[fi.title||'고정']||0)+amt*12;
    }
  });
  (LD.transactions||[]).forEach(function(tx){
    if(!tx.date.startsWith(year+'-'))return;
    if(tx.type==='income'){
      totalInc+=tx.amount;
      if(!incCats[tx.majorCategory])incCats[tx.majorCategory]={total:0,subs:{}};
      incCats[tx.majorCategory].total+=tx.amount;
      const s=tx.minorCategory||'기타';
      incCats[tx.majorCategory].subs[s]=(incCats[tx.majorCategory].subs[s]||0)+tx.amount;
    } else if(tx.type==='expense'){
      totalExp+=tx.amount;
      if(!expCats[tx.majorCategory])expCats[tx.majorCategory]={total:0,subs:{}};
      expCats[tx.majorCategory].total+=tx.amount;
      const s=tx.minorCategory||'기타';
      expCats[tx.majorCategory].subs[s]=(expCats[tx.majorCategory].subs[s]||0)+tx.amount;
    }
  });
  (S.savings&&S.savings.entries||[]).forEach(function(e){
    if(e.date&&e.date.startsWith(year+'-'))totalSav+=e.amount||0;
  });
  function catRows(map,color){
    return Object.entries(map).sort((a,b)=>b[1].total-a[1].total).map(function([major,data]){
      let r='<div style="margin-bottom:10px">';

    '<div style="text-align:center;padding:16px;background:var(--s2);border-radius:8px"><div style="font-size:0.78em;color:var(--t3);margin-bottom:4px">연간 총 지출</div><div style="font-size:1.3em;font-weight:700;color:var(--red)">'+fmtMoney(totalExp)+'</div></div>'+
    '<div style="text-align:center;padding:16px;background:var(--s2);border-radius:8px"><div style="font-size:0.78em;color:var(--t3);margin-bottom:4px">연간 저축</div><div style="font-size:1.3em;font-weight:700;color:var(--accent)">'+fmtMoney(totalSav)+'</div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
    '<div><div style="font-size:0.88em;font-weight:600;color:var(--t2);margin-bottom:10px">💚 수입</div>'+catRows(incCats,'var(--green)')+'</div>'+
    '<div><div style="font-size:0.88em;font-weight:600;color:var(--t2);margin-bottom:10px">❤️ 지출</div>'+catRows(expCats,'var(--red)')+'</div>'+
    '</div>';
  if(document.body.classList.contains('cozy')){

    var mmx=Math.max(1,...mInc),nowM=(new Date().getFullYear()===year)?new Date().getMonth():-1;

        '<div class="rp-mini"><div class="rp-lab"><i style="background:#8FB59A"></i>연간 수입</div><div class="rp-amt">'+fmtMoney(totalInc)+'</div></div>'+
        '<div class="rp-mini"><div class="rp-lab"><i style="background:#EE9C8A"></i>연간 지출</div><div class="rp-amt">'+fmtMoney(totalExp)+'</div></div>'+
      '</div>'+
      '<div class="rp-sec"><h4>달마다 들어온 돈</h4></div>'+
      '<div class="rp-card rp-months">'+mInc.map(function(v,i){return '<div class="rp-m'+(i===nowM?' on':'')+'"><div class="rp-mb"><i style="height:'+Math.max(v?6:0,Math.round(v/mmx*100))+'%"></i></div><span>'+(i+1)+'</span></div>';}).join('')+'</div>'+
      '<div class="rp-cols"><div><div class="rp-sec"><h4>수입</h4></div>'+czCats(incCats,'inc')+'</div>'+
      '<div><div class="rp-sec"><h4>지출</h4></div>'+czCats(expCats,'exp')+'</div></div>'+
      '</div>';
    if(asPage) return yb;
    openMo(year+'년 연간 대시보드',yb,'<button class="btn bg" onclick="closeMo()">닫기</button>');
    return;
  }
  openMo(year+'년 연간 대시보드',body,'<button class=\"btn bg\" onclick=\"closeMo()\">닫기</button>');
}
function ledgerPrevMonth(){if(ledgerMonth===0){ledgerMonth=11;ledgerYear--;}else ledgerMonth--;render();}

    (LD.transactions||[]).forEach(function(tx){if(tx.date.slice(0,7)===k){if(tx.type==='income')inc+=tx.amount;else if(tx.type==='expense')exp+=tx.amount;}});
    const isCur=(i===ledgerMonth);
    const tipTxt=MN[i]+'  수입 +'+new Intl.NumberFormat('ko-KR').format(inc)+'  지출 -'+new Intl.NumberFormat('ko-KR').format(exp);

function _ensureLedgerTip(){
  var tip=document.getElementById('ledger-cal-tip');
  if(!tip){
    tip=document.createElement('div');
    tip.id='ledger-cal-tip';
    tip.style.cssText='position:fixed;z-index:99999;pointer-events:none;display:none;background:var(--surface);color:var(--text);padding:10px 13px;border-radius:8px;font-size:0.82em;line-height:1.6;white-space:pre;box-shadow:0 4px 16px rgba(0,0,0,0.12);border:1px solid var(--border);max-width:280px';
    document.body.appendChild(tip);
  }
  return tip;
}
function showLedgerTip(el,e){
  var txt=el.getAttribute('data-tip');
  if(!txt)return;
  var tip=_ensureLedgerTip();
  tip.textContent=txt.replace(/&#10;/g,'\n').replace(/&quot;/g,'"');
  tip.style.display='block';
  moveLedgerTip(e);
}
function moveLedgerTip(e){
  var tip=document.getElementById('ledger-cal-tip');
  if(!tip||tip.style.display==='none')return;
  var x=e.clientX+14, y=e.clientY+14;
  var tw=tip.offsetWidth, th=tip.offsetHeight;
  if(x+tw>window.innerWidth-10) x=e.clientX-tw-14;
  if(y+th>window.innerHeight-10) y=e.clientY-th-14;
  tip.style.left=x+'px';
  tip.style.top=y+'px';
}
function hideLedgerTip(){
  var tip=document.getElementById('ledger-cal-tip');
  if(tip)tip.style.display='none';
}

  fixedItems.forEach(function(fi){

  }

  txs.forEach(function(tx){
    const sign=tx.type==='income'?'+':tx.type==='transfer'?'±':'-';

    inner+=(tx.memo?'<div style="font-size:0.75em;color:var(--t3)">'+tx.memo+'</div>':'')+' </div>';

// ═══════════ 자산 현황 업그레이드: 추이 · 목표 · 구성 · 알림 · 부채 ═══════════
function ldNwSnapshot(net){var ym=todStr().slice(0,7);if(!LD.nwHistory)LD.nwHistory={};if(LD.nwHistory[ym]!==net){LD.nwHistory[ym]=net;try{saveLedger();}catch(e){}}}
function ldMonthsBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return (y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth())+(y.getDate()>=x.getDate()?0:-1);}
function ldMonthlyPace(){
  var h=LD.nwHistory||{},ks=Object.keys(h).sort();
  if(ks.length>=2){var a=ks[Math.max(0,ks.length-7)],b=ks[ks.length-1],n=ldMonthsBetween(a+'-01',b+'-01');if(n>0)return (h[b]-h[a])/n;}
  var t=todStr(),from=addDays(t,-90),sum=0;((S.savings&&S.savings.entries)||[]).forEach(function(e){if(e.date>=from&&e.date<=t)sum+=e.amount;});
  return sum?sum/3:0;
}
function ldGoalCalc(){
  var g=LD.assetGoal;if(!g||!g.amount)return null;
  var assets=LD.assets||[],net=assets.reduce(function(s,a){return s+(a.type==='asset'?a.amount:-a.amount);},0);
  var t=todStr(),rem=Math.max(0,g.amount-net),pct=Math.max(0,Math.min(100,Math.round(net/g.amount*100)));
  var months=g.date?Math.max(1,ldMonthsBetween(t,g.date)):null,need=months?Math.ceil(rem/months):null,pace=ldMonthlyPace(),eta=null;
  if(pace>0&&rem>0){var d=new Date();d.setMonth(d.getMonth()+Math.ceil(rem/pace));eta=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';}
  return {g:g,net:net,rem:rem,pct:pct,months:months,need:need,pace:pace,eta:eta};
}
function ldAssetInsights(assets,totalAsset,totalLiab,net){
  ldNwSnapshot(net);
  var h='<div class="lda">';
  var at=goalTips().filter(function(x){return x.go.indexOf('ledger')>=0;});
  h+=ldAssetTips(assets,totalAsset,totalLiab,net,at);
  // 목표
  var gc=ldGoalCalc();
  if(gc){
    h+='<div class="card lda-goal"><div class="lda-h"><div class="lda-t"><em>goal</em>'+esc(gc.g.name||'자산 목표')+'</div><button class="btn bg bsm" onclick="openAssetGoal()">수정</button></div>'+
      '<div class="lda-gn"><b>'+gc.pct+'%</b><span>'+fmtMoney(gc.net)+' / '+fmtMoney(gc.g.amount)+'</span></div><div class="lda-bar"><i style="width:'+gc.pct+'%"></i></div>'+
      '<div class="lda-facts">'+
        '<div><small>남은 금액</small><b>'+fmtMoney(gc.rem)+'</b></div>'+
        (gc.need!=null?'<div><small>'+esc(gc.g.date.slice(0,7).replace('-','.'))+'까지 매달</small><b>'+fmtMoney(gc.need)+'</b></div>':'')+
        '<div><small>최근 월평균 증가</small><b>'+(gc.pace?fmtMoney(Math.round(gc.pace)):'기록 쌓는 중')+'</b></div>'+
        '<div><small>이 속도면 달성</small><b>'+(gc.rem<=0?'달성 완료 ✿':gc.eta||'-')+'</b></div>'+
      '</div></div>';
  } else h+='<button type="button" class="card lda-goal lda-empty" onclick="openAssetGoal()">+ 자산 목표 정하기 <span>예: 내 집 마련 6억 · 2030년</span></button>';
  // 추이
  var hs=LD.nwHistory||{},ks=Object.keys(hs).sort().slice(-12);
  h+='<div class="card lda-trend"><div class="lda-h"><div class="lda-t"><em>trend</em>순자산 추이</div><span class="lda-c">최근 '+ks.length+'개월</span></div>';
  if(ks.length<2) h+='<div class="lda-note">달마다 자동으로 기록돼요. 다음 달부터 그래프가 그려져요.</div>';
  else{var vs=ks.map(function(k){return hs[k];}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=(mx-mn)||1,W=320,H=90;
    var pts=vs.map(function(v,i){return [(i/(vs.length-1))*W,H-8-((v-mn)/rg)*(H-16)];});
    h+='<svg class="lda-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polygon fill="var(--cz-soft)" points="0,'+H+' '+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+' '+W+','+H+'"/><polyline fill="none" stroke="var(--cz-acc)" stroke-width="2.2" vector-effect="non-scaling-stroke" points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+'"/></svg>'+
      '<div class="lda-axis"><span>'+ks[0].replace('-','.')+'</span><span>'+ks[ks.length-1].replace('-','.')+'</span></div>';
    var diff=vs[vs.length-1]-vs[0];h+='<div class="lda-note">'+(diff>=0?'▲ ':'▼ ')+fmtMoney(Math.abs(diff))+' '+(diff>=0?'늘었어요':'줄었어요')+'</div>';}
  h+='</div>';
  // 구성
  var cats={};assets.filter(function(a){return a.type==='asset'&&a.amount>0;}).forEach(function(a){cats[a.category]=(cats[a.category]||0)+a.amount;});
  var ce=Object.entries(cats).sort(function(a,b){return b[1]-a[1];}),cols=['#C9A27E','#A9C8B0','#E8B4A8','#B4C7DB','#D7C4DD','#E6D3A3','#C8C0B8'];
  h+='<div class="card lda-mix"><div class="lda-h"><div class="lda-t"><em>mix</em>자산 구성</div></div>';
  if(!ce.length) h+='<div class="lda-note">자산을 추가하면 비율이 보여요</div>';
  else{var acc=0,stops=ce.map(function(e,i){var a0=acc/totalAsset*100;acc+=e[1];return cols[i%cols.length]+' '+a0.toFixed(2)+'% '+(acc/totalAsset*100).toFixed(2)+'%';}).join(',');
    h+='<div class="lda-mixb"><div class="lda-donut" style="background:conic-gradient('+stops+')"><span>'+ce.length+'<small>종류</small></span></div><div class="lda-leg">'+ce.map(function(e,i){return '<div><i style="background:'+cols[i%cols.length]+'"></i><span>'+esc(e[0])+'</span><b>'+Math.round(e[1]/totalAsset*100)+'%</b></div>';}).join('')+'</div></div>';}
  h+='</div>';
  // 알림
  var t=todStr(),al=[],dToday=new Date().getDate();
  assets.forEach(function(a){
    if(a.maturityDate){var dl=dLeft(a.maturityDate);if(dl>=0&&dl<=60)al.push({d:dl,ic:'⏳',tx:esc(a.name)+' 만기','sub':a.maturityDate.replace(/-/g,'.')});else if(dl<0&&dl>=-30)al.push({d:dl,ic:'!',tx:esc(a.name)+' 만기 지남','sub':'재예치나 이동을 정해 주세요'});}
    if(a.payDay){var pd=a.payDay,left=pd>=dToday?pd-dToday:null;if(left!=null&&left<=7)al.push({d:left,ic:a.type==='liability'?'↘':'↗',tx:esc(a.name)+(a.type==='liability'?' 상환':' 납입')+(a.monthly?' '+fmtMoney(a.monthly):''),'sub':'매달 '+pd+'일'});}
  });

function ldMoneyTipsCard(c){
  var tips=[],t=todStr(),isCur=c.ym===t.slice(0,7);
  var now=new Date(),day=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(isCur&&c.totalBudget>0){
    var usePct=Math.round(c.totalSpent/c.totalBudget*100),timePct=Math.round(day/dim*100);
    if(c.totalSpent>c.totalBudget) tips.push({ic:'!',tx:'이번 달 예산을 '+fmtMoney(c.totalSpent-c.totalBudget)+' 넘었어요',sub:'남은 '+(dim-day)+'일은 꼭 필요한 지출만 해요'});
    else if(usePct>timePct+10) tips.push({ic:'◔',tx:'예산 '+usePct+'% 사용 · 한 달의 '+timePct+'%가 지났어요',sub:'남은 '+(dim-day)+'일 동안 하루 '+fmtMoney(Math.floor((c.totalBudget-c.totalSpent)/Math.max(1,dim-day+1)))+'씩 쓰면 예산 안이에요'});
    else tips.push({ic:'✿',tx:'예산 페이스 좋아요 · '+usePct+'% 사용',sub:'하루 '+fmtMoney(Math.floor((c.totalBudget-c.totalSpent)/Math.max(1,dim-day+1)))+'까지 써도 괜찮아요'});
  }
  // 카테고리 증가
  var prevCat={};(LD.transactions||[]).forEach(function(tx){if(tx.type==='expense'&&tx.date.slice(0,7)===c.prevYm)prevCat[tx.majorCategory]=(prevCat[tx.majorCategory]||0)+tx.amount;});
  var up=Object.keys(c.catMap).map(function(k){return [k,(c.catMap[k]||0)-(prevCat[k]||0),prevCat[k]||0];}).filter(function(x){return x[1]>=50000&&x[2]>0;}).sort(function(a,b){return b[1]-a[1];})[0];
  if(up) tips.push({ic:'↗',tx:esc(up[0])+' 지출이 지난달보다 '+fmtMoney(up[1])+' 늘었어요',sub:'지난달 '+fmtMoney(up[2])+' → 이번 달 '+fmtMoney(c.catMap[up[0]])});
  // 저축률
  if(c.curInc>0){var rate=Math.round((c.curInc-c.curExp)/c.curInc*100);
    tips.push(rate>=30?{ic:'♢',tx:'이번 달 저축 여력 '+rate+'% · '+fmtMoney(c.curInc-c.curExp),sub:'남은 돈을 목표 통장으로 옮겨 두면 자산 목표에 바로 반영돼요'}:rate>=0?{ic:'♢',tx:'이번 달 남은 돈은 수입의 '+rate+'%예요',sub:'수입의 30%를 먼저 떼어 두는 걸 목표로 해 봐요'}:{ic:'!',tx:'이번 달 지출이 수입보다 '+fmtMoney(c.curExp-c.curInc)+' 많아요',sub:'고정 지출부터 한 번 점검해 봐요'});}
  // 고정비 비중
  var fx=(LD.fixedItems||[]).reduce(function(a,f){return a+(f.amount&&f.amount!=='req_input'?Number(f.amount)||0:0);},0);
  if(fx>0&&c.curInc>0&&fx/c.curInc>0.4) tips.push({ic:'⌁',tx:'고정 지출이 수입의 '+Math.round(fx/c.curInc*100)+'%예요',sub:'구독·통신비처럼 줄일 수 있는 게 있는지 봐요'});
  // 목표 연결
  var gc=ldGoalCalc();
  if(gc&&gc.need&&c.curInc>0&&isCur){var left=c.curInc-c.curExp;tips.push(left>=gc.need?{ic:'⌂',tx:esc(gc.g.name||'자산 목표')+' 이번 달 필요 금액 '+fmtMoney(gc.need)+' 충분해요',sub:'남은 돈 '+fmtMoney(left)}:{ic:'⌂',tx:esc(gc.g.name||'자산 목표')+'까지 이번 달 '+fmtMoney(gc.need-Math.max(0,left))+' 부족해요',sub:'매달 '+fmtMoney(gc.need)+' 필요 · 이번 달 남은 돈 '+fmtMoney(Math.max(0,left))});}
  return '<div style="margin-bottom:16px">'+ldTipsHtml('가계부 코치',tips.slice(0,4))+'</div>';
}

function goalTips(){
  var tips=[],t=todStr();
  try{
    var gc=ldGoalCalc();
    if(gc&&gc.rem>0){
      if(gc.need!=null&&gc.pace>0&&gc.pace<gc.need) tips.push({ic:'⌂',tx:esc(gc.g.name||'자산 목표')+'까지 매달 '+fmtMoney(gc.need)+'이 필요한데, 지금 속도는 월 '+fmtMoney(Math.round(gc.pace))+'예요',sub:'이 속도면 '+(gc.eta||'-')+' 달성 · 한 달에 '+fmtMoney(Math.round(gc.need-gc.pace))+' 더 모으면 제때 가요',go:"ledgerTab='assets';go('ledger')"});
      else if(gc.need!=null) tips.push({ic:'⌂',tx:esc(gc.g.name||'자산 목표')+' '+gc.pct+'% · 매달 '+fmtMoney(gc.need)+'씩이면 목표일에 달성해요',sub:gc.eta?'지금 속도면 '+gc.eta+' 예상':'',go:"ledgerTab='assets';go('ledger')"});
      else if(gc.eta) tips.push({ic:'⌂',tx:esc(gc.g.name||'자산 목표')+' 지금 속도면 '+gc.eta+'에 달성해요',sub:'남은 금액 '+fmtMoney(gc.rem),go:"ledgerTab='assets';go('ledger')"});
    }
    (LD.assets||[]).forEach(function(a){if(a.maturityDate){var dl=dLeft(a.maturityDate);if(dl>=0&&dl<=14)tips.push({ic:'⏳',tx:esc(a.name)+' 만기 D-'+dl,sub:'재예치할지, 목표 통장으로 옮길지 정해 두세요',go:"ledgerTab='assets';go('ledger')"});}});
    var sv=S.savings||{};
    if(sv.goal&&sv.goalDate){var rem=Math.max(0,sv.goal-(sv.current||0)),m=Math.max(1,ldMonthsBetween(t,sv.goalDate)),need=Math.ceil(rem/m),ym=t.slice(0,7),thisM=((sv.entries||[]).filter(function(e){return e.date&&e.date.slice(0,7)===ym;}).reduce(function(a,e){return a+e.amount;},0));
      if(rem>0){var day=new Date().getDate();if(day>=15&&thisM<need)tips.push({ic:'♢',tx:'이번 달 저축 '+money(thisM)+' · 목표 페이스보다 '+money(need-thisM)+' 적어요',sub:esc(sv.goalName||'저축 목표')+'까지 매달 '+money(need)+' 필요',go:"go('savings')"});}}
    (S.lifeAreas||[]).forEach(function(la){if(!la.dday)return;var dl=dLeft(la.dday);if(dl<0)return;var pc=lifeProgress(la);if(dl<=30&&pc<70)tips.push({ic:'✿',tx:esc(la.name)+' D-'+dl+' · 진행 '+pc+'%',sub:'남은 기간에 집중할 프로젝트를 이번 주 할 것으로 골라 보세요',go:"goToArea('"+la.id+"')"});});
  }catch(e){}
  return tips.slice(0,4);
}

function deleteLedgerFixed(i){if(!confirm('삭제할까요?'))return;(LD.fixedItems||[]).splice(i,1);saveLedger();render();}
function changeLedgerFixedMajor(major){

function addLedgerAssetCat(type){
  const id=type==='asset'?'new-asset-cat':'new-liab-cat';
  const el=document.getElementById(id); if(!el||!el.value.trim())return;
  if(type==='asset'){if(!LD.assetCats)LD.assetCats=['현금/입출금','예적금','주식/펀드','부동산','기타'];if(!LD.assetCats.includes(el.value.trim()))LD.assetCats.push(el.value.trim());}
  else{if(!LD.liabCats)LD.liabCats=['대출','신용카드값','할부','보증금 대출','기타'];if(!LD.liabCats.includes(el.value.trim()))LD.liabCats.push(el.value.trim());}
  saveLedger();render();
}
function saveLedgerFixed(){
  const day=parseInt(document.getElementById('lf-day').value);
  const acc=document.getElementById('lf-acc')?document.getElementById('lf-acc').value:'';
  const major=document.getElementById('lf-major')?document.getElementById('lf-major').value:'';
  const minor=document.getElementById('lf-minor')?document.getElementById('lf-minor').value:'';
  const amtVal=document.getElementById('lf-amt')?document.getElementById('lf-amt').value.trim():'';
  const memo=(document.getElementById('lf-memo')?document.getElementById('lf-memo').value.trim():'')||major||'고정 지출';
  if(!day||isNaN(day)||day<1||day>31)return;
  const amount=amtVal?parseInt(amtVal,10):'req_input';
  if(!LD.fixedItems)LD.fixedItems=[];
  LD.fixedItems.push({id:gid(),day,type:'expense',account:acc,majorCategory:major,minorCategory:minor,amount,memo});
  LD.fixedItems.sort((a,b)=>a.day-b.day);
  saveLedger();
  const ov=document.getElementById('ledger-fixed-overlay'); if(ov)ov.remove();
  render();
}
function deleteLedgerAssetCat(type,cat){
  if(type==='asset'){if(!LD.assetCats)LD.assetCats=['현금/입출금','예적금','주식/펀드','부동산','기타'];LD.assetCats=LD.assetCats.filter(c=>c!==cat);}
  else{if(!LD.liabCats)LD.liabCats=['대출','신용카드값','할부','보증금 대출','기타'];LD.liabCats=LD.liabCats.filter(c=>c!==cat);}
  saveLedger();render();
}
function updateLedgerAssetCats(type){
  const sel=document.getElementById('la-cat'); if(!sel)return;

  sel.innerHTML=list.map(c=>'<option>'+c+'</option>').join('');
}
function saveLedgerAsset(){
  const type=document.getElementById('la-type').value;
  const cat=document.getElementById('la-cat').value;
  const name=document.getElementById('la-name').value.trim();
  const amt=parseInt(document.getElementById('la-amt').value)||0;
  const rate=parseFloat(document.getElementById('la-rate').value)||0;
  const mat=document.getElementById('la-mat').value;
  const pday=parseInt(document.getElementById('la-pday').value)||0,mon=parseInt(document.getElementById('la-mon').value)||0;
  if(!name)return;
  if(!LD.assets)LD.assets=[];
  var eid=arguments[0];
  if(eid){LD.assets=LD.assets.map(function(a){return a.id===eid?Object.assign({},a,{type:type,category:cat,name:name,amount:amt,interestRate:rate,maturityDate:mat,payDay:pday,monthly:mon}):a;});}
  else LD.assets.push({id:gid(),type,category:cat,name,amount:amt,interestRate:rate,maturityDate:mat,payDay:pday,monthly:mon});
  saveLedger();
  const ov=document.getElementById('ledger-asset-overlay'); if(ov)ov.remove();
  render();
}

// ═══════════ 인세 정산 불러오기 ═══════════
// 인세 관리 앱(royalty.html)은 정산액을 미리 계산해서 저장해두지 않고, 앱 전체 상태
// (users/{uid}/appdata/royalty 문서의 payload)에 담긴 monthlyData(작품×월 매출) +
// masterWorks(작품→출판사) + publisherData(출판사→정산일)를 조합해 그때그때 화면에서
// 계산한다. 여기서도 같은 방식으로 월별·출판사별 정산액을 직접 집계한다.
async function loadRoyaltyFromFirebase(){
  const statusEl=document.getElementById('royalty-status');
  if(statusEl)statusEl.textContent='불러오는 중...';
  try{
    const user=auth.currentUser;
    if(!user)throw new Error('로그인 필요');
    const snap=await db.collection('users').doc(user.uid).collection('appdata').doc('royalty').get();
    const docData=snap.exists&&snap.data();
    const payload=docData&&docData.payload;
    if(!payload)throw new Error('인세 관리 앱에 저장된 데이터가 없어요');
    const savedAt=docData._savedAt||null;
    const state=JSON.parse(payload);
    const monthlyData=state.monthlyData||{};
    const masterWorks=state.masterWorks||[];
    const publisherData=state.publisherData||{};
    const workById={};
    masterWorks.forEach(function(w){workById[w.id]=w;});

    // 선인세: 인세 앱의 작품별 '선인세 입금 내역'(w.advances = [{id,date,amount}])도 그 달 monthlyData 칸에
    // 더해져 있으므로, 그만큼 인세에서 빼서 실제로 들어온 날짜의 별도 수입 항목으로 만든다.
    const royalty={};
    Object.keys(monthlyData).forEach(function(ym){
      const pubTotals={};
      const advItems=[];
      Object.entries(monthlyData[ym]||{}).forEach(function(entry){
        const workId=entry[0];
        let amount=Number(entry[1])||0;
        if(!amount)return;
        const w=workById[workId];
        if(!w)return;
        const pub=w.settlementPublisher||w.publisher;
        if(!pub)return;
        (Array.isArray(w.advances)?w.advances:[]).forEach(function(a){
          if(String(a.date||'').slice(0,7)!==ym)return;
          const amt=Number(a.amount)||0;
          if(!amt)return;
          const dd=String(a.date).slice(8,10);
          advItems.push({publisher:pub,isAdv:true,title:w.title,advKey:workId+'|'+(a.id||a.date),amount:amt,paymentDay:dd?String(Number(dd)):''});
          amount-=amt;
        });
        pubTotals[pub]=(pubTotals[pub]||0)+amount;
      });
      const items=Object.keys(pubTotals)
        .filter(function(pub){return pubTotals[pub]!==0;})
        .map(function(pub){
          return {publisher:pub,amount:pubTotals[pub],paymentDay:(publisherData[pub]||{}).paymentDay||''};
        })
        .concat(advItems);
      if(items.length)royalty[ym]=items;
    });
    if(Object.keys(royalty).length===0)throw new Error('정산 내역이 없어요');

    showRoyaltyImportModal(royalty,savedAt);
    if(statusEl)statusEl.textContent='';
  }catch(e){
    if(statusEl)statusEl.textContent='❌ 불러오기 실패: '+e.message;
  }
}

function showRoyaltyImportModal(royalty,savedAt){
  const months=Object.keys(royalty).sort().reverse().slice(0,12);
  const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  let html='';
  if(savedAt){
    const d=new Date(savedAt);
    const ageMs=Date.now()-savedAt;
    const ageDays=ageMs/86400000;
    const stale=ageDays>2;
    const dateStr=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    html+='<div style="font-size:0.8em;margin-bottom:10px;padding:8px 10px;border-radius:8px;background:'+(stale?'var(--al)':'var(--s2)')+';color:'+(stale?'var(--red,#C14A3C)':'var(--t3)')+'">'+
      (stale?'⚠ ':'☁ ')+'인세 앱에서 '+dateStr+'에 마지막으로 동기화된 데이터예요'+
      (stale?' — 2일 넘게 지났어요. 인세 앱을 열어서 클라우드 저장이 제대로 되고 있는지 확인해보세요.':'')+
    '</div>';
  }
  let monthOpts=months.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  html+='<div class="fg"><label class="fl">가져올 월 선택</label><select class="sel" id="roy-month" onchange="previewRoyalty(this.value)">'+monthOpts+'</select></div>';
  html+='<div id="roy-preview" style="margin-top:10px"></div>';

  openMo('📥 인세 정산 가져오기', html,
    '<button class="btn bg" onclick="closeMo()">취소</button>'+
    '<button class="btn bp" onclick="importRoyaltyMonth()">수입으로 등록</button>');

  // 저장해두기
  window._royaltyData=royalty;
  // 첫 달 미리보기
  setTimeout(function(){previewRoyalty(months[0]);},100);
}

function previewRoyalty(ym){
  const royalty=window._royaltyData;
  if(!royalty||!royalty[ym])return;
  const items=royalty[ym];
  const prev=document.getElementById('roy-preview');
  if(!prev)return;
  let html='<div style="font-size:0.82em;color:var(--t3);margin-bottom:8px">등록될 수입 내역 (출판사별 입금일에 등록 · 선인세는 실제 입금일에 따로 등록)</div>';
  let total=0;
  items.forEach(function(item){
    const day=item.paymentDay==='말일'?'말일':item.paymentDay?item.paymentDay+'일':'?';
    html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.88em">';
    const advTag=item.isAdv?' <span style="font-size:0.8em;font-weight:600;color:var(--primary,var(--accent));margin-left:4px">선인세</span><span style="color:var(--t3);font-size:0.85em;margin-left:4px">'+item.title+'</span>':'';
    html+='<span><span style="color:var(--t3);margin-right:6px">'+day+'</span>'+item.publisher+advTag+'</span>';
    html+='<span style="font-weight:500">'+new Intl.NumberFormat('ko-KR').format(item.amount)+'원</span>';
    html+='</div>';
    total+=item.amount;
  });
  html+='<div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:600;font-size:0.9em">';
  html+='<span>합계</span><span style="color:var(--green)">'+new Intl.NumberFormat('ko-KR').format(total)+'원</span></div>';
  prev.innerHTML=html;
}

function importRoyaltyMonth(){
  const sel=document.getElementById('roy-month');
  if(!sel)return;
  const ym=sel.value;
  const royalty=window._royaltyData;
  if(!royalty||!royalty[ym])return;
  const items=royalty[ym];
  const [year,month]=ym.split('-').map(Number);

  let added=0, updated=0;
  items.forEach(function(item){
    // 입금일 계산
    let day=15;
    if(item.paymentDay==='말일'||item.paymentDay==='말'){
      day=new Date(year,month,0).getDate();
    } else if(item.paymentDay){
      day=parseInt(item.paymentDay)||15;
    }
    const dateStr=year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');

    if(!LD.transactions)LD.transactions=[];

    // 같은 달 같은 출판사 정산(선인세는 같은 선인세 건)이 있으면 금액/날짜 업데이트, 없으면 새로 추가
    const dupIdx=(LD.transactions).findIndex(function(t){
      if(item.isAdv)return t._royaltyAdv&&t._advKey===item.advKey;
      return t.date.slice(0,7)===ym&&t.memo&&t.memo.includes(item.publisher)&&t._royalty&&!t._royaltyAdv;
    });
    if(dupIdx>-1){
      const existing=LD.transactions[dupIdx];
      if(existing.amount!==item.amount||existing.date!==dateStr){
        LD.transactions[dupIdx]=Object.assign({},existing,{amount:item.amount,date:dateStr});
        updated++;
      }
      return;
    }

    LD.transactions.push({
      id:gid(),
      type:'income',
      date:dateStr,
      account:(LD.accounts&&LD.accounts[0])||'사업용 기업은행',
      majorCategory:'인세 수익',
      minorCategory:item.publisher,
      amount:item.amount,
      memo:item.isAdv?(item.publisher+' 선인세 · '+item.title):(item.publisher+' '+ym.replace('-','년 ')+'월 정산'),
      _royalty:true,
      _royaltyAdv:item.isAdv?true:undefined,
      _advKey:item.isAdv?item.advKey:undefined
    });
    added++;
  });

  // 카테고리에 출판사 소분류 자동 추가
  if(!LD.categories)LD.categories=JSON.parse(JSON.stringify(defaultLedgerCategories));
  if(!LD.categories.income)LD.categories.income={'인세 수익':[],'기타 수익':['외주/강연','이자/투자','기타']};
  if(!LD.categories.income['인세 수익'])LD.categories.income['인세 수익']=[];
  items.forEach(function(item){
    if(!LD.categories.income['인세 수익'].includes(item.publisher)){
      LD.categories.income['인세 수익'].push(item.publisher);
    }
  });

  LD.transactions.sort((a,b)=>b.date.localeCompare(a.date));
  saveLedger();
  closeMo();
  ledgerTab='dashboard';
  var msg=[];
  if(added>0) msg.push(added+'건 새로 등록');
  if(updated>0) msg.push(updated+'건 금액/날짜 업데이트');
  if(msg.length===0) msg.push('변경된 내용이 없어요');
  alert('정산 완료! '+msg.join(', ')+' 🎉');
  render();
}
function deleteLedgerAccount(acc){if(!confirm(acc+' 삭제?'))return;LD.accounts=(LD.accounts||[]).filter(a=>a!==acc);saveLedger();render();}

function deleteLedgerMajor(type,major){if(!confirm('대분류 '+major+' 삭제?'))return;if(LD.categories&&LD.categories[type])delete LD.categories[type][major];saveLedger();render();}
function deleteLedgerMinor(type,major,minor){if(!LD.categories||!LD.categories[type]||!LD.categories[type][major])return;LD.categories[type][major]=LD.categories[type][major].filter(m=>m!==minor);saveLedger();render();}
function addLedgerMajor(type){
  const el=document.getElementById('new-major-'+type);
  if(!el||!el.value.trim())return;
  if(!LD.categories[type])LD.categories[type]={};
  LD.categories[type][el.value.trim()]=[];
  saveLedger();render();
}
function addLedgerMinorByType(type,major){
  const els=document.querySelectorAll('.ledger-minor-inp');
  let el=null;
  els.forEach(function(e){if(e.dataset.major===major&&e.dataset.type===type)el=e;});
  if(!el)els.forEach(function(e){if(e.dataset.major===major)el=e;}); // fallback
  if(!el||!el.value.trim())return;
  if(!LD.categories[type][major])LD.categories[type][major]=[];
  LD.categories[type][major].push(el.value.trim());
  saveLedger();render();
}

function _ltxDayOpts(){
  const y=parseInt(document.getElementById('otx-y').value);
  const m=parseInt(document.getElementById('otx-m').value);
  const dSel=document.getElementById('otx-d');
  const cur=parseInt(dSel.value)||1;
  const last=new Date(y,m,0).getDate();
  let s='';for(let d=1;d<=last;d++)s+='<option '+(d===Math.min(cur,last)?'selected':'')+'>'+String(d).padStart(2,'0')+'</option>';
  dSel.innerHTML=s;
}
function _ltxTypeChange(v){
  document.querySelectorAll('[name="otx-type"]').forEach(function(el){
    const div=el.nextElementSibling;
    const on=el.value===v;
    div.style.background=on?'var(--surface)':'transparent';
    div.style.color=on?'var(--accent)':'var(--t2)';
    div.style.boxShadow=on?'var(--sh)':'none';
  });
  const cats=LD.categories||defaultLedgerCategories;
  const majors=Object.keys(cats[v]||{});
  const majorSel=document.getElementById('otx-major');
  if(majorSel){
    majorSel.innerHTML=majors.map(m=>'<option>'+m+'</option>').join('');
    _ltxMajorChange(majors[0]||'');
  }
}
function _ltxMajorChange(major){
  const typeSel=document.querySelector('[name="otx-type"]:checked');
  const type=typeSel?typeSel.value:'expense';
  const cats=LD.categories||defaultLedgerCategories;
  const minors=(cats[type]||{})[major]||[];
  const minorSel=document.getElementById('otx-minor');
  if(minorSel)minorSel.innerHTML=minors.map(m=>'<option>'+m+'</option>').join('');
}
function _ltxSave(editId){
  const typeSel=document.querySelector('[name="otx-type"]:checked');
  const type=typeSel?typeSel.value:'expense';
  const y=document.getElementById('otx-y').value;
  const m=document.getElementById('otx-m').value;
  const d=document.getElementById('otx-d').value;
  const date=y+'-'+m+'-'+d;
  const acc=document.getElementById('otx-acc').value;
  const major=document.getElementById('otx-major').value;
  const minor=document.getElementById('otx-minor').value;
  const amt=parseInt(document.getElementById('otx-amt').value)||0;
  const memo=document.getElementById('otx-memo').value;
  if(!date||!amt)return;
  if(!LD.transactions)LD.transactions=[];
  if(editId){
    LD.transactions=LD.transactions.map(t=>t.id===editId?Object.assign({},t,{type,date,account:acc,majorCategory:major,minorCategory:minor,amount:amt,memo}):t);
  } else {
    LD.transactions.push({id:gid(),type,date,account:acc,majorCategory:major,minorCategory:minor,amount:amt,memo});
  }
  // 저축/투자성 지출이면 자산에 자동 누적
  if(!editId) syncTxToAsset(type,major,minor,amt,memo);
  LD.transactions.sort((a,b)=>b.date.localeCompare(a.date));
  saveLedger();
  document.getElementById('ledger-tx-overlay').remove();
  // 달력 날짜 모달 업데이트
  const dayOv=document.getElementById('ledger-day-overlay');
  if(dayOv)dayOv.remove();
  render();
}

// 저축/투자성 지출을 자산에 자동 반영
function syncTxToAsset(type,major,minor,amt,memo){
  if(type!=='expense')return;
  // 저축/투자성 카테고리 키워드
  const savingKeywords=['저축','예금','적금','예적금','투자','ISA','isa','펀드','연금','청약','공제'];
  var hay=(major+' '+minor+' '+(memo||''));
  var isSaving=savingKeywords.some(function(k){return hay.indexOf(k)>=0;});
  if(!isSaving)return;
  if(!LD.assets)LD.assets=[];
  // 매칭: 메모 또는 소분류 이름과 같은 자산 찾기
  var nameKey=(memo&&memo.trim())?memo.trim():minor;
  var existing=LD.assets.find(function(a){
    return a.type==='asset'&&(a.name===nameKey||a.name===minor||a.name===memo);
  });
  if(existing){
    existing.amount=(existing.amount||0)+amt;
  } else {
    // 카테고리 추정
    var cat='예적금';
    if(/투자|펀드|ISA|isa/.test(hay))cat='투자';
    else if(/연금|청약|공제/.test(hay))cat='기타';
    LD.assets.push({id:gid(),type:'asset',category:cat,name:nameKey,amount:amt,interestRate:0,maturityDate:''});
  }
}
function deleteLedgerTx(id){
  if(!confirm('삭제할까요?'))return;
  LD.transactions=(LD.transactions||[]).filter(t=>t.id!==id);
  saveLedger();
  const dayOv=document.getElementById('ledger-day-overlay');
  if(dayOv)dayOv.remove();
  render();
}

// Firebase Auth 상태 감지 → 앱 시작점
auth.onAuthStateChanged(async function(user){
  if(user){
    currentUser = user;
    // 로딩 표시
    document.getElementById('login-screen').innerHTML=
      '<div style="text-align:center;color:#6B6560"><div style="font-size:2em;margin-bottom:12px">✨</div><div style="font-size:1.1em;font-weight:500">데이터 불러오는 중...</div></div>';
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-wrap').style.display='none';

    // 클라우드에서 데이터 로드
    const cloudData = await loadFromCloud();

    // 로컬에 클라우드보다 더 최근에 저장된(아직 클라우드 업로드가 안 끝났을 수 있는) 데이터가 있는지 확인
    // → 디바운스 중 새로고침되어 최신 입력이 통째로 날아가는 것을 방지
    let localIsNewer = false;
    let localRawForRecovery = null;
    try {
      const savedAtRaw = localStorage.getItem(KEY+'_savedAt');
      const localSavedAt = savedAtRaw ? parseInt(savedAtRaw,10) : 0;
      const cloudUpdatedAt = (cloudData && cloudData._cloudUpdatedAt) || 0;
      if(localSavedAt > 0 && localSavedAt > cloudUpdatedAt){
        localIsNewer = true;
        localRawForRecovery = localStorage.getItem(KEY);
      }
    } catch(e) {}

    if(cloudData && !localIsNewer){
      // localStorage에서 폰트 데이터 미리 보존 (Firestore에 없으므로)
      let localFontData = ['','',''];
      let localDiaryPhotos = {};
      try {
        const localRaw = localStorage.getItem(KEY);
        if(localRaw) {
          const localS = JSON.parse(localRaw);
          if(localS.customFontData) localFontData = localS.customFontData;
          // 이 브라우저에만 저장된(base64) 일기 사진도 보존 (Firestore에 올리지 않으므로)
          const lde = localS.diaryEntries || {};
          Object.keys(lde).forEach(function(k){
            const e = lde[k];
            if(e && e.photoStorage === 'local' && e.photoUrl){
              localDiaryPhotos[k] = {photoUrl:e.photoUrl, photoStorage:'local', photoSize:e.photoSize};
            }
          });
        }
      } catch(e) {}

      // 클라우드 데이터 적용
      const ledgerData = cloudData._ledger;
      delete cloudData._ledger;
      delete cloudData._cloudUpdatedAt;
      S = Object.assign({}, S, cloudData);
      // 클라우드에 가계부가 있으면 그것을, 없으면 이 기기에 저장된 가계부를 살린다.
      // (클라우드에 없다고 해서 로컬 가계부를 기본값으로 덮어쓰면 안 된다)
      var ledgerRestoredFromLocal = false;
      if(ledgerData){
        LD = Object.assign({}, LD, ledgerData);
      } else {
        loadLedger();
        ledgerRestoredFromLocal = true;
      }

      // 폰트 데이터 복원 (클라우드엔 없으므로 localStorage 것 유지)
      S.customFontData = localFontData;

      // 로컬 전용 일기 사진 복원
      if(!S.diaryEntries) S.diaryEntries = {};
      Object.keys(localDiaryPhotos).forEach(function(k){
        if(!S.diaryEntries[k]) S.diaryEntries[k] = {text:'',mood:'',title:''};
        if(!S.diaryEntries[k].photoUrl) Object.assign(S.diaryEntries[k], localDiaryPhotos[k]);
      });

      // localStorage 업데이트 (용량 초과로 실패해도 아래 클라우드 복구는 계속 진행)
      try{
        localStorage.setItem(KEY, phStringifyLocal(S));
        localStorage.setItem(LEDGER_KEY, JSON.stringify(LD));
      }catch(e){ console.error('로컬 캐시 저장 실패:',e); }
      // 클라우드에 가계부가 없어서 로컬에서 살렸다면, 클라우드에도 다시 올려둔다
      if(ledgerRestoredFromLocal){
        try{ await saveToCloud({...S, _ledger: LD}); }catch(e){}
      }
    } else if(localIsNewer){
      // 로컬이 더 최신 → 로컬 데이터를 유지하고, 아직 못 올라간 변경사항을 클라우드에 재업로드
      load(); loadLedger();
      await saveToCloud({...S, _ledger: LD});
    } else {
      // 클라우드에 없으면 localStorage 데이터를 클라우드에 올림
      load(); loadLedger();
      await saveToCloud({...S, _ledger: LD});
    }
    hideLoginScreen();
    initApp();
  } else {
    currentUser = null;
    showLoginScreen();
  }
});
