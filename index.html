<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucy's Space</title>
<meta http-equiv="refresh" content="1;url=space/">
<style>body{font-family:sans-serif;background:#FDFCFB;color:#4a4034;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}a{color:#C17C3C}</style>
</head>
<body>
<p>루시 스페이스로 이동 중이에요… <a href="space/">바로 가기</a></p>
<script>
// 예전에 이 폴더 전체를 범위로 등록해 둔 서비스워커가 남아 있으면 걷어낸 뒤 넘어간다
(function () {
    var go = function () { location.replace('space/' + location.search + location.hash); };
    try {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (list) {
                var base = new URL('./', location.href).href;
                return Promise.all(list.filter(function (r) { return r.scope === base; }).map(function (r) { return r.unregister(); }));
            }).catch(function () {}).then(go);
            setTimeout(go, 1200);
            return;
        }
    } catch (e) {}
    go();
})();
</script>
</body>
</html>
