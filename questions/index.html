<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3ece2">
<title>마음 한 장 — 종이 다이어리를 위한 400개의 질문</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece2;--card:#fffaf2;--ink:#3d322b;--muted:#8d7f72;--line:#e6d9c8;--accent:#b0776b;--accent-d:#8f5d53;--soft:#f6e6de;--serif:'Gowun Batang','Noto Serif KR','Nanum Myeongjo','Batang',serif;--sans:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--shadow:0 18px 50px -18px rgba(95,66,48,.28),0 2px 6px rgba(95,66,48,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1000px 520px at 50% -140px,#fff8ee,transparent 70%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2.5px solid #c9a79b;outline-offset:3px;border-radius:10px}
.wrap{width:min(1600px,calc(100% - 36px));margin:0 auto;padding:22px 0 72px}
.paper{position:relative;background:var(--card);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
.paper:before{content:"";position:absolute;inset:6px;border:1px dashed #e4d3c1;border-radius:13px;pointer-events:none}
.paper:after{content:"❦";position:absolute;right:-4px;bottom:-22px;font-size:90px;line-height:1;color:var(--soft);opacity:.7;transform:rotate(-14deg);pointer-events:none}
.paper>*{position:relative;z-index:1}
.date{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.chip{display:inline-block;margin:8px 0 0;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:600;color:var(--cat,var(--accent));background:color-mix(in srgb,var(--cat,var(--accent)) 10%,#fffaf2);border:1px solid color-mix(in srgb,var(--cat,var(--accent)) 28%,#fffaf2)}
.q{font-family:var(--serif);font-size:clamp(18px,3.6vw,22px);line-height:1.55;letter-spacing:-.4px;margin:8px auto 6px;min-height:2.9em;font-weight:400;display:flex;align-items:center;justify-content:center;max-width:520px;word-break:keep-all;overflow-wrap:anywhere}
.meta{font-size:11px;color:#a69889;margin-bottom:12px}
.btns{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap}
.btn{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:3px 9px;font-size:11px;white-space:nowrap;font-weight:600;color:#6b564b;transition:.15s}
.btn:hover{background:var(--soft);border-color:#dcc0b5}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 8px -4px rgba(176,119,107,.7)}
.btn.main:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn:active{transform:scale(.97)}
.lead{margin:50px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lead h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;letter-spacing:-.4px}
.lead span{font-size:12px;color:var(--muted)}
.cats{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:1 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fffaf2;border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:600;color:#7a6a5f}
.cat:hover{background:#fbf0e8}
.cat[aria-pressed=true]{background:#5c493f;border-color:#5c493f;color:#fff}
.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:8px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));column-gap:22px}
.row{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.55;word-break:keep-all}
.row{border-bottom:1px dotted #eadfce;border-radius:0}
.row:hover{background:#fbf0e8;border-radius:12px}
.row b{font-family:var(--serif);font-weight:400;font-size:12px;color:#c4ab9f;min-width:22px}
.none{grid-column:1/-1;padding:34px 10px;text-align:center;color:var(--muted)}
.foot{margin-top:34px;text-align:center;font-size:12px;color:#a69889;line-height:1.9}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#4d3f37;color:#fff;border-radius:99px;padding:9px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.wrap{padding-top:16px}.paper{padding:14px 12px 12px}.q{min-height:3.3em}.btn{padding:3px 8px;font-size:11px}.btns{gap:4px}.list{padding:6px 8px}}
@media print{body{background:#fff}.lead,.cats,.list,.foot,.btns,.toast,.meta{display:none!important}.paper{box-shadow:none;border:1px solid #ddd}.paper:after{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
 <section class="paper" id="paper" aria-label="오늘의 질문">
  <div class="date" id="date"></div>
  <span class="chip" id="chip"></span>
  <h2 class="q" id="q" aria-live="polite"></h2>
  <div class="meta" id="meta"></div>
  <div class="btns"><button class="btn main" id="again" type="button">↻ 다른 질문</button><button class="btn" id="same" type="button">같은 주제</button><button class="btn" id="copy" type="button">복사</button></div>
 </section>
 <div class="lead"><h2>질문 서랍</h2><span id="count"></span></div>
 <div class="cats" id="cats" role="group" aria-label="주제"></div>
 <div class="list" id="list"></div>
 <p class="foot">답을 입력하거나 저장하는 기능은 없어요.<br>마음 가는 질문 하나만 골라 다이어리에 적어 보세요 ♡</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';

const $=id=>document.getElementById(id);
const SHORT=['올해·도전','취향','생활·돈','나 알기','요즘의 나','사랑·미래','인간관계','만약에'];
let cur=null,tab=-1,tt;
function dailyQ(d){const n=ALL.length,y=d.getFullYear(),a=ALL.map((_,i)=>i);let s=(y*2654435761)>>>0;
 const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let r=Math.imul(s^(s>>>15),1|s);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296};
 for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 const doy=Math.floor((Date.UTC(y,d.getMonth(),d.getDate())-Date.UTC(y,0,0))/864e5);return ALL[a[(doy-1)%n]]}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)}
function show(q,isToday){cur=q;const c=CATEGORIES[q.ci];$('paper').style.setProperty('--cat',c.color);$('chip').textContent=c.icon+' '+c.name;$('q').textContent=q.text;$('meta').textContent=(isToday?'오늘의 질문 · ':'')+(ALL.indexOf(q)+1)+' / '+ALL.length}
function pick(pool){const p=pool.filter(q=>q!==cur);return p[Math.floor(Math.random()*p.length)]}
function tabs(){const h=$('cats');h.replaceChildren();[{n:'전체',k:-1}].concat(CATEGORIES.map((c,i)=>({n:SHORT[i]||c.name,k:i}))).forEach(x=>{const b=document.createElement('button');b.type='button';b.className='cat';b.textContent=x.n;b.setAttribute('aria-pressed',String(tab===x.k));b.onclick=()=>{tab=x.k;tabs();rows()};h.append(b)})}
function rows(){const l=ALL.filter(q=>tab<0||q.ci===tab);$('count').textContent=l.length+'개의 질문';const h=$('list');h.replaceChildren();
 if(!l.length){const p=document.createElement('p');p.className='none';p.textContent='찾는 질문이 없어요. 다른 단어로 검색해 보세요.';h.append(p);return}
 const f=document.createDocumentFragment();l.forEach((q,k)=>{const b=document.createElement('button');b.type='button';b.className='row';const n=document.createElement('b');n.textContent=String(k+1).padStart(2,'0');const t=document.createElement('span');t.textContent=q.text;b.append(n,t);b.onclick=()=>{show(q,false);window.scrollTo({top:0,behavior:'smooth'})};f.append(b)});h.append(f)}
const now=new Date(),days=['일','월','화','수','목','금','토'];
$('date').textContent=now.getFullYear()+'. '+(now.getMonth()+1)+'. '+now.getDate()+'  '+days[now.getDay()]+'요일';
$('again').onclick=()=>show(pick(ALL),false);
$('same').onclick=()=>cur&&show(pick(ALL.filter(q=>q.ci===cur.ci)),false);
$('copy').onclick=async()=>{if(!cur)return;try{await navigator.clipboard.writeText(cur.text);toast('질문을 복사했어요')}catch(e){toast('질문을 길게 눌러 복사해 주세요')}};
show(dailyQ(now),true);tabs();rows();
</script>
</body>
