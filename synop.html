<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에피소드 기획 보드</title>
    <!-- 폰트 (CDN, 온라인 버전 전용) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
    <!-- Tailwind (CDN, 온라인 버전 전용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
    <!-- html2canvas (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase (실시간 동기화용, CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .top-toolbar::-webkit-scrollbar { height: 4px; }
        
        [contenteditable]:focus, input:focus, select:focus, textarea:focus { outline: none; box-shadow: none; }
        
        /* Drag and Drop 시각적 피드백 */
        .dragging { opacity: 0.5; border: 2px dashed #3b82f6 !important; }
        .drag-over { border-top: 4px solid #3b82f6 !important; }
        
        /* 보드 목록 Drag and Drop 피드백 */
        .board-dragging { opacity: 0.4; }
        .board-drag-over { border-top: 2px solid #3b82f6 !important; padding-top: 2px !important; }
        .folder-drag-over { background-color: rgba(59, 130, 246, 0.05) !important; outline: 1px dashed #3b82f6 !important; border-radius: 0.25rem; }
        
        /* 카드 Hover 시 툴 노출 */
        .card-wrapper .card-tools { display: none; }
        .card-wrapper:hover .card-tools { display: flex; }

        /* 서식 적용을 위한 기본 에디터 스타일 */
        .rich-editor { min-height: 80px; font-size: 10.5pt; line-height: 1.6; }
        .rich-editor blockquote { border-left: 3px solid #ccc; padding-left: 8px; color: #666; margin: 4px 0; }

        /* 빈 에디터 플레이스홀더 처리 */
        .empty-editor:before { content: attr(data-placeholder); color: #9ca3af; pointer-events: none; display: block; }

        /* 테마 시스템 CSS (채도를 낮춘 Muted 톤) */
        body[data-theme="green"] .theme-panel { background-color: #f4f6f4 !important; border-color: #e3e8e4 !important; }
        body[data-theme="green"] .theme-canvas { background-color: #eef1ef !important; }
        body[data-theme="pink"] .theme-panel { background-color: #fdf8f9 !important; border-color: #eedce0 !important; }
        body[data-theme="pink"] .theme-canvas { background-color: #f7f0f2 !important; }

        /* 메모 탭 버튼 스타일 트위크 */
        .memo-tab-btn { transition: all 0.2s; }
        .memo-tab-active { background-color: #eff6ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 700; }

        /* 활성 카드 강조 (더 명확하게) */
        .card-wrapper.active-card {
            box-shadow: 0 0 0 2.5px #3b82f6, 0 4px 16px rgba(59,130,246,0.18) !important;
            z-index: 10;
        }

        /* 검색 하이라이트 */
        .search-highlight {
            background: #fef08a;
            border-radius: 2px;
        }

        /* 카드 복사 버튼 */
        .card-copy-btn {
            transition: all 0.15s;
        }

        /* 메모 탭 편집 모드 */
        .tab-edit-input {
            background: white;
            border: 1px solid #93c5fd;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            width: 80px;
            outline: none;
        }

        /* 트랙 색상 칩 */
        .track-color-chip {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        /* 카드 체크리스트 */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #4b5563;
            padding: 1px 0;
        }
        .checklist-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .checklist-item .check-done { text-decoration: line-through; color: #9ca3af; }

        /* 검색 패널 */
        #search-panel {
            transition: all 0.2s ease;
        }

        /* 카드 삭제 확인 토스트 */
        #delete-toast {
            transition: all 0.2s ease;
        }

        /* 툴바 버튼 활성 상태 표시 */
        .toolbar-btn-active {
            background: #eff6ff !important;
            color: #2563eb !important;
        }

        /* Undo/Redo 버튼 비활성 */
        .undo-btn:disabled, .redo-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Row header 색상 */
        .row-color-bg-red { background-color: #fee2e2 !important; }
        .row-color-bg-orange { background-color: #ffedd5 !important; }
        .row-color-bg-yellow { background-color: #fef9c3 !important; }
        .row-color-bg-green { background-color: #dcfce7 !important; }
        .row-color-bg-blue { background-color: #dbeafe !important; }
        .row-color-bg-purple { background-color: #f3e8ff !important; }
        .row-color-bg-pink { background-color: #fce7f3 !important; }
        .row-color-bg-gray { background-color: #f3f4f6 !important; }

        /* 왼쪽 사이드바 애니메이션 */
        .sidebar-left {
            transition: width 0.25s ease, opacity 0.25s ease, padding 0.25s ease;
            overflow: hidden;
        }
        .sidebar-left.collapsed {
            width: 0 !important;
            opacity: 0;
            padding: 0;
            pointer-events: none;
        }

        /* 오른쪽 사이드바 애니메이션 */
        .sidebar-right {
            transition: width 0.25s ease, opacity 0.25s ease, padding 0.25s ease;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar-right.collapsed {
            width: 0 !important;
            opacity: 0;
            padding: 0;
            pointer-events: none;
        }

        /* 우측 사이드바 섹션 개별 접기(아코디언) */
        .rs-head { padding: 4px 2px; }
        .rs-head:hover { background: rgba(0,0,0,0.025); border-radius: 6px; }
        .rs-body.collapsed { display: none; }
        .rs-chevron { transition: transform 0.2s ease; }
        .rs-chevron.collapsed { transform: rotate(-90deg); }

    </style>
</head>
<body data-theme="default" class="flex h-screen w-full bg-gray-50 font-sans text-sm text-gray-800 overflow-hidden transition-colors duration-300" style="font-family: 'Pretendard', sans-serif;">

    <!-- 로컬 저장 상태 인디케이터 -->
    <div id="save-indicator" class="fixed top-3 right-4 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm bg-white border border-gray-200 z-50 transition-opacity duration-300 opacity-0 pointer-events-none flex items-center">
    </div>

    <!-- 카드 삭제 확인 토스트 (Undo 지원) -->
    <div id="delete-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-xl z-[9999] hidden flex items-center gap-3">
        <span id="delete-toast-msg">카드가 삭제됩니다.</span>
        <button id="delete-undo-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-full text-[11px] transition-colors">되돌리기</button>
    </div>

    <!-- 전체 검색 패널 -->
    <div id="search-panel" class="fixed top-14 left-1/2 -translate-x-1/2 bg-white border border-gray-200 shadow-2xl rounded-xl z-[100] w-[480px] hidden">
        <div class="p-3 flex items-center gap-2 border-b border-gray-100">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 shrink-0"></i>
            <input id="search-input" type="text" placeholder="제목, 내용, 장소 검색..." class="flex-1 text-sm outline-none text-gray-800 bg-transparent" oninput="window.doSearch(this.value)" onkeydown="if(event.key==='Escape') window.closeSearch()">
            <button onclick="window.closeSearch()" class="text-gray-400 hover:text-gray-600 p-1 rounded">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
        </div>
        <div id="search-results" class="max-h-80 overflow-y-auto p-2 text-xs text-gray-500">
            <span class="p-2 block">검색어를 입력하세요.</span>
        </div>
    </div>

    <!-- Left Sidebar Toggle Button (always visible) -->
    <button id="left-sidebar-toggle" onclick="window.toggleLeftSidebar()" 
            class="fixed left-0 top-1/2 -translate-y-1/2 z-30 bg-white border border-gray-200 shadow-md rounded-r-lg w-5 h-12 flex items-center justify-center text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200"
            title="왼쪽 패널 접기/펼치기" style="display:none;">
        <i data-lucide="chevron-left" id="left-toggle-icon" class="w-3.5 h-3.5"></i>
    </button>

    <!-- Right Sidebar Toggle Button (펼치기용, 접혔을 때만 노출) -->
    <button id="right-sidebar-toggle" onclick="window.toggleRightSidebar()"
            class="fixed right-0 top-1/2 -translate-y-1/2 z-30 bg-white border border-gray-200 shadow-md rounded-l-lg w-5 h-12 flex items-center justify-center text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-all duration-200"
            title="오른쪽 도구창 펼치기" style="display:none;">
        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
    </button>

    <!-- Left Sidebar -->

    <div class="theme-panel sidebar-left w-56 bg-white border-r border-gray-200 flex flex-col shrink-0 z-20 shadow-sm relative transition-colors duration-300" id="left-sidebar">
        <div class="p-4 font-bold text-lg border-b border-gray-100 flex items-center justify-between text-gray-800">
            <div class="flex items-center gap-2">
                <i data-lucide="book-open" class="w-5 h-5 text-gray-600"></i> 작업 공간
            </div>
            <button onclick="window.toggleLeftSidebar()" class="text-gray-400 hover:text-blue-600 p-1 rounded transition-colors" title="패널 접기">
                <i data-lucide="panel-left-close" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="p-2 flex-1 overflow-y-auto border-b border-gray-100 custom-scrollbar flex flex-col relative">
            <div class="flex items-center justify-between p-2 hover:bg-black/5 rounded text-gray-600 group cursor-pointer mb-3" onclick="window.createNewBoard()">
                <span class="flex items-center gap-2 text-xs font-semibold"><i data-lucide="layout" class="w-4 h-4"></i> 새 시놉시스 생성</span>
                <button class="text-gray-400 hover:text-blue-600 p-1 rounded hover:bg-black/5" title="새 보드 생성">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                </button>
            </div>
            
            <!-- 진행 중인 플롯 목록 -->
            <div class="flex flex-col flex-1 min-h-[45%] max-h-[60%]">
                <div class="pt-2 pb-2 px-2 text-[14px] font-extrabold text-gray-600 tracking-wide border-b border-gray-100 mb-2">진행 중 시놉시스</div>
                <div id="board-list-active" class="space-y-0.5 overflow-y-auto custom-scrollbar flex-1" ondragover="window.handleBoardDragOver(event)" ondrop="window.handleBoardDrop(event, null, 'active')">
                </div>
            </div>

            <!-- 완결 시놉시스 보관함 -->
            <div class="mt-2 pt-4 border-t border-gray-200 flex flex-col flex-1 min-h-[30%]">
                <div class="pb-2 px-2 text-[14px] font-extrabold text-gray-600 tracking-wide border-b border-gray-100 mb-2 cursor-pointer flex items-center justify-between hover:text-gray-800 transition-colors" 
                     onclick="window.toggleCompletedFolder()"
                     ondragover="window.handleBoardDragOverFolder(event)" 
                     ondrop="window.handleBoardDrop(event, null, 'completed')">
                    <span>완결 시놉시스 보관함</span>
                    <i data-lucide="chevron-down" id="completed-folder-icon" class="w-4 h-4 text-gray-400 transition-transform duration-300"></i>
                </div>
                <div id="board-list-completed" class="space-y-0.5 overflow-y-auto custom-scrollbar transition-all duration-300 hidden flex-1 mt-1" ondragover="window.handleBoardDragOverFolder(event)" ondragleave="window.handleBoardDragLeaveFolder(event)" ondrop="window.handleBoardDrop(event, null, 'completed')">
                </div>
            </div>
        </div>

        <!-- Data Management (Bottom) -->
        <div class="p-4 border-t border-gray-100 flex flex-col gap-3 text-[11px] text-gray-500 font-medium">
            <!-- Theme Selection -->
            <div class="mb-1 pb-3 border-b border-gray-100 border-dashed flex justify-between items-center">
                <span class="block text-[10px] font-bold text-gray-400 tracking-wider">테마 색상</span>
                <div class="flex gap-2">
                    <button onclick="window.setTheme('default')" class="w-4 h-4 rounded-full bg-gray-200 border border-gray-300 hover:scale-110 transition-transform shadow-sm" title="기본 (회색)"></button>
                    <button onclick="window.setTheme('green')" class="w-4 h-4 rounded-full bg-[#eef1ef] border border-[#e3e8e4] hover:scale-110 transition-transform shadow-sm" title="차분한 녹색"></button>
                    <button onclick="window.setTheme('pink')" class="w-4 h-4 rounded-full bg-[#f7f0f2] border border-[#eedce0] hover:scale-110 transition-transform shadow-sm" title="차분한 분홍"></button>
                </div>
            </div>
            
            <!-- Export Actions -->
            <div class="flex items-center gap-1.5">
                <button onclick="window.exportText()" class="flex-1 flex items-center justify-center gap-1 py-1.5 bg-gray-100 hover:bg-blue-50 text-gray-600 hover:text-blue-600 rounded font-bold transition-colors">
                    <i data-lucide="file-output" class="w-3.5 h-3.5"></i> 텍스트
                </button>
                <button onclick="window.exportImage()" class="flex-1 flex items-center justify-center gap-1 py-1.5 bg-gray-100 hover:bg-blue-50 text-gray-600 hover:text-blue-600 rounded font-bold transition-colors">
                    <i data-lucide="camera" class="w-3.5 h-3.5"></i> 이미지
                </button>
            </div>
            
            <!-- Data Management -->
            <div class="flex items-center justify-between pt-1 text-[10px]">
                <button onclick="window.exportData()" class="hover:text-gray-800 transition-colors" title="수동 파일 백업">백업</button>
                <span class="text-gray-300">|</span>
                <button onclick="document.getElementById('import-file').click()" class="hover:text-gray-800 transition-colors" title="수동 백업본 불러오기">불러오기</button>
                <span class="text-gray-300">|</span>
                <button onclick="window.triggerSave(true)" class="text-blue-600 hover:text-blue-800 font-bold transition-colors" title="G드라이브 강제 동기화">강제</button>
                <span class="text-gray-300">|</span>
                <button onclick="window.resetData()" class="text-gray-400 hover:text-red-500 transition-colors">초기화</button>
            </div>
            <input type="file" id="import-file" accept=".json" class="hidden" onchange="window.importData(event)">
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#fcfcfc] relative">
        <!-- Top Toolbar -->
        <div class="theme-panel top-toolbar h-12 bg-white border-b border-gray-200 flex items-center justify-between px-4 shrink-0 z-10 shadow-sm transition-colors duration-300 overflow-x-auto overflow-y-hidden">
            <!-- Left: Text Formatting -->
            <div class="flex items-center gap-4 shrink-0 whitespace-nowrap">
                <div class="flex items-center gap-2 text-gray-600 border-r border-gray-200/60 pr-4 shrink-0">
                    <select onchange="window.formatText('formatBlock', this.value)" class="bg-transparent cursor-pointer hover:text-gray-900 text-sm outline-none">
                        <option value="div">본문</option>
                        <option value="H1">제목 1</option>
                        <option value="H2">제목 2</option>
                        <option value="H3">제목 3</option>
                        <option value="BLOCKQUOTE">인용구</option>
                    </select>
                    <span class="text-gray-300">|</span>
                    <select id="font-select" onchange="window.formatText('fontName', this.value)" class="bg-transparent cursor-pointer hover:text-gray-900 text-sm w-24 outline-none">
                        <option value="Pretendard, sans-serif">Pretendard</option>
                        <option value="'KoPub Batang', 'Nanum Myeongjo', serif">바탕체</option>
                        <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                        <option value="'Nanum Myeongjo', serif">나눔명조</option>
                    </select>
                    <span class="text-gray-300">|</span>
                    <select id="font-size-select" onchange="window.formatText('fontSizeExact', this.value)" class="bg-transparent cursor-pointer hover:text-gray-900 text-sm outline-none">
                        <option value="10pt">10 pt</option>
                        <option value="10.5pt" selected>10.5 pt</option>
                        <option value="11pt">11 pt</option>
                        <option value="12pt">12 pt</option>
                        <option value="14pt">14 pt</option>
                    </select>
                    <span class="text-gray-300">|</span>
                    
                    <!-- Custom Color Palette Dropdown -->
                    <div class="relative flex items-center">
                        <button id="color-picker-btn" onclick="window.toggleTextColorPalette()" class="w-6 h-6 rounded flex items-center justify-center hover:bg-black/5 transition-colors border border-transparent hover:border-gray-200 shadow-none hover:shadow-sm" title="글자 색상">
                            <div id="current-text-color-indicator" class="w-3.5 h-3.5 rounded-full bg-black border border-gray-200"></div>
                        </button>
                        
                        <div id="text-color-palette" class="absolute top-full mt-2 left-0 bg-white border border-gray-200 shadow-lg rounded-md p-2 z-50 hidden w-max">
                            <div class="grid grid-cols-5 gap-1.5">
                                <button onclick="window.applyTextColor('#000000')" class="w-5 h-5 rounded bg-[#000000] border border-gray-200 hover:scale-110 transition-transform" title="검정"></button>
                                <button onclick="window.applyTextColor('#ffffff')" class="w-5 h-5 rounded bg-[#ffffff] border border-gray-200 hover:scale-110 transition-transform" title="흰색"></button>
                                <button onclick="window.applyTextColor('#ef4444')" class="w-5 h-5 rounded bg-[#ef4444] border border-gray-200 hover:scale-110 transition-transform" title="빨강"></button>
                                <button onclick="window.applyTextColor('#3b82f6')" class="w-5 h-5 rounded bg-[#3b82f6] border border-gray-200 hover:scale-110 transition-transform" title="파랑"></button>
                                <button onclick="window.applyTextColor('#22c55e')" class="w-5 h-5 rounded bg-[#22c55e] border border-gray-200 hover:scale-110 transition-transform" title="초록"></button>
                                <button onclick="window.applyTextColor('#a855f7')" class="w-5 h-5 rounded bg-[#a855f7] border border-gray-200 hover:scale-110 transition-transform" title="보라"></button>
                                <button onclick="window.applyTextColor('#eab308')" class="w-5 h-5 rounded bg-[#eab308] border border-gray-200 hover:scale-110 transition-transform" title="노랑"></button>
                                <button onclick="window.applyTextColor('#f97316')" class="w-5 h-5 rounded bg-[#f97316] border border-gray-200 hover:scale-110 transition-transform" title="주황"></button>
                                <button onclick="window.applyTextColor('#84cc16')" class="w-5 h-5 rounded bg-[#84cc16] border border-gray-200 hover:scale-110 transition-transform" title="연두"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3 text-gray-600 border-r border-gray-200/60 pr-4 shrink-0">
                    <button onclick="window.formatText('bold')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5" title="굵게"><i data-lucide="bold" class="w-4 h-4"></i></button>
                    <button onclick="window.formatText('italic')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5" title="기울임"><i data-lucide="italic" class="w-4 h-4"></i></button>
                    <button onclick="window.formatText('underline')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5" title="밑줄"><i data-lucide="underline" class="w-4 h-4"></i></button>
                    <button onclick="window.formatText('strikeThrough')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5" title="취소선"><i data-lucide="strikethrough" class="w-4 h-4"></i></button>
                </div>
                <div class="flex items-center gap-3 text-gray-600 border-r border-gray-200/60 pr-4 shrink-0">
                    <button onclick="window.formatText('justifyLeft')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                    <button onclick="window.formatText('justifyCenter')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                    <button onclick="window.formatText('justifyRight')" class="hover:text-gray-900 p-1 rounded hover:bg-black/5"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                </div>
                <!-- Undo / Redo 버튼 -->
                <div class="flex items-center gap-2 text-gray-600 shrink-0">
                    <button id="undo-btn" onclick="window.undoAction()" class="undo-btn hover:text-gray-900 p-1 rounded hover:bg-black/5 disabled:opacity-30" title="되돌리기 (Ctrl+Z)" disabled>

    <script>
// --- Node.js File System 세팅 (Electron 전용) ---
let fs, pathModule, os;
let isNodeEnvironment = false;
let TARGET_DIR = '';
let targetFilePath = '';

try {
    fs = require('fs');
    pathModule = require('path');
    os = require('os');
    isNodeEnvironment = true;

    if (os.platform() === 'win32') {
        TARGET_DIR = 'G:\\내 드라이브\\백업\\시놉시스 파일';
    } else if (os.platform() === 'darwin') {
        TARGET_DIR = '/Users/lucy/Library/CloudStorage/GoogleDrive-doitdomina@gmail.com/내 드라이브/백업/시놉시스 파일';
    }

    targetFilePath = pathModule.join(TARGET_DIR, '시놉시스_자동백업_데이터.json');
} catch(e) {
    console.warn("Node.js API 연동 실패 (일반 브라우저 환경에서 실행됨)");
}

// --- GitHub 동기화 (여러 PC간 데이터 이어쓰기용) ---
let ghConfigPath = '';
if (isNodeEnvironment) {
    try {
        const ghConfigDir = pathModule.join(os.homedir(), '.episode-board');
        if (!fs.existsSync(ghConfigDir)) fs.mkdirSync(ghConfigDir, { recursive: true });
        ghConfigPath = pathModule.join(ghConfigDir, 'github-sync.json');
    } catch (e) { console.warn('GitHub 설정 폴더 생성 실패:', e); }
}

let githubConfig = null; // { token, owner, repo, branch, path, autoSync, sha }

function loadGithubConfig() {
    if (ghConfigPath) {
        try {
            if (!fs.existsSync(ghConfigPath)) return null;
            return JSON.parse(fs.readFileSync(ghConfigPath, 'utf8'));
        } catch (e) { return null; }
    }
    // 브라우저(GitHub Pages 등, 파일시스템 없음)에서는 localStorage로 대신 저장
    try {
        const raw = localStorage.getItem('gh-sync-config');
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

function saveGithubConfig(cfg) {
    if (ghConfigPath) {
        try { fs.writeFileSync(ghConfigPath, JSON.stringify(cfg, null, 2), 'utf8'); }
        catch (e) { console.warn('GitHub 설정 저장 실패:', e); }
        return;
    }
    try { localStorage.setItem('gh-sync-config', JSON.stringify(cfg)); }
    catch (e) { console.warn('GitHub 설정 저장 실패:', e); }
}

function ghUrl(cfg) {
    const encodedPath = cfg.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodedPath}`;
}
function ghHeaders(cfg) {
    return { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' };
}

// GitHub 저장소에서 최신 데이터를 가져온다
async function githubPull(cfg) {
    const res = await fetch(`${ghUrl(cfg)}?ref=${encodeURIComponent(cfg.branch || 'main')}`, { headers: ghHeaders(cfg) });
    if (res.status === 404) return { notFound: true };
    if (res.status === 401 || res.status === 403) throw new Error(`GitHub 인증 실패 (HTTP ${res.status}) - 토큰/권한을 확인하세요.`);
    if (!res.ok) throw new Error(`GitHub 불러오기 실패 (HTTP ${res.status})`);
    const json = await res.json();
    cfg.sha = json.sha;
    saveGithubConfig(cfg);
    const text = Buffer.from(json.content, 'base64').toString('utf8');
    return { data: JSON.parse(text) };
}

// GitHub 저장소에 현재 데이터를 커밋한다 (sha 충돌 시 최신 sha로 1회 재시도)
async function githubPush(cfg, dataStr) {
    const body = {
        message: `자동 동기화 - ${new Date().toLocaleString('ko-KR')}`,
        content: Buffer.from(dataStr, 'utf8').toString('base64'),
        branch: cfg.branch || 'main'
    };
    if (cfg.sha) body.sha = cfg.sha;

    let res = await fetch(ghUrl(cfg), {
        method: 'PUT',
        headers: { ...ghHeaders(cfg), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    if (res.status === 409 || res.status === 422) {
        const latest = await fetch(`${ghUrl(cfg)}?ref=${encodeURIComponent(cfg.branch || 'main')}`, { headers: ghHeaders(cfg) });
        if (latest.ok) {
            const j = await latest.json();
            body.sha = j.sha;
            res = await fetch(ghUrl(cfg), {
                method: 'PUT',
                headers: { ...ghHeaders(cfg), 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        }
    }
    if (res.status === 401 || res.status === 403) throw new Error(`GitHub 인증 실패 (HTTP ${res.status}) - 토큰/권한을 확인하세요.`);
    if (!res.ok) {
        const t = await res.text().catch(() => '');
        throw new Error(`GitHub 저장 실패 (HTTP ${res.status}) ${t.slice(0, 200)}`);
    }
    const json = await res.json();
    cfg.sha = json.content.sha;
    saveGithubConfig(cfg);
}

function ghSetStatus(msg, kind) {
    const el = document.getElementById('gh-status');
    if (!el) return;
    const colors = { info: 'text-gray-400', ok: 'text-green-600', warn: 'text-orange-500', err: 'text-red-500' };
    el.textContent = msg;
    el.className = `text-[11px] min-h-[16px] ${colors[kind] || colors.info}`;
}

window.openGithubSyncModal = function () {
    const cfg = loadGithubConfig() || {};
    document.getElementById('gh-token').value = cfg.token || '';
    document.getElementById('gh-owner').value = cfg.owner || '';
    document.getElementById('gh-repo').value = cfg.repo || '';
    document.getElementById('gh-branch').value = cfg.branch || 'main';
    document.getElementById('gh-path').value = cfg.path || 'data/synopsis.json';
    document.getElementById('gh-autosync').checked = !!cfg.autoSync;
    ghSetStatus('', 'info');
    const modal = document.getElementById('github-sync-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    if (window.lucide) window.lucide.createIcons({ el: modal });
};
window.closeGithubSyncModal = function () {
    const modal = document.getElementById('github-sync-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
};
window.saveGithubSyncSettings = function () {
    const prev = loadGithubConfig() || {};
    const cfg = {
        token: document.getElementById('gh-token').value.trim(),
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: document.getElementById('gh-branch').value.trim() || 'main',
        path: document.getElementById('gh-path').value.trim() || 'data/synopsis.json',
        autoSync: document.getElementById('gh-autosync').checked,
        sha: prev.sha || null
    };
    if (!cfg.token || !cfg.owner || !cfg.repo) {
        ghSetStatus('토큰, 소유자, 저장소 이름은 필수입니다.', 'err');
        return false;
    }
    githubConfig = cfg;
    saveGithubConfig(cfg);
    ghSetStatus('저장되었습니다.', 'ok');
    return true;
};
window.manualGithubPull = async function () {
    if (!window.saveGithubSyncSettings()) return;
    try {
        ghSetStatus('불러오는 중...', 'info');
        const result = await githubPull(githubConfig);
        if (result.notFound) { ghSetStatus('저장소에 아직 파일이 없습니다. "지금 올리기"로 먼저 업로드하세요.', 'warn'); return; }
        if (!result.data || !Array.isArray(result.data) || result.data.length === 0) { ghSetStatus('불러온 데이터가 비어있어 적용하지 않았습니다.', 'warn'); return; }
        _skipHistory = true;
        window.workspaces = normalizeData(result.data);
        window.currentWorkspaceId = window.workspaces[0].id;
        _skipHistory = false;
        renderAll();
        if (dbInitialized) await saveToLocalDB(window.workspaces);
        ghSetStatus('불러오기 완료! (현재 화면의 데이터를 덮어썼습니다)', 'ok');
    } catch (e) {
        console.error(e);
        ghSetStatus(e.message || '불러오기 실패', 'err');
    }
};
window.manualGithubPush = async function () {
    if (!window.saveGithubSyncSettings()) return;
    try {
        ghSetStatus('올리는 중...', 'info');
        const dataStr = JSON.stringify(window.workspaces, null, 2);
        await githubPush(githubConfig, dataStr);
        ghSetStatus('올리기 완료!', 'ok');
    } catch (e) {
        console.error(e);
        ghSetStatus(e.message || '올리기 실패', 'err');
    }
};

// 기본 프로젝트 설정값 (사용자가 별도로 설정하지 않아도 자동으로 이 값으로 동기화됩니다)

};
let fbConfigPath = '';
if (isNodeEnvironment) {
    try {
        const fbConfigDir = pathModule.join(os.homedir(), '.episode-board');
        if (!fs.existsSync(fbConfigDir)) fs.mkdirSync(fbConfigDir, { recursive: true });
        fbConfigPath = pathModule.join(fbConfigDir, 'firebase-sync.json');

}

let firebaseConfig = null; // { apiKey, projectId, collection, docId, autoSync, clientId }
let fbApp = null, fbAuthObj = null, fbDb = null, fbUnsub = null, fbEditWatcher = null;
let fbPendingRemote = null; // 편집 중일 때 잠시 보류해두는 원격 변경사항
let fbApplyingRemote = false; // 원격 데이터 반영 중 재귀 저장 방지용

function loadFirebaseConfig() {
    let stored = null;
    if (fbConfigPath) {
        try {
            if (fs.existsSync(fbConfigPath)) stored = JSON.parse(fs.readFileSync(fbConfigPath, 'utf8'));
        } catch (e) { stored = null; }
    } else {
        try {
            const raw = localStorage.getItem('fb-sync-config');
            stored = raw ? JSON.parse(raw) : null;
        } catch (e) { stored = null; }
    }
    // 저장된 설정이 없으면 기본값(코드에 내장된 apiKey/프로젝트ID)을 사용
    if (!stored || !stored.apiKey || !stored.projectId) {
        return { ...DEFAULT_FIREBASE_CONFIG, ...(stored || {}) };
    }
    return stored;
}
function saveFirebaseConfig(cfg) {
    if (fbConfigPath) {
        try { fs.writeFileSync(fbConfigPath, JSON.stringify(cfg, null, 2), 'utf8'); }
        catch (e) { console.warn('Firebase 설정 저장 실패:', e); }
        return;
    }
    try { localStorage.setItem('fb-sync-config', JSON.stringify(cfg)); }
    catch (e) { console.warn('Firebase 설정 저장 실패:', e); }
}
function fbGetClientId(cfg) {
    if (cfg.clientId) return cfg.clientId;
    cfg.clientId = 'client_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    saveFirebaseConfig(cfg);
    return cfg.clientId;
}

// 브라우저(온라인 버전)에서 최초 1회 auth 상태가 정해질 때까지 기다림 (새로고침 시 로그인 세션 자동 복원 대기)
let _fbAuthReadyPromise = null;
function fbWaitAuthReady() {
    if (!_fbAuthReadyPromise) {
        _fbAuthReadyPromise = new Promise(resolve => {
            const unsub = fbAuthObj.onAuthStateChanged(user => {
                unsub();
                resolve(user);
            });
        });
    }
    return _fbAuthReadyPromise;
}

// 로그인 상태가 바뀔 때마다 동기화 모달의 상태 표시를 갱신 + 로그인되면 자동 동기화가 켜져있으면 재연결
function fbUpdateAuthUI(user) {
    if (fbAuthObj && user === undefined) user = fbAuthObj.currentUser;
    const box = document.getElementById('fb-google-status');
    if (box && !isNodeEnvironment) {
        if (user && !user.isAnonymous) {
            box.innerHTML = `<span class="text-green-600 font-bold">${esc ? esc(user.displayName || user.email || '로그인됨') : (user.displayName || user.email || '로그인됨')}</span> 로 로그인됨 · <button onclick="window.fbGoogleSignOut()" class="text-gray-400 underline hover:text-gray-600">로그아웃</button>`;
        } else {
            box.innerHTML = `<span class="text-orange-500 font-bold">로그인 필요</span> · <button onclick="window.fbGoogleSignIn()" class="text-blue-500 underline hover:text-blue-700">구글로 로그인</button>`;
        }
    }
    if (!isNodeEnvironment && user && !user.isAnonymous) {
        const cfg = loadFirebaseConfig();
        if (cfg && cfg.apiKey && cfg.projectId && cfg.autoSync) fbStartRealtimeSync(cfg);
    } else if (!isNodeEnvironment && !user) {
        fbStopRealtimeSync();
    }
}

// Firebase 앱 초기화. 데스크탑(Electron)은 익명 로그인, 브라우저(온라인 버전)는 구글 로그인 필요.
async function fbConnect(cfg) {
    if (typeof firebase === 'undefined') {
        throw new Error('Firebase SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    }
    if (!fbApp) {
        fbApp = (firebase.apps || []).find(a => a.name === 'episodeBoardApp')
            || firebase.initializeApp({ apiKey: cfg.apiKey, projectId: cfg.projectId, authDomain: cfg.authDomain || (cfg.projectId + '.firebaseapp.com') }, 'episodeBoardApp');
        fbAuthObj = fbApp.auth();
        fbDb = fbApp.firestore();
        if (!isNodeEnvironment) {
            try { await fbAuthObj.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
            // 구글 로그인 리디렉션에서 방금 돌아온 경우 결과를 처리 (에러가 있으면 콘솔에만 남김)
            try { await fbAuthObj.getRedirectResult(); } catch (e) { console.warn('구글 로그인 리디렉션 오류:', e); }
        }
    }

    if (isNodeEnvironment) {
        // 데스크탑: 익명 인증 (기기 내부 로그인 유지 전용, 사용자 구분 없음, 버튼 없이 항상 자동)
        if (!fbAuthObj.currentUser) {
            try { await fbAuthObj.signInAnonymously(); }
            catch (e) { throw new Error(`Firebase 인증 실패 - API Key/익명 로그인 설정을 확인하세요. (${e.code || e.message})`); }
        }
    } else {
        // 브라우저(온라인 버전): 구글 로그인 필요. 세션이 있으면 자동 복원.
        // 세션이 없으면 버튼 없이 자동으로 구글 로그인 화면으로 이동했다가 곧바로 돌아옵니다.
        const user = await fbWaitAuthReady();
        if (!user) {
            const provider = new firebase.auth.GoogleAuthProvider();
            await fbAuthObj.signInWithRedirect(provider); // 페이지 이동 시작 → 이후 코드는 실행되지 않음
            throw new Error('구글 로그인 화면으로 이동 중...');
        }
    }
    return fbDb;
}

// 브라우저에서 구글 계정으로 로그인 (버튼 클릭 등 사용자 동작에서 호출해야 팝업이 차단되지 않음)
window.fbGoogleSignIn = async function () {
    try {
        if (!fbApp) {
            const cfg = loadFirebaseConfig() || {};
            if (!cfg.apiKey || !cfg.projectId) { fbSetStatus('먼저 API Key / 프로젝트 ID를 입력하고 저장하세요.', 'err'); return; }
            fbApp = (firebase.apps || []).find(a => a.name === 'episodeBoardApp')
                || firebase.initializeApp({ apiKey: cfg.apiKey, projectId: cfg.projectId, authDomain: cfg.authDomain || (cfg.projectId + '.firebaseapp.com') }, 'episodeBoardApp');
            fbAuthObj = fbApp.auth();
            fbDb = fbApp.firestore();
            try { await fbAuthObj.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
            fbAuthObj.onAuthStateChanged(fbUpdateAuthUI);
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        await fbAuthObj.signInWithPopup(provider);
        fbSetStatus('구글 로그인 완료!', 'ok');
    } catch (e) {
        console.error(e);
        fbSetStatus(`구글 로그인 실패 (${e.code || e.message})`, 'err');
    }
};
window.fbGoogleSignOut = async function () {
    try { if (fbAuthObj) await fbAuthObj.signOut(); fbSetStatus('로그아웃 되었습니다.', 'info'); }
    catch (e) { console.error(e); }
};

function fbDocRef(cfg) {
    return fbDb.collection(cfg.collection || 'episodeBoards').doc(cfg.docId || 'main');
}

async function firestorePull(cfg) {
    await fbConnect(cfg);
    const snap = await fbDocRef(cfg).get();
    if (!snap.exists) return { notFound: true };
    const d = snap.data();
    if (!d || !d.data) return { notFound: true };
    return { data: JSON.parse(d.data) };
}

async function firestorePush(cfg, dataStr) {
    await fbConnect(cfg);
    await fbDocRef(cfg).set({
        data: dataStr,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        clientId: fbGetClientId(cfg)
    }, { merge: true });
}

// 지금 사용자가 뭔가 입력 중인지 (원격 데이터를 바로 덮어쓰면 타이핑 중인 내용을 날릴 수 있어서 체크)
function fbIsUserEditing() {
    const el = document.activeElement;
    if (!el) return false;
    return el.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName);
}

function fbApplyRemoteData(data) {
    if (!data || !Array.isArray(data) || data.length === 0) return;
    fbApplyingRemote = true;
    _skipHistory = true;
    const activeId = window.currentWorkspaceId;
    window.workspaces = normalizeData(data);
    window.currentWorkspaceId = (activeId && window.workspaces.find(w => w.id === activeId)) ? activeId : window.workspaces[0].id;
    _skipHistory = false;
    renderAll();
    if (dbInitialized) saveToLocalDB(window.workspaces);
    fbApplyingRemote = false;
}

function fbShowSyncToast(msg) {
    const ind = document.getElementById('save-indicator');
    if (!ind) return;
    ind.classList.remove('opacity-0');
    ind.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5 inline-block mr-1.5 text-orange-500"></i> <span class="text-orange-600">${esc ? esc(msg) : msg}</span>`;
    if (window.lucide) window.lucide.createIcons({ el: ind });
    setTimeout(() => ind.classList.add('opacity-0'), 3000);
}

// 실시간 리스너 시작: 다른 PC가 Firebase에 저장하는 즉시 이 함수가 반응한다
function fbStartRealtimeSync(cfg) {
    fbConnect(cfg).then(() => {
        if (fbUnsub) { fbUnsub(); fbUnsub = null; }
        fbUnsub = fbDocRef(cfg).onSnapshot(snap => {
            if (!snap.exists) return;
            const d = snap.data();
            if (!d || !d.data) return;
            if (d.clientId === fbGetClientId(cfg)) return; // 내가 방금 올린 변경사항 에코 → 무시
            let parsed;
            try { parsed = JSON.parse(d.data); } catch (e) { return; }

            if (fbIsUserEditing()) {
                // 편집 중이면 바로 덮어쓰지 않고 보류, 편집이 끝나면 자동 반영
                fbPendingRemote = parsed;
                fbShowSyncToast('다른 PC에서 변경사항 도착 (편집 마치면 반영)');
                if (!fbEditWatcher) {
                    fbEditWatcher = setInterval(() => {
                        if (fbPendingRemote && !fbIsUserEditing()) {
                            const p = fbPendingRemote; fbPendingRemote = null;
                            fbApplyRemoteData(p);
                            fbShowSyncToast('다른 PC의 변경사항을 반영했습니다');
                        }
                    }, 1200);
                }
            } else {
                fbApplyRemoteData(parsed);
                fbShowSyncToast('다른 PC의 변경사항을 반영했습니다');
            }
        }, err => console.warn('Firebase 실시간 리스너 오류:', err));
    }).catch(e => console.warn('Firebase 실시간 연결 실패:', e));
}
function fbStopRealtimeSync() {
    if (fbUnsub) { fbUnsub(); fbUnsub = null; }
    if (fbEditWatcher) { clearInterval(fbEditWatcher); fbEditWatcher = null; }
    fbPendingRemote = null;
}

function fbSetStatus(msg, kind) {
    const el = document.getElementById('fb-status');
    if (!el) return;
    const colors = { info: 'text-gray-400', ok: 'text-green-600', warn: 'text-orange-500', err: 'text-red-500' };
    el.textContent = msg;
    el.className = `text-[11px] min-h-[16px] ${colors[kind] || colors.info}`;
}

};


        // --- Utility ---
        const escapeHtml = (unsafe) => {
            if (unsafe == null) return '';
            return String(unsafe)
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        };

        const generateId = () => 'id_' + Date.now() + Math.random().toString(36).substr(2, 9);

        // --- IndexedDB ---
        const DB_NAME = 'PlotBoardLocalDB';
        const STORE_NAME = 'workspaces';
        let db = null;
        let dbInitialized = false;

        function initLocalDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = (event) => reject(event.target.error);
                request.onsuccess = (event) => {
                    db = event.target.result;
                    dbInitialized = true;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        function loadFromLocalDB() {
            return new Promise((resolve, reject) => {
                if (!db) return resolve(null);
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get('main_save');
                request.onsuccess = (event) => resolve(request.result ? request.result.data : null);
                request.onerror = () => resolve(null);
            });
        }

        function saveToLocalDB(dataToSave) {
            return new Promise((resolve, reject) => {
                if (!db) return resolve();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id: 'main_save', data: dataToSave });
                request.onsuccess = () => {
                    // 마지막으로 열었던 보드 ID도 함께 저장
                    const t2 = db.transaction([STORE_NAME], 'readwrite');
                    const s2 = t2.objectStore(STORE_NAME);
                    s2.put({ id: 'last_workspace_id', data: window.currentWorkspaceId });
                    resolve();
                };
                request.onerror = (event) => reject(event.target.error);
            });
        }

        function loadLastWorkspaceId() {
            return new Promise((resolve) => {
                if (!db) return resolve(null);
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get('last_workspace_id');
                request.onsuccess = () => resolve(request.result ? request.result.data : null);
                request.onerror = () => resolve(null);
            });
        }

        // --- 데이터 정규화 (구버전 호환) ---
        const DEFAULT_MEMO_TABS = [
            { id: 'mainMale', label: '남자주인공' },

            { id: 'subChar', label: '조연' },

            { id: 'keyDevice', label: '주요장치' },

        ];

        const memoTabPlaceholders = {
            mainMale: '남자주인공의 성격, 외모, 배경, 설정 등을 기록하세요.',
            mainFemale: '여자주인공의 성격, 외모, 배경, 설정 등을 기록하세요.',

            general: '자유로운 아이디어나 추가 메모를 기록하세요.'
        };

        function normalizeData(data) {
            if (!Array.isArray(data)) return [];
            data.forEach(w => {
                if (!w.status) w.status = 'active';
                if (!w.cardWidth) w.cardWidth = 400;
                if (!w.globalFontSize) w.globalFontSize = '10.5pt';
                if (!w.globalFontFamily) w.globalFontFamily = '';
                if (!w.episodeTarget) w.episodeTarget = 5500; // 회차당 목표 글자수
                if (!w.memos || typeof w.memos !== 'object') {
                    const oldMemo = (typeof w.memo === 'string') ? w.memo : '';
                    w.memos = { mainMale: '', mainFemale: '', subChar: '', background: '', synopsis: '', keyDevice: '', general: oldMemo };
                }
                // 메모 탭 커스터마이징 초기화
                if (!w.memoTabs) {
                    w.memoTabs = JSON.parse(JSON.stringify(DEFAULT_MEMO_TABS));
                }
                // 카드별 체크리스트 초기화
                (w.data || []).forEach(row => {
                    (row.cards || []).forEach(card => {
                        if (!card.checklist) card.checklist = [];
                        if (!card.rowColor) card.rowColor = 'gray';
                        if (!card.cardFontSize) card.cardFontSize = '';
                        if (card.episode == null) card.episode = '';      // 회차 번호 (문자열)
                        if (!Array.isArray(card.foreshadows)) card.foreshadows = []; // [{id,label,role:'plant'|'payoff'}]
                    });
                    if (!row.color) row.color = 'gray';
                });
            });
            return data;
        }

        // ========== Undo / Redo 시스템 ==========
        const MAX_HISTORY = 50;
        let undoStack = [];
        let redoStack = [];
        let _skipHistory = false;

        function pushHistory() {
            if (_skipHistory) return;
            const snapshot = JSON.stringify(window.workspaces);
            // 같은 상태면 스킵
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapshot) return;
            undoStack.push(snapshot);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');
            if (undoBtn) undoBtn.disabled = undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = redoStack.length === 0;
        }

        window.undoAction = () => {
            if (undoStack.length === 0) return;
            const current = JSON.stringify(window.workspaces);
            redoStack.push(current);
            const prev = undoStack.pop();
            _skipHistory = true;
            window.workspaces = normalizeData(JSON.parse(prev));
            // currentWorkspaceId 유효성 확인
            if (!window.workspaces.find(w => w.id === window.currentWorkspaceId)) {
                window.currentWorkspaceId = window.workspaces[0]?.id;
            }
            renderAll();
            window.triggerSave();
            _skipHistory = false;
            updateUndoRedoUI();
        };

        window.redoAction = () => {
            if (redoStack.length === 0) return;
            const current = JSON.stringify(window.workspaces);
            undoStack.push(current);
            const next = redoStack.pop();
            _skipHistory = true;
            window.workspaces = normalizeData(JSON.parse(next));
            if (!window.workspaces.find(w => w.id === window.currentWorkspaceId)) {
                window.currentWorkspaceId = window.workspaces[0]?.id;
            }
            renderAll();
            window.triggerSave();
            _skipHistory = false;
            updateUndoRedoUI();
        };

        // ========== 삭제 토스트 (Soft Delete) ==========
        let _deletedCardCache = null; // { card, rowId, cardIdx }
        let _deleteToastTimer = null;

        function showDeleteToast(cardData, rowId, cardIdx) {
            _deletedCardCache = { card: JSON.parse(JSON.stringify(cardData)), rowId, cardIdx };
            const toast = document.getElementById('delete-toast');
            const msg = document.getElementById('delete-toast-msg');
            msg.textContent = `"${cardData.title || '제목 없음'}" 카드가 삭제됩니다.`;
            toast.classList.remove('hidden');
            toast.classList.add('flex');

            if (_deleteToastTimer) clearTimeout(_deleteToastTimer);
            _deleteToastTimer = setTimeout(() => {
                hideDeleteToast();
                _deletedCardCache = null;
            }, 4000);
        }

        function hideDeleteToast() {
            const toast = document.getElementById('delete-toast');
            toast.classList.add('hidden');
            toast.classList.remove('flex');
        }

        document.getElementById('delete-undo-btn').addEventListener('click', () => {
            if (!_deletedCardCache) return;
            clearTimeout(_deleteToastTimer);
            hideDeleteToast();
            const data = window.getCurrentBoard().data;
            const row = data.find(r => r.id === _deletedCardCache.rowId);
            if (row) {
                row.cards.splice(_deletedCardCache.cardIdx, 0, _deletedCardCache.card);
                renderAll();
                window.triggerSave();
            }
            _deletedCardCache = null;
        });

        // ========== 전체 검색 ==========
        window.openSearch = () => {
            const panel = document.getElementById('search-panel');
            panel.classList.remove('hidden');
            document.getElementById('search-input').focus();
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = '<span class="p-2 block text-xs text-gray-400">검색어를 입력하세요.</span>';
            if (window.lucide) window.lucide.createIcons({ el: panel });
        };

        window.closeSearch = () => {
            document.getElementById('search-panel').classList.add('hidden');
            // 하이라이트 제거
            document.querySelectorAll('.search-highlight').forEach(el => {
                el.outerHTML = el.innerHTML;
            });
        };

        window.doSearch = (query) => {
            const resultsEl = document.getElementById('search-results');
            if (!query || query.length < 1) {
                resultsEl.innerHTML = '<span class="p-2 block text-xs text-gray-400">검색어를 입력하세요.</span>';
                return;
            }
            const q = query.toLowerCase();
            const results = [];

            window.workspaces.forEach(board => {
                (board.data || []).forEach((row, rIdx) => {
                    (row.cards || []).forEach((card, cIdx) => {
                        const titleMatch = (card.title || '').toLowerCase().includes(q);
                        const locMatch = (card.location || '').toLowerCase().includes(q);
                        const contentText = card.content ? card.content.replace(/<[^>]+>/g, '') : '';
                        const contentMatch = contentText.toLowerCase().includes(q);
                        if (titleMatch || locMatch || contentMatch) {
                            results.push({ board, row, card, rIdx, cIdx });
                        }
                    });
                });
            });

            if (results.length === 0) {
                resultsEl.innerHTML = '<span class="p-2 block text-xs text-gray-400">검색 결과가 없습니다.</span>';
                return;
            }

            resultsEl.innerHTML = results.map(r => `
                <div onclick="window.jumpToCard('${r.board.id}', '${r.card.id}')" 
                     class="flex items-start gap-2 p-2 rounded-lg hover:bg-blue-50 cursor-pointer transition-colors group">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-gray-400 shrink-0 mt-0.5"></i>
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-700 truncate">${escapeHtml(r.card.title || '제목 없음')}</div>
                        <div class="text-[10px] text-gray-400 truncate">${escapeHtml(r.board.title)} › ${escapeHtml(r.row.title || 'Track ' + (r.rIdx+1))} ${r.card.location ? '· ' + escapeHtml(r.card.location) : ''}</div>
                    </div>
                </div>
            `).join('');
            if (window.lucide) window.lucide.createIcons({ el: resultsEl });
        };

        window.jumpToCard = (boardId, cardId) => {
            window.closeSearch();
            if (window.currentWorkspaceId !== boardId) {
                window.currentWorkspaceId = boardId;
                window.activeCardId = null;
                renderAll();
            }
            setTimeout(() => {
                window.selectCard(cardId);
                const cardEl = document.querySelector(`.card-wrapper[data-card-id="${cardId}"]`);
                if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }, 100);
        };

        // ========== 체크리스트 ==========
        window.addChecklistItem = () => {
            if (!window.activeCardId) { alert('카드를 먼저 선택하세요.'); return; }
            const result = findCardAndRow(window.activeCardId);
            if (result) {
                pushHistory();
                if (!result.card.checklist) result.card.checklist = [];
                result.card.checklist.push({ id: generateId(), text: '', done: false });
                renderChecklist(result.card);
                window.refreshCardMarks(result.card.id);
                window.triggerSave();
            }
        };

        function renderChecklist(card) {
            const container = document.getElementById('checklist-container');
            if (!card || !card.checklist || card.checklist.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = card.checklist.map((item, idx) => `
                <div class="checklist-item" id="check-item-${item.id}">
                    <input type="checkbox" ${item.done ? 'checked' : ''} onchange="window.toggleCheckItem('${card.id}', '${item.id}', this.checked)">
                    <input type="text" value="${escapeHtml(item.text)}" placeholder="할 일 입력..." 
                           class="flex-1 bg-transparent border-none outline-none text-[11px] ${item.done ? 'line-through text-gray-400' : 'text-gray-700'}"

        window.toggleCheckItem = (cardId, itemId, done) => {

        function renderEpisodeSummary() {
            const el = document.getElementById('episode-summary');
            if (!el) return;
            const board = window.getCurrentBoard();
            if (!board) return;
            const target = board.episodeTarget || 5500;

            // 회차별 집계
            const map = {}; // ep -> { words, scenes }
            (board.data || []).forEach(row => {
                (row.cards || []).forEach(card => {
                    const ep = String(card.episode || '').replace(/[^0-9]/g, '');
                    if (!ep) return;
                    const w = parseInt(String(card.estWords || '').replace(/[^0-9]/g, ''), 10) || 0;
                    if (!map[ep]) map[ep] = { words: 0, scenes: 0 };
                    map[ep].words += w;
                    map[ep].scenes += 1;
                });
            });

            const eps = Object.keys(map).map(Number).sort((a, b) => a - b);
            if (eps.length === 0) {
                el.innerHTML = '';
                return;
            }

            el.innerHTML = eps.map(ep => {
                const { words, scenes } = map[ep];
                const pct = Math.min(100, Math.round((words / target) * 100));
                const col = episodeColor(ep) || '#6366f1';
                const over = words > target;
                const barColor = over ? '#ef4444' : col;
                return `
                    <div>
                        <div class="flex items-center justify-between mb-0.5">
                            <span class="font-bold flex items-center gap-1" style="color:${col}">
                                <span class="inline-block w-2 h-2 rounded-full" style="background:${col}"></span>${ep}화
                                <span class="text-[10px] text-gray-400 font-normal">· ${scenes}장면</span>
                            </span>
                            <span class="text-[10px] font-bold ${over ? 'text-red-500' : 'text-gray-500'}">${words.toLocaleString()} / ${target.toLocaleString()}</span>
                        </div>
                        <div class="h-1.5 rounded-full bg-gray-100 overflow-hidden">
                            <div class="h-full rounded-full transition-all" style="width:${pct}%;background:${barColor}"></div>
                        </div>
                    </div>`;
            }).join('');
        }

        // ========== 복선 / 떡밥 ==========
        const FORESHADOW_ROLES = {
            plant:  { label: '던짐', icon: '🌱', cls: 'bg-emerald-100 text-emerald-700' },
            payoff: { label: '회수', icon: '✅', cls: 'bg-blue-100 text-blue-700' }
        };

        window.addForeshadow = () => {
            if (!window.activeCardId) { alert('카드를 먼저 선택하세요.'); return; }
            const result = findCardAndRow(window.activeCardId);
            if (!result) return;
            pushHistory();
            if (!Array.isArray(result.card.foreshadows)) result.card.foreshadows = [];
            result.card.foreshadows.push({ id: generateId(), label: '', role: 'plant' });
            renderForeshadowEditor(result.card);
            window.refreshCardMarks(result.card.id);
            window.triggerSave();
        };

        function renderForeshadowEditor(card) {
            const el = document.getElementById('foreshadow-editor');
            if (!el) return;
            if (!card) {
                el.innerHTML = '';
                return;
            }
            const list = card.foreshadows || [];
            if (list.length === 0) {
                el.innerHTML = '';
                return;
            }
            el.innerHTML = list.map(f => {
                const r = FORESHADOW_ROLES[f.role] || FORESHADOW_ROLES.plant;
                return `
                <div class="flex items-center gap-1">
                    <button onclick="window.toggleForeshadowRole('${card.id}','${f.id}')" title="던짐 ↔ 회수 전환"
                            class="shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded ${r.cls} hover:opacity-80 transition-opacity">${r.icon} ${r.label}</button>
                    <input type="text" value="${escapeHtml(f.label)}" placeholder="복선 이름 (예: 어머니의 반지)"
                           class="flex-1 min-w-0 bg-transparent border-b border-gray-200 outline-none text-[11px] text-gray-700 focus:border-amber-300 py-0.5"
                           oninput="window.updateForeshadow('${card.id}','${f.id}', this.value)"
                           onkeydown="if(event.key==='Enter'){window.addForeshadow()}">
                    <button onclick="window.removeForeshadow('${card.id}','${f.id}')" class="shrink-0 text-gray-300 hover:text-red-400 transition-colors">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>`;
            }).join('');
            if (window.lucide) window.lucide.createIcons({ el });
        }

        window.updateForeshadow = (cardId, fId, value) => {
            const result = findCardAndRow(cardId);
            if (!result) return;
            const f = (result.card.foreshadows || []).find(x => x.id === fId);
            if (f) { f.label = value; renderForeshadowSummary(); window.triggerSave(); }
        };

        window.toggleForeshadowRole = (cardId, fId) => {
            const result = findCardAndRow(cardId);
            if (!result) return;
            const f = (result.card.foreshadows || []).find(x => x.id === fId);
            if (f) {
                f.role = (f.role === 'plant') ? 'payoff' : 'plant';
                renderForeshadowEditor(result.card);
                renderForeshadowSummary();
                window.triggerSave();
            }
        };

        window.removeForeshadow = (cardId, fId) => {
            pushHistory();
            const result = findCardAndRow(cardId);
            if (!result) return;
            result.card.foreshadows = (result.card.foreshadows || []).filter(x => x.id !== fId);
            renderForeshadowEditor(result.card);
            renderForeshadowSummary();
            window.refreshCardMarks(cardId);
            window.triggerSave();
        };

        function renderForeshadowSummary() {
            const el = document.getElementById('foreshadow-summary');
            if (!el) return;
            const board = window.getCurrentBoard();
            if (!board) return;

            // 라벨(대소문자/공백 무시)별로 묶기
            const groups = {}; // key -> { label, plant:[cards], payoff:[cards] }
            (board.data || []).forEach(row => {
                (row.cards || []).forEach(card => {
                    (card.foreshadows || []).forEach(f => {
                        const label = (f.label || '').trim();
                        if (!label) return;
                        const key = label.toLowerCase();
                        if (!groups[key]) groups[key] = { label, plant: [], payoff: [] };
                        (f.role === 'payoff' ? groups[key].payoff : groups[key].plant).push(card);
                    });
                });
            });

            const keys = Object.keys(groups);
            if (keys.length === 0) {
                el.innerHTML = '';
                return;
            }

            el.innerHTML = keys.map(k => {
                const g = groups[k];
                const hasPlant = g.plant.length > 0;
                const hasPayoff = g.payoff.length > 0;
                let status, color;
                if (hasPlant && hasPayoff) { status = '✅ 회수완료'; color = 'text-blue-600'; }
                else if (hasPlant && !hasPayoff) { status = '🌱 미회수'; color = 'text-amber-600'; }
                else { status = '⚠️ 회수만 있음'; color = 'text-red-500'; }
                const jumpCard = (hasPlant ? g.plant[0] : g.payoff[0]);
                return `
                    <div class="flex items-center justify-between gap-2 cursor-pointer hover:bg-amber-50 rounded px-1 py-0.5"
                         onclick="window.jumpToCard('${board.id}','${jumpCard.id}')" title="해당 장면으로 이동">
                        <span class="truncate text-gray-700">${escapeHtml(g.label)}</span>
                        <span class="shrink-0 font-bold ${color}">${status}</span>
                    </div>`;
            }).join('');
        }

        // ========== 트랙 색상 ==========
        const ROW_COLORS = [
            { key: 'gray', label: '기본', cls: 'bg-gray-100' },
            { key: 'red', label: '발단', cls: 'bg-red-100' },
            { key: 'orange', label: '전개', cls: 'bg-orange-100' },
            { key: 'yellow', label: '위기', cls: 'bg-yellow-100' },
            { key: 'green', label: '절정', cls: 'bg-green-100' },
            { key: 'blue', label: '결말', cls: 'bg-blue-100' },
            { key: 'purple', label: '기타', cls: 'bg-purple-100' },
            { key: 'pink', label: '기타2', cls: 'bg-pink-100' },
        ];

        function getRowColorCls(key) {
            return (ROW_COLORS.find(c => c.key === key) || ROW_COLORS[0]).cls;
        }

        window.cycleRowColor = (rowId) => {
            pushHistory();
            const row = window.getCurrentBoard().data.find(r => r.id === rowId);
            if (!row) return;
            const keys = ROW_COLORS.map(c => c.key);
            const curIdx = keys.indexOf(row.color || 'gray');
            row.color = keys[(curIdx + 1) % keys.length];
            renderAll();

        // ========== 카드 복사 ==========
        window.duplicateCard = (cardId) => {
            pushHistory();
            const data = window.getCurrentBoard().data;
            for (let r of data) {
                const idx = r.cards.findIndex(c => c.id === cardId);
                if (idx !== -1) {
                    const original = r.cards[idx];

                    copy.checklist = (copy.checklist || []).map(item => ({ ...item, id: generateId() }));

        // ========== 메모 탭 커스터마이징 ==========
        window.editMemoTabs = () => {
            const board = window.getCurrentBoard();
            if (!board) return;
            const tabs = board.memoTabs || JSON.parse(JSON.stringify(DEFAULT_MEMO_TABS));
            const newLabels = prompt(
                '탭 이름을 쉼표로 구분해서 입력하세요 (최대 7개):\n현재: ' + tabs.map(t => t.label).join(', '),
                tabs.map(t => t.label).join(', ')
            );
            if (newLabels === null) return;
            const parts = newLabels.split(',').map(s => s.trim()).filter(Boolean).slice(0, 7);
            if (parts.length === 0) return;

            pushHistory();
            board.memoTabs = parts.map((label, i) => ({
                id: tabs[i] ? tabs[i].id : generateId(),
                label
            }));

            board.memoTabs.forEach(t => {

        function renderMemoTabs(board) {

            if (!tabsEl || !board) return;
            const tabs = board.memoTabs || DEFAULT_MEMO_TABS;
            tabsEl.innerHTML = tabs.map(t => `
                <button onclick="window.switchMemoTab('${t.id}')" id="tab-${t.id}" 
                        class="memo-tab-btn px-2 py-1 text-[10px] rounded border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">
                    ${escapeHtml(t.label)}

            // 활성 탭 강조
            tabsEl.querySelectorAll('.memo-tab-btn').forEach(btn => {

                }
            });
        }

        // ========== Auto Save ==========
        let saveTimeout = null;

        // 원자적 저장 + 롤링 백업
        // - 임시파일(.tmp)에 먼저 쓰고 rename으로 교체 → 쓰기 도중 죽어도 본파일이 깨지지 않음
        // - 내용이 직전과 달라졌을 때만 백업을 회전(.bak1 ~ .bakN) → 동일 저장 스팸 방지
        const MAX_BACKUPS = 15;
        // 파일 존재 여부를 비동기로 확인 (동기 existsSync는 렌더러 스레드를 멈추게 하므로 사용하지 않음)
        async function fileExistsAsync(p) {
            try { await fs.promises.access(p); return true; }
            catch(e) { return false; }
        }

        async function safeSaveWithBackup(filePath, dataStr) {
            // 변경 여부 확인
            let prev = null;
            try {
                prev = await fs.promises.readFile(filePath, 'utf8');
            } catch(e) { prev = null; }

            // 내용 동일하면 쓰기 자체를 건너뜀
            if (prev === dataStr) return;

            // 본파일이 이미 있으면(=직전 상태가 존재) 백업 회전
            if (prev !== null) {
                try {
                    for (let i = MAX_BACKUPS - 1; i >= 1; i--) {
                        const src = `${filePath}.bak${i}`;
                        const dst = `${filePath}.bak${i + 1}`;
                        try { await fs.promises.rename(src, dst); } catch(e) {} // 없으면(ENOENT) 그냥 넘어감
                    }
                    await fs.promises.copyFile(filePath, `${filePath}.bak1`);
                } catch(e) { console.warn('백업 회전 실패(저장은 계속):', e); }
            }

            // 원자적 쓰기: tmp → rename
            const tmpPath = `${filePath}.tmp`;
            await fs.promises.writeFile(tmpPath, dataStr, 'utf8');
            await fs.promises.rename(tmpPath, filePath);
        }

        // TARGET_DIR이 한 번 확인/생성되면 매번 다시 물어보지 않도록 캐시
        // (existsSync를 저장할 때마다 부르면 클라우드 동기화 폴더에서 매번 지연이 생길 수 있음)
        let _targetDirReady = false;

        window.triggerSave = function(force = false) {
            showSaveIndicator('loading');
            if (saveTimeout) clearTimeout(saveTimeout);
            const delay = force ? 0 : 1000;
            
            saveTimeout = setTimeout(async () => {
                try {
                    const cleanDataStr = JSON.stringify(window.workspaces, null, 2);
                    let gDriveSuccess = false;
                    if (isNodeEnvironment) {
                        if (!_targetDirReady) {
                            if (!(await fileExistsAsync(TARGET_DIR))) {
                                try { await fs.promises.mkdir(TARGET_DIR, { recursive: true }); } catch(e) {}
                            }
                            _targetDirReady = await fileExistsAsync(TARGET_DIR);
                        }
                        if (_targetDirReady) {
                            await safeSaveWithBackup(targetFilePath, cleanDataStr);
                            gDriveSuccess = true;
                            showSaveIndicator('gdrive_success');
                        }
                    }
                    if (dbInitialized) {
                        await saveToLocalDB(JSON.parse(cleanDataStr));
                        if(!gDriveSuccess) showSaveIndicator('local_success');
                    }

                            console.warn('GitHub 자동 동기화 실패:', e);

                        }
                    }

                    // Firebase 자동 동기화 (설정되어 있고 자동 동기화가 켜진 경우에만)
                    if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.autoSync) {

        window._applyFontNoIpc = (kind, value) => {
          try {
            const board = window.getCurrentBoard();
            if (!board) return;
            const isSize = (kind === 'fontSize');
            const attr   = isSize ? 'size' : 'face';
            const cssKey = isSize ? 'font-size' : 'font-family';
            const styleProp = isSize ? 'fontSize' : 'fontFamily';

            document.querySelectorAll('.rich-editor[id^="editor-"]').forEach(editor => {
                Array.from(editor.querySelectorAll(`font[${attr}]`)).forEach(el => {
                    el.removeAttribute(attr);
                    if (!el.getAttribute('style') && !el.getAttribute('color') &&
                        !el.getAttribute('size') && !el.getAttribute('face')) {
                        el.replaceWith(...Array.from(el.childNodes));
                    }
                });
                Array.from(editor.querySelectorAll(`[style*="${cssKey}"]`)).forEach(el => {
                    el.style[styleProp] = '';
                    const st = el.getAttribute('style');
                    if (!st || !st.trim()) el.removeAttribute('style');
                });
                editor.style[styleProp] = value;
            });

            (board.data || []).forEach(row => {
                (row.cards || []).forEach(card => {
                    if (isSize) card.cardFontSize = value;
                    if (!card.content) return;
                    const tmp = document.createElement('div');
                    tmp.innerHTML = card.content;
                    Array.from(tmp.querySelectorAll(`font[${attr}]`)).forEach(el => {
                        el.removeAttribute(attr);
                        if (!el.getAttribute('style') && !el.getAttribute('color') &&
                            !el.getAttribute('size') && !el.getAttribute('face')) {
                            el.replaceWith(...Array.from(el.childNodes));
                        }
                    });
                    Array.from(tmp.querySelectorAll(`[style*="${cssKey}"]`)).forEach(el => {
                        el.style[styleProp] = '';
                        const st = el.getAttribute('style');
                        if (!st || !st.trim()) el.removeAttribute('style');
                    });
                    card.content = tmp.innerHTML;
                });
            });
            window.triggerSave();
          } catch (err) {
            console.error('[_applyFontNoIpc]', kind, value, err);
          }
        };
