<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3ece2">
<title>마음 한 장 — 종이 다이어리를 위한 320개의 질문</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece2;--card:#fffaf2;--ink:#3d322b;--muted:#8d7f72;--line:#e6d9c8;--accent:#b0776b;--accent-d:#8f5d53;--soft:#f6e6de;--serif:'Gowun Batang','Noto Serif KR','Nanum Myeongjo','Batang',serif;--sans:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--shadow:0 18px 50px -18px rgba(95,66,48,.28),0 2px 6px rgba(95,66,48,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1000px 520px at 50% -140px,#fff8ee,transparent 70%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2.5px solid #c9a79b;outline-offset:3px;border-radius:10px}
.wrap{width:min(680px,calc(100% - 36px));margin:0 auto;padding:44px 0 72px}
.top{text-align:center;margin-bottom:18px}
.mark{font-family:var(--serif);font-size:13px;letter-spacing:.32em;color:var(--accent);margin-bottom:6px}
.top h1{font-family:var(--serif);font-weight:400;font-size:clamp(25px,5vw,31px);letter-spacing:-.5px;margin:0 0 6px}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.paper{position:relative;background:var(--card);border-radius:20px;padding:22px 22px 18px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
.paper:before{content:"";position:absolute;inset:7px;border:1px dashed #e4d3c1;border-radius:14px;pointer-events:none}
.paper:after{content:"❦";position:absolute;right:-4px;bottom:-22px;font-size:90px;line-height:1;color:var(--soft);opacity:.7;transform:rotate(-14deg);pointer-events:none}
.paper>*{position:relative;z-index:1}
.date{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.chip{display:inline-block;margin:8px 0 0;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:600;color:var(--cat,var(--accent));background:color-mix(in srgb,var(--cat,var(--accent)) 10%,#fffaf2);border:1px solid color-mix(in srgb,var(--cat,var(--accent)) 28%,#fffaf2)}
.q{font-family:var(--serif);font-size:clamp(18px,3.6vw,22px);line-height:1.55;letter-spacing:-.4px;margin:10px auto 8px;min-height:3.6em;font-weight:400;display:flex;align-items:center;justify-content:center;max-width:520px;word-break:keep-all;overflow-wrap:anywhere}
.meta{font-size:11px;color:#a69889;margin-bottom:14px}
.btns{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
.btn{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:6px 11px;font-size:12px;white-space:nowrap;font-weight:600;color:#6b564b;transition:.15s}
.btn:hover{background:var(--soft);border-color:#dcc0b5}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px -5px rgba(176,119,107,.7)}
.btn.main:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn:active{transform:scale(.97)}
.lead{margin:50px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lead h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;letter-spacing:-.4px}
.lead span{font-size:12px;color:var(--muted)}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cat{border:1px solid var(--line);background:#fffaf2;border-radius:99px;padding:7px 14px;font-size:12.5px;color:#7a6a5f}
.cat:hover{background:#fbf0e8}
.cat[aria-pressed=true]{background:#5c493f;border-color:#5c493f;color:#fff}
.search{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:11px 15px;font-size:14px;outline:none;margin-bottom:10px}
.search:focus{border-color:#cfaea3}.search::placeholder{color:#b3a699}
.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:6px 8px;max-height:520px;overflow:auto}
.row{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.55;word-break:keep-all}
.row+.row{border-top:1px dotted #eadfce;border-radius:0}
.row:hover{background:#fbf0e8;border-radius:12px}
.row b{font-family:var(--serif);font-weight:400;font-size:12px;color:#c4ab9f;min-width:22px}
.none{padding:34px 10px;text-align:center;color:var(--muted)}
.foot{margin-top:34px;text-align:center;font-size:12px;color:#a69889;line-height:1.9}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#4d3f37;color:#fff;border-radius:99px;padding:9px 18px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.wrap{padding-top:26px}.paper{padding:20px 14px 16px}.q{min-height:4.2em}.btn{padding:6px 9px;font-size:11.5px}.btns{gap:5px}.list{max-height:none}}
@media print{body{background:#fff}.top p,.lead,.cats,.search,.list,.foot,.btns,.toast,.meta{display:none!important}.paper{box-shadow:none;border:1px solid #ddd}.paper:after{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
 <header class="top"><div class="mark">마 음 한 장</div><h1>오늘, 어떤 이야기를 적어볼까요</h1><p>질문은 여기서 고르고, 대답은 나의 다이어리에.</p></header>
 <section class="paper" id="paper" aria-label="오늘의 질문">
  <div class="date" id="date"></div>
  <span class="chip" id="chip"></span>
  <h2 class="q" id="q" aria-live="polite"></h2>
  <div class="meta" id="meta"></div>
  <div class="btns"><button class="btn main" id="again" type="button">↻ 다른 질문</button><button class="btn" id="same" type="button">같은 주제</button><button class="btn" id="copy" type="button">복사</button><button class="btn" id="todayBtn" type="button">오늘</button></div>
 </section>
 <div class="lead"><h2>질문 서랍</h2><span id="count"></span></div>
 <div class="cats" id="cats" role="group" aria-label="주제"></div>
 <input class="search" id="search" type="search" placeholder="전체 질문에서 검색" aria-label="질문 검색" autocomplete="off">
 <div class="list" id="list"></div>
 <p class="foot">답을 입력하거나 저장하는 기능은 없어요.<br>마음 가는 질문 하나만 골라 다이어리에 적어 보세요 ♡</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const ALL = CATEGORIES.flatMap((c,ci)=>c.questions.map((text,i)=>({id:ci+'-'+i,ci,i,text})));

function dailyQ(d){const n=ALL.length,y=d.getFullYear(),a=ALL.map((_,i)=>i);let s=(y*2654435761)>>>0;
 const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let r=Math.imul(s^(s>>>15),1|s);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296};
 for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 const doy=Math.floor((Date.UTC(y,d.getMonth(),d.getDate())-Date.UTC(y,0,0))/864e5);return ALL[a[(doy-1)%n]]}

function rows(){const s=$('search').value.trim().toLowerCase();const l=ALL.filter(q=>(tab<0||q.ci===tab)&&(!s||q.text.toLowerCase().includes(s)));$('count').textContent=l.length+'개의 질문';const h=$('list');h.replaceChildren();
 if(!l.length){const p=document.createElement('p');p.className='none';p.textContent='찾는 질문이 없어요. 다른 단어로 검색해 보세요.';h.append(p);return}
