        function renderSubCharList() {
            const board = window.getCurrentBoard();
            const listEl = document.getElementById('char-subchar-list');
            if (!board || !listEl) return;
            if (!Array.isArray(board.subChars)) board.subChars = [];
            if (board.subChars.length === 0) {
                board.subChars.push({ id: generateId(), photo: '', name: '', age: '', personality: '', role: '', relation: '', note: '' });
                window.triggerSave();
            }
            listEl.innerHTML = board.subChars.map(sc => subCharCardHtml(sc)).join('');
            listEl.querySelectorAll('textarea').forEach(t => window.autoGrowTextarea(t));
            if (window.lucide) window.lucide.createIcons({ el: listEl });
        }

        window.addSubChar = () => {
            const board = window.getCurrentBoard();
            if (!board) return;
            if (!Array.isArray(board.subChars)) board.subChars = [];
            board.subChars.push({ id: generateId(), photo: '', name: '', age: '', personality: '', role: '', relation: '', note: '' });
            window.triggerSave();
            renderSubCharList();
        };

        window.deleteSubChar = (id) => {
            const board = window.getCurrentBoard();
            if (!board || !Array.isArray(board.subChars)) return;
            board.subChars = board.subChars.filter(sc => sc.id !== id);
            window.triggerSave();
            renderSubCharList();
        };

        window.updateSubCharField = (id, key, value) => {
            const board = window.getCurrentBoard();
            if (!board || !Array.isArray(board.subChars)) return;
            const sc = board.subChars.find(s => s.id === id);
            if (sc) { sc[key] = value; window.triggerSave(); }
        };

        window.uploadSubCharPhoto = (event, id) => {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('이미지 파일만 업로드할 수 있습니다.'); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                const board = window.getCurrentBoard();
                if (!board || !Array.isArray(board.subChars)) return;
                const sc = board.subChars.find(s => s.id === id);
                if (sc) {
                    sc.photo = e.target.result;
                    window.triggerSave();
                    renderSubCharList();
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.removeSubCharPhoto = (id) => {
            const board = window.getCurrentBoard();
            if (!board || !Array.isArray(board.subChars)) return;
            const sc = board.subChars.find(s => s.id === id);
            if (sc) { sc.photo = ''; window.triggerSave(); renderSubCharList(); }
        };

        window.switchCharTab = (tabId) => {
            window.activeCharTab = tabId;
            renderCharacterPage();
        };

        window.uploadCharPhoto = (event) => {
            const file = event.target.files[0];
            if (!file || !window.activeCharTab) return;
            if (!file.type.startsWith('image/')) { alert('이미지 파일만 업로드할 수 있습니다.'); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                const board = window.getCurrentBoard();
                if (!board) return;
                if (!board.memoPhotos) board.memoPhotos = {};
                board.memoPhotos[window.activeCharTab] = e.target.result;
                window.triggerSave();
                renderCharacterPage();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.removeCharPhoto = (event) => {
            event.preventDefault();
            event.stopPropagation();
            const board = window.getCurrentBoard();
            if (board && board.memoPhotos && window.activeCharTab) {
                delete board.memoPhotos[window.activeCharTab];
                window.triggerSave();
                renderCharacterPage();
            }
        };

        function renderNotePage() {
            const board = window.getCurrentBoard();
            const tabsEl = document.getElementById('note-page-tabs');
            if (!board || !tabsEl) return;
            const allTabs = board.memoTabs || DEFAULT_MEMO_TABS;
            const tabs = allTabs.filter(t => !CHAR_PAGE_TAB_IDS.includes(t.id));
            if (!window.activeNoteTab || !tabs.find(t => t.id === window.activeNoteTab)) {
                window.activeNoteTab = tabs[0] ? tabs[0].id : null;
            }
            tabsEl.innerHTML = tabs.map(t => `
                <button onclick="window.switchNoteTab('${t.id}')" id="note-tab-${t.id}"
                        class="page-tab-btn rounded-full ${t.id === window.activeNoteTab ? 'bg-white text-gray-800 shadow-sm font-bold' : 'text-gray-500 hover:text-gray-700 font-medium'}"
                        style="padding:7px 18px; font-size:13px; border:none;">
                    ${escapeHtml(t.label)}
                </button>
            `).join('');
            renderNoteEntries();
            if (window.lucide) window.lucide.createIcons();
        }

        window.switchNoteTab = (tabId) => {
            window.activeNoteTab = tabId;
            renderNotePage();
        };

        function noteEntryHtml(entry) {
            const isEmpty = !entry.text || entry.text.trim() === '' || entry.text === '<br>';
            return `
                <div class="hover-card bg-white border border-gray-200 flex items-start gap-2" style="padding:12px;">
                    <div id="editor-note-${entry.id}" contenteditable="true" spellcheck="false"
                         oninput="window.updateNoteEntry('${entry.id}', this.innerHTML); window.toggleEmptyEditor(this);"
                         onfocus="window.activeBlockEditorId='editor-note-${entry.id}';"
                         class="rich-editor flex-1 min-w-0 outline-none leading-relaxed text-gray-700 text-sm ${isEmpty ? 'empty-editor' : ''}"
                         style="min-height:46px;" data-placeholder="${escapeHtml(memoTabPlaceholders[window.activeNoteTab] || '내용을 입력하세요.')}">${entry.text || ''}</div>
                    <button onclick="window.deleteNoteEntry('${entry.id}')" class="card-remove-btn shrink-0 text-gray-300 hover:text-red-500" title="삭제">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>`;
        }

        window.toggleEmptyEditor = (el) => {
            if (el.innerHTML.trim() === '' || el.innerHTML === '<br>') el.classList.add('empty-editor');
            else el.classList.remove('empty-editor');
        };

        function renderNoteEntries() {
            const board = window.getCurrentBoard();
            const listEl = document.getElementById('note-entries-list');
            if (!board || !listEl || !window.activeNoteTab) return;
            if (!board.memoEntries) board.memoEntries = {};
            if (!Array.isArray(board.memoEntries[window.activeNoteTab]) || board.memoEntries[window.activeNoteTab].length === 0) {
                board.memoEntries[window.activeNoteTab] = [{ id: generateId(), text: '' }];
                window.triggerSave();
            }
            const entries = board.memoEntries[window.activeNoteTab];
            listEl.innerHTML = entries.map(e => noteEntryHtml(e)).join('');
            if (window.lucide) window.lucide.createIcons({ el: listEl });
        }

        window.addNoteEntry = () => {
            const board = window.getCurrentBoard();
            if (!board || !window.activeNoteTab) return;
            if (!board.memoEntries) board.memoEntries = {};
            if (!Array.isArray(board.memoEntries[window.activeNoteTab])) board.memoEntries[window.activeNoteTab] = [];
            board.memoEntries[window.activeNoteTab].push({ id: generateId(), text: '' });
            window.triggerSave();
            renderNoteEntries();
        };

        window.deleteNoteEntry = (id) => {
            const board = window.getCurrentBoard();
            if (!board || !window.activeNoteTab || !board.memoEntries) return;
            const arr = board.memoEntries[window.activeNoteTab];
            if (!arr) return;
            board.memoEntries[window.activeNoteTab] = arr.filter(e => e.id !== id);
            window.triggerSave();
            renderNoteEntries();
        };

        window.updateNoteEntry = (id, value) => {
            const board = window.getCurrentBoard();
            if (!board || !window.activeNoteTab || !board.memoEntries) return;
            const arr = board.memoEntries[window.activeNoteTab];
            if (!arr) return;
            const e = arr.find(x => x.id === id);
            if (e) { e.text = value; window.triggerSave(); }
        };

        // --- Drag & Drop for Boards ---
        window.handleBoardDragStart = (e, id) => {
            window.draggedBoardId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('board-dragging');
        };

        window.handleBoardDragOver = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const boardEl = e.target.closest('.group');
            if (boardEl && window.draggedBoardId && boardEl.dataset?.id !== window.draggedBoardId) {
                boardEl.classList.add('board-drag-over');
            }
        };

        window.handleBoardDragOverFolder = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            document.getElementById('board-list-completed').classList.add('folder-drag-over');
            if (!window.isCompletedFolderOpen) window.toggleCompletedFolder();
        };

        window.handleBoardDragLeaveFolder = (e) => {
            document.getElementById('board-list-completed').classList.remove('folder-drag-over');
        };

        window.handleBoardDrop = (e, targetId, targetStatus) => {
            e.preventDefault();
            e.stopPropagation();
            document.querySelectorAll('.group').forEach(el => el.classList.remove('board-dragging', 'board-drag-over'));
            document.getElementById('board-list-completed').classList.remove('folder-drag-over');
            if (!window.draggedBoardId) return;
            const fromIndex = window.workspaces.findIndex(w => w.id === window.draggedBoardId);
            if (fromIndex === -1) return;
            window.workspaces[fromIndex].status = targetStatus;
            if (targetId && targetId !== window.draggedBoardId) {
                const toIndex = window.workspaces.findIndex(w => w.id === targetId);
                if (toIndex !== -1) {
                    const [movedBoard] = window.workspaces.splice(fromIndex, 1);
                    const adjustedToIndex = window.workspaces.findIndex(w => w.id === targetId); 
                    window.workspaces.splice(adjustedToIndex, 0, movedBoard);
                }
            }
            window.draggedBoardId = null;
            renderAll();
            window.triggerSave();
        };

        // --- Board UI Actions ---
        window.selectCard = (id) => {
            window.activeCardId = id;
            document.querySelectorAll('.card-wrapper').forEach(el => {
                const isActive = el.dataset.cardId === id;
                el.classList.toggle('active-card', isActive);
            });
            // 체크리스트 업데이트
            const result = findCardAndRow(id);
            if (result) { renderChecklist(result.card); renderForeshadowEditor(result.card); }
        };

        const findCardAndRow = (cardId) => {
            const board = window.getCurrentBoard();
            if (!board) return null;
            const data = board.data;
            for (let r of data) {
                let cardIdx = r.cards.findIndex(c => c.id === cardId);
                if (cardIdx !== -1) return { row: r, card: r.cards[cardIdx], cardIdx };
            }
            return null;
        };

        window.updateCardTitle = (id, value) => {
            const result = findCardAndRow(id);
            if(result) { result.card.title = value; window.triggerSave(); }
        };

        window.updateCardLocation = (id, value) => {
            const result = findCardAndRow(id);
            if(result) { result.card.location = value; window.triggerSave(); }
        };

        window.updateCardEstWords = (id, value) => {
            const result = findCardAndRow(id);
            if(result) {
                result.card.estWords = value;
                updateRowTotalDOM(result.row.id);
                updateBoardTotalDOM();
                renderEpisodeSummary();
                window.triggerSave();
            }
        };

        window.updateCardEpisode = (id, value) => {
            const result = findCardAndRow(id);
            if (!result) return;
            result.card.episode = value;
            const wrapper = document.querySelector(`.card-wrapper[data-card-id="${id}"]`);
            const col = episodeColor(value);
            if (wrapper) wrapper.style.borderTop = col ? `3px solid ${col}` : '';
            renderEpisodeSummary();
            window.triggerSave();
        };

        // --- 시놉시스 블록 (카드 안의 여러 텍스트 블록) ---
        window.updateBlockContent = (cardId, blockId, htmlContent) => {
            const result = findCardAndRow(cardId);
            if (!result) return;
            const block = (result.card.blocks || []).find(b => b.id === blockId);
            if (block) { block.html = htmlContent; window.triggerSave(); }
        };

        window.addBlock = (cardId) => {
            pushHistory();
            const result = findCardAndRow(cardId);
            if (!result) return;
            if (!Array.isArray(result.card.blocks)) result.card.blocks = [];
            const newBlockId = generateId();
            result.card.blocks.push({ id: newBlockId, html: '', markers: [], color: '' });
            renderAll();
            window.triggerSave();
            setTimeout(() => {
                window.selectCard(cardId);
                const editor = document.getElementById(`editor-${cardId}-${newBlockId}`);
                if (editor) editor.focus();
            }, 50);
        };

        window.deleteBlock = (cardId, blockId) => {
            const result = findCardAndRow(cardId);
            if (!result) return;
            pushHistory();
            result.card.blocks = (result.card.blocks || []).filter(b => b.id !== blockId);
            renderAll();
            window.triggerSave();
        };

        // 블록 드래그 앤 드롭: 같은 카드 안에서 순서 변경 + 다른 카드로 이동
        window._blockDrag = null; // { cardId, blockId }

        function clearBlockDragOverStyles() {
            document.querySelectorAll('.block-drag-over-top, .block-drag-over-bottom').forEach(el => {
                el.classList.remove('block-drag-over-top', 'block-drag-over-bottom');
            });
            document.querySelectorAll('.block-list-drag-over').forEach(el => el.classList.remove('block-list-drag-over'));
        }

        function moveBlockBetweenCards(fromCardId, blockId, toCardId, targetBlockId, insertBefore) {
            const fromResult = findCardAndRow(fromCardId);
            const toResult = findCardAndRow(toCardId);
            if (!fromResult || !toResult) return;
            const fromBlocks = fromResult.card.blocks || [];
            const idx = fromBlocks.findIndex(b => b.id === blockId);
            if (idx === -1) return;
            if (fromCardId === toCardId && targetBlockId === blockId) return;

            pushHistory();
            const [block] = fromBlocks.splice(idx, 1);
            if (!Array.isArray(toResult.card.blocks)) toResult.card.blocks = [];
            const toBlocks = toResult.card.blocks;

            if (targetBlockId) {
                let targetIdx = toBlocks.findIndex(b => b.id === targetBlockId);
                if (targetIdx === -1) targetIdx = toBlocks.length;
                toBlocks.splice(insertBefore ? targetIdx : targetIdx + 1, 0, block);
            } else {
                toBlocks.push(block);
            }

            renderAll();
            window.triggerSave();
        }

        window.handleBlockDragStart = (e, cardId, blockId) => {
            window._blockDrag = { cardId, blockId };
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', blockId); } catch (err) {}
            const itemEl = e.target.closest('.block-item');
            if (itemEl) setTimeout(() => itemEl.classList.add('block-dragging'), 0);
        };

        window.handleBlockDragEnd = () => {
            document.querySelectorAll('.block-dragging').forEach(el => el.classList.remove('block-dragging'));
            clearBlockDragOverStyles();
            window._blockDrag = null;
        };

        window.handleBlockDragOver = (e) => {
            if (!window._blockDrag) return;
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'move';
            const itemEl = e.currentTarget;
            if (itemEl.dataset.blockId === window._blockDrag.blockId) return;
            clearBlockDragOverStyles();
            const rect = itemEl.getBoundingClientRect();
            const before = (e.clientY - rect.top) < rect.height / 2;
            itemEl.classList.add(before ? 'block-drag-over-top' : 'block-drag-over-bottom');
        };

        window.handleBlockDragLeave = (e) => {
            e.currentTarget.classList.remove('block-drag-over-top', 'block-drag-over-bottom');
        };

        window.handleBlockDrop = (e, targetCardId, targetBlockId) => {
            if (!window._blockDrag) return;
            e.preventDefault();
            e.stopPropagation();
            const itemEl = e.currentTarget;
            const rect = itemEl.getBoundingClientRect();
            const before = (e.clientY - rect.top) < rect.height / 2;
            clearBlockDragOverStyles();
            moveBlockBetweenCards(window._blockDrag.cardId, window._blockDrag.blockId, targetCardId, targetBlockId, before);
            window._blockDrag = null;
        };

        window.handleBlockListDragOver = (e) => {
            if (!window._blockDrag) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (e.target === e.currentTarget) e.currentTarget.classList.add('block-list-drag-over');
        };

        window.handleBlockListDrop = (e, cardId) => {
            if (!window._blockDrag) return;
            if (e.target !== e.currentTarget) return; // 개별 블록 위 drop은 handleBlockDrop이 처리
            e.preventDefault();
            clearBlockDragOverStyles();
            moveBlockBetweenCards(window._blockDrag.cardId, window._blockDrag.blockId, cardId, null, false);
            window._blockDrag = null;
        };

        window.updateRowTitle = (id, value) => {
            const row = window.getCurrentBoard().data.find(r => r.id === id);
            if(row) { row.title = value; window.triggerSave(); }
        };

        // 카드 헤더의 마커 + 복선/체크리스트 마크를 한 번에 다시 그림
        window.refreshCardMarks = (cardId) => {
            const cont = document.getElementById(`markers-${cardId}`);
            if (cont) cont.innerHTML = '';
        };

        window.highlightActiveBlock = () => {
            document.querySelectorAll('.block-item.active-block').forEach(el => el.classList.remove('active-block'));
            if (window.activeBlockId) {
                const el = document.querySelector(`.block-item[data-block-id="${window.activeBlockId}"]`);
                if (el) el.classList.add('active-block');
            }
        };

        window.toggleMarker = (markerIcon) => {
            if (!window.activeBlockId) return alert('마커를 추가할 블록을 먼저 선택하세요.');
            pushHistory();
            const result = findCardAndRow(window.activeCardId);
            const block = result && (result.card.blocks || []).find(b => b.id === window.activeBlockId);
            if (block) {
                if (!Array.isArray(block.markers)) block.markers = [];
                const idx = block.markers.indexOf(markerIcon);
                if (idx > -1) block.markers.splice(idx, 1);
                else block.markers.push(markerIcon);
                renderAll();
                applyFilterDOM();
                window.triggerSave();
            }
        };

        window.toggleFilter = (markerIcon) => {
            window.activeFilter = window.activeFilter === markerIcon ? null : markerIcon;
            document.querySelectorAll('[id^="filter-btn-"]').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'border-blue-300', 'font-bold');
                btn.classList.add('text-gray-500', 'border-gray-200');
            });
            if (window.activeFilter) {
                const btn = document.getElementById(`filter-btn-${window.activeFilter}`);
                if(btn) {
                    btn.classList.remove('text-gray-500', 'border-gray-200');
                    btn.classList.add('bg-blue-50', 'border-blue-300', 'font-bold');
                }
            }
            applyFilterDOM();
        };

        window.addRow = () => {
            pushHistory();
            window.getCurrentBoard().data.push({
                id: generateId(), title: '', color: 'gray', cards: [{ id: generateId(), title: '', location: '', estWords: '', blocks: [{ id: generateId(), html: '' }], color: 'bg-white', markers: [], checklist: [] }]
            });
            renderAll();
            window.triggerSave();
        };

        window.removeRow = () => {
            const data = window.getCurrentBoard().data;
            if (data.length > 1) {
                if(confirm('마지막 트랙(행)을 삭제하시겠습니까? 포함된 모든 카드가 삭제됩니다.')) {
                    pushHistory();
                    data.pop();
                    renderAll();
                    window.triggerSave();
                }
            } else {
                alert('최소 1개의 트랙이 필요합니다.');
            }
        };

        window.addCardToRow = (rowId) => {
            pushHistory();
            const row = window.getCurrentBoard().data.find(r => r.id === rowId);
            if(row) {
                const newId = generateId();
                const firstBlockId = generateId();
                row.cards.push({ id: newId, title: '', location: '', estWords: '', blocks: [{ id: firstBlockId, html: '' }], color: 'bg-white', markers: [], checklist: [], episode: '', foreshadows: [] });
                renderAll();
                window.triggerSave();
                setTimeout(() => {
                    window.selectCard(newId);
                    const editor = document.getElementById(`editor-${newId}-${firstBlockId}`);
                    if(editor) editor.focus();
                }, 50);
            }
        };

        window.deleteCard = (id) => {
            const data = window.getCurrentBoard().data;
            for (let r of data) {
                const idx = r.cards.findIndex(c => c.id === id);
                if (idx !== -1) {
                    pushHistory();
                    const [removed] = r.cards.splice(idx, 1);
                    if(window.activeCardId === id) window.activeCardId = null;
                    renderAll();
                    window.triggerSave();
                    // 토스트로 되돌리기 제공
                    showDeleteToast(removed, r.id, idx);
                    return;
                }
            }
        };

        window.changeZoom = (delta) => {
            window.zoomLevel += delta;
            if (window.zoomLevel < 0.5) window.zoomLevel = 0.5;
            if (window.zoomLevel > 2.0) window.zoomLevel = 2.0;
            document.getElementById('zoom-container').style.transform = `scale(${window.zoomLevel})`;
            document.getElementById('zoom-level-text').textContent = Math.round(window.zoomLevel * 100) + '%';
        };

        window.resetZoom = () => {
            window.zoomLevel = 1;
            window.changeZoom(0);
        };

        window.changeCardColor = (colorClass) => {
            if (!window.activeBlockId) return;
            pushHistory();
            const result = findCardAndRow(window.activeCardId);
            const block = result && (result.card.blocks || []).find(b => b.id === window.activeBlockId);
            if (block) {
                block.color = colorClass;
                renderAll();
                window.triggerSave();
            }
        };

        // --- Drag & Drop for Cards ---
        window.handleCardDragStart = (e, cardId, rowId) => {
            window.draggedFromRowId = rowId;
            const result = findCardAndRow(cardId);
            window.draggedCardObj = result.card;
            e.dataTransfer.effectAllowed = 'move';
            const cardElement = document.querySelector(`.card-wrapper[data-card-id="${cardId}"]`);
            setTimeout(() => cardElement.classList.add('opacity-30'), 0);
        };

        window.handleCardDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        window.handleCardDragEnter = (e) => {
            e.preventDefault();
            const cardEl = e.target.closest('.card-wrapper');
            if (cardEl && cardEl.dataset.cardId !== (window.draggedCardObj ? window.draggedCardObj.id : '')) {
                cardEl.classList.add('drag-over');
            }
        };
        window.handleCardDragLeave = (e) => {
            const cardEl = e.target.closest('.card-wrapper');
            if (cardEl) cardEl.classList.remove('drag-over');
        };

        window.handleCardDrop = (e, targetCardId, targetRowId) => {
            e.preventDefault();
            e.stopPropagation();
            document.querySelectorAll('.card-wrapper').forEach(el => { el.classList.remove('opacity-30', 'drag-over'); });
            // 블록을 카드 빈 곳에 떨어뜨린 경우 → 그 카드의 맨 아래로 블록 이동
            if (window._blockDrag) {
                clearBlockDragOverStyles();
                moveBlockBetweenCards(window._blockDrag.cardId, window._blockDrag.blockId, targetCardId, null, false);
                window._blockDrag = null;
                return;
            }
            if (!window.draggedCardObj || window.draggedCardObj.id === targetCardId) return;
            pushHistory();
            const data = window.getCurrentBoard().data;
            const sourceRow = data.find(r => r.id === window.draggedFromRowId);
            const sourceIdx = sourceRow.cards.findIndex(c => c.id === window.draggedCardObj.id);
            sourceRow.cards.splice(sourceIdx, 1);
            const targetRow = data.find(r => r.id === targetRowId);
            const targetIdx = targetRow.cards.findIndex(c => c.id === targetCardId);
            targetRow.cards.splice(targetIdx, 0, window.draggedCardObj);
            window.draggedCardObj = null;
            renderAll();
            window.triggerSave();
        };

        window.handleCardDropToEmptyRow = (e, targetRowId) => {
            e.preventDefault();
            document.querySelectorAll('.card-wrapper').forEach(el => { el.classList.remove('opacity-30', 'drag-over'); });
            if (window._blockDrag) { clearBlockDragOverStyles(); window._blockDrag = null; return; }
            if (!window.draggedCardObj) return;
            pushHistory();
            const data = window.getCurrentBoard().data;
            const sourceRow = data.find(r => r.id === window.draggedFromRowId);
            const sourceIdx = sourceRow.cards.findIndex(c => c.id === window.draggedCardObj.id);
            sourceRow.cards.splice(sourceIdx, 1);
            const targetRow = data.find(r => r.id === targetRowId);
            targetRow.cards.push(window.draggedCardObj);
            window.draggedCardObj = null;
            renderAll();
            window.triggerSave();
        };

        // --- Render functions ---
        function renderBoardList() {
            const listActive = document.getElementById('board-list-active');
            const listCompleted = document.getElementById('board-list-completed');
            listActive.innerHTML = ''; listCompleted.innerHTML = '';

            window.workspaces.forEach(w => {
                if(!w.status) w.status = 'active'; 
                const isActive = w.id === window.currentWorkspaceId;
                const iconColor = isActive ? 'text-gray-700' : 'text-gray-400 group-hover:text-gray-500';
                const textStyle = isActive ? 'text-gray-800 font-bold' : 'text-gray-500';
                const bgStyle = isActive ? 'bg-gray-200' : 'hover:bg-black/5';
                const iconName = w.status === 'completed' ? 'book' : 'book-open';

                const boardHtml = `
                    <div onclick="window.switchBoard('${w.id}')"
                         draggable="true" 
                         ondragstart="window.handleBoardDragStart(event, '${w.id}')"
                         ondragover="window.handleBoardDragOver(event)"
                         ondrop="window.handleBoardDrop(event, '${w.id}', '${w.status}')"
                         class="group flex items-center justify-between p-2 rounded cursor-pointer transition-colors ${bgStyle} mb-0.5"
                         data-id="${w.id}">
                        <div class="flex items-center gap-2 overflow-hidden flex-1 pointer-events-none">
                            <i data-lucide="${iconName}" class="w-3.5 h-3.5 ${iconColor} shrink-0 transition-colors"></i>
                            <span class="truncate text-xs ${textStyle}">${escapeHtml(w.title) || '제목 없음'}</span>
                        </div>
                        <button onclick="window.deleteBoard('${w.id}', event)" class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 transition-opacity shrink-0 ml-1 cursor-pointer" title="보드 삭제">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                if (w.status === 'completed') listCompleted.insertAdjacentHTML('beforeend', boardHtml);
                else listActive.insertAdjacentHTML('beforeend', boardHtml);
            });
        }

        function renderBoard() {
            const board = window.getCurrentBoard();
            if (!board) return; 

            const currentWidth = board.cardWidth || 400;
            document.getElementById('doc-title').value = board.title || '';

            // 폰트 사이즈 드롭다운 동기화
            const fsSel = document.getElementById('font-size-select');
            if (fsSel && board.globalFontSize) {
                fsSel.value = board.globalFontSize;
            }
            // 폰트 글자체 드롭다운 동기화
            const ffSel = document.getElementById('font-select');
            if (ffSel && board.globalFontFamily) {
                ffSel.value = board.globalFontFamily;
            }
            
            const container = document.getElementById('board-container');
            container.innerHTML = '';

            let allRowsHtml = '';

            (board.data || []).forEach((row, index) => {
                let cardsHtml = (row.cards || []).map(card => {
                    const isActive = window.activeCardId === card.id;
                    const epColor = episodeColor(card.episode);
                    const epStyle = epColor ? `border-top:3px solid ${epColor};` : '';
                    return `
                        <div class="card-wrapper part-box relative flex flex-col shrink-0 border border-gray-200 rounded-lg bg-gray-50 ${isActive ? 'active-card' : ''} transition-all duration-200"
                             style="width: ${currentWidth}px;${epStyle}"
                             data-card-id="${card.id}" data-row-id="${row.id}"
                             onclick="window.selectCard('${card.id}')"
                             ondragover="window.handleCardDragOver(event)"
                             ondragenter="window.handleCardDragEnter(event)"
                             ondragleave="window.handleCardDragLeave(event)"
                             ondrop="window.handleCardDrop(event, '${card.id}', '${row.id}')">

                            <div class="card-tools absolute -top-3 -right-3 flex gap-1 z-20">
                                <button class="w-6 h-6 bg-white border border-gray-200 text-gray-400 rounded-full flex items-center justify-center shadow hover:text-blue-500 cursor-grab active:cursor-grabbing"
                                        draggable="true"
                                        ondragstart="window.handleCardDragStart(event, '${card.id}', '${row.id}')" title="드래그하여 이동">
                                    <i data-lucide="grip-horizontal" class="w-3 h-3"></i>
                                </button>
                                <button onclick="window.duplicateCard('${card.id}'); event.stopPropagation();" class="w-6 h-6 bg-white border border-gray-200 text-gray-400 rounded-full flex items-center justify-center shadow hover:text-blue-500 transition-colors" title="카드 복사">
                                    <i data-lucide="copy" class="w-3 h-3"></i>
                                </button>
                                <button onclick="window.deleteCard('${card.id}'); event.stopPropagation();" class="w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow hover:bg-red-600 transition-colors" title="삭제">
                                    <i data-lucide="x" class="w-3 h-3"></i>
                                </button>
                            </div>

                            <div class="px-3 pt-3 pb-2">
                                <div class="flex items-center gap-1.5">
                                    <input type="text" value="${escapeHtml(card.title)}" oninput="window.updateCardTitle('${card.id}', this.value)" spellcheck="false" class="flex-1 min-w-0 text-[15px] text-gray-800 bg-transparent border-none outline-none font-bold px-1 py-0.5 placeholder-gray-400 hover:bg-black/5 focus:bg-white focus:ring-1 focus:ring-gray-200 rounded transition-all" placeholder="챕터">
                                    <span class="text-[11px] text-gray-500 font-bold bg-gray-200/70 rounded-full w-5 h-5 flex items-center justify-center shrink-0" title="블록 수">${(card.blocks || []).length}</span>
                                    <button onclick="window.addBlock('${card.id}'); event.stopPropagation();" class="text-gray-400 hover:text-blue-500 shrink-0" title="블록 추가">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                                    <div class="flex gap-1 items-center shrink-0" id="markers-${card.id}"></div>
                                    <input type="text" value="${escapeHtml(card.location)}" oninput="window.updateCardLocation('${card.id}', this.value)" spellcheck="false" class="min-w-0 flex-1 text-[12px] text-gray-400 bg-transparent border-none outline-none px-1 py-0.5 placeholder-gray-300 hover:bg-black/5 focus:bg-white focus:ring-1 focus:ring-gray-200 rounded transition-all" placeholder="메모">
                                </div>
                                <div class="border-t border-gray-200 mt-2"></div>
                            </div>

                            <div class="px-3 pb-3">
                                <div class="block-list flex flex-col gap-1 min-h-[26px]" data-card-id="${card.id}"
                                     ondragover="window.handleBlockListDragOver(event)"
                                     ondrop="window.handleBlockListDrop(event, '${card.id}')">
                                    ${(card.blocks || []).map(block => {
                                        const isActiveBlock = window.activeBlockId === block.id;
                                        const blockBg = BLOCK_COLOR_HEX[block.color] ? `background-color:${BLOCK_COLOR_HEX[block.color]};` : '';
                                        const blockMarkersHtml = (block.markers || []).map(m => {
                                            const cc = markerColors[m] || 'text-gray-500';
                                            return `<i data-lucide="${m}" class="w-3 h-3 ${cc}"></i>`;
                                        }).join('');
                                        return `
                                    <div class="block-item group/block relative flex items-start gap-1 rounded ${isActiveBlock ? 'active-block' : ''}"
                                         style="${blockBg}"
                                         data-card-id="${card.id}" data-block-id="${block.id}"
                                         ondragover="window.handleBlockDragOver(event)"
                                         ondragleave="window.handleBlockDragLeave(event)"
                                         ondrop="window.handleBlockDrop(event, '${card.id}', '${block.id}')">
                                        <span class="block-handle shrink-0 mt-1 text-gray-400 cursor-grab active:cursor-grabbing"
                                              draggable="true"
                                              ondragstart="window.handleBlockDragStart(event, '${card.id}', '${block.id}')"
                                              ondragend="window.handleBlockDragEnd(event)"
                                              title="드래그하여 순서 변경 / 다른 카드로 이동">
                                            <i data-lucide="grip-vertical" class="w-3 h-3"></i>
                                        </span>
                                        ${blockMarkersHtml ? `<div class="flex items-center gap-0.5 shrink-0 mt-1" id="markers-block-${block.id}">${blockMarkersHtml}</div>` : ''}
                                        <div id="editor-${card.id}-${block.id}" contenteditable="true" spellcheck="false"
                                             oninput="window.updateBlockContent('${card.id}', '${block.id}', this.innerHTML)"
                                             onfocus="window.selectCard('${card.id}'); window.activeBlockEditorId = 'editor-${card.id}-${block.id}'; window.activeBlockId = '${block.id}'; window.highlightActiveBlock();"
                                             class="rich-editor flex-1 min-w-0 outline-none leading-relaxed text-gray-800"
                                             style="font-size:${board.globalFontSize || card.cardFontSize || '10.5pt'};${board.globalFontFamily ? 'font-family:' + board.globalFontFamily + ';' : ''}"
                                             data-placeholder="">${block.html || ''}</div>
                                        <button onclick="window.deleteBlock('${card.id}', '${block.id}'); event.stopPropagation();"
                                                class="block-del shrink-0 mt-1 text-gray-300 opacity-0 group-hover/block:opacity-100 hover:text-red-500" title="블록 삭제">
                                            <i data-lucide="x" class="w-3 h-3"></i>
                                        </button>
                                    </div>`;
                                    }).join('')}
                                </div>
                                <button onclick="window.addBlock('${card.id}'); event.stopPropagation();"
                                        class="add-block-btn mt-1 text-[11px] text-gray-300 hover:text-blue-500 flex items-center gap-1">
                                    <i data-lucide="plus" class="w-3 h-3"></i> 새 블록
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                cardsHtml += `
                    <button class="add-card-btn shrink-0 self-start flex items-center gap-1.5 px-3 py-2 text-sm text-gray-400 hover:text-blue-500 transition-colors whitespace-nowrap"
                            onclick="window.addCardToRow('${row.id}')"
                            ondragover="window.handleCardDragOver(event)"
                            ondrop="window.handleCardDropToEmptyRow(event, '${row.id}')">
                        <i data-lucide="plus" class="w-4 h-4"></i> 새 파트
                    </button>
                `;

                allRowsHtml += `<div class="flex flex-row flex-wrap items-start gap-4" data-row-id="${row.id}">${cardsHtml}</div>`;
            });

            container.innerHTML = allRowsHtml;

            if(document.getElementById('track-count')) {
                document.getElementById('track-count').textContent = board.data.length;
            }
            updateBoardTotalDOM();
            applyFilterDOM(); 
            
            document.querySelectorAll('[contenteditable]').forEach(el => {
                if(el.innerHTML.trim() === '' || el.innerHTML === '<br>') el.classList.add('empty-editor');
                el.addEventListener('input', function() {
                    if(this.innerHTML.trim() === '' || this.innerHTML === '<br>') this.classList.add('empty-editor');
                    else this.classList.remove('empty-editor');
                });
            });
        }

        function updateBoardTotalDOM() {
            const board = window.getCurrentBoard();
            if (!board) return;
            let total = 0;
            (board.data || []).forEach(row => {
                (row.cards || []).forEach(card => {
                    const val = card.estWords ? String(card.estWords).replace(/[^0-9]/g, '') : '0';
                    total += (parseInt(val) || 0);
                });
            });
            const topTotalSpan = document.getElementById('board-total-words');
            if (topTotalSpan) topTotalSpan.textContent = total.toLocaleString();
        }

        function updateRowTotalDOM(rowId) {
            const row = window.getCurrentBoard().data.find(r => r.id === rowId);
            if (row) {
                const total = (row.cards || []).reduce((sum, card) => {
                    const val = card.estWords ? String(card.estWords).replace(/[^0-9]/g, '') : '0';
                    return sum + (parseInt(val) || 0);
                }, 0);
                const totalSpan = document.getElementById(`row-total-${rowId}`);
                if (totalSpan) totalSpan.textContent = total.toLocaleString() + '자';
            }
        }

        function applyFilterDOM() {
            document.querySelectorAll('.card-wrapper').forEach(el => {
                if (!window.activeFilter) {
                    el.classList.remove('opacity-20', 'grayscale');
                } else {
                    const cardId = el.dataset.cardId;
                    const result = findCardAndRow(cardId);
                    const hasMatch = result && (result.card.blocks || []).some(b => (b.markers || []).includes(window.activeFilter));
                    if (hasMatch) {
                        el.classList.remove('opacity-20', 'grayscale');
                    } else {
                        el.classList.add('opacity-20', 'grayscale');
                    }
                }
            });
        }

        function renderPalette() {
            const palette = document.getElementById('palette-grid');
            palette.innerHTML = '';
            colors.forEach(color => {
                palette.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center justify-center">
                        <button onclick="window.changeCardColor('${color.class}')" class="w-6 h-6 rounded border border-gray-200 shadow-sm hover:scale-110 transition-transform ${color.viewClass}"></button>
                    </div>
                `);
            });
            palette.insertAdjacentHTML('beforeend', `
                <div class="flex items-center justify-center">
                    <button onclick="window.changeCardColor('')" class="w-6 h-6 rounded border border-gray-200 shadow-sm hover:scale-110 transition-transform bg-white flex items-center justify-center text-gray-300" title="색상 빼기">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `);
            if (window.lucide) window.lucide.createIcons({ el: palette });
        }

        function renderAll() {
            renderBoardList();
            renderBoard();
            const board = window.getCurrentBoard();
            const currentWidth = board ? (board.cardWidth || 400) : 400;
            const slider = document.getElementById('card-size-slider');
            const text = document.getElementById('card-size-text');
            if (slider && text) {
                slider.value = currentWidth;
                text.textContent = currentWidth + 'px';
            }
            // 회차 목표 글자수 입력 동기화
            const epTargetInput = document.getElementById('episode-target-input');
            if (epTargetInput && board) epTargetInput.value = board.episodeTarget || 5500;
            // 회차/복선 패널 갱신
            renderEpisodeSummary();
            renderForeshadowSummary();
            // 보드 전환 시 선택 카드가 없으면 복선 에디터 초기화
            if (window.activeCardId) {
                const r = findCardAndRow(window.activeCardId);
                renderForeshadowEditor(r ? r.card : null);
            } else {
                renderForeshadowEditor(null);
            }
            window.toggleFilter(window.activeFilter);
            updateUndoRedoUI();
            renderSidebarRefSelector();
            renderSidebarRefContent();
            if(window.lucide) window.lucide.createIcons();
        }

        function initCanvasPanning() {
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.addEventListener('contextmenu', e => {
                if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.hasAttribute('contenteditable')) {
                    e.preventDefault();
                }
            });
            wrapper.addEventListener('mousedown', e => {
                if (e.button === 2) { 
                    window.isPanning = true; wrapper.style.cursor = 'grabbing';
                    window.startX = e.pageX - wrapper.offsetLeft; window.startY = e.pageY - wrapper.offsetTop;
                    window.scrollLeft = wrapper.scrollLeft; window.scrollTop = wrapper.scrollTop;
                }
            });
            wrapper.addEventListener('mouseleave', () => { window.isPanning = false; wrapper.style.cursor = 'default'; });
            wrapper.addEventListener('mouseup', e => {
                if (e.button === 2) { window.isPanning = false; wrapper.style.cursor = 'default'; }
            });
            wrapper.addEventListener('mousemove', e => {
                if (!window.isPanning) return;
                e.preventDefault();
                const x = e.pageX - wrapper.offsetLeft; const y = e.pageY - wrapper.offsetTop;
                wrapper.scrollLeft = window.scrollLeft - (x - window.startX) * 1.5;
                wrapper.scrollTop = window.scrollTop - (y - window.startY) * 1.5;
            });
            
            // 팔레트 밖 클릭 시 닫기
            document.addEventListener('click', (e) => {
                const palette = document.getElementById('text-color-palette');
                const btn = document.getElementById('color-picker-btn');
                if (palette && !palette.classList.contains('hidden') && !palette.contains(e.target) && !btn.contains(e.target)) {
                    palette.classList.add('hidden');
                }
                const bgPalette = document.getElementById('bg-color-palette');
                const bgBtn = document.getElementById('bg-color-picker-btn');
                if (bgPalette && !bgPalette.classList.contains('hidden') && !bgPalette.contains(e.target) && !bgBtn.contains(e.target)) {
                    bgPalette.classList.add('hidden');
                }
                // 검색 패널 외부 클릭 시 닫기
                const searchPanel = document.getElementById('search-panel');
                const searchInput = document.getElementById('search-input');
                if (searchPanel && !searchPanel.classList.contains('hidden') &&
                    !searchPanel.contains(e.target) && !e.target.closest('[onclick*="openSearch"]')) {
                    window.closeSearch();
                }
            });
            
            document.addEventListener('dragleave', (e) => {
                if(e.target.closest('.group')) e.target.closest('.group').classList.remove('board-drag-over');
            });

            // ========== 붙여넣기: 서식/배경 없이 텍스트만 ==========
            document.addEventListener('paste', (e) => {
                const editor = e.target.closest && e.target.closest('[contenteditable]');
                if (!editor) return;
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text/plain');
                const html = text.split('\n').map(line => escapeHtml(line)).join('<br>');
                document.execCommand('insertHTML', false, html);
                editor.dispatchEvent(new Event('input', { bubbles: true }));
            });

            // ========== 단축키 ==========
            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement.tagName;
                const isEditing = ['INPUT', 'TEXTAREA'].includes(tag) || document.activeElement.hasAttribute('contenteditable');

                // Ctrl+Z: Undo
                if (e.ctrlKey && e.key === 'z' && !e.shiftKey && !isEditing) {
                    e.preventDefault();
                    window.undoAction();
                }
                // Ctrl+Y / Ctrl+Shift+Z: Redo
                if ((e.ctrlKey && e.key === 'y') || (e.ctrlKey && e.shiftKey && e.key === 'z')) {
                    if (!isEditing) { e.preventDefault(); window.redoAction(); }
                }
                // Ctrl+F: 검색
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    window.openSearch();
                }
                // Escape: 검색 닫기
                if (e.key === 'Escape') {
                    window.closeSearch();
                }
            });
        }

        // 우측 사이드바 각 섹션을 헤더 클릭으로 접었다 펼 수 있게 변환 (메모 섹션 제외)
        function initCollapsibleSections() {
            const sb = document.getElementById('right-sidebar');
            if (!sb) return;
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem('rs_collapsed') || '{}'); } catch(e) {}

            Array.from(sb.children).forEach(sec => {
                if (sec.nodeType !== 1 || sec.dataset.rsInit) return;
                // 메모(설정·기획) 섹션은 항상 펼쳐둠 (글쓰기 영역)
                if (sec.querySelector('#board-memo')) return;
                const origHeader = sec.firstElementChild;
                if (!origHeader) return;
                const titleEl = origHeader.querySelector('h3, span');
                const key = titleEl ? titleEl.textContent.trim() : ('sec' + Array.from(sb.children).indexOf(sec));

                sec.dataset.rsInit = '1';

                // 본문 = 헤더 이후 모든 형제 → rs-body로 이동
                const body = document.createElement('div');
                body.className = 'rs-body';
                while (origHeader.nextSibling) body.appendChild(origHeader.nextSibling);

                // 헤더 바 구성: [원래 헤더(flex-1)] [chevron]
                const head = document.createElement('div');
                head.className = 'rs-head flex items-center justify-between gap-2 cursor-pointer select-none';
                sec.insertBefore(head, origHeader);
                head.appendChild(origHeader);
                origHeader.style.flex = '1 1 auto';
                origHeader.style.marginBottom = '0';
                const chev = document.createElement('i');
                chev.setAttribute('data-lucide', 'chevron-down');
                chev.className = 'rs-chevron w-4 h-4 text-gray-400 shrink-0';
                head.appendChild(chev);
                sec.appendChild(body);

                const setState = (collapsed) => {
                    body.classList.toggle('collapsed', collapsed);
                    chev.classList.toggle('collapsed', collapsed);
                };
                head.addEventListener('click', (e) => {
                    if (e.target.closest('button, input, select, textarea, a')) return;
                    const collapsed = !body.classList.contains('collapsed');
                    setState(collapsed);
                    try {
                        const st = JSON.parse(localStorage.getItem('rs_collapsed') || '{}');
                        st[key] = collapsed;
                        localStorage.setItem('rs_collapsed', JSON.stringify(st));
                    } catch(e) {}
                });
                setState(!!saved[key]);
            });
            if (window.lucide) window.lucide.createIcons({ el: sb });
        }

        async function loadInitialData() {
            firebaseConfig = loadFirebaseConfig();
            if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId) {
                try {
                    const result = await firestorePull(firebaseConfig);
                    if (!result.notFound && result.data && result.data.length > 0) {
                        console.log("Firebase에서 데이터를 성공적으로 불러왔습니다.");
                        return result.data;
                    }
                } catch (e) {
                    console.warn("Firebase 불러오기 실패 → 다른 저장소로 대체합니다:", e);
                }
            }
            githubConfig = loadGithubConfig();
            if (githubConfig && githubConfig.token && githubConfig.owner && githubConfig.repo) {
                try {
                    const result = await githubPull(githubConfig);
                    if (!result.notFound && result.data && result.data.length > 0) {
                        console.log("GitHub에서 데이터를 성공적으로 불러왔습니다.");
                        return result.data;
                    }
                } catch (e) {
                    console.warn("GitHub 불러오기 실패 → 로컬/G드라이브 데이터로 대체합니다:", e);
                }
            }
            if (isNodeEnvironment && await fileExistsAsync(targetFilePath)) {
                try {
                    const fileData = await fs.promises.readFile(targetFilePath, 'utf8');
                    const parsedData = JSON.parse(fileData);
                    if (parsedData && parsedData.length > 0) {
                        console.log("G드라이브에서 데이터를 성공적으로 불러왔습니다.");
                        return parsedData;
                    }
                } catch(e) {
                    console.error("G드라이브 파일 읽기 실패 → 백업 시도:", e);
                    // 본파일이 깨졌으면 최신 백업(.bak1 → .bakN) 순서로 복구 시도
                    for (let i = 1; i <= MAX_BACKUPS; i++) {
                        const bak = `${targetFilePath}.bak${i}`;
                        if (!fs.existsSync(bak)) continue;
                        try {
                            const d = JSON.parse(await fs.promises.readFile(bak, 'utf8'));
                            if (d && d.length > 0) {
                                console.warn(`백업본(${bak})에서 복구했습니다.`);
                                setTimeout(() => alert(`자동저장 파일이 손상되어 백업본(.bak${i})에서 복구했습니다.\n작업 내용을 확인 후 저장하세요.`), 500);
                                return d;
                            }
                        } catch(e2) {}
                    }
                }
            }
            console.log("로컬 DB에서 데이터를 불러옵니다.");
            return await loadFromLocalDB();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            renderPalette();
            initCanvasPanning();
            initWritingModeWidget();

            // 집필 모드에서 폰트 변경 시 본 보드에도 동기화
            try {
                const { ipcRenderer } = require('electron');
                ipcRenderer.on('font-changed-from-writing', (e, { fontSize, fontFamily }) => {
                    const board = window.getCurrentBoard();
                    if (!board) return;
                    // 주의: 여기서 window.formatText()를 호출하면 그 안에서 다시
                    // ipcRenderer.send('writing-font-changed')가 실행되어 main.js가
                    // 또 이 이벤트를 돌려보내는 무한 루프가 발생한다(브라우저에선 require가
                    // 없어 send가 실패하므로 루프가 안 생기지만 Electron exe에선 멈춤).
                    // 따라서 IPC를 재전송하지 않는 _applyFontNoIpc로 직접 적용한다.
                    if (fontSize)   { board.globalFontSize   = fontSize;   window._applyFontNoIpc('fontSize', fontSize); }
                    if (fontFamily) { board.globalFontFamily = fontFamily; window._applyFontNoIpc('fontFamily', fontFamily); }
                    // 드롭다운 동기화
                    const fsSel = document.getElementById('font-size-select');
                    const ffSel = document.getElementById('font-select');
                    if (fsSel && fontSize)   fsSel.value = fontSize;
                    if (ffSel && fontFamily) ffSel.value = fontFamily;
                });
            } catch(e) {}
            
            try {
                await initLocalDB();
                const savedData = await loadInitialData();
                const lastId = await loadLastWorkspaceId();
                if (savedData && savedData.length > 0) {
                    _skipHistory = true;
                    window.workspaces = normalizeData(savedData);
                    // 마지막으로 열었던 보드가 있으면 복원, 없으면 첫 번째
                    const restored = lastId && window.workspaces.find(w => w.id === lastId);
                    window.currentWorkspaceId = restored ? lastId : window.workspaces[0].id;
                    const board = window.getCurrentBoard();
                    if (board && board.memoTabs) window.activeMemoTab = board.memoTabs[0].id;
                    _skipHistory = false;
                }
            } catch (err) {
                console.error("Data Load Error:", err);
            }

            // Firebase 실시간 동기화가 켜져 있으면 리스너 시작
            try {
                if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.autoSync) {
                    fbStartRealtimeSync(firebaseConfig);
                }
            } catch (e) { console.warn('Firebase 실시간 동기화 시작 실패:', e); }
            
            renderAll();
            initCollapsibleSections();
        });

    </script>
</body>
