// ═══════════ DEADLINES ═══════════
function renderDeadlines(){
  // 날짜가 비었거나 형식이 깨진 항목은 분리 (정렬/계산 중 에러로 전체 목록이 사라지는 것을 방지)
  const validDateRe=/^\d{4}-\d{2}-\d{2}$/;
  const broken=S.deadlines.filter(d=>!d.date||!validDateRe.test(d.date));
  const valid=S.deadlines.filter(d=>d.date&&validDateRe.test(d.date));
  const sorted=[...valid].sort((a,b)=>a.date.localeCompare(b.date));
  // 지난 마감은 최근 7일 이내 + 미완료만 표시
  const over=sorted.filter(d=>{const dd=dLeft(d.date);return dd<0&&dd>=-7&&!d.done;}),up=sorted.filter(d=>dLeft(d.date)>=0&&!d.done);
  // 7일 넘게 지났는데 아직도 미완료인 마감 (방치된 항목 — 완료/삭제하기 전까진 여기서 계속 보임)
  const stale=sorted.filter(d=>{const dd=dLeft(d.date);return dd<-7&&!d.done;});
  const doneList=sorted.filter(d=>d.done&&dLeft(d.date)>=-30);
  let html='<div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn bp" onclick="openDlModal()">+ 마감 추가</button></div>';
  if(broken.length>0){
    html+='<div class="card" style="margin-bottom:16px;padding:14px 18px;border-color:var(--red)">'+
      '<div class="ct" style="margin-bottom:8px;color:var(--red)">⚠️ 날짜 확인이 필요한 마감 <span style="font-size:0.8em;font-weight:400;color:var(--t3)">('+broken.length+'개 · 날짜가 비어있거나 잘못 저장됐어요)</span></div>'+
      broken.map(function(d){var pr=S.projects.find(p=>p.id===d.projectId);return '<div class="dl row-hov"><div style="width:18px;height:18px;flex-shrink:0"></div><div class="db"><div class="dm">??</div><div class="dd">??</div></div><div style="flex:1;min-width:0"><div style="font-size:0.9643em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(d.title||'(제목 없음)')+'</div><div style="font-size:0.8571em;color:var(--t3)">'+(pr?'🗂️ '+pr.name+' · ':'')+'저장된 날짜: '+(d.date||'없음')+'</div></div><button class="bi hov-btns" onclick="delDl(\''+d.id+'\')" style="font-size:0.8571em;color:var(--t3);flex-shrink:0">✕</button></div>';}).join('')+
    '</div>';
  }
  if(over.length>0){
    html+='<div style="margin-bottom:20px">'+
      '<div class="ct" style="color:var(--red);margin-bottom:10px">⚠️ 놓친 마감 <span style="font-size:0.8em;color:var(--t3);font-weight:400">(최근 7일)</span></div>'+
      '<div class="dl-grid">'+over.map(dlRow).join('')+'</div>'+
    '</div>';
  }
  html+='<div><div class="ct" style="margin-bottom:10px">📋 예정 마감</div>'+(up.length===0?'<div class="empty"><div class="ei">🎉</div>예정된 마감이 없어요</div>':'<div class="dl-grid">'+up.map(dlRow).join('')+'</div>')+'</div>';
  if(stale.length>0){
    var dlStaleOpen=!!window._dlStaleOpen;
    html+='<div class="card" style="margin-top:20px;padding:14px 18px;border-color:var(--red)">'+
      '<div onclick="window._dlStaleOpen=!window._dlStaleOpen;render()" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">'+
        '<div class="ct" style="margin-bottom:0;color:var(--red)">🚨 7일 넘게 방치된 마감 <span style="font-size:0.8em;font-weight:400;color:var(--t3)">('+stale.length+'개 · 완료 처리하거나 ✕로 정리해주세요)</span></div>'+
        '<span style="color:var(--t3);font-size:0.85em;transition:transform .2s;transform:rotate('+(dlStaleOpen?'180':'0')+'deg)">▾</span>'+
      '</div>'+
      (dlStaleOpen?'<div class="dl-grid" style="margin-top:12px">'+stale.map(dlRow).join('')+'</div>':'')+
    '</div>';
  }
  if(doneList.length>0){
    var dlDoneOpen=!!window._dlDoneOpen;
    html+='<div class="card" style="margin-top:'+(stale.length>0?'16':'60')+'px;padding:14px 18px">'+
      '<div onclick="window._dlDoneOpen=!window._dlDoneOpen;render()" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">'+
        '<div class="ct" style="margin-bottom:0;color:var(--t3)">✓ 완료한 마감 <span style="font-size:0.8em;font-weight:400">(최근 한 달 · '+doneList.length+'개)</span></div>'+
        '<span style="color:var(--t3);font-size:0.85em;transition:transform .2s;transform:rotate('+(dlDoneOpen?'180':'0')+'deg)">▾</span>'+
      '</div>'+
      (dlDoneOpen?'<div class="dl-done-scroll" style="max-height:200px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;margin-top:12px"><div class="dl-grid" style="opacity:0.6">'+doneList.map(dlRow).join('')+'</div></div>':'')+
    '</div>';
  }
  return html;
}

function renderSavings(){
  const s=S.savings,pct=s.goal?Math.min(100,Math.round(s.current/s.goal*100)):0,rem=Math.max(0,s.goal-s.current);
  const entries=(s.entries||[]).slice().reverse();

  // 프로젝트별 합산
  const byProject={};
  const noProject={amount:0,count:0};
  (s.entries||[]).forEach(function(e){
    if(e.projectId&&e.projectName){
      if(!byProject[e.projectId])byProject[e.projectId]={name:e.projectName,amount:0,count:0,color:''};
      byProject[e.projectId].amount+=e.amount;
      byProject[e.projectId].count++;
    } else {
      noProject.amount+=e.amount;
      noProject.count++;
    }
  });
  // 프로젝트 색상 매칭
  Object.keys(byProject).forEach(function(pid){
    const proj=(S.projects||[]).find(p=>p.id===pid);
    byProject[pid].color=proj?proj.color:'var(--accent)';
  });

  // 저축 금액이 등록된 루틴이 있는 프로젝트는 적립 0이어도 카드 표시
  (S.routines||[]).forEach(function(r){
    if(r.saveAmount>0&&r.rzProjectId){
      const proj=(S.projects||[]).find(p=>p.id===r.rzProjectId);
      if(proj&&!byProject[proj.id]){
        byProject[proj.id]={name:proj.name,amount:0,count:0,color:proj.color||'var(--accent)'};
      }
    }
  });

  // 프로젝트별 목표 횟수 및 목표 금액 계산 (저축 루틴이 시작~마감일까지 등록한 캘린더 이벤트 총 수 × 회당 금액)
  Object.keys(byProject).forEach(function(pid){
    const proj=(S.projects||[]).find(p=>p.id===pid);
    var total=0, targetAmt=0;
    if(proj&&proj.routinized){
      proj.routinized.forEach(function(rz){
        if(rz.saveAmount>0){
          var cnt=(S.calEvents||[]).filter(function(e){return e.rzId===rz.id;}).length;
          total+=cnt;
          targetAmt+=cnt*rz.saveAmount;
        }
      });
    }
    byProject[pid].totalCount=total;
    byProject[pid].targetAmount=targetAmt;
  });

  var projectCards='';
  const pids=Object.keys(byProject);
  if(pids.length>0||noProject.count>0){
    // 가장 큰 금액 기준으로 막대 비율 계산
    var allAmts=pids.map(function(pid){return byProject[pid].amount;});
    if(noProject.count>0)allAmts.push(noProject.amount);
    var maxAmt=Math.max(1,...allAmts);

    projectCards='<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:0.9286em;font-weight:500;color:var(--text)"><svg width="17" height="17" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0"><path d="M2 6a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>항목별 저축 현황</div>';
    projectCards+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px">';

    function svCard(name,amount,count,color,totalCount,targetAmount){
      var hasTarget=totalCount&&totalCount>0;
      var barPct=hasTarget?Math.min(100,Math.round(count/totalCount*100)):0;
      var countLabel=hasTarget?(count+' / '+totalCount+'회 적립 ('+barPct+'%)'):(count+'회 적립');
      var targetLabel=(hasTarget&&targetAmount>0)?('목표 '+money(targetAmount)):'';
      return '<div class="card" style="margin-bottom:0;padding:16px 18px">'+
        '<div style="display:flex;align-items:center;gap:7px;margin-bottom:10px">'+
          '<div style="width:9px;height:9px;border-radius:3px;background:'+color+';flex-shrink:0"></div>'+
          '<div style="font-size:0.88em;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name+'</div>'+
        '</div>'+
        '<div style="font-family:var(--serif);font-size:1.7em;letter-spacing:-0.5px;color:var(--text);line-height:1.1;margin-bottom:8px">'+money(amount)+'</div>'+
        '<div class="pw" style="height:8px;margin-bottom:6px"><div class="pb" style="width:'+barPct+'%;background:'+color+'"></div></div>'+
        '<div style="font-size:0.75em;color:var(--t3)">'+countLabel+'</div>'+
        (targetLabel?'<div style="font-size:0.75em;color:var(--t3);margin-top:2px">'+targetLabel+'</div>':'')+
      '</div>';
    }

    pids.forEach(function(pid){
      const g=byProject[pid];
      projectCards+=svCard(g.name,g.amount,g.count,g.color,g.totalCount,g.targetAmount);
    });
    if(noProject.count>0){
      projectCards+=svCard('기타 (직접 입력)',noProject.amount,noProject.count,'var(--t3)',0,0);
    }
    projectCards+='</div>';
  }

  // 저축 내역을 루틴(note+projectName)별로 그룹화
  var histGroups={};
  (s.entries||[]).forEach(function(e){
    var key=(e.projectName||'')+'|'+(e.note||'저축');
    if(!histGroups[key]){
      var proj=e.projectId?(S.projects||[]).find(p=>p.id===e.projectId):null;
      histGroups[key]={note:(e.note||'저축').replace(/ \(루틴 달성\)$/,''),projectName:e.projectName||'',color:proj?proj.color:'var(--t3)',total:0,items:[]};
    }
    histGroups[key].total+=e.amount;
    histGroups[key].items.push(e);
  });
  var histKeys=Object.keys(histGroups);
  var histHtml='';
  if(histKeys.length===0){
    histHtml='<div class="empty">내역이 없어요</div>';
  } else {
    histHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px">';
    histKeys.forEach(function(k){
      var g=histGroups[k];
      // 최신 날짜순 정렬
      g.items.sort(function(a,b){return b.date.localeCompare(a.date);});
      var itemsHtml=g.items.map(function(e){
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 0;font-size:0.7em">'+
          '<span style="color:var(--t3);font-family:var(--mono)">'+e.date.slice(5)+'</span>'+
          '<span style="display:flex;align-items:center;gap:3px"><span style="color:var(--green);font-family:var(--mono)">'+money(e.amount)+'</span>'+
          '<button class="bi" onclick="delSv(\''+e.id+'\')" style="font-size:0.85em;color:var(--t3);padding:0 2px">✕</button></span>'+
        '</div>';
      }).join('');
      histHtml+='<div class="card" style="margin-bottom:0;padding:13px 14px">'+
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'+
          '<div style="width:8px;height:8px;border-radius:3px;background:'+g.color+';flex-shrink:0"></div>'+
          '<div style="font-size:0.8em;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+g.note+'</div>'+
        '</div>'+
        (g.projectName?'<div style="font-size:0.68em;color:var(--t3);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+g.projectName+'</div>':'')+
        '<div style="font-family:var(--serif);font-size:1.25em;color:var(--text);margin-bottom:8px;line-height:1.1">'+money(g.total)+'</div>'+
        '<div style="border-top:1px solid var(--border);padding-top:5px">'+itemsHtml+'</div>'+
      '</div>';
    });
    histHtml+='</div>';
  }

  // 목표 D-day 한 줄 표시
  var goalBanner='';
  if(s.goalName||s.goalDate){
    var ddTxt='',dateTxt='';
    if(s.goalDate){
      var gd=new Date(s.goalDate+'T00:00:00');
      var td=new Date();td.setHours(0,0,0,0);
      var diffDays=Math.ceil((gd-td)/(1000*60*60*24));
      var yy=String(gd.getFullYear()).slice(2),mm=gd.getMonth()+1,dd=gd.getDate();
      dateTxt=yy+'년 '+mm+'월 '+dd+'일까지 ';
      ddTxt=diffDays>0?'D-'+diffDays:diffDays===0?'D-DAY':'D+'+Math.abs(diffDays);
    }
    goalBanner='<div style="text-align:center;margin-top:14px;font-size:0.95em;color:var(--accent);font-weight:600">'+
      dateTxt+(s.goalName||'')+(s.goalName?'!':'')+(ddTxt?' <span style="color:var(--t2);font-weight:500">'+ddTxt+'</span>':'')+
    '</div>';
  }

  return ''+
    '<div class="card" style="margin-bottom:16px;position:relative"><div style="position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:1"><button class="btn bp bsm" onclick="openSvAdd()">+ 금액 추가</button><button class="btn bg bsm" onclick="openSvGoal()">목표 수정</button></div><div style="text-align:center;padding:4px 0 16px"><div style="font-family:var(--serif);font-size:2.8571em;letter-spacing:-1px">'+money(s.current)+'</div><div style="font-size:1.1em;color:var(--t2);margin-top:6px">목표: '+money(s.goal)+'</div><div style="margin:20px auto;max-width:400px"><div class="pw" style="height:18px"><div class="pb" style="width:'+pct+'%;background:var(--accent)"></div></div><div class="pl" style="font-size:0.95em;margin-top:6px"><span>'+pct+'% 달성</span><span>'+money(rem)+' 남음</span></div></div>'+goalBanner+'</div></div>'+
    projectCards+
    '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;font-size:0.9286em;font-weight:500;color:var(--text)">💳 저축 내역</div>'+histHtml;
}

        rightCol+='<div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:5px">'+
          '<div style="width:7px;height:7px;border-radius:50%;background:'+p.color+';flex-shrink:0;margin-top:4px"></div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:0.875em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+rz.task+'</div>'+
            '<div style="font-size:0.75em;color:var(--t3)">'+rzLabel(rz)+(rz.until?' ~ '+rz.until.slice(0,7):'')+(rz.saveAmount>0?' · 💰'+rz.saveAmount.toLocaleString()+'만원':'')+'</div>'+
          '</div>'+
        '</div>';
      });
    }
    if(!rightCol) rightCol='<div style="font-size:0.8em;color:var(--t3)">마감·루틴 없음</div>';

    return '<div style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)">'+
      // 헤더
      '<div style="display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border)" onclick="go(\'projects\',\''+p.id+'\')">'+
        '<div style="width:9px;height:9px;border-radius:2px;background:'+p.color+';flex-shrink:0"></div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:0.9286em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.name+'</div>'+
          (totalCnt>0?'<div style="font-size:0.75em;color:var(--t3)">'+doneCnt+'/'+totalCnt+'개 완료 ('+pct+'%)</div>':'')+
        '</div>'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" style="flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</div>'+
      // 2열 본문
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">'+
        '<div style="padding:12px 14px;border-right:1px solid var(--border)">'+leftCol+'</div>'+
        '<div style="padding:12px 14px">'+rightCol+'</div>'+
      '</div>'+
    '</div>';
  }

  if(areas.length===0 && (S.projects||[]).length===0){
    html+='<div class="empty"><div class="ei">🗺️</div>라이프 목표와 프로젝트를 먼저 추가해보세요</div>';
    return html;
  }

  areas.forEach(function(area){
    var pjs=pjByArea[area.id]||[];
    html+=
      '<div style="display:flex;align-items:center;gap:9px;margin:16px 0 10px">'+
        '<div style="width:30px;height:30px;border-radius:8px;background:'+area.color+'20;display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0">'+area.emoji+'</div>'+
        '<div style="font-size:0.95em;font-weight:700;color:var(--text)">'+area.name+'</div>'+
        '<div style="flex:1;height:1.5px;background:linear-gradient(to right,'+area.color+'50,transparent);border-radius:2px"></div>'+
        '<div style="font-size:0.75em;color:var(--t3)">'+pjs.length+'개</div>'+
      '</div>';
    if(pjs.length===0){
      html+='<div style="font-size:0.82em;color:var(--t3);padding:8px 10px;margin-bottom:12px;background:var(--s2);border-radius:8px">연결된 프로젝트 없음</div>';
    } else {
      pjs.forEach(function(p){ html+=renderPjBlock(p); });
    }
  });

  if(pjNoArea.length>0){
    html+=
      '<div style="display:flex;align-items:center;gap:9px;margin:16px 0 10px">'+
        '<div style="width:30px;height:30px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0">📁</div>'+
        '<div style="font-size:0.95em;font-weight:700;color:var(--text)">영역 미지정</div>'+
        '<div style="flex:1;height:1.5px;background:linear-gradient(to right,var(--border),transparent);border-radius:2px"></div>'+
        '<div style="font-size:0.75em;color:var(--t3)">'+pjNoArea.length+'개</div>'+
      '</div>';
    pjNoArea.forEach(function(p){ html+=renderPjBlock(p); });
  }

  return html;
}

function printOverview(){
  const today=todStr();
  const yr=new Date().getFullYear();
  const areas=(S.lifeAreas||[]).filter(a=>a.name);
  const pjByArea={}, pjNoArea=[];
  (S.projects||[]).forEach(function(p){
    if(p.lifeAreaId){ if(!pjByArea[p.lifeAreaId]) pjByArea[p.lifeAreaId]=[]; pjByArea[p.lifeAreaId].push(p); }
    else pjNoArea.push(p);
  });

  function rzLabel(rz){
    if(rz.isMonthly) return '매월 '+(rz.monthDays||[]).map(function(d){return d==='last'?'말':d;}).join('·')+'일';
    if(!rz.days||rz.days.length===0) return '매일';
    return '매주 '+rz.days.map(function(d){return DOW_KO[DOWS.indexOf(d)];}).join('·');
  }

  // 현재 앱에서 사용 중인 폰트 패밀리 가져오기
  const appFont=getComputedStyle(document.documentElement).getPropertyValue('--sans').trim()||"'Pretendard','Apple SD Gothic Neo',sans-serif";
  const appFontSize=S.fontSize||14;
  const appFontWeight=S.fontWeight||'400';

  // 구글 폰트 링크 (앱에서 이미 로드된 것들)
  const existingFontLinks=Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(function(l){return l.href;}).filter(function(h){return h.includes('fonts.googleapis.com');}).map(function(h){return '<link rel="stylesheet" href="'+h+'">';}).join('\n');

  const lifeGoal=S.lifeGoal||{};
  const goalTitle=lifeGoal.text||'';
  const goalSub=lifeGoal.sub||'';
  const goalDday=lifeGoal.dday||'';
  const savingsAmt=(S.savings&&S.savings.goal>0)?money(S.savings.goal):'';

  function buildPjCard(p){
    const dls=(S.deadlines||[]).filter(function(d){return d.projectId===p.id&&d.date&&!d.done&&dLeft(d.date)>=0;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    const rzs=p.routinized||[];
    const tasks=p.tasks||[];

    // 왼쪽: 태스크
    var leftHtml='<div class="col-label">태스크</div>';
    if(tasks.length===0){
      leftHtml+='<div class="col-empty">없음</div>';
    } else {
      tasks.forEach(function(t){
        leftHtml+='<div class="task-row'+(t.done?' task-done':'')+'">'+
          '<span class="task-box">'+(t.done?'✓':'')+'</span>'+
          '<span class="task-text">'+t.text+'</span>'+
          (t.dueDate?'<span class="task-due">'+t.dueDate.slice(5)+'</span>':'')+
        '</div>';
      });
    }

    // 오른쪽: 마감일 + 루틴화
    var rightHtml='';
    if(dls.length>0){
      rightHtml+='<div class="col-label">마감일</div>';
      dls.forEach(function(d){
        var dd=dLeft(d.date);
        var uc=dd<=7?'#c0392b':dd<=30?'#c07a2b':'#555';
        rightHtml+='<div class="dl-row">'+
          '<span class="dl-date">'+d.date.slice(5).replace('-','/')+'</span>'+
          '<span class="dl-title">'+d.title+'</span>'+
          '<span class="dl-dday" style="color:'+uc+'">'+(dd===0?'오늘':'D-'+dd)+'</span>'+
        '</div>';
      });
    }
    if(rzs.length>0){
      rightHtml+='<div class="col-label" style="margin-top:'+(dls.length?'10':'0')+'px">루틴화 일정</div>';
      rzs.forEach(function(rz){
        var label=rzLabel(rz);
        var until=rz.until?rz.until.slice(0,7):'';
        var amtStr=rz.saveAmount>0?(' · '+rz.saveAmount.toLocaleString()+'만원'):'';
        rightHtml+='<div class="rz-row">'+
          '<span class="rz-dot" style="background:'+p.color+'"></span>'+
          '<span class="rz-text">'+rz.task+'<span class="rz-meta">'+label+(until?' ~ '+until:'')+amtStr+'</span></span>'+
        '</div>';
      });
    }
    if(!rightHtml) rightHtml='<div class="col-empty">없음</div>';

    return '<div class="pj-card">'+
      '<div class="pj-header">'+
        '<span class="pj-dot" style="background:'+p.color+'"></span>'+
        '<span class="pj-name">'+p.name+'</span>'+
        (p.dday?'<span class="pj-dday">목표 '+p.dday+'</span>':'')+
      '</div>'+
      '<div class="pj-body">'+
        '<div class="pj-left">'+leftHtml+'</div>'+
        '<div class="pj-right">'+rightHtml+'</div>'+
      '</div>'+
    '</div>';
  }

  var sectionsHtml='';
  areas.forEach(function(area){
    var pjs=pjByArea[area.id]||[];
    sectionsHtml+='<div class="area-section">'+
      '<div class="area-header"><span class="area-emoji">'+area.emoji+'</span><span class="area-name">'+area.name+'</span></div>'+
      (pjs.length===0?'<p class="col-empty">이 영역에 연결된 프로젝트가 없어요</p>':pjs.map(buildPjCard).join(''))+
    '</div>';
  });
  if(pjNoArea.length>0){
    sectionsHtml+='<div class="area-section">'+
      '<div class="area-header"><span class="area-emoji">📁</span><span class="area-name">기타</span></div>'+
      pjNoArea.map(buildPjCard).join('')+
    '</div>';
  }

  const printHtml=`<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>${yr} 목표 계획서</title>
${existingFontLinks}
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:${appFont};color:#1a1a1a;background:#fff;font-size:${Math.max(11,appFontSize-1)}px;font-weight:${appFontWeight};line-height:1.6;}
  .page{max-width:760px;margin:0 auto;padding:44px 40px;}
  /* 헤더 */
  .report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #1a1a1a;padding-bottom:12px;margin-bottom:28px;}
  .report-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;}
  .report-year{font-size:44px;font-weight:700;line-height:1;}
  /* 인생 목표 */
  .life-goal-banner{border:1.5px solid #1a1a1a;border-radius:6px;padding:12px 18px;margin-bottom:24px;display:flex;align-items:center;gap:16px;background:#fafaf8;}
  .life-goal-label{font-size:9.5px;font-weight:600;color:#888;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3px;}
  .life-goal-text{font-size:14px;font-weight:700;}
  .life-goal-amount{font-size:18px;font-weight:700;padding:0 18px;border-left:1px solid #ddd;border-right:1px solid #ddd;}
  /* 영역 */
  .area-section{margin-bottom:24px;}
  .area-header{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #1a1a1a;}
  .area-emoji{font-size:14px;}
  .area-name{font-size:13.5px;font-weight:700;}
  /* 프로젝트 카드 */
  .pj-card{margin-bottom:10px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;break-inside:avoid;}
  .pj-header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f5f5f2;}
  .pj-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;display:inline-block;}
  .pj-name{font-weight:600;font-size:12.5px;flex:1;}
  .pj-dday{font-size:10px;color:#666;}
  /* 2열 본문 */
  .pj-body{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e8e8e8;}
  .pj-left{padding:10px 12px;border-right:1px solid #e8e8e8;}
  .pj-right{padding:10px 12px;}
  .col-label{font-size:9.5px;font-weight:600;color:#888;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
  .col-empty{font-size:10.5px;color:#bbb;}
  /* 태스크 */
  .task-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px;font-size:11.5px;}
  .task-done .task-text{color:#aaa;text-decoration:line-through;}
  .task-box{width:12px;height:12px;border:1.5px solid #ccc;border-radius:2px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:#555;}
  .task-text{flex:1;}
  .task-due{font-size:10px;color:#aaa;flex-shrink:0;}
  /* 마감일 */
  .dl-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11.5px;}
  .dl-date{font-size:10.5px;color:#666;flex-shrink:0;font-weight:600;min-width:36px;}
  .dl-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dl-dday{font-size:10.5px;font-weight:700;flex-shrink:0;}
  /* 루틴 */
  .rz-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;font-size:11.5px;}
  .rz-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;display:inline-block;}
  .rz-text{flex:1;}
  .rz-meta{display:block;font-size:10px;color:#888;}
  /* 푸터 */
  .report-footer{margin-top:36px;padding-top:10px;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:10px;color:#aaa;}
  .sign-line{width:130px;border-bottom:1px solid #999;margin-top:22px;}
  .sign-label{font-size:10px;color:#999;margin-top:4px;}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.page{padding:30px 26px;}}
</style></head><body>
<div class="page">
  <div class="report-header">
    <div><div class="report-title">나의 목표 계획서</div><div style="font-size:10.5px;color:#888;margin-top:3px">작성일 ${today}</div></div>
    <div class="report-year">${yr}</div>
  </div>
  ${goalTitle?`<div class="life-goal-banner">
    <div style="flex:1"><div class="life-goal-label">인생 목표</div><div class="life-goal-text">${goalTitle}</div>${goalSub?`<div style="font-size:10.5px;color:#888;margin-top:2px">${goalSub}</div>`:''}</div>
    ${savingsAmt?`<div class="life-goal-amount">${savingsAmt}</div>`:''}
    ${goalDday?`<div><div class="life-goal-label">목표 기간</div><div style="font-size:11px;color:#555;">${goalDday}까지</div></div>`:''}
  </div>`:''}
  ${sectionsHtml}
  <div class="report-footer">
    <div><div class="sign-line"></div><div class="sign-label">서명</div></div>
    <div style="text-align:right;line-height:2"><div>Lucy's Space</div><div>${today} 기준</div></div>
  </div>
</div>
</body></html>`;

  const w=window.open('','_blank','width=820,height=950');
  w.document.write(printHtml);
  w.document.close();
  w.focus();
  setTimeout(function(){ w.print(); }, 800);
}

  if(!H.inbody) H.inbody=[];
  if(!H.tab) H.tab='summary';
  if(!['summary','inbody','sched','records','supps','memo'].includes(H.tab)) H.tab='summary';
  const tab=H.tab;

  // ── 탭 헤더 ──
  const tabIco={
    summary:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',

    records:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M9 4h6a1 1 0 0 1 1 1v1h1a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h1V5a1 1 0 0 1 1-1z"/><rect x="8.5" y="2.5" width="7" height="3.5" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',
    supps:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M10.5 3.5a4 4 0 0 1 0 5.66L5.16 14.5a4 4 0 1 1-5.66-5.66L4.84 3.5a4 4 0 0 1 5.66 0z" transform="translate(4 2)"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/></svg>',
    memo:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M3.5 20.5l1-4 12-12a1.6 1.6 0 0 1 2.3 0l0.7 0.7a1.6 1.6 0 0 1 0 2.3l-12 12z"/><path d="M14 6l4 4"/></svg>'
  };
  const tabs=[{k:'summary',l:'건강 요약'},{k:'inbody',l:'인바디'},{k:'sched',l:'검진 일정'},{k:'records',l:'검진 기록'},{k:'supps',l:'식품 정리'},{k:'memo',l:'메모'}];
  // 인덱스(폴더 탭) 느낌을 위한 탭별 고유 색상
  const tabColors=[
    {bg:'#F5D976',text:'#7A5E16'},
    {bg:'#A9D9E8',text:'#255A6E'},
    {bg:'#E8A0A0',text:'#7A3535'},
    {bg:'#E8897E',text:'#7A2E22'},
    {bg:'#8FCFA0',text:'#245C3A'},
    {bg:'#C9A06B',text:'#5C3E1A'}
  ];
  let html='<div style="position:relative;display:flex;align-items:flex-end;gap:4px;margin-bottom:18px;padding:0 2px;border-bottom:2px solid var(--border)">';
  tabs.forEach(function(t,ti){
    var on=tab===t.k;
    var pal=tabColors[ti];
    html+='<button onclick="setHealthTab(\''+t.k+'\')" style="'+
      'flex:1;min-width:0;position:relative;box-sizing:border-box;'+
      'padding:'+(on?'10px 8px 12px':'7px 8px 9px')+';'+
      'border:none;border-radius:8px 12px 0 0;cursor:pointer;'+
      'font-family:var(--sans);font-size:0.8em;font-weight:700;'+
      'display:flex;align-items:center;justify-content:center;gap:4px;'+
      'transition:all .2s ease;white-space:nowrap;overflow:hidden;'+
      'margin-bottom:'+(on?'-2px':'0')+';'+
      'z-index:'+(on?'3':'1')+';'+
      (on
        ? 'background:'+pal.bg+';color:'+pal.text+';box-shadow:0 -3px 10px rgba(0,0,0,.1);transform:translateY(-3px);'
        : 'background:'+pal.bg+'4d;color:'+pal.text+'99;transform:translateY(2px);')+
      '">'+tabIco[t.k]+t.l+'</button>';
  });
  html+='</div>';

  // ══ 탭 0: 건강 요약 ══
  if(tab==='summary'){
    // 최신 인바디 수치
    const ibs=(H.inbody||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const latest=ibs[ibs.length-1];
    if(latest){
      html+='<div class="card" style="margin-bottom:14px">'+
        '<div class="ct" style="margin-bottom:10px;gap:5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V12M9 20V8M13 20V4M17 20V10M21 20V14"/></svg>최근 인바디 <span style="font-size:0.75em;color:var(--t3);font-weight:400">'+latest.date+(latest.timing?' · '+latest.timing:'')+'</span></div>'+

        var minV=Math.min.apply(null,vals.map(function(v){return v.val;}));

          var cx=xPos(i), cy=yPos(v.val);

        }).join('');

        // 날짜 라벨 (최대 4개)

        var xLabels='';

function saveSuppEdit(slotKey,id){

function renderSuppCalendar(){
  if(!S.health||!S.health.supplements)return'';
  var suppSlotsDef=[
    {key:'morning_empty'},{key:'morning_meal'},{key:'lunch'},{key:'dinner'},{key:'bedtime'}
  ];
  var allItems=[];
  suppSlotsDef.forEach(function(sl){
    ((S.health.supplements[sl.key])||[]).forEach(function(it){allItems.push(it.id);});
  });
  var total=allItems.length;
  if(!total)return'<div style="font-size:0.85em;color:var(--t3);text-align:center;padding:16px 0;margin-top:16px">영양제를 먼저 추가해주세요</div>';

  var now=new Date();
  var moOffset=window._suppCalMonthOffset||0;
  var baseDate=new Date(now.getFullYear(),now.getMonth()+moOffset,1);
  var yr=baseDate.getFullYear(),mo=baseDate.getMonth();
  var firstDay=new Date(yr,mo,1).getDay();
  var daysInMonth=new Date(yr,mo+1,0).getDate();
  var today=todStr();
  var selDate=window._suppSelectedDate||today;
  var MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var DN=['일','월','화','수','목','금','토'];
  var sc=S.suppChecks||{};

  var slotLabels={morning_empty:'기상 직후',morning_meal:'아침 식사 후',lunch:'점심 식사 후',dinner:'저녁 식사 후',bedtime:'취침 전'};

  var cal='<div style="margin-top:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff">';
  cal+='<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:#fff">'+
    '<button onclick="suppCalNav(-1)" style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:1em;line-height:1">‹</button>'+
    '<div style="font-size:0.9em;font-weight:700;color:var(--text)">'+yr+'년 '+MN[mo]+' 복용 달력</div>'+
    '<button onclick="suppCalNav(1)" style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:1em;line-height:1">›</button>'+
  '</div>';
  // 요일 헤더
  cal+='<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:#fff">';
  DN.forEach(function(d,i){cal+='<div style="padding:8px 0;text-align:center;font-size:0.72em;font-weight:600;color:'+(i===0?'#E06060':i===6?'var(--accent)':'var(--t3)')+'">'+d+'</div>';});
  cal+='</div>';

  // 슬롯별 약 목록 (달력 셀에 직접 표시용)
  var suppSlotsFull=[
    {key:'morning_empty',label:'기상 직후'},{key:'morning_meal',label:'아침 식사 후'},
    {key:'lunch',label:'점심 식사 후'},{key:'dinner',label:'저녁 식사 후'},{key:'bedtime',label:'취침 전'}
  ];
  var allItemsFull=[];
  suppSlotsFull.forEach(function(sl){
    ((S.health.supplements[sl.key])||[]).forEach(function(it){
      allItemsFull.push({slotKey:sl.key,slotLabel:sl.label,it:it});
    });
  });

  // 날짜 그리드 (셀 크게)
  cal+='<div style="display:grid;grid-template-columns:repeat(7,1fr)">';
  for(var e2=0;e2<firstDay;e2++)cal+='<div style="min-height:120px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--cal-cell-bg);opacity:0.5"></div>';

  for(var d=1;d<=daysInMonth;d++){
    var col=(firstDay+d-1)%7;
    var ds=yr+'-'+(mo+1<10?'0':'')+(mo+1)+'-'+(d<10?'0':'')+d;
    var checks=sc[ds]||{};
    var doneCnt=allItemsFull.filter(function(x){return checks[x.it.id];}).length;
    var pct=allItemsFull.length?Math.round(doneCnt/allItemsFull.length*100):0;
    var isToday=ds===today;
    var isFuture=ds>today;
    var isLastCol=col===6;

    // 셀 안 약 체크박스 목록 (위: 기상직후+아침식사후 / 아래: 나머지, 각 2열 그리드)
    var cellItems='';
    if(!isFuture && allItemsFull.length){
      var topKeys=['morning_empty','morning_meal'];
      var topItems=allItemsFull.filter(function(x){return topKeys.indexOf(x.slotKey)!==-1;});
      var botItems=allItemsFull.filter(function(x){return topKeys.indexOf(x.slotKey)===-1;});
      function makeCellRow(arr){
        if(!arr.length) return '';
        var inner='';
        arr.forEach(function(x){
          var done=!!checks[x.it.id];
          var pc=pillColorByName(x.it.name);
          inner+='<div onclick="event.stopPropagation();togSuppCheck(\''+ds+'\',\''+x.it.id+'\')" '+
            'style="display:flex;align-items:center;gap:3px;padding:1px 2px;cursor:pointer;user-select:none;transition:all .12s;min-width:0" '+
            'onmouseenter="this.style.opacity=\'0.6\'" onmouseleave="this.style.opacity=\'1\'">'+
            '<span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;'+
            'border:1.2px solid '+(done?pc.color:'var(--border2)')+';'+
            'background:'+(done?pc.color:'transparent')+';transition:all .12s"></span>'+
            '<span style="font-size:0.6em;font-weight:500;color:'+(done?pc.color:'var(--t2)')+';line-height:1.3;transition:all .12s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:'+(done?'line-through':'none')+'">'+
              x.it.name+
            '</span>'+
          '</div>';
        });
        return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 2px">'+inner+'</div>';
      }
      var topHtml=makeCellRow(topItems);
      var botHtml=makeCellRow(botItems);
      cellItems='<div style="margin-top:2px">'+
        topHtml+
        (topHtml&&botHtml?'<div style="height:1px;background:var(--border);margin:3px 0;opacity:0.7"></div>':'')+
        botHtml+
      '</div>';
    }

    var isSelected=(ds===selDate);
    cal+='<div class="cal-cell" onclick="selectSuppDay(\''+ds+'\')" style="min-height:120px;border-right:'+(isLastCol?'none':'1px solid var(--border)')+';border-bottom:1px solid var(--border);'+
      'background:var(--cal-cell-bg);padding:5px 5px 5px 5px;position:relative;'+
      (isSelected?'box-shadow:inset 0 0 0 2px var(--accent);':'')+'">'+
      // 날짜 숫자 + 진행바
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'+
        '<div style="display:inline-flex;align-items:center;justify-content:center;'+
          'width:20px;height:20px;border-radius:50%;'+
          'background:'+(isToday?'var(--accent)':'transparent')+';'+
          'font-size:0.75em;font-weight:'+(isToday?'700':'500')+';'+
          'color:'+(isToday?'#fff':col===0?'#E06060':col===6?'var(--accent)':'var(--text)')+'">'+d+'</div>'+
        (!isFuture&&allItemsFull.length?
          '<span style="display:inline-flex;align-items:center;justify-content:center;'+
          'font-size:0.55em;font-weight:700;'+
          'padding:1px 5px;border-radius:8px;'+
          'background:'+(pct===100?'var(--green)':pct>0?'var(--accent)':'var(--border)')+';'+
          'color:'+(pct===100||pct>0?'#fff':'var(--t3)')+'">'+
            (pct===100?'✓':doneCnt+'/'+allItemsFull.length)+
          '</span>':'')+
      '</div>'+
      // 진행바
      (!isFuture&&allItemsFull.length?
        '<div style="height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-bottom:5px">'+
          '<div style="height:100%;width:'+pct+'%;background:'+(pct===100?'var(--green)':'var(--accent)')+';border-radius:1px;transition:width .3s"></div>'+
        '</div>':'')+
      // 약 체크박스 목록
      cellItems+
    '</div>';
  }
  // 나머지 빈칸
  var lastCol=(firstDay+daysInMonth-1)%7;
  if(lastCol<6){for(var f=lastCol+1;f<=6;f++)cal+='<div style="min-height:120px;border-right:'+(f===6?'none':'1px solid var(--border)')+';border-bottom:1px solid var(--border);background:var(--cal-cell-bg);opacity:0.5"></div>';}
  cal+='</div></div>';

  // 선택 날짜 복용 체크 패널 (달력에서 날짜를 클릭하면 해당 날짜로 전환됨, 기본값은 오늘)
  var selChecks=sc[selDate]||{};
  var selAllItems=[];
  var slotLabelsCal={morning_empty:'기상 직후',morning_meal:'아침 식사 후',lunch:'점심 식사 후',dinner:'저녁 식사 후',bedtime:'취침 전'};
  ['morning_empty','morning_meal','lunch','dinner','bedtime'].forEach(function(slKey){
    ((S.health.supplements[slKey])||[]).forEach(function(it){selAllItems.push({slotKey:slKey,slotLabel:slotLabelsCal[slKey],it:it});});
  });
  var selTotal=selAllItems.length;
  var selDone=selAllItems.filter(function(x){return selChecks[x.it.id];}).length;
  var selPct=selTotal?Math.round(selDone/selTotal*100):0;
  // 슬롯별로 그룹핑
  var slotGroups=[];
  var curSlotC='';
  selAllItems.forEach(function(x){
    if(x.slotLabel!==curSlotC){
      curSlotC=x.slotLabel;
      slotGroups.push({label:x.slotLabel,items:[]});
    }
    slotGroups[slotGroups.length-1].items.push(x);
  });

  var selPanelRows='';
  slotGroups.forEach(function(sg,si){
    var slotDoneC=sg.items.filter(function(x){return selChecks[x.it.id];}).length;
    selPanelRows+='<div style="'+(si>0?'margin-top:8px;padding-top:8px;border-top:1px solid var(--border)':'')+'">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'
        +'<span style="font-size:0.72em;font-weight:700;color:var(--t3);letter-spacing:0.03em">'+sg.label+'</span>'
        +(slotDoneC===sg.items.length?'<span style="font-size:0.68em;color:var(--green);font-weight:700">✓</span>':'<span style="font-size:0.68em;color:var(--t3)">'+slotDoneC+'/'+sg.items.length+'</span>')
      +'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 6px">';
    sg.items.forEach(function(x){
      var done2=!!selChecks[x.it.id];
      var p2=pillColorByName(x.it.name);
      selPanelRows+='<div onclick="togSuppCheck(\''+selDate+'\',\''+x.it.id+'\')" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;transition:all .15s;user-select:none" '
        +'onmouseenter="this.style.background=\'var(--surface)\'" onmouseleave="this.style.background=\'transparent\'">'
        +'<span style="width:14px;height:14px;border-radius:50%;border:1.5px solid '+(done2?p2.color:'var(--border)')+';display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:'+(done2?p2.color:'transparent')+';transition:all .15s">'
          +(done2?'<svg width="8" height="8" viewBox="0 0 10 10"><path d="M2 5l2.5 2.5 3.5-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')
        +'</span>'
        +'<span style="font-size:0.8em;font-weight:500;color:'+(done2?p2.color:'var(--text)')+';text-decoration:'+(done2?'line-through':'none')+';opacity:'+(done2?'0.7':'1')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .15s">'+x.it.name+' <span style="font-size:0.85em;opacity:0.6">'+x.it.count+'알</span></span>'
        +'</div>';
    });
    selPanelRows+='</div></div>';
  });
  if(selTotal>0){
    var selIsToday=(selDate===today);
    var selMonNum=parseInt(selDate.slice(5,7),10),selDayNum=parseInt(selDate.slice(8,10),10);
    var selDateLabel=selIsToday?'오늘':(selMonNum+'월 '+selDayNum+'일');
    cal+='<div style="margin-top:12px;border:1.5px solid '+(selIsToday?'var(--border)':'var(--accent)')+';border-radius:8px;padding:14px 16px;background:var(--bg)">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">'
        +'<div style="display:flex;align-items:center;gap:7px">'
          +'<div style="font-size:0.85em;font-weight:700;color:var(--text)">'+selDateLabel+' 복용 체크</div>'
          +(selIsToday?'':'<button onclick="selectSuppDay(\''+today+'\')" style="background:var(--al);color:var(--accent);border:none;border-radius:99px;padding:2px 9px;font-size:0.7em;font-weight:600;cursor:pointer">오늘로</button>')
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:7px">'
          +'<div style="font-size:0.8em;font-weight:700;color:'+(selPct===100?'var(--green)':'var(--accent)')+'">'+selDone+'/'+selTotal+'</div>'
          +'<div style="width:70px;height:5px;background:var(--border);border-radius:3px;overflow:hidden">'
            +'<div style="width:'+selPct+'%;height:100%;background:'+(selPct===100?'var(--green)':'var(--accent)')+';border-radius:3px;transition:width .3s"></div>'
          +'</div>'
        +'</div>'
      +'</div>'
      +selPanelRows
    +'</div>';
  }

  return cal;
}

function pillColorByName(name){
  if(_pillColorMap[name])return _pillColorMap[name];
  var s=0;for(var i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))&0xFFFFFF;
  return _pillColorPalette[Math.abs(s)%_pillColorPalette.length];
}

  _suppDragEnterCount--;

function suppDrop(e,toSlot,el){
  e.preventDefault();
  _suppDragEnterCount=0;
  if(el)el.style.outline='none';
  if(!_suppDragId||_suppDragSlot===toSlot)return;
  if(!S.health)return;
  if(!S.health.supplements)S.health.supplements={};
  var supps=S.health.supplements;
  var fromArr=supps[_suppDragSlot]||[];
  var item=fromArr.find(function(x){return x.id===_suppDragId;});
  if(!item)return;
  supps[_suppDragSlot]=fromArr.filter(function(x){return x.id!==_suppDragId;});
  if(!supps[toSlot])supps[toSlot]=[];
  supps[toSlot].push(item);
  _suppDragSlot='';_suppDragId='';
  save();render();
}

function calcBmi(){
  var wEl=document.getElementById('ib-w'), hEl=document.getElementById('ib-h'), bEl=document.getElementById('ib-b');

  if(w>0&&h>0) bEl.value=(w/((h/100)*(h/100))).toFixed(1);
}

function saveCondHist(condId){

var HR_LABELS={
  abnormal:{l:'⚠️ 이상 소견', c:'var(--red)', bg:'#fde8e8'},
  normal:{l:'✅ 정상 범위', c:'#2d8653', bg:'#e6f4ec'},
  treatment:{l:'💊 처치 / 처방', c:'#3C6BC1', bg:'#e8edfa'},
  action:{l:'📌 추후 조치', c:'var(--accent)', bg:'var(--al)'},

function hrRecFieldsHtml(r){
  var out='';
  ['abnormal','normal','treatment','action','nextAppt','note'].forEach(function(k){
    var L=HR_LABELS[k];
    var content;
    if(k==='nextAppt'){
      if(!r.nextApptDate)return;
      var dd=dLeft(r.nextApptDate);
      var ddTxt=dd<0?'지남':dd===0?'오늘':'D-'+dd;
      content=r.nextApptDate+(r.nextApptNote?' · '+r.nextApptNote:'')+' <span style="color:var(--t3);font-weight:600">('+ddTxt+')</span>';
    } else {
      if(!r[k])return;
      content=r[k];
    }
    out+='<div style="margin-top:5px"><span style="font-size:0.72em;font-weight:600;color:'+L.c+';background:'+L.bg+';padding:1px 6px;border-radius:4px">'+L.l+'</span><div style="font-size:0.82em;color:var(--t2);margin-top:3px;white-space:pre-wrap">'+content+'</div></div>';
  });
  if(!r.abnormal&&!r.normal&&!r.treatment&&!r.action&&!r.nextApptDate&&!r.note&&r.memo){
    out='<div style="font-size:0.82em;color:var(--t3);margin-top:3px;white-space:pre-wrap">'+r.memo+'</div>'+out;
  }
  return out;
}

// 이미지를 canvas로 리사이즈·압축해서 base64 반환 (용량 초과 방지)
function compressImage(file, maxW, maxH, quality){
  return new Promise(function(resolve){
    if(!file.type.startsWith('image/')){
      const reader=new FileReader();
      reader.onload=function(e){resolve({name:file.name,type:file.type,data:e.target.result});};
      reader.readAsDataURL(file);
      return;
    }
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve({name:file.name,type:'image/jpeg',data:canvas.toDataURL('image/jpeg',quality||0.7)});
    };
    img.onerror=function(){resolve(null);};
    img.src=url;
  });
}

function previewHealthFiles(input){
  var files=Array.from(input.files);
  // 병렬 압축 후 순서 유지
  Promise.all(files.map(function(file){
    return compressImage(file, 1200, 1200, 0.72);
  })).then(function(results){
    window._hrFiles=window._hrFiles||[];
    results.forEach(function(r){if(r) window._hrFiles.push(r);});
    refreshHrPreview();
  });
}

function refreshHrPreview(){
  var prev=document.getElementById('hr-preview');if(!prev)return;
  prev.innerHTML=(window._hrFiles||[]).map(function(f,i){
    return '<div style="position:relative">'+
      (f.type&&f.type.startsWith('image/')?
        '<img src="'+f.data+'" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">':
        '<div style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:0.78em">📄 '+f.name+'</div>')+
      '<button onclick="removeHrFile('+i+')" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;padding:0">✕</button>'+
    '</div>';
  }).join('');
}


function removeHrFile(i){

// 검진 기록의 "다음 예약" 날짜를 검진 일정(S.health.schedules)에 자동으로 추가·동기화
function syncNextApptSchedule(rec){
  if(!S.health.schedules) S.health.schedules=[];
  if(rec.nextApptDate){
    var schedTitle=(rec.title||'진료')+' 다음 예약'+(rec.nextApptNote?' · '+rec.nextApptNote:'');
    var cid=(rec.conditionIds&&rec.conditionIds[0])||'';
    var s=rec.nextApptSchedId?S.health.schedules.find(function(x){return x.id===rec.nextApptSchedId;}):null;
    if(s){
      s.title=schedTitle;s.date=rec.nextApptDate;s.conditionId=cid;s.done=false;
    } else {
      var ns={id:gid(),title:schedTitle,date:rec.nextApptDate,memo:'',hospital:'',conditionId:cid,done:false,fromRecordId:rec.id};
      S.health.schedules.push(ns);
      rec.nextApptSchedId=ns.id;
    }
  } else if(rec.nextApptSchedId){
    S.health.schedules=S.health.schedules.filter(function(x){return x.id!==rec.nextApptSchedId;});
    rec.nextApptSchedId=null;
  }
}
function saveHealthRec(id){
  const t=document.getElementById('hr-t').value.trim();
  const d=document.getElementById('hr-d').value;
  const abnormal=document.getElementById('hr-abnormal').value.trim();
  const normal=document.getElementById('hr-normal').value.trim();
  const treatment=document.getElementById('hr-treatment').value.trim();
  const action=document.getElementById('hr-action').value.trim();
  const nextApptDate=document.getElementById('hr-nextappt-date').value;
  const nextApptNote=document.getElementById('hr-nextappt-note').value.trim();
  const note=document.getElementById('hr-note').value.trim();
  if(!t||!d){alert('이름과 날짜를 입력해주세요');return;}
  if(!S.health) S.health={schedules:[],records:[],memo:''};
  const files=window._hrFiles||[];
  const conditionIds=window._hrCondIds||[];
  const entry={id:id||gid(),title:t,date:d,abnormal,normal,treatment,action,nextApptDate,nextApptNote,note,files,conditionIds};
  var recRef;
  if(id){const r=S.health.records.find(x=>x.id===id);if(r){Object.assign(r,entry);recRef=r;}}
  else {S.health.records.push(entry);recRef=entry;}
  if(recRef) syncNextApptSchedule(recRef);
  window._hrFiles=[];window._hrCondIds=[];window._hrEditId=null;save();closeMo();render();
}
function editHealthRec(id){openHealthRecModal(id);}
function delHealthRec(id){
  if(!S.health)return;
  var rec=(S.health.records||[]).find(function(x){return x.id===id;});
  if(rec&&rec.nextApptSchedId){S.health.schedules=(S.health.schedules||[]).filter(function(x){return x.id!==rec.nextApptSchedId;});}
  S.health.records=S.health.records.filter(x=>x.id!==id);
  save();render();
}

  else{w.document.write('<html><body style="margin:0"><iframe src="'+f.data+'" style="width:100vw;height:100vh;border:none"></iframe></body></html>');}
}

function saveHealthMemoCard(id){

  if(!t){alert('제목을 입력해주세요');return;}
  if(!S.health.memos) S.health.memos=[];
  if(id){

    if(m){m.title=t;m.content=c;}

function delHealthMemo(id){

}

// ════ 회고 & 통계 ════
function renderInsights(){
  const today=todStr();
  let cells30=[];
  for(let i=29;i>=0;i--){
    const ds=addDays(today,-i);
    const rods=routinesForDate(ds);
    const ck=S.checks[ds]||{};
    const done=rods.filter(r=>ck[r.id]).length;
    const pct=rods.length?Math.round(done/rods.length*100):0;
    cells30.push({ds,done,total:rods.length,pct});
  }
  // 이번 주(최근 7일) 평균
  const last7=cells30.slice(-7);
  const avg7=last7.length?Math.round(last7.reduce((s,c)=>s+c.pct,0)/last7.length):0;
  const avg30=cells30.length?Math.round(cells30.reduce((s,c)=>s+c.pct,0)/cells30.length):0;

  // ── 2) 연속 달성(스트릭): 오늘부터 거꾸로, 그날 루틴 100% 달성한 날 ──
  let streak=0;
  for(let i=0;i<365;i++){
    const ds=addDays(today,-i);
    const rods=routinesForDate(ds);
    if(rods.length===0){ if(i===0)continue; else break; }
    const ck=S.checks[ds]||{};
    const allDone=rods.every(r=>ck[r.id]);
    if(allDone)streak++; else break;
  }

  // ── 3) 루틴별 달성 횟수 (최근 30일) ──
  let routineStats={};
  cells30.forEach(c=>{
    const rods=routinesForDate(c.ds);
    const ck=S.checks[c.ds]||{};
    rods.forEach(r=>{
      if(!routineStats[r.id])routineStats[r.id]={task:r.task,done:0,total:0};
      routineStats[r.id].total++;
      if(ck[r.id])routineStats[r.id].done++;
    });
  });
  let statArr=Object.values(routineStats).map(function(s){s.rate=s.total?Math.round(s.done/s.total*100):0;return s;});
  statArr.sort((a,b)=>b.rate-a.rate);
  const best=statArr.slice(0,3);
  const worst=statArr.slice().sort((a,b)=>a.rate-b.rate).slice(0,3);

  // ── 4) 가계부 월 비교 ──
  const now=new Date();
  const ymThis=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const ymPrev=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  function sumMonth(ym,type){return (LD.transactions||[]).filter(t=>t.date.slice(0,7)===ym&&t.type===type).reduce((s,t)=>s+t.amount,0);}
  const incThis=sumMonth(ymThis,'income'),incPrev=sumMonth(ymPrev,'income');
  const expThis=sumMonth(ymThis,'expense'),expPrev=sumMonth(ymPrev,'expense');
  function diffLabel(cur,prev){
    if(prev===0)return cur>0?'<span style="color:var(--green)">신규</span>':'-';
    const d=Math.round((cur-prev)/prev*100);
    if(d===0)return '<span style="color:var(--t3)">변화 없음</span>';
    const up=d>0;
    return '<span style="color:'+(up?'var(--green)':'var(--red)')+'">'+(up?'▲':'▼')+' '+Math.abs(d)+'%</span>';
  }

  // ── 5) 저축 월별 추이 (최근 6개월 누적) ──
  let svByMonth={};
  (S.savings&&S.savings.entries||[]).forEach(function(e){
    const m=e.date.slice(0,7);
    svByMonth[m]=(svByMonth[m]||0)+e.amount;
  });
  let svMonths=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);

// ═══════════ 연말 결산 ═══════════
function openYearReview(Y){
  var pfx=Y+'-';
  // ── 일기 ──
  var diaryDays=0, totalChars=0, dist={}, longest={ds:'',len:0};
  var monthCnt=Array(12).fill(0);
  Object.keys(S.diaryEntries||{}).forEach(function(ds){
    if(ds.slice(0,5)!==pfx)return;
    var e=S.diaryEntries[ds];if(!e)return;
    var has=!!(e.text||e.title||e.mood);
    if(!has)return;
    diaryDays++;
    monthCnt[parseInt(ds.slice(5,7))-1]++;
    var len=(e.text||'').length;
    totalChars+=len;
    if(len>longest.len)longest={ds:ds,len:len};
    if(e.mood)dist[e.mood]=(dist[e.mood]||0)+1;
  });
  var topMood='', topMoodCnt=0;
  Object.keys(dist).forEach(function(m){if(dist[m]>topMoodCnt){topMood=m;topMoodCnt=dist[m];}});
  // ── 루틴 ──
  var today=todStr();
  var rtSum=0,rtDays=0,perfectDays=0,bestStreak=0,curStreak=0;
  var rtStats={};
  var endDs=(Y===new Date().getFullYear())?today:Y+'-12-31';
  for(var ds=Y+'-01-01';ds<=endDs;ds=addDays(ds,1)){
    var rods=routinesForDate(ds),ck=S.checks[ds]||{};
    if(rods.length===0){continue;}
    var dn=rods.filter(r=>ck[r.id]).length;
    var p=Math.round(dn/rods.length*100);
    rtDays++;rtSum+=p;
    if(p===100){perfectDays++;curStreak++;if(curStreak>bestStreak)bestStreak=curStreak;}
    else curStreak=0;
    rods.forEach(function(r){
      if(!rtStats[r.id])rtStats[r.id]={task:r.task,done:0,total:0};
      rtStats[r.id].total++;if(ck[r.id])rtStats[r.id].done++;
    });
  }
  var rtAvg=rtDays?Math.round(rtSum/rtDays):0;
  var bestRt=null;
  Object.values(rtStats).forEach(function(s){
    if(s.total<10)return;
    s.rate=Math.round(s.done/s.total*100);
    if(!bestRt||s.rate>bestRt.rate)bestRt=s;
  });
  // ── 저축 / 가계부 / 마감 ──
  var yearSv=(S.savings&&S.savings.entries||[]).filter(function(e){return e.date&&e.date.slice(0,5)===pfx;}).reduce(function(s,e){return s+e.amount;},0);
  var yInc=0,yExp=0;
  (LD.transactions||[]).forEach(function(tx){
    if(tx.date.slice(0,5)!==pfx)return;
    if(tx.type==='income')yInc+=tx.amount;else if(tx.type==='expense')yExp+=tx.amount;
  });
  var dlDone=(S.deadlines||[]).filter(function(d){return d.done&&d.date&&d.date.slice(0,5)===pfx;}).length;

  // ════ HTML ════
  function tile(emoji,label,val,sub){
    return '<div style="background:var(--s2);border-radius:8px;padding:14px 12px;text-align:center">'+
      '<div style="font-size:1.3em;margin-bottom:4px">'+emoji+'</div>'+
      '<div style="font-family:var(--serif);font-size:1.25em;line-height:1.2;color:var(--text)">'+val+'</div>'+
      '<div style="font-size:0.7em;color:var(--t3);margin-top:3px">'+label+(sub?'<br>'+sub:'')+'</div></div>';
  }
  var body='<div style="text-align:center;margin-bottom:16px">'+
    '<div style="font-family:var(--serif);font-size:1.5em;color:var(--accent)">'+Y+'년의 루시</div>'+
    '<div style="font-size:0.78em;color:var(--t3);margin-top:2px">'+(Y===new Date().getFullYear()?'오늘까지의 기록이에요':'1년간의 기록이에요')+'</div></div>';

  body+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">';
  body+=tile('✍️','일기 쓴 날',diaryDays+'<span style="font-size:0.55em;color:var(--t3)">일</span>',totalChars>0?'총 '+totalChars.toLocaleString()+'자':'');
  body+=tile(topMood||'🌱','가장 많았던 기분',topMood?topMoodCnt+'<span style="font-size:0.55em;color:var(--t3)">일</span>':'-','');
  body+=tile('🔥','최장 연속 달성',bestStreak+'<span style="font-size:0.55em;color:var(--t3)">일</span>','100% 달성 '+perfectDays+'일');
  body+=tile('📈','루틴 연 평균',rtAvg+'<span style="font-size:0.55em;color:var(--t3)">%</span>','');
  body+=tile('💰','올해 모은 돈',money(yearSv),'');
  body+=tile('✅','끝낸 마감',dlDone+'<span style="font-size:0.55em;color:var(--t3)">개</span>','');
  body+='</div>';

  // 월별 일기 미니 차트
  var maxM=Math.max(1,...monthCnt);
  body+='<div style="margin-bottom:14px"><div style="font-size:0.78em;color:var(--t2);margin-bottom:6px">월별 일기</div>';
  body+='<div style="display:flex;gap:4px;align-items:flex-end;height:50px">';
  monthCnt.forEach(function(c,i){
    var h=Math.round(c/maxM*40);
    body+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div title="'+(i+1)+'월 '+c+'일" style="width:70%;background:var(--accent);opacity:'+(c>0?1:0.15)+';border-radius:3px 3px 0 0;height:'+Math.max(h,3)+'px"></div><div style="font-size:0.6em;color:var(--t3)">'+(i+1)+'</div></div>';
  });
  body+='</div></div>';

  // 기분 분포 (색상)
  var distKeys=Object.keys(dist);
  if(distKeys.length>0){
    var maxD=Math.max.apply(null,Object.values(dist));
    body+='<div style="margin-bottom:14px"><div style="font-size:0.78em;color:var(--t2);margin-bottom:6px">올해의 기분</div>';
    MOODS.forEach(function(m){
      var c=dist[m.v]||0;if(c===0)return;
      body+='<div style="display:flex;align-items:center;gap:8px;padding:3px 0">'+
        '<span style="width:22px;text-align:center;font-size:0.95em">'+m.v+'</span>'+
        '<div class="pw" style="flex:1;height:8px"><div class="pb" style="width:'+Math.round(c/maxD*100)+'%;background:'+(MOOD_COLORS[m.v]||'var(--accent)')+'"></div></div>'+
        '<span style="font-size:0.72em;color:var(--t3);font-family:var(--mono);width:34px;text-align:right">'+c+'일</span></div>';
    });
    body+='</div>';
  }

  // 하이라이트
  var highlights=[];
  if(bestRt)highlights.push('제일 잘 지킨 루틴은 <b>「'+bestRt.task+'」</b> ('+bestRt.rate+'%)');
  if(longest.len>0)highlights.push('가장 길게 쓴 일기는 <b>'+longest.ds+'</b> ('+longest.len.toLocaleString()+'자)');
  if(yInc>0||yExp>0)highlights.push('올해 수입 <b style="color:var(--green)">'+money(yInc)+'</b> · 지출 <b style="color:var(--red)">'+money(yExp)+'</b>');
  if(highlights.length>0){
    body+='<div style="padding:12px 14px;background:var(--al);border-radius:8px;font-size:0.85em;line-height:1.8">';
    highlights.forEach(function(h){body+='<div>· '+h+'</div>';});
    body+='</div>';
  }
  if(diaryDays===0&&rtSum===0&&yearSv===0&&yInc===0&&yExp===0&&dlDone===0){
    body+='<div class="empty">'+Y+'년 기록이 아직 없어요</div>';
  }

  openMo('🎁 '+Y+'년 결산',body,'<button class="btn bg" onclick="closeMo()">닫기</button>');
}

}
// 모달 안에서 마감 완료 토글 → 모달 즉시 갱신 (완료되면 목록에서 사라짐)
function dayDlToggle(id,ds){

function dayDlDelete(id,ds){

// 루틴화 항목을 이 날짜에서만 삭제 (반복 일정 자체는 유지, 이후 날짜에는 계속 나옴)
function dayRoutineSkip(rid,ds){
  var r=S.routines.find(function(x){return x.id===rid;});
  if(r){
    if(!r.skipDates)r.skipDates=[];
    if(r.skipDates.indexOf(ds)===-1)r.skipDates.push(ds);
  }
  if(r&&r.rzProjectId){
    var p=S.projects.find(function(x){return x.id===r.rzProjectId;});
    var entry=p&&p.routinized?p.routinized.find(function(x){return x.id===rid;}):null;
    if(entry){
      if(!entry.skipDates)entry.skipDates=[];
      if(entry.skipDates.indexOf(ds)===-1)entry.skipDates.push(ds);
    }
  }
  if(S.checks[ds])delete S.checks[ds][rid];
  save();render();
  openDayRoutineModal(ds);
}
// 루틴화 항목의 반복 설정 자체를 수정 (모든 날짜에 반영됨)
function dayRoutineEdit(rid,ds){
  var r=S.routines.find(function(x){return x.id===rid;});
  if(!r||!r.rzProjectId)return;
  var p=S.projects.find(function(x){return x.id===r.rzProjectId;});
  if(!p||!p.routinized)return;
  var idx=p.routinized.findIndex(function(x){return x.id===rid;});
  if(idx<0)return;
  closeDayOverlayAnd(function(){openRzEditModal(p.id,idx);});
}
// 날짜 오버레이를 닫고 다른 모달(openMo 기반)을 여는 헬퍼
function closeDayOverlayAnd(fn){
  var old=document.getElementById('day-routine-overlay');
  if(old)old.remove();
  fn();
}

function calRoutineToggle(rid,ds){

// ═══════════ TODO CALENDAR ═══════════
let todoCalY=new Date().getFullYear(), todoCalM=new Date().getMonth();

function renderTodoCal(){
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MN_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const ts=todStr();

  // 연도/월 헤더
  var monthCards='<div class="mtab-wrap"><div class="mtab">';
  for(var m=0;m<12;m++){
    var isCur=m===todoCalM;
    monthCards+='<div class="mtab-item'+(isCur?' on':'')+'" data-m="'+m+'" onclick="todoCalM=parseInt(this.dataset.m);render()">'+MN[m]+'</div>';
  }
  monthCards+='</div></div>';

  const first=new Date(todoCalY,todoCalM,1),last=new Date(todoCalY,todoCalM+1,0),sdow=first.getDay();
  const prevLast=new Date(todoCalY,todoCalM,0);
  var cells=[];
  for(var i=sdow-1;i>=0;i--){var pd=prevLast.getDate()-i,pm=todoCalM===0?11:todoCalM-1,py=todoCalM===0?todoCalY-1:todoCalY;cells.push({d:pd,m:pm,y:py,cur:false});}
  for(var d=1;d<=last.getDate();d++)cells.push({d:d,m:todoCalM,y:todoCalY,cur:true});
  var rem=42-cells.length;
  for(var d=1;d<=rem;d++){var nm=todoCalM===11?0:todoCalM+1,ny=todoCalM===11?todoCalY+1:todoCalY;cells.push({d:d,m:nm,y:ny,cur:false});}

  var calHtml='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><div style="min-width:560px">'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)">';
  ['일','월','화','수','목','금','토'].forEach(function(d,i){
    calHtml+='<div style="text-align:center;padding:8px 0;font-size:0.75em;font-weight:500;color:'+(i===0?'var(--red)':i===6?'#4A90D9':'var(--t3)')+'">'+d+'</div>';
  });
  calHtml+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr)">';

  for(var idx=0;idx<cells.length;idx++){
    var cell=cells[idx];
    var ri=Math.floor(idx/7),ci=idx%7;
    var ds=cell.y+'-'+String(cell.m+1).padStart(2,'0')+'-'+String(cell.d).padStart(2,'0');
    var isT=ds===ts;
    // 이월된 항목은 원래 날짜에서 숨기고, 이월 목적지(오늘)에서만 표시
    // _carried:true 항목은 이미 다음날 todoList에 존재하므로 원래 날짜에서는 미완료+이월된 것만 걸러냄
    var nextDs=addDays(ds,1);
    var nextItems=(S.todoList&&S.todoList[nextDs])||[];
    var todos=((S.todoList&&S.todoList[ds])||[]).filter(function(item){
      // 이 항목이 미완료이면서 다음날에 이월 복사본이 있으면 원래 날짜에서 숨김
      if(!item.done && !item._carried){
        return !nextItems.some(function(nx){return nx._carried&&nx.text===item.text;});
      }
      return true;
    });
    var doneCount=todos.filter(function(t){return t.done;}).length;
    var totalCount=todos.length;
    var hasTodo=totalCount>0;

    var badge='';
    if(hasTodo){
      var allDone=doneCount===totalCount;
      badge='<span style="font-size:0.62em;font-weight:600;padding:1px 5px;border-radius:99px;background:'+(allDone?'var(--green)':'var(--al)')+';color:'+(allDone?'#fff':'var(--accent)')+'">'+doneCount+'/'+totalCount+'</span>';
    }

    calHtml+='<div onclick="openTodoCalDay(\''+ds+'\')" '+
      'style="cursor:pointer;min-height:100px;padding:6px 8px;'+
      'border-right:'+(ci===6?'none':'1px solid var(--border)')+';'+
      'border-bottom:'+(ri===5?'none':'1px solid var(--border)')+';'+
      'background:'+(isT?'var(--accent)15':'transparent')+'">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">'+
        '<div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;'+
          'background:'+(isT?'var(--accent)25':'transparent')+';'+
          'font-size:0.85em;font-weight:'+(isT?'700':'500')+';'+
          'color:'+(isT?'var(--accent)':!cell.cur?'var(--t3)':ci===0?'var(--red)':ci===6?'#4A90D9':'var(--text)')+'">'+cell.d+'</div>'+
        (badge?'<div>'+badge+'</div>':'')+
      '</div>';

    // 투두 항목 최대 5개 표시
    todos.slice(0,5).forEach(function(item){
      calHtml+='<div style="display:flex;align-items:center;gap:3px;font-size:0.75em;padding:2px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:'+(item.done?'var(--t3)':'var(--text)')+'">'+
        '<span style="flex-shrink:0;width:8px;height:8px;border-radius:2px;display:inline-block;background:'+(item.done?'var(--green)':item._carried?'var(--accent)':'var(--border2)')+'"></span>'+
        '<span style="overflow:hidden;text-overflow:ellipsis;'+(item.done?'text-decoration:line-through':'')+'">'+item.text+'</span>'+
      '</div>';
    });
    if(todos.length>5){
      calHtml+='<div style="font-size:0.7em;color:var(--t3);margin-top:1px">+' +(todos.length-5)+'개 더</div>';
    }
    calHtml+='</div>';
  }
  calHtml+='</div></div></div>';

  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
    '<button class="btn bg bsm" onclick="todoCalY--;render()">← '+(todoCalY-1)+'</button>'+
    '<div style="font-family:\'Instrument Serif\',serif;font-size:2.1em !important;font-weight:600 !important;letter-spacing:1px;color:var(--accent)">'+todoCalY+'</div>'+
    '<button class="btn bg bsm" onclick="todoCalY++;render()">'+(todoCalY+1)+' →</button>'+
  '</div>'+
  monthCards+
  '<div class="card" style="padding:0;overflow:hidden">'+
    '<div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">'+
      '<button class="btn bg bsm" onclick="todoCalM=todoCalM===0?11:todoCalM-1;if(todoCalM===11)todoCalY--;render()">←</button>'+
      '<div style="font-family:\'Instrument Serif\',serif;font-size:1.55em;font-weight:600;letter-spacing:1.5px;color:var(--text)">'+MN_D[todoCalM]+'</div>'+
      '<button class="btn bg bsm" onclick="todoCalM=todoCalM===11?0:todoCalM+1;if(todoCalM===0)todoCalY++;render()">→</button>'+
    '</div>'+
    calHtml+
  '</div>';
}

function openTodoCalDay(ds){
  if(!S.todoList)S.todoList={};
  if(!S.todoList[ds])S.todoList[ds]=[];
  var items=S.todoList[ds];
  var d=new Date(ds+'T00:00:00');
  var label=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+['일','월','화','수','목','금','토'][d.getDay()]+'요일';

  function todoModalHtml(){
    var html='<div style="margin-bottom:12px"><div style="font-size:0.85em;color:var(--t3);margin-bottom:8px">'+label+'</div>';
    var its=S.todoList[ds];
    if(its.length===0){
      html+='<div style="font-size:0.85em;color:var(--t3);padding:8px 0">할 일이 없어요</div>';
    } else {
      its.forEach(function(item,i){
        html+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">'+
          '<div id="tdcal-chk-'+i+'" onclick="togTodoCalItem(\''+ds+'\','+i+')" style="width:16px;height:16px;border-radius:4px;border:1.5px solid '+(item.done?'var(--green)':'var(--border2)')+';background:'+(item.done?'var(--green)':'transparent')+';cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">'+
          (item.done?'<span style="color:#fff;font-size:0.6em">✓</span>':'')+
          '</div>'+
          '<div style="flex:1;font-size:0.9em;'+(item.done?'text-decoration:line-through;color:var(--t3)':'')+(item._carried?';color:var(--accent)':'')+'">'+
            item.text+(item._carried?'<span style="font-size:0.72em;color:var(--accent);margin-left:4px">↩이월</span>':'')+
          '</div>'+
          '<button class="bi" title="날짜 변경" onclick="changeTodoCalDate(\''+ds+'\','+i+')" style="font-size:0.78em;color:var(--t2);padding:2px 5px;border:1px solid var(--border);border-radius:5px">📅</button>'+
          '<button class="bi" onclick="delTodoCalItem(\''+ds+'\','+i+')" style="font-size:0.8em;color:var(--t3)">✕</button>'+
        '</div>';
      });
    }
    html+='</div>';
    html+='<div style="display:flex;gap:8px;align-items:center">'+
      '<input id="tdcal-inp" class="inp" style="flex:1;font-size:0.9em" placeholder="할 일 추가..." onkeydown="if(event.key===\'Enter\')addTodoCalItem(\''+ds+'\')">'+
      '<button class="btn bp bsm" onclick="addTodoCalItem(\''+ds+'\')">추가</button>'+
    '</div>';
    return html;
  }

  openMo(label, todoModalHtml(), '<button class="btn bg" onclick="closeMo();render()">닫기</button>');
}

function togTodoCalItem(ds,i){
  i=parseInt(i);
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  S.todoList[ds][i].done=!S.todoList[ds][i].done;
  save();
  // 모달 내부만 갱신
  var item=S.todoList[ds][i];
  var chk=document.getElementById('tdcal-chk-'+i);
  if(chk){
    chk.style.background=item.done?'var(--green)':'transparent';
    chk.style.borderColor=item.done?'var(--green)':'var(--border2)';
    chk.innerHTML=item.done?'<span style="color:#fff;font-size:0.6em">✓</span>':'';
    var textDiv=chk.parentElement.querySelector('[style*="font-size:0.9em"]');
    if(textDiv){textDiv.style.textDecoration=item.done?'line-through':'';textDiv.style.color=item.done?'var(--t3)':'';}
  }
}

function addTodoCalItem(ds){
  var inp=document.getElementById('tdcal-inp');
  if(!inp)return;
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';
  if(!S.todoList)S.todoList={};
  if(!S.todoList[ds])S.todoList[ds]=[];
  S.todoList[ds].push({id:gid(),text:text,done:false});
  save();
  // 모달 body 갱신
  openTodoCalDay(ds);
}

function delTodoCalItem(ds,i){
  i=parseInt(i);
  if(!S.todoList||!S.todoList[ds])return;
  S.todoList[ds].splice(i,1);
  save();
  openTodoCalDay(ds);
}

function changeTodoCalDate(ds,i){
  i=parseInt(i);
  if(!S.todoList||!S.todoList[ds]||!S.todoList[ds][i])return;
  var item=S.todoList[ds][i];
  var html='<div style="margin-bottom:12px;font-size:0.9em;color:var(--t2)">이동할 날짜를 선택하세요</div>'+
    '<div style="font-size:0.88em;color:var(--t3);margin-bottom:8px">항목: <b style="color:var(--text)">'+item.text+'</b></div>'+
    '<input id="todo-date-inp" type="date" class="inp" value="'+ds+'" style="width:100%;font-size:1em;margin-bottom:4px">';
  openMo('날짜 변경', html,
    '<button class="btn bg" onclick="closeMo();openTodoCalDay(\''+ds+'\')">취소</button>'+
    '<button class="btn bp" onclick="applyTodoCalDate(\''+ds+'\','+i+')">이동</button>'
  );
  // 날짜 입력 포커스
  setTimeout(function(){var el=document.getElementById('todo-date-inp');if(el)el.focus();},100);
}

function applyTodoCalDate(fromDs,i){
  i=parseInt(i);
  var inp=document.getElementById('todo-date-inp');
  if(!inp||!inp.value)return;
  var toDs=inp.value;
  if(toDs===fromDs){closeMo();openTodoCalDay(fromDs);return;}
  if(!S.todoList||!S.todoList[fromDs]||!S.todoList[fromDs][i])return;
  var item=S.todoList[fromDs][i];
  if(!S.todoList[toDs])S.todoList[toDs]=[];
  S.todoList[toDs].push({id:gid(),text:item.text,done:false,_carried:item._carried||false});
  S.todoList[fromDs].splice(i,1);
  save();
  closeMo();
  render();
  // 이동된 날짜로 모달 열기
  setTimeout(function(){openTodoCalDay(toDs);},50);
}


function renderCalendar(){
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MN_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const ts=todStr();
  const ym=calY+'-'+String(calM+1).padStart(2,'0');

  var monthCards='<div class="mtab-wrap"><div class="mtab">';
  for(var m=0;m<12;m++){

  }
  monthCards+='</div></div>';

  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),sdow=first.getDay();
  const prevLast=new Date(calY,calM,0);

  // ── 이번 달에 표시되는 프로젝트만 모아서 필터 목록 구성 ──
  var filterPidSet={};
  for(var fd=1;fd<=last.getDate();fd++){
    var fds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(fd).padStart(2,'0');
    routinesForDate(fds).filter(function(r){return r.isRz&&r.rzProjectId;}).forEach(function(r){filterPidSet[r.rzProjectId]=true;});
  }
  (S.calEvents||[]).forEach(function(e){if(e.date&&e.date.indexOf(ym)===0&&e.projectId&&!e.rzId)filterPidSet[e.projectId]=true;});
  (S.deadlines||[]).forEach(function(d){if(d.date&&d.date.indexOf(ym)===0&&d.projectId)filterPidSet[d.projectId]=true;});
  var filterProjects=Object.keys(filterPidSet).map(function(pid){return S.projects.find(function(p){return p.id===pid;});}).filter(Boolean);
  // 이번 달에 없는 프로젝트가 선택돼있으면 필터 목록에도 표시해 무엇이 선택된 상태인지 알 수 있게 함
  calProjectFilter.forEach(function(fpid){
    if(!filterProjects.some(function(p){return p.id===fpid;})){
      var stillSel=S.projects.find(function(p){return p.id===fpid;});
      if(stillSel)filterProjects.push(stillSel);
    }
  });

  var cells=[];
  for(var i=sdow-1;i>=0;i--){var pd=prevLast.getDate()-i,pm=calM===0?11:calM-1,py=calM===0?calY-1:calY;cells.push({d:pd,m:pm,y:py,cur:false});}
  for(var d=1;d<=last.getDate();d++)cells.push({d:d,m:calM,y:calY,cur:true});
  var rem=42-cells.length;
  for(var d=1;d<=rem;d++){var nm=calM===11?0:calM+1,ny=calM===11?calY+1:calY;cells.push({d:d,m:nm,y:ny,cur:false});}

  var evMap={};
  (S.calEvents||[]).forEach(e=>{
    if(e.rzId)return; // 루틴화 항목은 routinesForDate 기준으로 셀마다 새로 계산 (날짜 범위와 무관하게 최신 정의 반영, 모달과 동일한 소스)
    if(!evMap[e.date])evMap[e.date]=[];
    // 프로젝트 색상 실시간 반영
    const pr=e.projectId?S.projects.find(p=>p.id===e.projectId):null;
    evMap[e.date].push(Object.assign({},e,{color:pr?pr.color:(e.color||'var(--accent)')}));
  });

  // 검진 예정 달력에 표시
  ((S.health&&S.health.schedules)||[]).filter(s=>!s.done).forEach(s=>{
    if(!s.date)return;
    if(!evMap[s.date])evMap[s.date]=[];
    evMap[s.date].push({id:s.id,title:s.title,isHealthSched:true,color:'#E8A0A0'});

  });
  calHtml+='</div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))">';

  for(var idx2=0;idx2<cells.length;idx2++){

    var isT=ds===ts;
    var rodsCell=routinesForDate(ds).filter(function(r){return r.isRz;});
    if(calProjectFilter.length) rodsCell=rodsCell.filter(function(r){return calProjectFilter.indexOf(r.rzProjectId)!==-1;});
    var routineEvs=rodsCell.map(function(r){

function loadCustomFont(input, slot){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  var name=file.name.replace(/\.[^.]+$/,'');
  var reader=new FileReader();
  reader.onload=function(e){
    var fontName='UserFont'+(slot+1);
    var fontFace=new FontFace(fontName, e.target.result);
    fontFace.load().then(function(ff){
      document.fonts.add(ff);
      if(!S.customFonts) S.customFonts=['','',''];
      if(!S.customFontData) S.customFontData=['','',''];
      S.customFonts[slot]=name;
      S.customFontData[slot]=e.target.result;
      S.font='custom'+(slot+1);
      save(); applyTheme(S.theme||'sky'); render();
    });
  };
  reader.readAsArrayBuffer(file);
}
function clearCustomFont(slot){
  if(!S.customFonts) S.customFonts=['','',''];
  if(!S.customFontData) S.customFontData=['','',''];
  S.customFonts[slot]=''; S.customFontData[slot]='';
  if(S.font==='custom'+(slot+1)) S.font='pretendard';
  save(); applyTheme(S.theme||'sky'); render();
}
function restoreCustomFont(){
  if(!S.customFontData) return;
  S.customFontData.forEach(function(data, i){
    if(!data) return;
    var fontFace=new FontFace('UserFont'+(i+1), data);

  });
}

function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function lighten(hex,amt){
  var c=hexToRgb(hex);
  var r=Math.min(255,Math.round(c.r+(255-c.r)*amt));
  var g=Math.min(255,Math.round(c.g+(255-c.g)*amt));
  var b=Math.min(255,Math.round(c.b+(255-c.b)*amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function darken(hex,amt){
  var c=hexToRgb(hex);
  var r=Math.max(0,Math.round(c.r*(1-amt)));
  var g=Math.max(0,Math.round(c.g*(1-amt)));
  var b=Math.max(0,Math.round(c.b*(1-amt)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function mixHex(hexA,hexB,t){
  var a=hexToRgb(hexA),b=hexToRgb(hexB);
  var r=Math.round(a.r+(b.r-a.r)*t),g=Math.round(a.g+(b.g-a.g)*t),bl=Math.round(a.b+(b.b-a.b)*t);
  return '#'+[r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('');
}

var THEME_BASE_BG={sky:'#F4F8F9',sand:'#EFE9E2',lightBeige:'#FBF9F3',lightGray:'#F5F6F8',coral:'#F4F8F8',mint:'#FCF5F5',cream:'#F4F8F5',ocean:'#F1F6FB',lilac:'#F8EFF2',peach:'#F4F8F5',charcoal:'#F5F5F6',apple:'#F2F2F7'};
function applyBgIntensity(){
  var t=S.theme||'sky';
  var pct=(S.bgIntensity!=null?S.bgIntensity:0)/100;
  var bg;
  if(t==='custom'){
    var hex=S.customThemeColor||'#F9D0CD';
    var amt=0.9-pct*0.55; // 0%→0.9(아주 연하게) · 100%→0.35(진하게)
    bg=lighten(hex,amt);
  }else{
    var base=THEME_BASE_BG[t]||THEME_BASE_BG.sky;
    var veryPale=lighten(base,0.7);
    bg=mixHex(veryPale,base,pct);
  }
  document.body.style.setProperty('--bg',bg);
}
function setBgIntensity(v){
  S.bgIntensity=parseInt(v)||0;
  save();
  applyBgIntensity();
  var lbl=document.getElementById('bg-intensity-label');
  if(lbl)lbl.textContent=S.bgIntensity+'%';
}
function setCustomThemeVars(hex){
  var root=document.documentElement.style;
  root.setProperty('--ct-light', lighten(hex,0.9));
  root.setProperty('--ct-lighter', lighten(hex,0.55));
  root.setProperty('--ct-mid', lighten(hex,0.2));
  root.setProperty('--ct-border', lighten(hex,0.1));
  root.setProperty('--ct-border2', hex);
  root.setProperty('--ct-dark', darken(hex,0.25));
  root.setProperty('--ct-dark-soft', darken(hex,0.12));
}

// 사이드바 메뉴 마커 (동그라미 / 색하트 / 테마하트)
